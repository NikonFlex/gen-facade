# Шаг 5: привязка к сетке и валидатор (`evaluation: Ошибки геометрии`, `generation: Привязка к сетке`, gf#15).
# Допуски — до калибровки по реальным фасадам (`evaluation: Калибровка допусков`: CMP и размеченные
# коттеджи, этап 2). Пока — из соображений масштаба листа 1:100: 1 см — меньше толщины линии.

eps_m = 0.01          # геометрический допуск: касание — не пересечение, край — не выход
align_m = 0.05        # верх окон этажа не на одной линии или окна почти на одной оси — предупреждение
snap_m = 0.15         # привязка: окна ближе этого — на одну ось и одну линию этажа
# Окно, чей верх отскочил от общей линии этажа по дому дальше этого, встаёт на линию (gf#275): у
# настоящих домов теста разброс верха окон этажа по дому — медиана 0,13 м, больше 0,30 — у 6
# этажей из 32, и хозяин бракует их («окно между этажами»).
window_jump_m = 0.30
# Крыльцо у двери первого этажа ставит шаг 5 (gf#276): дверь с низом выше этого над землёй стоит на
# площадке от земли до своего низа, шире двери на porch_pad_m с каждой стороны. У 57 из 58 дверей
# первого этажа настоящих домов теста низ выше 0,15 м (пол поднят на 0,2–0,76 м); дверь ниже — на
# земле, ступень не нужна. Запас — как у крыльца синтетики (она берёт его отсюда).
porch_min_m = 0.15
porch_pad_m = 0.30
# Двери и углы ставит шаг 5 (gf#313). Двери одного этажа — одной высоты: настоящие дома теста держат
# их в пределах 0,12 м (у 26 из 27 домов теста разброс высот дверей этажа не больше 0,15 м), а модель
# ставит двери одного этажа разной высоты (до 0,74 м). Разброс больше door_spread_m — все двери
# этажа на медиану. Дверь уже door_min_w_m расширяется: 0,80 м — свет эвакуационного выхода
# (СП 1.13130, свод `door_size_ru`), у настоящих домов теста уже только две панели-двери одного дома
# (0,72 и 0,73 м, sd-ny-2011), у модели — 0,35 м. Проём ближе corner_min_m к углу отодвигается:
# 0,457 м (1,5 ft, Grapevine) — самая мягкая норма свода (`window_corner_distance`), у настоящих
# домов ближе неё 5 % проёмов.
door_spread_m = 0.15
door_min_w_m = 0.80
corner_min_m = 0.457

# Окно во фронтоне (gf#321) — окно этажа под скатом: рамка в стене с фронтоном не ближе slope_offset_m
# к скату (страж, валидатор, синтетика). У 19 окон фронтона разметки отступ рамы от ската 0,21–0,59 м,
# медиана 0,31 (замер 08.11, docs/tasks/gf-0321.md); в сводах правил числа нет. Низ окна под скатом —
# не ниже карниза на attic_knee_m: у 13 из 19 окон низ ниже карниза на 0,04–0,45 м (стенка-колено
# мансарды); окно этажа ниже карниза с низом выше этой линии не бывает (самое низкое окно — 0,6 м).
slope_offset_m = 0.20
attic_knee_m = 0.50
# Окно вида `slope` (gf#319): рамка может выйти за скат, контур — рамка, срезанная скатом с отступом
# slope_offset_m; контур не меньше этой доли рамки (страж, валидатор, синтетика). Как inside_share
# разметки (data.toml): окно, у которого за скатом больше половины, разметка не берёт.
slope_share = 0.5
