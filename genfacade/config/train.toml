# Обучение модели шага 4 на корпусе токенов (gf#106; genfacade/train/fit.py).
# Размеры модели сохраняются с чекпойнтом: с какими обучена, с такими и загружается.

[model]              # GPT из nanoGPT (genfacade/train/gpt.py)
block = 2560         # окно, токенов: не меньше самой длинной последовательности корпуса; у 600 домов
                     # до 24 м в 1–3 этажа — до 1627 (gf#186, 21.10); батч длиной по самой длинной в нём
# 8 × 512 пробовали (gf#186, run 39794796700): на val лучше, на плане GenPlan и BuildingNet хуже
layers = 6
heads = 6
width = 384          # размер вектора токена; делится на heads
dropout = 0.1

[fit]
epochs = 10
batch = 32           # последовательностей в шаге
lr = 6e-4            # после разгона; дальше по косинусу до min_lr к концу обучения
min_lr = 6e-5
warmup_steps = 200
weight_decay = 0.1
betas = [0.9, 0.95]   # AdamW, как в nanoGPT
grad_clip = 1.0
seed = 0
device = "auto"      # auto | cuda | cpu
bf16 = true          # вычисления в bfloat16 на GPU; на процессоре не действует
compile = false      # torch.compile: в WSL2 не проверен (низ docs/tasks/gf-0106.md)
# Модель после каждых save_every эпох — model-e<N>.pt рядом с итоговой; 0 — только итоговая. Перенос
# на план GenPlan и BuildingNet меряется по ним вне GPU-машины: этих данных там нет (gf#186).
save_every = 4

[sample]             # после обучения: ответы модели на условия из val
count = 200          # последовательностей (дом × режим), случайных с seed обучения
batch = 64
temperature = 1.0
top_k = 0            # 0 — из всего словаря

[eval]               # genfacade eval: модель шага 4 (config/models.toml) на val, gf#108
count = 0            # последовательностей val (дом × режим), случайных с seed модели; 0 — все
batch = 64
untrained = 64       # столько же условий — необученной модели того же размера, для сравнения

[probe]              # датчик по эпохам (gf#148): ответы на условия глухого режима val, без запрета
every = 2            # раз в столько эпох и после последней; 0 — выключен
count = 256          # первых последовательностей глухого режима val; отвечают с настройками [sample]

[paths]
runs_dir = "outputs/train"   # <время>/: model.pt, model.json, loss.png, loss.json, samples.json
