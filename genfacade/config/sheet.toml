# Оформление листа фасадов: размеры в метрах натуры, лист в масштабе 1:scale.
# Цвета и толщины линий, шрифты — в sheet.css.

[sheet]
scale = 100               # 1:100 — 1 м = 10 мм на листе
columns = 2               # фасадов в ряд
margin_left_m = 2.0
margin_top_m = 1.5
gap_x_m = 5.0             # между фасадами по горизонтали: справа отметки уровней
gap_y_m = 4.0             # по вертикали: снизу оси и подпись

[ground]
extend_m = 1.5            # линия земли выходит за стену с каждой стороны

[levels]
offset_m = 1.2            # значок отметки правее стены на столько
shelf_left_m = 0.9        # полка отметки влево от значка
shelf_right_m = 1.4       # и вправо
marker_half_width_m = 0.15
marker_height_m = 0.2
text_dx_m = 0.25          # подпись правее значка
text_above_m = 0.06       # подпись над полкой
text_below_m = 0.3        # подпись земли под полкой — чтобы не слипалась с цоколем
merge_below_m = 0.05      # отметки ближе друг к другу считаются одной

[axes]
line_from_m = 0.1         # выносная линия оси ниже земли: от
line_to_m = 1.2           # до
bubble_y_m = 1.6          # центр кружка ниже земли
bubble_radius_m = 0.4
text_dy_m = 0.11          # сдвиг подписи в кружке, чтобы буква стояла по центру
letters = "АБВГДЕЖИКЛМН"  # буквенные оси по y; цифровые — по x

[door]
# стекло двери на листе — в долях её ширины и высоты (спека facade, «Элемент», вариант)
glass_inset = 0.18        # от края полотна до стекла, доля ширины
glazed_span = [0.45, 0.9] # стекло в полотне: низ и верх, доли высоты
transom_share = 0.125     # фрамуга: верхняя доля высоты элемента (0.3 м при двери 2.1 м)

[trim]
# Выводимые элементы на листе по виду дома (config/derive.toml, gf#212): поверх прямоугольника —
# рисунок вида. Ставни: жалюзи — планки через louver_step_m, дощатые — доски через board_step_m,
# филёнчатые — две филёнки с отступом panel_inset (доля ширины створки). Какой рисунок у вида —
# `shape` записи в config/derive.toml.
louver_step_m = 0.06
board_step_m = 0.1
panel_inset = 0.18
# Козырёк: двускатный — треугольник на всю ширину; на кронштейнах — плита slab_m сверху и два
# кронштейна шириной bracket_w_m на долях bracket_at от краёв.
slab_m = 0.08
bracket_at = 0.2
bracket_w_m = 0.12
# Навес на столбах: столб шириной post_w_m у края элемента, плита сверху — slab_m.
post_w_m = 0.12
# Ставни на планках: две планки на доле batten_at высоты от низа и от верха, диагональ между ними.
batten_at = 0.12

[roof]
# Одна толщина кровли листа, 3D и IFC (gf#447): низ плиты — плоскость ската, верх — выше на
# толщину по вертикали, торец по краю свеса вертикальный. На виде (gf#320) скат, видный с ребра,
# рисуется полосой такой толщины.
thickness_m = 0.2

[roof_items]
# Дымовая труба и водосток (gf#454), считает код (roof_items.py), модель шага 4 их не ставит.
# Верх трубы выше конька — СНиП 41-01-2003 п. 6.6.12 (до 1,5 м от конька — не менее 0,5 м);
# сечение 510 мм — кирпич в два кирпича, источника нет [не проверено]. Желоб 125 мм и труба
# 90 мм — система 125/90 Grand Line. Труба от угла — чтобы не стоять в самом углу.
chimney_m = 0.51
chimney_over_m = 0.5
# Высота по расстоянию d от конька до центра трубы (gf#471, СНиП 41-01-2003 п. 6.6.12): до near_m
# — выше конька на over_m; до far_m — вровень с коньком; дальше — до линии под slope_deg вниз
# от конька. Пункт сверен по цитате на normacs.info, первоисточник не открыт [не проверено].
chimney_near_m = 1.5
chimney_far_m = 3.0
chimney_slope_deg = 10.0
gutter_m = 0.125
pipe_m = 0.09
pipe_inset_m = 0.15
chimney_fill = "#a65f48"  # кирпичная
gutter_fill = "#c3c9cf"   # оцинковка, светлая — читается на тёмной обшивке и кровле
[skylight]
# Мансардное окно в плоскости ската (gf#456, `facade: Мансардное окно`). Размер — Velux MK06
# 78 × 118 см (ширина × длина по скату; velux.co.uk/products/sizes, `docs/library-catalog.md`),
# уклон от 15° (общее руководство по монтажу Velux), между окнами 0,1 м (оклад EK), низ выше
# карниза на 0,8 м — минимум Velux «не ниже 0,8 м от пола» (пол мансарды — у карниза; при 1,0 м
# у дома 10 × 5 м под 35° окно с запасом у конька не встаёт), от конька по скату 0,2 м
# (Velux: 0,04–0,17 м), от торца кровли 0,5 м.
width_m = 0.78
length_m = 1.18
min_pitch_deg = 15.0
sill_m = 0.8
gap_m = 0.1
end_margin_m = 0.5
ridge_margin_m = 0.2
frame_m = 0.06
lift_m = 0.01

[title]
y_m = 2.6                 # подпись «Фасад в осях …» ниже земли

[preview]
width_px = 2400

[spec]
# трасса шага 1 (01_spec.svg): образец стены до карниза с отметками, как на листе, и палитра дома
margin_m = 2.0            # поле вокруг: шире, чем линия земли выходит за стену
wall_m = 2.0              # ширина образца стены
gap_m = 0.6               # от отметок уровней до палитры
line_m = 0.5              # шаг строк палитры
swatch_m = 0.35           # образец цвета — квадрат такой стороны
text_dx_m = 0.2           # от образца до подписи
text_w_m = 3.5            # место под подпись «id · вид»

[plan]
# трасса шага 2 (02_plan.svg): план с номерами сторон, проёмами и запретными зонами
margin_m = 1.5            # поле вокруг контура
label_offset_m = 0.6      # номер стороны снаружи от её середины
forbidden_inset_m = 0.075 # запретная зона — линия по наружной стене: на столько внутрь от контура
                          # (середина стены 0.15 м); глубже — ляжет на перегородку (хозяин 01.10)
legend_margin_m = 0.2     # легенда под планом: отступ слева и снизу
legend_line_m = 0.35      # шаг строк легенды
legend_swatch_m = 0.25    # образец цвета — квадрат такой стороны
legend_gap_m = 0.15       # от образца до подписи

[plan.legend]
# подпись к каждому классу плана; образец рисуется тем же классом .plan-<ключ> из sheet.css,
# поэтому цвет в легенде всегда тот же, что на плане, — названия цветов здесь не пишем
wall = "стена"
entrance = "вход"
window = "окно"
door = "дверь"
sealed = "заделано в глухом режиме"
forbidden = "запретная зона: внутренняя стена примыкает к наружной"
