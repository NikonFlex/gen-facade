[[guideline]]
id = "floor_height_ru"
text = "Высота помещений ru: жилые комнаты и кухня не ниже 2,5 м (2,7 м в подрайонах IА, IБ, IГ, IД, IVА), мансарда с наклонными потолками — не ниже 2,3 м; шаг этажей = чистая высота + перекрытие"
check = "floor_height"
params = { min = 2.5 }
applies = ["ru-izhs", "ru-mkd"]
note = "min относится к чистой высоте; шаг этажей на фасаде ≈ min + перекрытие (≈ 0,25 м, [не проверено]), то есть около 2,75 м. Что означает 2,75 м в GenPlan (шаг или чистая высота) — вопрос хозяину/Егору. В СП 54 допускается уменьшение потолка до 50 % площади в мансарде."
[[guideline.source]]
doc = "СП 55.13330.2016"
file = "norms/sp55.txt"
where = "п. 6.2"
quote = "расположенных в мансарде или имеющих наклонные потоки или стены, допускается принимать не менее 2,3 м"
checked = true
[[guideline.source]]
doc = "СП 54.13330.2022"
file = "norms/sp54.txt"
where = "п. 5.12"
quote = "допускается уменьшение высоты потолка относительно нормируемой на площади, не превышающей 50%"
checked = true
[[guideline.source]]
doc = "СП 55.13330.2016"
file = "norms/sp55.txt"
where = "п. 3.19"
quote = "Часть дома между высотными отметками верха перекрытия"
checked = true
[[guideline.source]]
doc = "СП 55.13330.2016, Изм. 2 (2023)"
file = "ru/norms2/sp55_izm2.txt"
where = "п. 6.2 (новая редакция)"
quote = "не менее 2,7 м, а в других климатических районах строительства - не менее 2,5 м"
checked = true

[[guideline]]
id = "light_ratio_ru_izhs"
text = "Свет ru-ИЖС: отношение площади световых проёмов к площади пола жилых комнат и кухонь не менее 1:8 (0,125); для мансардных этажей не менее 1:10"
check = "light_ratio"
params = { min = 0.125 }
applies = ["ru-izhs"]
note = "Строгая версия — по каждой комнате (привязка окна к комнате, план); агрегат по дому — слабая проверка. Для мансарды min = 0,10. Верхней границы для ИЖС нет."
[[guideline.source]]
doc = "СП 55.13330.2016"
file = "norms/sp55.txt"
where = "п. 9.18"
quote = "Отношение площади световых проемов к площади пола жилых помещений и кухонь должно быть не менее 1:8."
checked = true

[[guideline]]
id = "light_ratio_ru_mkd"
text = "Свет ru-МКД: отношение площади световых проёмов к площади пола жилых комнат и кухни не более 1:5,5 и не менее 1:8"
check = "light_ratio"
params = { min = 0.125, max = 0.182 }
applies = ["ru-mkd"]
note = "Верхний предел 1:5,5 (энергопотери) для ИЖС не действует; верхние этажи с окнами в наклонных конструкциях — не менее 1:10. Учебные пособия ИЖС (ТГТУ) тоже ограничивают сверху: 1/5,5…1/8 от площади пола; в СП 55 для ИЖС верхней границы нет."
[[guideline.source]]
doc = "СП 54.13330.2022"
file = "norms/sp54.txt"
where = "п. 7.13"
quote = "Отношение площади световых проемов к площади пола жилых комнат и кухни принимают не более 1:5,5 и не менее 1:8"
checked = true
[[guideline.source]]
doc = "ННГАСУ, Гоголева, Нуждов, Малоэтажное жилище"
file = "ru/58d5d7.pdf"
where = "стр. 82 (PDF)"
quote = "не должно превышать 1:5,5. Минимальное отношение должно быть не менее 1:8"
checked = true
[[guideline.source]]
doc = "Кузнецова и др., Индивидуальный жилой дом из мелкоразмерных элементов, 2011"
file = "books2/ru/tstu_kuznecova_2011.txt"
where = "стр. 19 (PDF)"
quote = "Площадь окон принимается в пределах 1/5,5…1/8 от площади пола помещения"
checked = true

[[guideline]]
id = "light_ratio_us"
text = "Свет us: остекление жилых комнат не менее 8 % площади пола (IRC R303.1); открываемая часть не менее 4 %"
