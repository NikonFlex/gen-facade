note = "нужна проверка: расстояние между осями соседних окон одного этажа 2,0–3,0 м (мягко); Куппфер 1914. Казань: 1,55–1,85 м между осями при окнах 0,8–0,95 м.; числа правила: min = 2.0, max = 3.0"
