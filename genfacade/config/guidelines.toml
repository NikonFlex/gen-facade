note = "нужна проверка: число ступеней ≈ plinth_m/0,15, не менее 3 (при plinth_m около 0,36 м и выше); для крыльца ИЖС ориентир, нормы нет (СП 1.13130 п. 4.3.5 не нормирует число ступеней наружных крылец; СП 59 к ИЖС не применяется).; числа правила: riser = 0.15, tread = 0.30, min_steps = 3"
[[guideline.source]]
doc = "УлГТУ, Индивидуальный однокв. жилой дом"
file = "ru/ulstu.txt"
where = "стр. 46"
quote = "Размер проступей лестниц должен быть – 0,3 м (допустимо от 0,27 до 0,35 м), а размер подступенка – 0,15 м"
checked = true
[[guideline.source]]
doc = "УлГТУ, Индивидуальный однокв. жилой дом"
file = "ru/ulstu.txt"
where = "стр. 46"
quote = "не допускаются использовать лестницы высотой менее трех ступеней"
checked = true
[[guideline.source]]
doc = "СП 59.13330.2020 (копия tiflocentre.ru, не ИЖС)"
file = "ru/norms2/sp59_tiflo.txt"
where = "п. 5.1.12"
quote = "высоту ступеней - от 0,12 до 0,15 м"
checked = true
[[guideline.source]]
doc = "Кузнецова и др., Индивидуальный жилой дом из мелкоразмерных элементов, 2011"
file = "books2/ru/tstu_kuznecova_2011.txt"
where = "стр. 17 (PDF)"
quote = "с числом ступеней не менее 3"
checked = true
[[guideline.source]]
doc = "ВГТУ, Черных, Конструкции и материалы, 2021"
file = "books2/ru/cchgeu_mu.txt"
where = "стр. 18 (PDF)"
quote = "ширину ступени делать не менее 260мм, а высоту не более 170мм"
checked = true

[[guideline]]
id = "sheet_dimensions_policy"
text = "Размеры на листе фасада: по вертикали отметки земли, цоколя, низа и верха проёмов, карниза, конька на расстоянии 15–20 мм от контура; горизонтальные размеры на фасаде не указывают (оси внизу без размеров) — у Казани под фасадом дана размерная цепочка"
check = "none"
applies = ["ru-izhs", "ru-mkd"]
note = "Конфликт: КГАСУ и БНТУ запрещают горизонтальные размеры на фасаде, Казань и ГОСТ Р 21.501 п. 5.4.2 допускают размеры и привязки проёмов, не указанные на планах. Решение — в спеке, оформление листа (шаг 6).; числа правила: offset_mm = [15, 20]"
[[guideline.source]]
doc = "КГАСУ, Сибгатуллина, Попов, Индивидуальный жилой дом"
file = "ru/kgasu.txt"
where = "п. 4.1, стр. 27"
quote = "Горизонтальные размеры на фасаде не указывают"
checked = true
[[guideline.source]]
doc = "БНТУ, Платонова, Гражданские здания из мелкоразмерных элементов"
