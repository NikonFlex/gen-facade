applies = ["ru-izhs", "ru-mkd"]
note = "нужна проверка: w·h окна ≤ 6,0 м2 (площадь створок на фасаде известна только если они нарисованы); числа правила: cls = 'window', max_area_m2 = 6.0"
[[guideline.source]]
doc = "ГОСТ 23166-99"
file = "norms/g23166.txt"
where = "п. 5.1.4"
quote = "изготовление оконных блоков с площадью, не превышающей 6,0 м2, при этом площадь открывающихся элементов не должна превышать 2,5 м2."
checked = true
[[guideline.source]]
doc = "ГОСТ 30674-99 (ПВХ-окна)"
file = "ru/g30674.txt"
where = "п. 5.1.4"
quote = "при максимальной площади каждого открывающегося элемента 2,5 м 2 для изделий белого цвета и 2,2 м 2 – для изделий других цветов"
checked = true

[[guideline]]
id = "window_sash_max"
text = "Окна ru: створка деревянного окна не более 1200×1800 мм, дверное полотно не более 900×2300 мм (больше — импост, фрамуга или двупольная дверь)"
