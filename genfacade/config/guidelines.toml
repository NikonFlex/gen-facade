# Свод правил фасада (gf#209): нормы РФ и США, pattern books, руководства по облику частных домов,
# книги и методички — одно правило со всеми источниками. Проверка — genfacade/guidelines.py
# (`genfacade guidelines` — доля домов, выполняющих правило); таблица для чтения —
# docs/facade-rules.md, собирается из этого файла. Числа — в метрах.
# use — куда правило включено (metric, synthetic, derive, guard, train); по умолчанию никуда:
# включает хозяин после замера. Тексты источников — tmp/facade-rules/ (вне git).

[[guideline]]
id = "window_gost_size_row"
text = "Окна ru: размеры оконного блока близки к типоразмерам ГОСТ 23166 (модуль 100 мм, табл. 2; ряд «рекомендуемый», проект вправе назначить другой — проверка мягкая, как доля типовых окон)"
check = "size_row"
params = { cls = "window", widths = [0.57, 0.72, 0.87, 1.17, 1.32, 1.47, 1.77, 2.07, 2.37, 2.67], heights = [0.58, 0.86, 1.16, 1.32, 1.46, 1.76, 2.06, 2.175, 2.375, 2.755], tol_m = 0.05 }
applies = ["ru-izhs", "ru-mkd"]
note = "Ряд ширин в тексте п. 4.9 включает 11М, в табл. 2 его нет; пары (W,H) допустимы не все (табл. А в extract-norms.md); габарит ≠ модуль (6М → 570/580)."
[[guideline.source]]
doc = "ГОСТ 23166-99"
file = "norms/g23166.txt"
where = "п. 4.9"
quote = "по ширине - 6М; 7М; 9М; 11М; 12М; 13М; 15М; 18М; 21М; 24М; 27М"
checked = true
[[guideline.source]]
doc = "ГОСТ 23166-99"
file = "norms/g23166.txt"
where = "п. 4.9, табл. 2"
quote = "Рекомендуемые габаритные размеры, мм, оконных блоков, а также их обозначения приведены в таблице 2."
checked = true
[[guideline.source]]
doc = "ГОСТ 23166-99"
file = "norms/g23166.txt"
where = "п. 4.9"
quote = "Габаритные размеры оконных и балконных дверных блоков и стеновых проемов для их монтажа устанавливают в проектной"
checked = true

[[guideline]]
id = "window_block_max_area"
text = "Окна ru: площадь оконного блока не более 6,0 м2 (открывающихся элементов не более 2,5 м2); больший проём разбивается импостами на несколько блоков"
