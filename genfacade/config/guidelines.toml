doc = "СП 55.13330.2016"
file = "norms/sp55.txt"
where = "п. 9.18"
quote = "В жилых комнатах и кухне должно быть обеспечено естественное освещение."
checked = true
[[guideline.source]]
doc = "СП 55.13330.2016"
