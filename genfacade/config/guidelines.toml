file = "en/norfolk.pdf"
where = "стр. 63 (PDF)"
quote = "Smaller, single-bay entry porches with a minimum porch depth of 4 feet are encouraged on Coastal Cottages."
checked = true

[[guideline]]
id = "porch_width_share_us"
text = "Порч занимает 1/5, 1/3, 3/5 или всю ширину фасада; Roanoke — не менее половины ширины; портик по центру"
check = "none"
applies = ["us"]
note = "нужна проверка: porch.w / длина стены ∈ {0,2; 0,33; 0,6; 1,0} (допуск ±0,05) или ≥ 0,5 (Roanoke).; числа правила: shares = [0.2, 0.33, 0.6, 1.0]"
[[guideline.source]]
doc = "Norfolk Pattern Book, UDA 2003"
file = "en/norfolk.pdf"
where = "стр. 31 (PDF)"
quote = "they may also be three-fifths or the entire length of the front facade"
checked = true
[[guideline.source]]
doc = "Residential Pattern Book Roanoke, 2008"
file = "en/roanoke_full.txt"
where = "стр. 104 (PDF)"
quote = "at least half the width of the dwelling’s façade and have a depth of at least 6 feet"
checked = true

[[guideline]]
id = "porch_column_spacing_us"
text = "Колонны порча: шаг 8–12 ft (2,44–3,66 м) по осям; расстояние между колоннами не больше их высоты; пролёты уже, чем высота"
check = "none"
applies = ["us"]
note = "нужна проверка: расстояние между соседними pillar ∈ [2,44; 3,66] и ≤ высоты pillar; у Coastal shed-porch пролёты шире высоты.; числа правила: min = 2.44, max = 3.66"
[[guideline.source]]
doc = "Mississippi Renewal Pattern Book, UDA 2005"
file = "en/ms_rep_patternbook.pdf"
where = "стр. 27 (PDF)"
quote = "Columns have a regular spacing of between 8 to 12 feet on center."
checked = true
[[guideline.source]]
doc = "Mississippi State University Architecture, Mouzon 2023"
file = "en/msu.pdf"
where = "стр. 29"
quote = "The space between columns (measured center to center) must be no greater than the height of the columns"
checked = true
[[guideline.source]]
doc = "Norfolk Pattern Book, UDA 2003"
file = "en/norfolk.txt"
where = "стр. 33 (PDF)"
quote = "Porch column bays should be more narrow than wide."
checked = true

[[guideline]]
id = "porch_column_height_us"
text = "Колонны порча одноэтажного: высота 9–10 ft (2,74–3,05 м) на 1-м этаже, 8–9 ft (2,44–2,74 м) на 2-м"
check = "none"
applies = ["us"]
note = "нужна проверка: высота pillar в диапазоне (Habitat: 8–9 ft; Coastal: 7–8 ft).; числа правила: cls = 'pillar', min = 2.44, max = 3.05"
[[guideline.source]]
doc = "Norfolk Pattern Book, UDA 2003"
file = "en/norfolk.txt"
where = "стр. 33 (PDF)"
quote = "Single-story porches have 9-to 10-foot-tall columns"
checked = true

[[guideline]]
id = "canopy_min_size_us"
text = "Навес над боковым входом: ширина и глубина не менее 36 дюймов (0,91 м); hood Coastal Cottage выносится не более чем на 3 ft"
check = "none"
applies = ["us"]
note = "нужна проверка: canopy.w ≥ 0,91 (глубины в модели нет).; числа правила: cls = 'canopy', min_w = 0.91"
[[guideline.source]]
doc = "Residential Pattern Book Roanoke, 2008"
file = "en/roanoke_full.pdf"
where = "стр. 105 (PDF)"
quote = "Side entries should be covered by a roof with a minimum width and depth of 36 inches."
checked = true
[[guideline.source]]
doc = "Norfolk Pattern Book, UDA 2003"
file = "en/norfolk.pdf"
where = "стр. 63 (PDF)"
quote = "projects no more than 3 feet from the facade"
checked = true

[[guideline]]
id = "frieze_gap_us"
text = "Фриз us: высота 8–16 дюймов (0,20–0,41 м), либо вплотную к наличнику верха окна, либо не менее чем на 8 дюймов (0,20 м) выше него"
check = "none"
applies = ["us"]
note = "нужна проверка: зазор между верхом окна 2-го этажа (с наличником) и низом cornice = 0 или ≥ 0,20 м (Victorian); у Arts & Crafts зазор 0–0,30 м; Louisiana Classical — фриз не менее 10 дюймов (0,25 м).; числа правила: gap_min = 0.20, frieze_h_min = 0.20, frieze_h_max = 0.41"
[[guideline.source]]
doc = "Mississippi Renewal Pattern Book, UDA 2005"
file = "en/ms_rep_patternbook.pdf"
where = "стр. 31 (PDF)"
quote = "A 12- to 16-inch frieze board either touching or at least 8 inches above the window head trim"
checked = true
[[guideline.source]]
doc = "Norfolk Pattern Book, UDA 2003"
file = "en/norfolk.pdf"
where = "стр. 37 (PDF)"
quote = "Eave profiles have an 8- to 12-inch frieze board at least 8 inches above the window head trim."
checked = true

[[guideline]]
id = "skirt_board_us"
text = "Цокольная доска (skirt board) высотой 8 дюймов (0,20 м), 8–10 дюймов (0,20–0,25 м) у Arts & Crafts; вентотверстия фундамента по центру под окном"
check = "none"
applies = ["us"]
note = "нужна проверка: высота полосы у низа стены; vent.cx = window.cx.; числа правила: min = 0.20, max = 0.25"
[[guideline.source]]
doc = "Mississippi Renewal Pattern Book, UDA 2005"
file = "en/ms_rep_patternbook.pdf"
where = "стр. 31 (PDF)"
quote = "These houses have 8-inch-wide skirt boards. Foundation vents are centered under windows when used."
checked = true
[[guideline.source]]
doc = "Norfolk Pattern Book, UDA 2003"
file = "en/norfolk.pdf"
where = "стр. 37 (PDF)"
quote = "Clapboard houses should have an 8-inch skirt board."
checked = true

[[guideline]]
id = "corner_board_us"
text = "Угловые доски (corner boards) шириной не менее 6 дюймов (0,15 м), по Roanoke не менее 3,5 дюйма"
check = "none"
applies = ["us"]
note = "нужна проверка: ширина вертикальной полосы на углу стены.; числа правила: min = 0.15"
[[guideline.source]]
doc = "Louisiana Speaks Pattern Book, UDA 2006"
file = "en/la_speaks_cpex.txt"
where = "стр. 57 (PDF)"
quote = "Corner boards are typically 6 inches wide at a minimum."
checked = true
[[guideline.source]]
doc = "Norfolk Pattern Book, UDA 2003"
file = "en/norfolk.txt"
where = "стр. 37 (PDF)"
quote = "On clapboard houses, corner boards"
checked = true

[[guideline]]
id = "belt_course"
text = "Пояс между этажами: непрерывная горизонтальная полоса (belt course) на уровне пола 2-го этажа или по линии подоконников 2-го этажа (Arts & Crafts, Colonial Revival)"
check = "none"
applies = ["us", "eu"]
note = "нужна проверка: molding на y = y_floor[1] или y = подоконник 2-го этажа, на всю длину стены."
[[guideline.source]]
doc = "Pattern Book for Neighborly Houses, 2007"
file = "en/habitat_sh_arch.txt"
where = "стр. 11 (PDF)"
quote = "Continuous horizontal trim band or belt course at the second floor window sill line"
checked = true
[[guideline.source]]
doc = "Essex Design Guide, 2018"
file = "books2/eu/uk-edg-architectural-details.txt"
where = "§1.47, стр. 18"
quote = "form of the building may be emphasised by string courses, plinths and projections at the eaves"
checked = true
[[guideline.source]]
doc = "Bodenheim, Gestaltfibel, 2013"
file = "books2/eu/de-bodenheim-gestaltfibel.txt"
where = "4.2, стр. 19"
quote = "Eine Fassade lässt sich in folgende Bereiche horizontal unterteilen"
checked = true

[[guideline]]
id = "heavy_material_below_light"
text = "Материалы по слоям: тяжёлые снизу, лёгкие сверху (камень/кирпич под деревом и штукатуркой); сайдинг не ближе 8 дюймов (0,20 м) к земле"
check = "none"
applies = ["us"]
note = "нужна проверка: порядок цветовых зон снизу вверх; нижняя граница сайдинга не ниже 0,20 м над землёй (цоколь)."
[[guideline.source]]
doc = "Mississippi State University Architecture, Mouzon 2023"
file = "en/msu.txt"
where = "стр. 12"
quote = "Heavier wall materials should always be below lighter wall materials."
checked = true
[[guideline.source]]
doc = "Norfolk Pattern Book, UDA 2003"
file = "en/norfolk.pdf"
where = "стр. 43 (PDF)"
quote = "Clapboard or shake cladding materials should never come within 8 inches of finished grade"
checked = true

[[guideline]]
id = "opening_module_masonry_us"
text = "Кирпичная облицовка: центры проёмов и углы на модуле 4 дюйма (0,10 м), кирпич по вертикали на модуле 16 дюймов, по горизонтали 8 дюймов"
check = "module"
params = { cls = "window", module_m = 0.1016, tol_m = 0.01 }
applies = ["us"]
note = "Только для кирпичной облицовки (MSU)."
[[guideline.source]]
doc = "Mississippi State University Architecture, Mouzon 2023"
file = "en/msu.pdf"
where = "стр. 12"
quote = "Brick should course vertically to a 16” module and horizontally to an 8” module."
checked = true

[[guideline]]
id = "raised_base_piers_us"
text = "Нежилой нижний этаж на высоком цоколе (при plinth от 2,44 м): стены из жалюзи между квадратными каменными/кирпичными столбами"
check = "none"
applies = ["us"]
note = "нужна проверка: при plinth_m ≥ 2,44 под floor 1 отрисованы pillar и панели, а не сплошной цоколь.; числа правила: cls = 'pillar'"
[[guideline.source]]
doc = "Mississippi Renewal Pattern Book, UDA 2005"
file = "en/ms_rep.txt"
where = "стр. 17 (PDF)"
quote = "Unoccupied ground floor exterior walls can be articulated as louvered panels inset between square, masonry piers."
checked = true

[[guideline]]
id = "window_row_rhythm_ru"
text = "Ритм проёмов ru (Казань, ТД ИРГ): окна одного ряда одной ширины и высоты, простенки между окнами одинаковые, боковой простенок (угол — первое окно) больше внутреннего; излишек по горизонтали уходит в боковые простенки"
check = "none"
applies = ["ru-izhs"]
note = "нужна проверка: сумма цепочки «боковой + N окон + (N−1) простенков» = ширина стены; окна ряда равны; внутренние простенки равны. Типы Казани: 1200|900|900 (3 окна, 6,9 м), 1100|950|800 (4 окна, 8,4 м), 1000|800|650 (двухэтажный, 5,7 м). Исторический анализ даёт простенок ≈ 1,7·окно — диапазон 0,8–1,7. Региональный стиль, не общий ИЖС.; числа правила: pier_to_window = [0.8, 1.0], lateral_to_window = [1.16, 1.33], tol_lateral_m = 0.3"
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 12"
quote = "Ширина и высота оконных проемов, а также ширина простенков"
checked = true
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 10, 12"
quote = "допустимое отступление горизонтальных размеров распределяется в боковые простенки"
checked = true

[[guideline]]
id = "window_vertical_ru"
text = "Окна ru: оконный проём стоячий, высота в 1,8–1,9 раза больше ширины (900×1600, 950×1700, 800×1500; историческая пропорция 1:1,9)"
check = "aspect"
params = { cls = "window", min = 1.7, max = 2.0 }
applies = ["ru-izhs"]
note = "Региональный стиль Казани (исторические дома XIX — начала XX века), не общий ИЖС. Створки + фрамуга около 1/3 высоты сверху. Числа сняты с чертежей, текстовых цитат нет. Куппфер (1914): ширина окна ≈ 0,5–0,7 высоты (h/w 1,43–2,2), высота окон жилых комнат 2,0–2,5 м (исторически высокие окна)."
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 38, рисунок «Оконный проем» (900×1600)"
quote = ""
checked = false
[[guideline.source]]
doc = "Казань, обоснование ТД ИРГ, 2025"
file = "ru/irg/obosnovanie.txt"
where = "стр. 26, анализ застройки (ширина : высота окна = 1:1,9)"
quote = ""
checked = false
[[guideline.source]]
doc = "Куппфер, Жилой дом, 1914"
file = "books2/ru/kupffer.txt"
where = "стр. 58 (PDF)"
quote = "Ширина обыкновенная окна принимается"
checked = true

[[guideline]]
id = "entrance_annex_kazan"
text = "Вход в Казани (ТД ИРГ): пристройка сбоку от основного объёма шириной 2,1 или 3,0 м, её свес ниже свеса дома на 0,1–0,8 м; дверь Д1 двустворчатая 1100×2100; аттик входной группы шириной с пристройку, высотой 0,75–0,9 м; навес 1,9 м по оси двери"
check = "none"
applies = ["ru-izhs"]
note = "нужна проверка: пристройка входа примыкает к основному объёму, door внутри пристройки, canopy по оси двери и уже пристройки. Региональный стиль, числа сняты с чертежей.; числа правила: annex_w = [2.1, 3.0], door = [1.1, 2.1], attic_h = [0.75, 0.9], canopy_w = 1.9"
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 44-45"
quote = "Навесы выполняются из деревянных конструкций с металлическими"
checked = true
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 47, рисунок аттика"
quote = ""
checked = false

[[guideline]]
id = "building_limits_kazan"
text = "Предельные габариты дома (Казань): длина уличного фасада основного объёма не более 18 м, высота от земли до конька не более 13 м"
check = "none"
applies = ["ru-izhs"]
note = "нужна проверка: length_m ≤ 18,0 м (высота до конька — кровли в модели нет, проверка по eaves_m).; числа правила: max_wall_length_m = 18.0, max_ridge_m = 13.0"
[[guideline.source]]
doc = "Казань, обоснование ТД ИРГ, 2025"
file = "ru/irg/obosnovanie.txt"
where = "печ. 31"
quote = "Максимальная длина уличного фасада основного объема – 18 м."
checked = true

[[guideline]]
id = "color_roles_ru"
text = "Цветовые роли ИЖС: основной цвет стен; детали (наличники, лопатки, пояски) светлые; оконные рамы и входная дверь одного цвета; цоколь отдельным цветом; кровля, водостоки и металл одного цвета; рамы всего здания одного цвета, двери фасада одного типа"
check = "none"
applies = ["ru-izhs", "ru-mkd"]
note = "нужна проверка: цвета frame всех window совпадают и равны цвету door; цвет trim светлее wall (Дизайн-Капитал допускает и обратное: светлые обрамления на тёмном, и наоборот). Цвет в дипломе приходит из палитры параметров дома.; числа правила: roles = ['wall', 'trim', 'windows_door', 'plinth', 'roof_gutters']"
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 11"
quote = "Колористические решения, представленные в альбоме, являются"
checked = true
[[guideline.source]]
doc = "Аннинское городское поселение, Дизайн-код, 2023"
file = "ru/annino.txt"
where = "п. 2.5.6, стр. 39"
quote = "Оконные рамы и переплеты одного здания должны быть выполнены в одном цвете"
checked = true
[[guideline.source]]
doc = "Аннинское городское поселение, Дизайн-код, 2023"
file = "ru/annino.txt"
where = "п. 2.6.3, стр. 40"
quote = "Двери одного фасада должны иметь единообразный вид и быть одного типа"
checked = true
[[guideline.source]]
doc = "Дизайн-Капитал, Руководство по дизайну фасада v2.5, 2019"
file = "ru/dk/designcapital.pdf"
where = "стр. 9 (PDF)"
quote = "на темном в целом фасаде могут быть светлые обрамления и наоборот"
checked = true

[[guideline]]
id = "porch_steps_ru"
text = "Ступени крыльца: подъём около 0,15 м (0,13–0,175), проступь 0,30 м (0,27–0,35); число ступеней примерно plinth_m / 0,15; лестницу менее чем из трёх ступеней при подъёме от 0,12 м заменяют пандусом"
