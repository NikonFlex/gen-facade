file = "norms/sp54.txt"
where = "п. 6.4.9"
quote = "В случае расположения нижнего уровня светопрозрачного заполнения оконного блока на высоте менее 0,9 м от уровня чистого пола"
checked = true

[[guideline]]
id = "egress_window_ru_izhs"
text = "Аварийное окно ru-ИЖС (3 этажа): в каждом помещении для сна — окно с низом не выше 1,0 м от пола; окно и балкон — не выше 7 м над землёй"
check = "none"
applies = ["ru-izhs"]
note = "нужна проверка: у спальни 3-го этажа (план) окно с sill ≤ 1,0 м и (2·H + sill + plinth_m) ≤ 7 м. Диапазон 0,9–1,0 м одновременно проходит СП 54 п. 6.4.9 и СП 55 п. 7.6; уровни GenPlan small (1,10) и standard (0,55) в него не попадают.; числа правила: sill_max = 1.0, height_above_ground_max = 7.0"
[[guideline.source]]
doc = "СП 55.13330.2016"
file = "norms/sp55.txt"
where = "п. 7.6"
quote = "каждое помещение, которое может быть использовано для сна, должно иметь не менее одного окна, расположенного на высоте не более 1 м над уровнем пола"
checked = true

[[guideline]]
id = "egress_window_us"
text = "Аварийное окно us (IRC R310): чистое открытие не менее 5,7 кв. фута (0,53 м2), высота в свету 24 дюйма (0,61 м), ширина 20 дюймов (0,51 м), низ не выше 44 дюймов (1,12 м)"
check = "none"
applies = ["us"]
note = "нужна проверка: окно спальни (план); справочно по вторичной копии Tip Sheet 23, первоисточник IRC не получен.; числа правила: min_area_m2 = 0.53, min_clear_h = 0.61, min_clear_w = 0.51, sill_max = 1.118"
[[guideline.source]]
doc = "IRC 2021 R310.2 (копия Tip Sheet 23)"
file = "norms/a.txt"
where = "R310.2"
quote = "Minimum clear opening size of 5.7 square feet (5 square feet on the grade level) with minimum clear height of 24 inches and minimum clear width of 20 inches."
checked = true

[[guideline]]
id = "sill_height_us"
text = "Падение из окна us (IRC R312.2): при наружном подоконнике выше 72 дюймов (1,83 м) над землёй и внутреннем ниже 24 дюймов (0,61 м) от пола нужен ограничитель открывания"
check = "none"
applies = ["us"]
note = "нужна проверка: только окна, у которых низ выше 1,83 м над землёй (sill_height проверяет все окна); числа правила: min 0.61. Относится к окнам этажей 2+ (y_пола + sill − y_земли > 1,83 м); для первого этажа не нужно. Справочно по вторичной копии Tip Sheet 23."
[[guideline.source]]
doc = "IRC 2021 R312.2 (копия Tip Sheet 23)"
file = "norms/a.txt"
where = "R312.2"
quote = "sill height above the finished floor on the interior side of the operable window opening is less than 24 inches"
checked = true

[[guideline]]
id = "house_has_entrance"
text = "У дома есть хотя бы одна наружная входная дверь на уровне первого этажа (выход непосредственно наружу)"
check = "none"
applies = ["ru-izhs"]
note = "нужна проверка: хотя бы одна стена с has_entrance и дверью (не garage_door, не окном) на первом этаже."
[[guideline.source]]
doc = "СП 1.13130.2020"
file = "norms/4293722520.txt"
where = "п. 6.2.1"
quote = "Каждый дом (жилой блок) должен иметь не менее одного эвакуационного выхода непосредственно наружу"
checked = true

[[guideline]]
id = "porch_wider_than_door"
text = "Входная площадка перед наружной дверью — шириной не менее 1,5 ширины полотна двери"
check = "none"
applies = ["ru-izhs", "ru-mkd"]
note = "нужна проверка: porch.w ≥ 1,5·door.w (в норме «шириной» трактуют как глубину, которой на фасаде нет; ширина вдоль фасада ≥ ширины проёма — минимум). Ориентиры других источников: площадка крыльца не менее 1,4×1,4 м (БНТУ, МКД РБ), 1,6×2,2 м без пандуса (СП 59, общественные здания; к одноквартирным домам СП 59 не применяется, п. 1.3).; числа правила: ratio = 1.5"
[[guideline.source]]
doc = "СП 1.13130.2020"
file = "norms/4293722520.txt"
where = "п. 4.2.21"
quote = "Перед наружной дверью (эвакуационным выходом) должна быть предусмотрена горизонтальная входная площадка с шириной не менее 1,5 ширины полотна наружной двери."
checked = true
[[guideline.source]]
doc = "БНТУ, Платонова, Гражданские здания из мелкоразмерных элементов"
file = "ru/bntu.txt"
where = "стр. 69 (PDF)"
quote = "должна быть защищена от атмосферных осадков козырьком или другим устройством"
checked = true
[[guideline.source]]
doc = "СП 59.13330.2020 (копия tiflocentre.ru, не ИЖС)"
file = "ru/norms2/sp59_tiflo.txt"
where = "п. 6.1.4"
quote = "Размеры входной площадки (ширина x глубина) с пандусом должны быть не менее 2,2 x 2,2 м."
checked = true
[[guideline.source]]
doc = "Кузнецова и др., Индивидуальный жилой дом из мелкоразмерных элементов, 2011"
file = "books2/ru/tstu_kuznecova_2011.txt"
where = "стр. 17 (PDF)"
quote = "входную площадку (шириной не менее 1200 мм)"
checked = true
[[guideline.source]]
doc = "БНТУ, Молокович, Типология жилых зданий, 2021"
file = "books2/ru/bntu_f3491.txt"
where = "раздел 4, стр. 70 (печ.)"
quote = "предусматривать защищенную от атмосферных осадков площадку размерами"
checked = true

[[guideline]]
id = "balcony_emergency_exit"
text = "Балкон как аварийный выход (МКД): глухой простенок не менее 1,2 м от торца балкона до оконного проёма (не менее 1,6 м между остеклёнными проёмами), ширина балкона не менее 0,6 м"
check = "none"
applies = ["ru-mkd"]
note = "нужна проверка: зазор от края balcony до ближайшего проёма ≥ 1,2 м. Для ИЖС не требуется.; числа правила: gap_min = 1.2, between_openings_min = 1.6, balcony_w_min = 0.6"
[[guideline.source]]
doc = "СП 1.13130.2020"
file = "norms/4293722520.txt"
where = "п. 4.2.4 а)"
quote = "выход на балкон или лоджию с глухим простенком не менее 1,2 м от торца балкона (лоджии) до оконного проема"
checked = true

[[guideline]]
id = "canopy_over_entrance"
text = "Над входом есть козырёк или навес: в МКД обязателен над входной площадкой, наружными маршами и пандусами (СП 54); для ИЖС норма не требует, учебники и дизайн-коды рекомендуют"
check = "canopy_over_entrance"
applies = ["ru-izhs", "ru-mkd", "us", "eu"]
note = "Размеров (вылет, высота) РФ-нормы не задают. Казань: навес по оси двери шириной 1,9 м (уже пристройки входа 2,1 м), цвет кровли. Roanoke: боковой вход закрыт навесом не менее 0,91 м. Европа: вход защищён скромным лёгким навесом на кронштейнах, без монументальных колонных портиков (Pfaffenhofen, Cotswold); вынос навеса ≥ его ширины (EDG), для Баварии Gret до 0,7 м — глубины в модели нет."
[[guideline.source]]
doc = "СП 54.13330.2022"
file = "norms/sp54.txt"
where = "п. 5.21"
quote = "Для защиты от осадков над входной площадкой, наружными лестничными маршами и пандусами, расположенными вдоль фасада, предусматривают козырек."
checked = true
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 44-45"
quote = "Навесы выполняются из деревянных конструкций с металлическими"
checked = true
[[guideline.source]]
doc = "ННГАСУ, Тишков, Рыскулова, Архитектурные конструкции"
file = "ru/nn4842.txt"
where = "стр. 36"
quote = "Входная площадка обычно защищается навесом от атмосферных осадков (козырьком)."
checked = true
[[guideline.source]]
doc = "Аннинское городское поселение, Дизайн-код, 2023"
file = "ru/annino.txt"
where = "п. 2.3.1, стр. 37"
quote = "входы в здания должны иметь навес в плоскости фасада"
checked = true
[[guideline.source]]
doc = "КГАСУ, Сибгатуллина, Попов, Индивидуальный жилой дом"
file = "ru/kgasu.txt"
where = "п. 4.1, стр. 27"
quote = "оконные и дверные проемы с оконными переплетами и дверными полотнами, ступени и козырьки входов, цоколь"
checked = true
[[guideline.source]]
doc = "Residential Pattern Book Roanoke, 2008"
file = "en/roanoke_full.pdf"
where = "стр. 105 (PDF)"
quote = "Side entries should be covered by a roof with a minimum width and depth of 36 inches."
checked = true
[[guideline.source]]
doc = "Pfaffenhofen, Bauen ist Charaktersache, 2018"
file = "books2/eu/de-pfaffenhofen-bauen-charaktersache.txt"
where = "стр. 3"
quote = "Vermeiden Sie bei der Hervorhebung des Eingangs Treppentürme oder protzige und daher unbeholfen wirkende Säulenportiken."
checked = true
[[guideline.source]]
doc = "Cotswold Design Code, Local Plan App. D"
file = "books2/eu/uk-cotswold-design-code-appendixD.txt"
where = "стр. 4"
quote = "many lightweight canopies, such as gables or flat hoods supported on brackets"
checked = true
[[guideline.source]]
doc = "Essex Design Guide, 2018"
file = "books2/eu/uk-edg-architectural-details.txt"
where = "§1.55, стр. 19"
quote = "pitched-roof porch should project from the building by at least the width of its span"
checked = true
[[guideline.source]]
doc = "Дизайн-Капитал, Руководство по дизайну фасада v2.5, 2019"
file = "ru/dk/designcapital.txt"
where = "стр. 11 (PDF)"
quote = "На дальнем видовом плане обращает на себя внимание фронтон или козырек дома."
checked = true
[[guideline.source]]
doc = "Pfaffenhofen, Bauen ist Charaktersache, 2018"
file = "books2/eu/de-pfaffenhofen-bauen-charaktersache.txt"
where = "стр. 3"
quote = "Eine großzügige Eingangsüberdachung ist z.B. der in unserem Landkreis ursprüngliche Gret"
checked = true

[[guideline]]
id = "plinth_height_ru"
text = "Цоколь ru: пол комнаты 1-го этажа и эвакуационный выход выше планировочной отметки земли (plinth_m строго больше нуля); высота цоколя не менее 0,5 м, у Казани 0,8–0,9 м"
check = "plinth_height"
params = { min = 0.5, max = 1.1 }
applies = ["ru-izhs", "ru-mkd"]
note = "Норма требует только plinth_m > 0 (СП 55 Изм. 2 п. 6.2.2; СП 54 прил. А); 0,5 м — ВолгГАСУ (Григоров п. 9.3.4); 0,5–1,1 м на рельефе и 0,8/0,9 м по типам — Казань, ТД ИРГ (высота измеряется по центру фасада). Верх цоколя примерно на уровне пола 1-го этажа (НГАСУ). Аннино: цоколь в одной плоскости со стеной, НГАСУ: цоколь слегка отступает — глубины в модели нет. Пол 1-го этажа выше земли на 0,15–0,20 м — минимум при полах по грунту (Басманов); ТГТУ: земля на 0,60 / 0,75 / 0,90 м ниже ±0.000 (4–6 ступеней по 150 мм)."
[[guideline.source]]
doc = "СП 55.13330.2016, Изм. 2 (2023)"
file = "ru/norms2/sp55_izm2.txt"
where = "п. 6.2.2 (новый)"
quote = "Отметка пола комнаты, расположенной на первом этаже, должна быть выше планировочной отметки земли"
checked = true
[[guideline.source]]
doc = "СП 54.13330.2022"
file = "norms/sp54.txt"
where = "прил. А"
quote = "Эвакуационный выход с первого надземного этажа непосредственно наружу должен располагаться выше планировочной отметки земли в месте его устройства."
checked = true
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 10, 12"
quote = "Высота цоколя измеряется по центру фасада."
checked = true
[[guideline.source]]
doc = "Казань, ТД ИРГ (типовые решения ИЖС), 2025"
file = "ru/irg/TD1.txt"
where = "стр. 12"
quote = "Допускается устройство ниш и окон на цоколе."
checked = true
[[guideline.source]]
doc = "ВолгГАСУ, Григоров, Архитектурные конструкции"
file = "ru/extra/vgasu_grigorov.txt"
where = "п. 9.3.4, стр. 66"
quote = "Высота цоколя принимается не менее 500 мм"
checked = true
[[guideline.source]]
doc = "ННГАСУ, Тишков, Рыскулова, Архитектурные конструкции"
file = "ru/nn4842.txt"
where = "стр. 45 (PDF)"
quote = "Верхний уступ («обрез») цоколя располагается, как правило, примерно на уровне приподнятого над поверхностью земли пола первого этажа"
checked = true
[[guideline.source]]
doc = "Кузнецова и др., Индивидуальный жилой дом из мелкоразмерных элементов, 2011"
file = "books2/ru/tstu_kuznecova_2011.txt"
where = "стр. 20 (PDF)"
quote = "Уровень земли принимается ниже нулевой отметки, как правило, на 600, 750, 900 мм"
checked = true
[[guideline.source]]
doc = "Кузнецова и др., Индивидуальный жилой дом из мелкоразмерных элементов, 2011"
file = "books2/ru/tstu_kuznecova_2011.txt"
where = "стр. 13 (PDF)"
quote = "Высота цоколя принимается, как правило, не менее 500 мм"
checked = true
[[guideline.source]]
doc = "Басманов, Однокв. малоэтажный жилой дом, 2018"
file = "books2/ru/rubinst_basmanov_2018.txt"
where = "стр. 7 (PDF)"
quote = "уровня поля первого этажа должна быть 0,150-0,200 выше уровня земли"
checked = true

[[guideline]]
id = "panoramic_glazing_guard_ru"
text = "Панорамное остекление (окно от пола): дополнительное защитное ограждение высотой 1,2 м, если перед окном нет балкона или лоджии"
check = "none"
applies = ["ru-izhs", "ru-mkd"]
note = "нужна проверка: окно с sill < 0,1 м и вне balcony/porch — рядом ограждение высотой 1,2 м (для ИЖС Изм. 2 п. 8.8, для МКД п. 6.4.13).; числа правила: guard_h = 1.2"
[[guideline.source]]
doc = "СП 54.13330.2022"
file = "norms/sp54.txt"
where = "п. 6.4.13"
quote = "при панорамном остеклении жилых помещений и кухонь, в местах, не примыкающих к балкону или лоджии"
checked = true
[[guideline.source]]
doc = "СП 55.13330.2016, Изм. 2 (2023)"
file = "ru/norms2/sp55_izm2.txt"
where = "п. 8.8 (новый)"
quote = "при панорамном остеклении жилых помещений и кухонь, в местах, не примыкающих к балкону или лоджии, следует принимать 1,2 м"
checked = true

[[guideline]]
id = "sheet_level_marks"
text = "Лист фасада: отметки уровней земли, входных площадок, верха стен, низа и верха проёмов и разноуровневых элементов; координационные оси в характерных местах (крайние, уступы, перепады)"
check = "none"
applies = ["ru-izhs", "ru-mkd"]
note = "Оформление листа (шаг 6), геометрию стен не проверяет; нужна проверка: на листе есть отметки земли, пола этажей, карниза и оси стены."
[[guideline.source]]
doc = "ГОСТ Р 21.501-2018"
file = "ru/g21501.txt"
where = "п. 5.4.2"
quote = "отметки уровней земли, входных площадок, верха стен, низа и верха проемов и расположенных на разных уровнях элементов фасадов"
checked = true
[[guideline.source]]
doc = "ГОСТ Р 21.501-2018"
file = "ru/g21501.txt"
where = "п. 5.4.2"
quote = "координационные оси здания (сооружения), проходящие в характерных местах фасадов"
checked = true
[[guideline.source]]
doc = "КГАСУ, Сибгатуллина, Попов, Индивидуальный жилой дом"
file = "ru/kgasu.txt"
where = "п. 4.1, стр. 27"
quote = "На фасадах показывают все архитектурные и конструктивные детали"
checked = true
[[guideline.source]]
doc = "БНТУ, Платонова, Гражданские здания из мелкоразмерных элементов"
file = "ru/bntu.txt"
where = "стр. 71 (PDF)"
quote = "на фасаде ставятся следующие отметки"
checked = true
[[guideline.source]]
doc = "БНТУ, Телеш и др., Выполнение чертежей двухэтажного жилого дома, 2021"
file = "books2/ru/bntu_chertezhi_2et.txt"
where = "стр. 75 (PDF)"
quote = "наносят высотные отметки уровня земли, цоколя, низа и верха проемов, карниза и верха крыши"
checked = true

[[guideline]]
id = "sheet_window_marks"
text = "Лист фасада: окна получают марки ОК1, ОК2… по числу различных типов заполнения проёмов; число марок не больше числа разных (w, h)"
check = "none"
applies = ["ru-izhs", "ru-mkd"]
note = "Оформление листа; нужна проверка: у каждого уникального типа окна своя марка в JSON-спецификации."
[[guideline.source]]
doc = "ГОСТ Р 21.501-2018"
file = "ru/g21501.txt"
where = "п. 5.4.2"
quote = "Обозначения типов заполнения оконных проемов составляют из буквенного обозначения ОК и порядкового номера в пределах этого обозначения"
checked = true

[[guideline]]
id = "sheet_finish_schedule"
text = "Лист фасада: отделка, отличающаяся от преобладающей, помечена номерами в кружках Ø6–8 мм с выносками; ведомость отделки по форме 9 (позиция, элемент фасада, материал, эталон цвета)"
check = "none"
applies = ["ru-izhs", "ru-mkd"]
note = "Оформление листа: цвет из палитры параметров дома — строка ведомости. Эталон цвета (RAL/NCS) не по ГОСТ, [не проверено]."
[[guideline.source]]
doc = "ГОСТ Р 21.501-2018"
file = "ru/g21501.txt"
where = "п. 5.4.2, прил. А, п. А.13"
quote = "за пределами изображения фасада в окружностях диаметром от 6 до 8 мм наносят номера типов отделки фасада"
checked = true
[[guideline.source]]
doc = "ГОСТ Р 21.501-2018"
file = "ru/g21501.txt"
where = "прил. А, п. А.13"
quote = "в графе «Наименование и номер эталона цвета или образец колера» — принятое по соответствующему стандарту или техническим условиям наименование цвета"
checked = true

[[guideline]]
id = "sheet_view_names_scale"
text = "Лист фасадов: подпись вида по крайним осям («Фасад 1-22») или главный/боковой/дворовый; масштаб 1:50, 1:100, 1:200"
check = "none"
applies = ["ru-izhs", "ru-mkd"]
note = "Оформление листа, метаданные; для дома ИЖС 8–20 м на A3 подходит 1:100 [вывод, не из нормы]."
[[guideline.source]]
doc = "ГОСТ Р 21.501-2018"
file = "ru/g21501.txt"
where = "п. 3.4"
quote = "Различают фасады главный, боковой, дворовый"
checked = true
[[guideline.source]]
