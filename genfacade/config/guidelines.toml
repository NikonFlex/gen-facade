applies = ["ru-izhs", "ru-mkd"]
note = "Створки в модели элементов не заданы; нужна проверка: число створок окна n ≥ ceil(w/1,2), при h > 1,8 м — горизонтальная перемычка; дверь шире 1,3 м — двупольная (ГОСТ 475 п. 4.5).; числа правила: sash_w = 1.2, sash_h = 1.8, leaf_w = 0.9, leaf_h = 2.3"
[[guideline.source]]
doc = "ГОСТ 24700-99"
file = "ru/g24700.txt"
where = "п. 5.1.4"
quote = "створки - по ширине 1200 мм, по высоте 1800 мм; дверные полотна - по ширине 900 мм, по высоте 2300 мм"
checked = true
[[guideline.source]]
doc = "ГОСТ 475-2016"
file = "norms/4293749722.txt"
where = "п. 4.5"
quote = "дверные блоки для проемов шириной 1300 мм и более должны быть двупольными, качающиеся — остекленными"
checked = true

