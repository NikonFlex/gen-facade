# Генератор синтетических домов (`data: Синтетика своим генератором`). Ступень 1 — прямоугольный дом
# (правило 9). Размеры — метры. Ширина входа здесь не задаётся: это протокол масштаба GenPlan
# (plan/preprocess.py, ENTRANCE_WIDTH_M).

[build]
val_share = 0.05          # доля домов в val; остальные — train. В тест синтетика не идёт (`data: Тест — только реальные данные`)

[canvas]
px_per_m = 100            # 1 px = 1 см, как у простого дома tests/fixtures/simple_house.svg
margin_m = 1.0            # поле холста вокруг дома

[house]
# Длины сторон — все, о которых модель шага 4 будет спрошена: длина в её условии — номер токена,
# и длину, которой не было в синтетике, она не читает (gf#153: у дома GenPlan 5,47 × 4,23 м).
grid_m = 0.05             # размеры дома и положение перегородок кратны этому шагу — шагу токенов
wall_m = 0.15             # толщина стен и перегородок

# ——— Размеры дома: профиль на дом по seed (gf#186) ———
# Два профиля: «как GenPlan» — прежние диапазоны, на них учится стыковка (дом примера 5,47 × 4,23 м,
# высоты WallSizeType GenPlan, dto/enum/wall_size_type.py); «как реальные» — по 30 коттеджам
# BuildingNet: длинная сторона 5,7–35 м (28 из 30 — до 24), короткая 5,3–18,4, этажи 1,8–3,6 м,
# цоколь чаще ниже 0,3 (у 5 домов 0), ширина окна 0,33–9,8 (10–90-й процентиль 0,54–2,07).
# Значения — на сетке шага step от и до. Одни широкие диапазоны для всех домов вытеснили дома
# GenPlan: на его плане годных 12 из 20 против 20 (gf#186, 22.10).
[sizes]
# доля домов профиля «как реальные»; 0 — все «как GenPlan», словарь — сетка до 20 м. С 0,3 и сеткой
# 40 м ни одна модель не держала план GenPlan на уровне gf#155 (gf#186, «Тупики»)
real_share = 0.0

[sizes.genplan]
width_m = [5.0, 14.0]     # длинная сторона; короткая не длиннее длинной
depth_m = [4.0, 9.0]
floor_height_m = [2.5, 3.0]
floor_height_step_m = 0.25   # 2,5 / 2,75 / 3,0
plinth_m = [0.3, 0.6]
window_width_m = [0.6, 1.8]  # от и до; страж берёт отсюда самое узкое окно
window_step_m = 0.3
# Ширины — из рядов (gf#211): ГОСТ 23166 (0,57; 0,72; 0,87; 1,17; 1,47; 1,77), кирпичный модуль
# (0,61; 0,91; 1,21; 1,51; 1,81), pattern books США (0,81; 0,91; 1,02) — на сетке 0,05 м. Узких
# в ряду больше: у сетки 0,6–1,8 через 0,3 окно выходило шире и ниже настоящего (стоячее окно —
# window_vertical_us, window_vertical_eu).
window_widths_m = [0.6, 0.7, 0.8, 0.9, 1.0, 1.2, 1.5, 1.8]

[sizes.real]
width_m = [5.0, 24.0]
depth_m = [4.0, 19.0]
floor_height_m = [2.4, 3.6]
floor_height_step_m = 0.05
plinth_m = [0.0, 0.6]     # без цоколя — без его зоны и крыльца
window_width_m = [0.4, 3.0]  # у BuildingNet около 10 % окон шире 2,4 м
window_step_m = 0.05
# Проёмы у BuildingNet теснее: половина простенков уже 0,6 м, 15 % проёмов ближе 0,65 м к углу —
# такие проёмы плана модель выбрасывала (gf#186, 23.10)
corner_clear_m = 0.3
between_m = 0.2

[openings]
# Как ставятся проёмы (gf#217). rules — по правилам ниже и в [facade.windows]: участки стены, окно
# над окном, одна линия верха окон этажа. random — «язык» без правил расстановки: число окон на
# стене, x по стене, типоразмер окна и низ окна по этажу, ряд каждого верхнего этажа — случайные
# в тех же пределах (отступ от угла и перегородки, простенок, окно внутри своего этажа); у дома
# 1–3 типоразмера окна. Отделка, цоколь, карниз, декор и двери — как у rules. Меняет только
# расстановку: грамматика ответа та же.
placement = "rules"
grid_m = 0.05             # шаг положения проёмов
corner_clear_m = 0.5      # от угла или перегородки до проёма
between_m = 0.6           # простенок между соседними проёмами
widths_per_house = 3      # сколько разных ширин окна бывает у одного дома, не больше
per_bay_weights = [1, 4, 3]   # веса числа окон на участке стены одной комнаты: 0, 1, 2 окна (0–3 и [1, 2, 4, 3] — для профиля «как реальные», gf#186)
entrance_long_p = 0.7     # вход на длинной стороне
# Глухие стены делаются намеренно (`data: Глухие стены в синтетике`): торец чаще, чем длинная сторона.
# С 0,15 и 0,4 глухих выходило 0,34 стен, у BuildingNet train — 0,24, у реального теста — 0,15;
# с 0,05 и 0,2 — 0,2 (gf#211). Глухая стена у всех одинакова по признакам, и лишние глухие стены
# классификатор «синтетика или настоящий» узнаёт по совпадению.
blind_long_p = 0.05
blind_short_p = 0.2
# Окон верхних этажей в плане нет — их ставит правило: стена повторяет окна нижнего этажа на тех
# же осях или ставит свой ряд на тех же участках стены; третий этаж повторяет второй, глухая
# стена глухая на всех этажах. Свой ряд и сам часто встаёт над окнами нижнего: при 0,2 над окном
# нижнего — 0,65 окон верхних этажей, у 30 домов BuildingNet — 0,30 (gf#155, 21.10). Свод правил
# (window_vertical_axes, допуск 0,05 м) требует окно над окном; у реального теста так 0,72 окон,
# у BuildingNet train — 0,41; при 0,2 у синтетики — 0,70, при 0,4 — выше реальных (gf#211).
upper_on_axes_p = 0.4

[partitions]
room_m = 4.5              # поперечных перегородок — от нуля до длины дома / room_m: у 10 м — до 2
min_room_m = 2.5          # комната не уже
passage_m = 0.8           # проход в перегородке

# ——— Контуры дома: ступень 1 — прямоугольник, ступень 3 — непрямоугольные (`data: Ступени данных`) ———
# Вид контура — по seed, своим потоком случайных чисел: прямоугольный дом при той же доле и том же seed
# не зависит от остальных видов. Дом — объединение прямоугольных крыльев; у входящего угла стоит
# перегородка, продолжающая стену выреза, дальше — перегородки и окна как у прямоугольного.
# Модель на прямоугольных домах не видела Г, Т, П и пристройки: на 9 планах gf#306 листов 9 из 18,
# у 8-сторонних 1 из 8 (gf#333). Доля непрямоугольных — всё, кроме rectangle; rectangle = 1 — как до gf#333.
[contours]
weights = { rectangle = 5.0, l = 1.5, t = 0.7, u = 0.8, annex = 1.0, bay = 1.0 }
wing_min_m = 2.5          # крыло не уже (как комната: partitions.min_room_m)
arm_min_m = 1.5           # уступ у ножки T, пристройки и эркера — от угла основного объёма
stem_depth_m = [2.5, 6.0]     # ножка T
annex_width_m = [2.5, 5.0]
annex_depth_m = [2.5, 4.0]
bay_width_m = [1.5, 3.0]
bay_depth_m = [0.7, 1.2]      # эркер глубже 0,6 м — часть контура, мельче — элемент стены (gf#199)

# ——— Параметры дома (HouseSpec): одни на все стены ———
[spec]
floors_weights = [9, 17, 4]          # веса 1, 2, 3 этажей — как у 30 коттеджей BuildingNet (gf#154)
grid_m = 0.05
styles = ["modern", "scandinavian", "chalet", "classic"]

[spec.palette]
# роль материала в палитре дома → виды из library.toml, из которых дому достаётся один
main = ["plaster", "brick", "siding", "wood"]
plinth = ["concrete", "stone", "brick"]
accent = ["wood", "stone", "brick", "siding"]
trim = ["metal", "wood", "plaster"]
roof = ["metal_roof"]

# Вид крыши дома → вес (gf#320): модель шага 4 видит вид крыши в условии, но стену раскладывает до
# карниза — крыша в синтетике нужна, чтобы токены всех видов встречались при обучении.
# gf#373: веса — счёт настоящих 47 домов (data/samples/manual, датчик tools/shares_probe.py): плоских
# 12, двускатных 26, вальмовых 7, односкатных 2; при равных весах двускатных среди скатных домов
# синтетики была треть, у настоящих — три четверти, и доля скатных домов с окном во фронтоне
# (окно бывает только у двускатных) выходила втрое ниже настоящей. Односкатных у настоящих мало —
# 2 дома, но токен вида модели нужен: вес 2 даёт их ~4 % синтетики.
[spec.roof_weights]
flat = 12
gable = 26
hip = 7
shed = 2

# Составные крыши (gf#431): у скатного дома с крыльями — своя крыша у пристроек, у двускатного —
# щипец над входом. Доли — по настоящим домам теста (59, markup/): из 13 скатных домов с крыльями у 7
# у части своя крыша, 9 из 10 таких частей — односкатные (2/12–4/12 = 9,5–18,4°, низ ската
# наружу, от главного объёма); щипец над карнизной стеной — у 5 из 26 двускатных, шириной 3,0–5,3 м
# (0,3–0,45 длины стены) и уклоном 10,9/12–16/12 (42–53°).
[spec.composite]
part_p = 0.54
part_pitch_deg = [9.5, 14.0, 18.4]       # 2/12, 3/12, 4/12 — arctan(n/12)
wall_gable_p = 0.19
wall_gable_share = [0.3, 0.45]
wall_gable_min_m = 3.0
wall_gable_pitch_deg = [42.0, 45.0, 49.0, 53.0]

# ——— Раскладка стены: проёмы плана, декор, зоны отделки (`facade: Состав фасада по уровням`) ———
[facade.windows]
# Высоты окон — по своду правил (gf#211, config/guidelines.toml), а не долями этажа WindowSizeType
# GenPlan: с ними верх окон стоял на 2,25 / 2,48 / 2,70 м, у настоящих домов — 2,05–2,58 м
# (docs/decisions.md, 30.10).
# Верх окон этажа — одна линия на дом (window_head_line), от пола этажа head_m
# (window_head_height_us 2,1–2,45; не выше 2,4 — под ту же линию встаёт дверь, door_size_ru).
head_m = [2.1, 2.4]       # на сетке spec.grid_m
lintel_m = 0.4            # перемычка: от верха окна до потолка этажа не меньше; с ней дверь на линии
                          # окон и плоский козырёк (config/derive.toml) влезают под карниз
# Высота обычного окна — одна на дом, из рядов: ГОСТ 23166 (1,32; 1,46; 1,76), кирпичный
# модуль (1,51; 1,81), pattern books США (1,68–1,98); из тех, при которых подоконник — sill_m.
heights_m = [1.3, 1.35, 1.5, 1.7, 1.8]
sill_m = [0.5, 0.9]       # подоконник обычного окна над полом этажа (sill_height_ru_izhs 0,75–0,9)
narrow_max_w_m = 0.6      # окно не шире — маленькое, как в санузле
narrow_heights_m = [0.6, 0.85]  # его высота — из ряда ГОСТ 23166 (0,58; 0,86), одна на дом
wide_min_w_m = 1.5        # окно не уже — большое, как в гостиной
wide_floor_p = 0.5        # у дома большие окна — в пол (панорамные, от пола до линии верха)
sash_max_w_m = 0.8        # шире — рама делится на столбцы створок
transom_min_h_m = 1.8     # выше — два ряда (фрамуга)

[facade.door]
# Верх входной двери — на линии верха окон первого этажа (door_head_line, gf#211): высота двери —
# верх окон дома, 2,1–2,4 м (door_size_ru, door_size_us). Ширина — протокол GenPlan, 0,9 м.
height_m = 2.1            # полотно
transom_m = 0.2           # фрамуга над полотном не ниже этого; ниже — у двери вместо неё стекло
# Вид входной двери — один на дом; solid — глухая, остальные — виды двери из schema.py
weights = { solid = 4, glazed = 3, transom = 2 }
glazed_panes = [1, 2]     # деление стекла в полотне: столбцы × ряды

[facade.trim]
# Выводимые элементы (gf#212): вид — параметр дома, вес — как часто выпадает; none — у дома их нет.
# Признак ставит правило: подоконник и наличник — у каждого окна не в пол, ставни — у окна, которому
# хватает места, козырёк — над входом. Прямоугольник считает код (genfacade/derive.py,
# config/derive.toml). Ставни — у 0,3 домов (у реального теста — у 11 из 27, у BuildingNet train —
# у 7 из 198), козырёк — у 0,7 (canopy_over_entrance: у реального теста — 0,52 входов), наличник —
# у половины (как прежде у стилей classic и chalet, gf#211); подоконник — у 0,75: у реального теста
# он у 20 окон из 106 (gf#212), у синтетики gf#211 был у каждого.
# Виды gf#318 (drip, stone, pediment, segment, board_batten_z, arched, posts) входят с весами так,
# что доля домов с элементом осталась прежней: none пересчитан. Форма вида модели не видна (условие
# — только наличие), поэтому веса задают лишь разнообразие листов. Двупольная дверь (double) в
# синтетике не выпадает: ширина входа 0,9 м, двупольным проём бывает от 1,3 м (ГОСТ 475-2016).
sill = { none = 1.7, flat = 2, sloped = 1, drip = 1, stone = 1 }
casing = { none = 3, flat = 1, wide = 1, pediment = 0.5, segment = 0.5 }
shutters = { none = 9, panel = 1, louvered = 1, board = 1, board_batten_z = 1 }
canopy = { none = 3.9, flat = 3, gable = 2, bracket = 2, arched = 1, posts = 1 }
door = { plain = 5, panel6 = 3, sidelights = 1 }

[facade.cornice]
# Карниз под отметкой карниза — одной высоты на дом. Между верхом окна верхнего этажа (с наличником)
# и низом карниза — фриз не меньше window_head_to_eaves из свода (gf#212: при 0,25 у дома с этажом
# 2,5 м окно с наличником упиралось в карниз): тесно — карниз тоньше, но не тоньше min_m, а дальше —
# ниже верх окон дома.
height_m = 0.25
min_m = 0.1

[facade.finish]
# Отделка стен — одна схема на дом; вес — как часто выпадает. Акцент — материал палитры `accent`.
#   plain — только основная; entrance — полоса у входа; wainscot — нижний пояс по всем стенам;
#   corners — полосы на углах; piers — вставки в простенках между соседними окнами.
weights = { plain = 3, entrance = 3, wainscot = 2, corners = 1, piers = 2 }
entrance_pad_m = 0.3      # насколько полоса у входа шире двери с каждой стороны
wainscot_m = [0.7, 1.1]   # высота нижнего пояса над цоколем, от и до
corner_m = 0.4            # ширина полосы на углу
pier_max_m = 1.6          # вставка — в простенке не шире этого

[facade.gable]
# Окна во фронтоне (gf#321) у домов с двускатной крышей. Число окон на торце у российских проектов
# строим.дом.рф (27 домов с окнами во фронтоне из 45, просмотр картинок 08.11; у разметки
# FreeFarmhouse — 11 из 31): 0 — 15 торцов, 1 — 7, 2 — 21, 3 и больше — 11. Низ — от карниза: у 13 из
# 19 окон фронтона разметки он ниже карниза на 0,04–0,45 м (стенка-колено мансарды), у 16 из 27
# российских проектов окно пересекает карниз; ниже −0,15 подоконник окна во фронтоне налезал бы на
# наличник окна верхнего этажа (перемычка не меньше windows.lintel_m). Стена с окнами во фронтоне — без
# карниза: она щипцовая. share — доля домов, которым генератор ставит окна.
# gf#373: при 0,9 модель ставила окно во фронтон у 62–70 % скатных домов реального теста против 26 %
# настоящих (датчик tools/shares_probe.py, настоящие 47 домов data/samples/manual: у 8 из 21
# двускатных домов с щипцом, 0,38, бутстреп 0,19–0,57; у скатных 0,26, 0,12–0,41). У реальных щипцов
# места много, окно влезает почти всегда, и модель повторяет долю генератора: 0,9 × 0,92 (нуль окон на
# торце у 28 %) = 0,83, у модели на двускатных домах реального теста 0,71–0,90. Доля 0,5 даёт на
# реальных щипцах 0,5 × 0,92 = 0,46 двускатных, 0,32 скатных — в интервале настоящих; на самой
# синтетике (мелкий щипец без места для окна) — 0,33 двускатных домов с щипцом (95 из 291, 1000
# домов), как 0,38 у настоящих.
share = 0.5
count_weights = [15, 7, 21, 11]
sill_m = [-0.15, 0.3]     # низ окна от карниза, на сетке spec.grid_m
# Форма окна во фронтоне (gf#319): regular — как у окон этажа, arch — полукруглый верх, oval — круглое
# или овальное, slope — трапеция или пятиугольник по скату (рамка выходит за скат, контур срезан им).
# gf#373: настоящие 47 домов (датчик tools/shares_probe.py) — 3 окна slope из 21 окна во фронтоне
# (0,14, у одного дома из 9 с такими окнами), 3 окна на 35 скатных домов; при весе 50 (0,83 суммы)
# модель на реальных щипцах ставила slope в 30 из 41 окна (0,73; 31–36 окон на 30 скатных домов
# против 3). Вес 2,5 — 0,2 суммы: ряд без места для рамки через скат (низкий фронтон) остаётся
# обычным, поэтому доля среди окон синтетики ниже. Российские проекты строим.дом.рф дают 16 домов из
# 27 с окном по скату (0,6) — это другой источник, чем настоящие дома датчика, и он выше. Вес 0 —
# окон по скату нет, дома прежние байт в байт. Круглое и арочное у настоящих домов редки (0 из 45
# российских, 1 из 51 разметки, 0 из 47 настоящих) — малый вес.
shapes = { regular = 8, arch = 1, oval = 1, slope = 2.5 }

[facade.entry]
porch_p = 0.7             # у входа крыльцо: площадка на высоту цоколя, шире двери на checks.porch_pad_m
