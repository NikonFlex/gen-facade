# Генератор синтетических домов (`data: Синтетика своим генератором`). Ступень 1 — прямоугольный дом
# (правило 9). Размеры — метры. Ширина входа здесь не задаётся: это протокол масштаба GenPlan
# (plan/preprocess.py, ENTRANCE_WIDTH_M).

[build]
val_share = 0.05          # доля домов в val; остальные — train. В тест синтетика не идёт (`data: Тест — только реальные данные`)

[canvas]
px_per_m = 100            # 1 px = 1 см, как у простого дома tests/fixtures/simple_house.svg
margin_m = 1.0            # поле холста вокруг дома

[house]
# Длины сторон — все, о которых модель шага 4 будет спрошена: длина в её условии — номер токена,
# и длину, которой не было в синтетике, она не читает (gf#153: у дома GenPlan 5,47 × 4,23 м).
grid_m = 0.05             # размеры дома и положение перегородок кратны этому шагу — шагу токенов
wall_m = 0.15             # толщина стен и перегородок

# ——— Размеры дома: профиль на дом по seed (gf#186) ———
# Два профиля: «как GenPlan» — прежние диапазоны, на них учится стыковка (дом примера 5,47 × 4,23 м,
# высоты WallSizeType GenPlan, dto/enum/wall_size_type.py); «как реальные» — по 30 коттеджам
# BuildingNet: длинная сторона 5,7–35 м (28 из 30 — до 24), короткая 5,3–18,4, этажи 1,8–3,6 м,
# цоколь чаще ниже 0,3 (у 5 домов 0), ширина окна 0,33–9,8 (10–90-й процентиль 0,54–2,07).
# Значения — на сетке шага step от и до. Одни широкие диапазоны для всех домов вытеснили дома
# GenPlan: на его плане годных 12 из 20 против 20 (gf#186, 22.10).
[sizes]
real_share = 0.3          # доля домов профиля «как реальные»

[sizes.genplan]
width_m = [5.0, 14.0]     # длинная сторона; короткая не длиннее длинной
depth_m = [4.0, 9.0]
floor_height_m = [2.5, 3.0]
floor_height_step_m = 0.25   # 2,5 / 2,75 / 3,0
plinth_m = [0.3, 0.6]
window_width_m = [0.6, 1.8]
window_step_m = 0.3          # 0,6 / 0,9 / 1,2 / 1,5 / 1,8

[sizes.real]
width_m = [5.0, 24.0]
depth_m = [4.0, 19.0]
floor_height_m = [2.4, 3.6]
floor_height_step_m = 0.05
plinth_m = [0.0, 0.6]     # без цоколя — без его зоны и крыльца
window_width_m = [0.4, 3.0]  # у BuildingNet около 10 % окон шире 2,4 м
window_step_m = 0.05
# Проёмы у BuildingNet теснее: половина простенков уже 0,6 м, 15 % проёмов ближе 0,65 м к углу —
# такие проёмы плана модель выбрасывала (gf#186, 23.10)
corner_clear_m = 0.3
between_m = 0.2

[openings]
grid_m = 0.05             # шаг положения проёмов
corner_clear_m = 0.5      # от угла или перегородки до проёма
between_m = 0.6           # простенок между соседними проёмами
widths_per_house = 3      # сколько разных ширин окна бывает у одного дома, не больше
per_bay_weights = [1, 2, 4, 3]   # веса числа окон на участке стены одной комнаты: 0–3; окон на 10 м этажа — 1,42, у BuildingNet 1,54 (gf#186)
entrance_long_p = 0.7     # вход на длинной стороне
# Глухие стены делаются намеренно (`data: Глухие стены в синтетике`): торец чаще, чем длинная сторона.
blind_long_p = 0.15
blind_short_p = 0.4
# Окон верхних этажей в плане нет — их ставит правило: стена повторяет окна нижнего этажа на тех
# же осях или ставит свой ряд на тех же участках стены; третий этаж повторяет второй, глухая
# стена глухая на всех этажах. Свой ряд и сам часто встаёт над окнами нижнего: при 0,2 над окном
# нижнего — 0,65 окон верхних этажей, у 30 домов BuildingNet — 0,30 (gf#155, 21.10).
upper_on_axes_p = 0.2

[partitions]
room_m = 4.5              # поперечных перегородок — от нуля до длины дома / room_m: у 10 м — до 2
min_room_m = 2.5          # комната не уже
passage_m = 0.8           # проход в перегородке

# ——— Параметры дома (HouseSpec): одни на все стены ———
[spec]
floors_weights = [9, 17, 4]          # веса 1, 2, 3 этажей — как у 30 коттеджей BuildingNet (gf#154)
grid_m = 0.05
styles = ["modern", "scandinavian", "chalet", "classic"]

[spec.palette]
# роль материала в палитре дома → виды из library.toml, из которых дому достаётся один
main = ["plaster", "brick", "siding", "wood"]
plinth = ["concrete", "stone", "brick"]
accent = ["wood", "stone", "brick", "siding"]
trim = ["metal", "wood", "plaster"]
roof = ["metal_roof"]                # плоскую крышу на фасаде не видно

# ——— Раскладка стены: проёмы плана, декор, зоны отделки (`facade: Состав фасада по уровням`) ———
[facade.windows]
# Низ и верх окна — доли высоты этажа от его пола, как WindowSizeType GenPlan
# (dto/enum/window_size_type.py): окна фасада сходятся с окнами его 3D-модели.
# Уровень — один на дом, для обычных окон; вес — как часто он выпадает. Низ 0.0 — окно в пол
# (панорамное). Узкие и широкие окна того же дома отличаются низом, верх у всех один.
size.small = [0.4, 0.9]
size.standard = [0.2, 0.9]
size.high = [0.0, 1.0]
weights = { small = 2, standard = 5, high = 1 }
sash_max_w_m = 0.8        # шире — рама делится на столбцы створок
transom_min_h_m = 1.8     # выше — два ряда (фрамуга)
lintel_m = 0.25           # перемычка: от верха окна до карниза не меньше
narrow_max_w_m = 0.6      # окно не шире — маленькое, как в санузле: низ выше обычного
narrow_low = 0.55         # его низ, доля высоты этажа
wide_min_w_m = 1.5        # окно не уже — большое, как в гостиной
wide_floor_p = 0.5        # у дома большие окна — в пол

[facade.door]
height_m = 2.1
transom_m = 0.3           # фрамуга над полотном; ставится, только если влезает под карниз
# Вид входной двери — один на дом; solid — глухая, остальные — виды двери из schema.py
weights = { solid = 4, glazed = 3, transom = 2 }
glazed_panes = [1, 2]     # деление стекла в полотне: столбцы × ряды

[facade.sill]
overhang_m = 0.05         # подоконник шире окна с каждой стороны
height_m = 0.06

[facade.casing]
# наличник вокруг окна (класс molding) — у этих стилей
styles = ["classic", "chalet"]
width_m = 0.1

[facade.cornice]
height_m = 0.25

[facade.finish]
# Отделка стен — одна схема на дом; вес — как часто выпадает. Акцент — материал палитры `accent`.
#   plain — только основная; entrance — полоса у входа; wainscot — нижний пояс по всем стенам;
#   corners — полосы на углах; piers — вставки в простенках между соседними окнами.
weights = { plain = 3, entrance = 3, wainscot = 2, corners = 1, piers = 2 }
entrance_pad_m = 0.3      # насколько полоса у входа шире двери с каждой стороны
wainscot_m = [0.7, 1.1]   # высота нижнего пояса над цоколем, от и до
corner_m = 0.4            # ширина полосы на углу
pier_max_m = 1.6          # вставка — в простенке не шире этого

[facade.entry]
porch_p = 0.7             # у входа крыльцо: площадка на высоту цоколя
porch_pad_m = 0.3         # крыльцо шире двери с каждой стороны
canopy_p = 0.5            # над входом козырёк
canopy_pad_m = 0.2
canopy_gap_m = 0.05       # от верха двери до козырька
canopy_m = 0.1            # толщина козырька
