# Генератор синтетических домов (specs/data.md, правило 1). Ступень 1 — прямоугольный дом
# (правило 9). Размеры — метры. Ширина входа здесь не задаётся: это протокол масштаба GenPlan
# (plan/preprocess.py, ENTRANCE_WIDTH_M).

[build]
val_share = 0.05          # доля домов в val; остальные — train. В тест синтетика не идёт (data.md, п. 5)

[canvas]
px_per_m = 100            # 1 px = 1 см, как у простого дома tests/fixtures/simple_house.svg
margin_m = 1.0            # поле холста вокруг дома

[house]
width_m = [7.0, 14.0]     # длинная сторона, от и до
depth_m = [5.0, 9.0]      # короткая сторона; длиннее длинной не бывает
grid_m = 0.5              # размеры дома и положение перегородок кратны этому шагу
wall_m = 0.15             # толщина стен и перегородок

[openings]
grid_m = 0.05             # шаг положения проёмов
corner_clear_m = 0.5      # от угла или перегородки до проёма
between_m = 0.6           # простенок между соседними проёмами
window_widths_m = [0.6, 0.9, 1.2, 1.5, 1.8]
widths_per_house = 3      # сколько разных ширин окна бывает у одного дома, не больше
per_bay_weights = [1, 4, 3]   # веса числа окон на участке стены одной комнаты: 0, 1, 2 окна
entrance_long_p = 0.7     # вход на длинной стороне
# Глухие стены делаются намеренно (data.md, правило 1): торец чаще, чем длинная сторона.
blind_long_p = 0.15
blind_short_p = 0.4

[partitions]
max_count = 2             # поперечных перегородок: от нуля до стольких
min_room_m = 2.5          # комната не уже
passage_m = 0.8           # проход в перегородке

# ——— Параметры дома (HouseSpec): одни на все стены ———
[spec]
floor_heights_m = [2.5, 2.75, 3.0]   # как WallSizeType GenPlan (dto/enum/wall_size_type.py)
plinth_m = [0.3, 0.6]                # цоколь, от и до
grid_m = 0.05
styles = ["modern", "scandinavian", "chalet", "classic"]

[spec.palette]
# роль материала в палитре дома → виды из library.toml, из которых дому достаётся один
main = ["plaster", "brick", "siding", "wood"]
plinth = ["concrete", "stone", "brick"]
accent = ["wood", "stone", "brick", "siding"]
trim = ["metal", "wood", "plaster"]
roof = ["metal_roof"]                # плоскую крышу на фасаде не видно

# ——— Раскладка стены: проёмы плана, декор, зоны отделки (facade.md, правило 9) ———
[facade.windows]
# Низ и верх окна — доли высоты этажа от его пола, как WindowSizeType GenPlan
# (dto/enum/window_size_type.py): окна фасада сходятся с окнами его 3D-модели.
# Уровень — один на дом, для обычных окон; вес — как часто он выпадает. Низ 0.0 — окно в пол
# (панорамное). Узкие и широкие окна того же дома отличаются низом, верх у всех один.
size.small = [0.4, 0.9]
size.standard = [0.2, 0.9]
size.high = [0.0, 1.0]
weights = { small = 2, standard = 5, high = 1 }
sash_max_w_m = 0.8        # шире — рама делится на столбцы створок
transom_min_h_m = 1.8     # выше — два ряда (фрамуга)
lintel_m = 0.25           # перемычка: от верха окна до карниза не меньше
narrow_max_w_m = 0.6      # окно не шире — маленькое, как в санузле: низ выше обычного
narrow_low = 0.55         # его низ, доля высоты этажа
wide_min_w_m = 1.5        # окно не уже — большое, как в гостиной
wide_floor_p = 0.5        # у дома большие окна — в пол

[facade.door]
height_m = 2.1
transom_m = 0.3           # фрамуга над полотном; ставится, только если влезает под карниз
# Вид входной двери — один на дом; solid — глухая, остальные — виды двери из schema.py
weights = { solid = 4, glazed = 3, transom = 2 }
glazed_panes = [1, 2]     # деление стекла в полотне: столбцы × ряды

[facade.sill]
overhang_m = 0.05         # подоконник шире окна с каждой стороны
height_m = 0.06

[facade.casing]
# наличник вокруг окна (класс molding) — у этих стилей
styles = ["classic", "chalet"]
width_m = 0.1

[facade.cornice]
height_m = 0.25

[facade.finish]
# Отделка стен — одна схема на дом; вес — как часто выпадает. Акцент — материал палитры `accent`.
#   plain — только основная; entrance — полоса у входа; wainscot — нижний пояс по всем стенам;
#   corners — полосы на углах; piers — вставки в простенках между соседними окнами.
weights = { plain = 3, entrance = 3, wainscot = 2, corners = 1, piers = 2 }
entrance_pad_m = 0.3      # насколько полоса у входа шире двери с каждой стороны
wainscot_m = [0.7, 1.1]   # высота нижнего пояса над цоколем, от и до
corner_m = 0.4            # ширина полосы на углу
pier_max_m = 1.6          # вставка — в простенке не шире этого

[facade.entry]
porch_p = 0.7             # у входа крыльцо: площадка на высоту цоколя
porch_pad_m = 0.3         # крыльцо шире двери с каждой стороны
canopy_p = 0.5            # над входом козырёк
canopy_pad_m = 0.2
canopy_gap_m = 0.05       # от верха двери до козырька
canopy_m = 0.1            # толщина козырька
