# Библиотека материалов (specs/facade.md, правило 4): модель выбирает материал
# из палитры дома, а не придумывает цвета. Состав библиотеки — открыт в facade.md.

[kinds]
# вид материала → цвет по умолчанию, если в палитре дома цвет не задан
plaster = "#ece6da"
brick = "#8c4a3a"
siding = "#c9d3d8"
wood = "#a0703f"
stone = "#6f6a63"
concrete = "#9a9a96"
metal = "#33373b"
metal_roof = "#4a4f55"
tile_roof = "#7a3b2e"

[fill]
# заливка там, где у дома нет своего материала
wall = "#e8e4dc"      # стена под зонами отделки
glass = "#a9c4d8"     # стекло окна; материал окна красит раму
other = "#bdbdbd"     # элемент класса, которого нет в [class_fill]

[class_fill]
# элемент без material
door = "#7b5230"
garage_door = "#d9d9d9"
sill = "#f0f0ee"
