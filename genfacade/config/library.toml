# Библиотека материалов (`facade: Цвет из палитры`): модель выбирает материал
# из палитры дома, а не придумывает цвета. Состав библиотеки — открыт в docs/dev-plan.md.

# Рисунок вида (gf#304): линии темнее цвета материала — каждый канал × (1 − pattern_darken)
pattern_darken = 0.35
# Элементы этих классов рисунком вида не заливаются: ставни рисуют себя линиями (render/svg.py),
# у окна заливка — стекло, а материал красит раму
unhatched_cls = ["blind", "window"]

[kinds]
# вид материала → цвет по умолчанию, если в палитре дома цвет не задан
plaster = "#ece6da"
brick = "#8c4a3a"
siding = "#c9d3d8"
wood = "#a0703f"
stone = "#6f6a63"
concrete = "#9a9a96"
metal = "#33373b"
metal_roof = "#4a4f55"
tile_roof = "#7a3b2e"
log = "#b88a54"          # бревно: светлее вида wood — стена из бруса и оцилиндрованного бревна
board_batten = "#a9b5a3" # доска с планкой: окрашенные вертикальные доски
clinker = "#6a4a40"      # клинкерная плитка: цоколь и стена, темнее кирпича
# gf#317, `docs/library-catalog.md`: виды по российским ИЖС и справочным размерам. Цвет — по умолчанию
brick_1_5 = "#9a5440"          # полуторный кирпич 250 × 88 (1,4НФ, ГОСТ 530-2012)
brick_long = "#6e5a4e"         # длинный тонкий кирпич 295 × 57 (Norman, США)
siding_narrow = "#c9d3d8"      # обшивка внахлёст, видимая часть 4 дюйма
siding_wide = "#c9d3d8"        # обшивка внахлёст, видимая часть 8 дюймов
siding_dutch = "#c9d3d8"       # Dutch lap: нахлёст с выемкой-тенью, видимая часть 6,75 дюйма
board_batten_narrow = "#a9b5a3"  # узкая доска с планкой, шаг 178 мм
ashlar = "#7a746b"             # ровный тёсаный камень: три высоты ряда
blockhouse = "#b08050"         # блок-хаус: имитация бревна, полубревно 140 мм
imitation_timber = "#c0975f"   # имитация бруса: плоская доска, видимая ширина 138 мм
profiled_sheet = "#4a5a66"     # профнастил: стена и кровля
metal_tile = "#44322d"         # металлочерепица: ступень 350 мм (RAL 8017)
shingle_roof = "#3d3f44"       # гибкая (битумная) черепица: ряд 143 мм
ondulin = "#5a4a3c"            # ондулин: волна 95 мм

[model_kinds]
# Модель шага 4 обучена на видах выше черты gf#317; новый вид показывается ей под образом (gf#317):
# словарь модели не меняется, переобучения нет. Новый вид — запись в [kinds] и сюда.
brick_1_5 = "brick"
brick_long = "brick"
siding_narrow = "siding"
siding_wide = "siding"
siding_dutch = "siding"
board_batten_narrow = "board_batten"
ashlar = "stone"
blockhouse = "log"
imitation_timber = "wood"
profiled_sheet = "metal"
metal_tile = "metal_roof"
shingle_roof = "tile_roof"
ondulin = "tile_roof"

[patterns]
# Рисунок вида на листе (gf#304): SVG <pattern> в метрах фасада, один на пару вид × цвет.
# Ряды (courses) снизу вверх повторяются по высоте; joints_m — вертикальные швы ряда внутри
# периода width_m (в рядах кладки они сдвинуты — перевязка). vertical — ряды стоят вертикально.
# line_m — шов; groove_m — вторая линия рядом со швом (нахлёст обшивки, планка), 0 — нет.
# Вида нет в таблице — сплошная заливка: штукатурка, бетон, металл.
brick = { vertical = false, line_m = 0.01, groove_m = 0.0, width_m = 0.26, courses = [
    { h_m = 0.075, joints_m = [0.065] },    # кирпич 250 × 65 мм, шов 10 мм
    { h_m = 0.075, joints_m = [0.195] },
] }
siding = { vertical = false, line_m = 0.012, groove_m = 0.02, width_m = 0.15, courses = [
    { h_m = 0.15, joints_m = [] },          # горизонтальная обшивка, доска 150 мм
] }
wood = { vertical = false, line_m = 0.01, groove_m = 0.0, width_m = 0.1, courses = [
    { h_m = 0.1, joints_m = [] },           # доски вразбежку без нахлёста
] }
stone = { vertical = false, line_m = 0.018, groove_m = 0.0, width_m = 1.2, courses = [
    { h_m = 0.2, joints_m = [0.15, 0.62, 0.98] },   # неровный камень: ряды разной высоты,
    { h_m = 0.14, joints_m = [0.4, 0.8, 1.1] },     # швы не стоят друг над другом
    { h_m = 0.25, joints_m = [0.25, 0.7] },
    { h_m = 0.17, joints_m = [0.1, 0.5, 0.9] },
] }
log = { vertical = false, line_m = 0.02, groove_m = 0.035, width_m = 0.22, courses = [
    { h_m = 0.22, joints_m = [] },          # оцилиндрованное бревно 220 мм: шов и тень под ним
] }
board_batten = { vertical = true, line_m = 0.012, groove_m = 0.04, width_m = 0.25, courses = [
    { h_m = 0.25, joints_m = [] },          # доски 250 мм, планка 40 мм на каждом стыке
] }
clinker = { vertical = false, line_m = 0.008, groove_m = 0.0, width_m = 0.25, courses = [
    { h_m = 0.06, joints_m = [0.0625] },    # плитка 240 × 52 мм, шов 8–10 мм, вразбежку
    { h_m = 0.06, joints_m = [0.1875] },
] }
metal_roof = { vertical = true, line_m = 0.015, groove_m = 0.0, width_m = 0.5, courses = [
    { h_m = 0.5, joints_m = [] },           # фальц через 500 мм
] }

# --- gf#317. Размеры: `docs/library-catalog.md`, раздел «Материалы и цвета» ---
brick_1_5 = { vertical = false, line_m = 0.012, groove_m = 0.0, width_m = 0.26, courses = [
