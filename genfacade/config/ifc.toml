# Выгрузка дома в BIM (IFC4, render/ifc.py, gf#392): толщины и размеры объектов, имена, цвета
# не из листа. Цвет стены, кровли и двери берётся из палитры дома, стекла — из library.toml.

[ifc]
wall_thickness_m = 0.4     # стена идёт внутрь от контура плана: наружная грань — по контуру
slab_m = 0.2               # перекрытие этажа: плита под отметкой этажа
roof_seat_m = 0.05         # верх стены под скатом лежит ниже верха плиты кровли (скат + толщина) на столько — в толще плиты
porch_gable_m = 0.2        # фронтон двускатного навеса: стена от торца навеса внутрь
joint_wall_m = 0.4         # стена верхней части над крышей нижней
shutter_m = 0.04          # толщина створки ставни: стоит на стене, выступает наружу на неё
window_depth_m = 0.1       # коробка окна и двери: глубина внутри проёма
opening_margin_m = 0.05    # вырез проёма выступает за стену с каждой стороны — чтобы резал начисто
glass_transparency = 0.5
tolerance = 1e-5           # допуск контекста модели, метров

[ifc.names]
project = "Дом GenFacade"
site = "Участок"
building = "Дом"
storey = "Этаж {n}"       # n — с единицы
wall = "Стена {side}"      # side — номер стороны листа
joint_wall = "Стена над кровлей нижней части"
window = "Окно {id}"
door = "Дверь {id}"
garage_door = "Ворота {id}"
opening = "Проём {id}"
slab = "Перекрытие {n}"
roof = "Крыша"
roof_slab = "Скат {n}"
skylight = "Мансардное окно {n}"
shutter = "Ставня {id}"
canopy = "Козырёк {id}"
porch = "Крыльцо {id}"
chimney = "Дымовая труба {n}"
gutter = "Желоб {n}"
pipe = "Водосточная труба {n}"
porch_roof = "Навес {n}"
porch_post = "Столб навеса {n}"
porch_deck = "Настил под навесом {n}"
porch_gable = "Фронтон навеса {n}"

[ifc.pset]
facade = "GenFacade"       # набор свойств объекта: сторона листа, id элемента, материал
