other = "другое"

[catalog]
# Вкладка «Каталог» (gf#354, страница /catalog): все виды, которые есть в конфиге, с картинкой —
# тем же кодом, что лист (render/svg.py) и 3D. Состав берётся из library.toml, models.toml,
# derive.toml и schema.py: новый вид, добавленный записью, появляется без правки страницы. Здесь —
# образец, на котором виды рисуются, и тексты разделов (порядок разделов — порядок ниже).
doc = "docs/library-catalog.md"   # источник вида — по имени вида в таблицах этого файла

[catalog.sample]
width_m = 8.0                # дом образца: длинная сторона
depth_m = 6.0                # короткая; на ней фронтон скатной крыши, окно и вход
wall_m = 4.0                 # отдельная стена для окон, дверей и выводимых элементов
sill_m = 0.9                 # низ окна над землёй
window_at = 0.25             # окно и дверь рядом на одной стене (отделки): доля свободной длины
door_at = 0.85               # стены, 0 — слева, 1 — справа; одно окно или дверь стоят посередине
door_m = [0.9, 2.1]
[catalog.sample.window_m]    # ширина × высота окна по виду; `default` — вида нет в таблице
default = [1.2, 1.4]
panoramic = [2.4, 1.6]
corner = [1.6, 1.4]
strip = [3.2, 0.6]

[catalog.labels]             # строки «Что у вида» и группы; {…} подставляет каталог
color = "Цвет по умолчанию"
pattern = "Рисунок"
pattern_value = "ряд {course} м, период {width} м, шов {line} м"
solid = "сплошная заливка"
model_sees = "Модель видит как"
hex = "Цвет"
used_in = "В отделках"
styles = "Стили"
roof = "Крыша"
trim = "Элементы"
materials = "Материалы"
pitch = "Уклон"
overhang = "Свес карнизный"
gable_overhang = "Свес фронтонный"
size = "Размер, м"
relief = "Выступ в 3D, м"
role_main = "Стены"
role_trim = "Отделка"
role_roof = "Крыша"
group_leaf = "Рисунок полотна"
group_glazing = "Остекление"
blank = "глухая"
none = "нет"

[catalog.sections.walls]
title = "Материалы стен"
note = "Рисунок вида на стене образца и цвет по умолчанию. «Модель видит как» — под каким из прежних видов материал показывается модели шага 4: новый вид переобучения не требует."
doc_headings = ["Виды: источник"]
[catalog.sections.roofing]
title = "Материалы кровли"
note = "Кровля двускатного дома образца. Вид попадает сюда, если какая-то отделка ставит его на крышу."
doc_headings = ["Виды: источник"]
[catalog.sections.colors]
title = "Цвета"
note = "Ряд цветов отделок. Цвет красит роль палитры дома; слова текста называют цвет. Нет hex — берётся цвет вида материала."
[catalog.sections.schemes]
title = "Сочетания цветов"
note = "Стены, отделка и крыша вместе — готовые наборы из источников. Дом образца: стены, наличник и подоконник, кровля."
[catalog.sections.finishes]
