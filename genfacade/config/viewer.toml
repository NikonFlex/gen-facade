note = "Готовая палитра и виды элементов дома: что стаб шага 1 ставит дому. Цвета — первые в рядах отделки."
[catalog.sections.roofs]
title = "Крыши"
note = "Вид крыши — параметр дома. Фронтон образца (короткая сторона): скаты строит код развёртки (roof.py)."
