# Смотрелка прогонов (genfacade serve). Пути — от папки, где запущена команда.

[server]
host = "127.0.0.1"   # только эта машина; с другой — через проброс порта
port = 8000

[paths]
runs_dir = "outputs/runs"
# SVG-планы GenPlan для запуска «план + описание». Пока — один простой дом (gf#58).
plans_dirs = ["tests/fixtures"]

[samples]
shown = 60   # сколько примеров источника показывать на вкладке «Датасеты»: в датасете их тысячи

[data_view]
# Страница «Данные» (gf#356): на чём учим и проверяем модель шага 4. Доли признаков читаются по
# `stats_sample` домам набора через равные промежутки (10 000 файлов читались бы секунд двадцать);
# карточек-примеров на набор — `examples`; «Все примеры» — порциями по `page_size`, подгружаются при прокрутке; листы-миниатюры
# (~0,7 с на рендер) держатся в памяти, не больше `sheet_cache` штук. Наборы — по
# порядку обучения. Счётчики берутся из описи набора (_manifest.json), в тексты они не копируются.
stats_sample = 1500
examples = 8
page_size = 24
sheet_cache = 200

[data_view.roles]   # роль набора в обучении модели шага 4
train = "Основное обучение"
finetune = "Дообучение"
eval = "Только проверка"

[data_view.shapes]  # форма плана: по числу углов контура (4 — прямоугольник)
rectangle = "Прямоугольник"
other = "Г, Т, П и другие"

[data_view.sets.synthetic]
title = "Корпус синтетики"
role = "train"
note = "Дома нашего генератора (genfacade synth): план в формате GenPlan, стены, проёмы и отделка по правилам, фасады всех сторон. Раскладка каждого дома — эталон без нарушений; модель учится ставить элементы так же."
origin = "Свой генератор, по seed; данные и код наши, внешней лицензии нет."
how = "С нуля учим модель на всём корпусе. Контуры: прямоугольник, Г, Т, П, пристройка, эркер (gf#333); крыши: плоская, двускатная, вальмовая, односкатная; у двускатных — окна во фронтоне разных форм (gf#321, gf#319), у элементов — виды (gf#318)."
modes = "Каждый дом даёт две последовательности: «окна из плана» и глухой куб."
[data_view.sets.buildingnet]
title = "BuildingNet: коттеджи"
role = "finetune"
note = "Реальные 3D-модели коттеджей из BuildingNet v1 (дома и виллы) с разметкой частей: из модели собраны план и фасады всех сторон. Не прошедшие отбор дома в набор не вошли — причины ниже."
origin = "BuildingNet v1, только некоммерческие исследования; доступ по заявке."
how = "Дообучаем модель, уже обученную на синтетике; к реальным домам подмешана часть синтетики, чтобы модель не забывала корпус."
modes = "Каждый дом — в обоих режимах: «окна из плана» и глухой куб."
[data_view.sets.manual]
title = "Реальный тест"
role = "eval"
note = "Дома, размеченные вручную по настоящим чертежам: рамки окон, дверей и зон на листах фасадов, план и параметры — по тем же чертежам. Единственный набор, по которому мерим качество."
origin = "Чертежи FreeFarmhouse (CC BY-SA 4.0), Solar Decathlon (общественное достояние) и проектов строим.дом.рф; разметка наша."
how = "В обучении не участвует: на нём только оценка, метрики и слепая проверка глазами."
modes = "Оба режима: модель получает план дома, а настоящий лист — эталон для сравнения."

[data_view.attrs]
sides = "Сторон у дома"
plan_shape = "Форма плана"
floors = "Этажей"
roof = "Крыша"
walls = "Стены"
style = "Стиль"

[house3d]
# Дом объёмом (вкладка «Дом в 3D»): стены по контуру, фасад стороны — текстурой, крыша — скатами
# (roof.py, gf#320) или плоская.
three_url = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"  # MIT
# Просмотр IFC (вкладка «BIM (IFC)», gf#392): разбор файла — web-ifc (MPL-2.0, wasm), вид — тот же three.js
web_ifc_url = "https://cdn.jsdelivr.net/npm/web-ifc@0.0.78/web-ifc-api.js"
web_ifc_wasm_dir = "https://cdn.jsdelivr.net/npm/web-ifc@0.0.78/"  # здесь лежит web-ifc.wasm
selected = "#ffb84d"   # подсветка выбранного объекта IFC
px_per_m = 120         # разрешение текстуры фасада: 10-метровая стена — 1200 px, шов кирпича 0,01 м — 1,2 px (gf#353)
texture_max_px = 4096  # сторона текстуры стены: телефоны часто дают MAX_TEXTURE_SIZE = 4096 (gf#353)
texture_budget_mpx = 8 # все стены вместе, млн пикселей: 32 МБ, на телефоне без провалов по памяти
roof = "#ffffff"       # плоская крыша и кровля без материала в палитре — белая (хозяин 27.10)
ground = "#262b32"
background = "#171b21"   # тёмная тема смотрелки (gf#356): сцена — как панель страницы
edges = "#3a4652"      # рёбра стен и крыши — чтобы углы дома читались
outline = true         # рисовать рёбра линией (выкл — углы читаются светом с двух сторон)

# Формы выступов (gf#305, хозяин 05.11: козырёк, карниз, цоколь и крыльцо — не коробки). Вид
# козырька и подоконника берётся из параметров дома, размеры вида — из config/derive.toml и
# sheet.toml ([trim]); здесь — то, что есть только у 3D.
riser_m = 0.17         # высота ступени крыльца: ступеней — ceil(высота крыльца / riser_m)
tread_m = 0.30         # глубина проступи; площадка у двери — по relief_cls.porch, ступени перед ней
slope_edge = 0.4       # плита с уклоном (плоский козырёк, подоконник sloped): толщина у внешнего
                       # края — эта доля толщины у стены
plinth_wash_m = 0.04   # отлив по верху цоколя: на сколько внешняя грань ниже верха
# Профиль карниза ступенями снизу вверх: [вынос ступени — доля глубины relief_cls.cornice,
# где ступень начинается — доля высоты карниза]. Вынос растёт кверху — вынос со ступенью.
cornice_steps = [[0.4, 0.0], [0.7, 0.35], [1.0, 0.7]]
window_out_m = 0.02    # окно во фронтоне (gf#321) — стеклом чуть перед гладким фронтоном, не в нём

# Выступы стены (gf#268, хозяин 03.11): что встаёт коробкой перед текстурой фасада и на сколько
# метров выступает. Цвет — тот же, что на листе (render/svg.element_fill, палитра дома).
[house3d.relief_role]
plinth = 0.05
[house3d.relief_cls]
cornice = 0.25
sill = 0.06
canopy = 0.6
porch = 1.0            # площадка перед дверью (gf#276): без выступа она — плашка на стене

[review]
# Слепая проверка листов глазами (gf#268): `genfacade serve --review <папка realtest>`, страница
# /review. Строки — начала имён папок строк реального теста; на доме они идут в случайном порядке
# без названий, порядок — от seed, режима и дома. Сводка по отметкам — `genfacade review <папка>`.
# Строка с режимом впереди («blind/model-») — из папки того режима, а не режима страницы: так на
# одном доме рядом встают ответы обоих режимов и настоящий дом вслепую (хозяин 04.11, gf#272).
rows = ["model-", "random", "genplan"]
seed = 0
modes = ["with_openings", "blind"]   # по каким режимам идут дома проверки
reference = true                     # настоящий дом — отдельно и с подписью, не вслепую

[markup]
# Правка автоматической разметки в браузере (gf#348): страница /markup. Очередь — разметки папки
# `folder` (`genfacade serve --markup <папка>` берёт другую), правка пишется в те же файлы, и
# `genfacade manual` собирает их как есть. Исходная разметка автоматики остаётся в original_dir.
folder = "markup/stroim"
source = "stroim"                    # где листы: [manual.paths.pdf_dirs] data.toml
state_file = "check.json"            # проверено / осталось и секунды на дом — в папке разметки
original_dir = "orig"
cache_dir = "outputs/markup_cache"
image_max_side = 2400                # сжатие листа для телефона; координаты разметки не меняются
add_classes = ["window", "door", "garage_door", "porch", "canopy"]
min_box_m = 0.15                     # рамка уже этого — касание: ставится рамка по умолчанию
view_pad_m = 0.3                     # окно вида стороны — весь рисунок фасада страницы и это поле (gf#470)
ink_level = 200                      # темнее — рисунок фасада: по нему окно вида, как видит хозяин
mark_depth_step_m = 0.05             # шаг поля выноса отметки от стены вида (gf#471)

[markup.house_step]                  # шаг числовых полей дома на панели правки (gf#470)
pitch_deg = 1.0
overhang_m = 0.05
gable_overhang_m = 0.05
roof_down = 1.0

[markup.marks.chimney]               # отметки на виде: как ставятся и какого цвета (gf#470)
label = "труба"
shape = "point"
color = "firebrick"
depth = true

[markup.marks.skylight]
label = "мансардное окно"
shape = "box"
color = "teal"
size_m = [0.8, 1.2]

[markup.marks.dormer]
label = "слуховое окно"
shape = "span"
color = "darkorchid"
size_m = [1.5, 0.0]
defaults = { roof = "gable" }

[markup.marks.porch_roof]
label = "крыльцо под кровлей"
shape = "box"
color = "darkgoldenrod"
size_m = [2.5, 2.5]
defaults = { kind = "shed", posts = 2, depth_m = 1.5 }
depth = true

[markup.zone]                        # зона второй отделки на виде (gf#470)
label = "зона отделки"
size_m = [2.0, 1.5]                  # от касания: ширина × высота, м

[markup.default_size_m]              # ширина × высота рамки, поставленной касанием
window = [1.2, 1.4]
door = [1.0, 2.1]
garage_door = [2.5, 2.2]
porch = [2.0, 0.6]
canopy = [2.0, 0.4]

[markup.colors]
levels = "blue"          # земля, чистый пол, верх этажей, края стены
zone = "magenta"
outline = "deepskyblue"
roof = "saddlebrown"
selected = "gold"

[markup.colors.cls]
window = "red"
door = "green"
garage_door = "green"
pillar = "orange"
sill = "orange"
blind = "orange"
deco = "orange"
cornice = "orange"
balcony = "orange"
molding = "orange"
shop = "orange"
facade = "orange"
porch = "orange"
chimney = "orange"
canopy = "orange"

[markup.labels]
mark_kind = "вид кровли отметки"
mark_depth = "вынос от стены вида, м"
empty_kind = "— не записан —"
delete_mark = "Удалить отметку"
delete_zone = "Удалить зону"
no_color = "не задан"

[markup.labels.role]                 # цвет роли палитры дома на панели правки (gf#470)
main = "стены"
plinth = "цоколь"
accent = "вторая отделка"
trim = "карниз"
roof = "кровля"

[markup.labels.state]
unchecked = "не проверен"
