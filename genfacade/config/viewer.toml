# Смотрелка прогонов (genfacade serve). Пути — от папки, где запущена команда.

[server]
host = "127.0.0.1"   # только эта машина; с другой — через проброс порта
port = 8000

[paths]
runs_dir = "outputs/runs"
# SVG-планы GenPlan для запуска «план + описание». Пока — один простой дом (gf#58).
plans_dirs = ["tests/fixtures"]

[samples]
shown = 60   # сколько примеров источника показывать на вкладке «Датасеты»: в датасете их тысячи

[house3d]
# Дом объёмом (вкладка «Дом в 3D»): стены по контуру, фасад стороны — текстурой, крыша — скатами
# (roof.py, gf#320) или плоская.
three_url = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"  # MIT
px_per_m = 80          # разрешение текстуры фасада: 10-метровая стена — 800 px
roof = "#ffffff"       # плоская крыша и кровля без материала в палитре — белая (хозяин 27.10)
ground = "#dfe3dc"
background = "#eef1f4"
edges = "#3a4652"      # рёбра стен и крыши — чтобы углы дома читались

# Формы выступов (gf#305, хозяин 05.11: козырёк, карниз, цоколь и крыльцо — не коробки). Вид
# козырька и подоконника берётся из параметров дома, размеры вида — из config/derive.toml и
# sheet.toml ([trim]); здесь — то, что есть только у 3D.
riser_m = 0.17         # высота ступени крыльца: ступеней — ceil(высота крыльца / riser_m)
tread_m = 0.30         # глубина проступи; площадка у двери — по relief_cls.porch, ступени перед ней
slope_edge = 0.4       # плита с уклоном (плоский козырёк, подоконник sloped): толщина у внешнего
                       # края — эта доля толщины у стены
plinth_wash_m = 0.04   # отлив по верху цоколя: на сколько внешняя грань ниже верха
# Профиль карниза ступенями снизу вверх: [вынос ступени — доля глубины relief_cls.cornice,
# где ступень начинается — доля высоты карниза]. Вынос растёт кверху — вынос со ступенью.
cornice_steps = [[0.4, 0.0], [0.7, 0.35], [1.0, 0.7]]

# Выступы стены (gf#268, хозяин 03.11): что встаёт коробкой перед текстурой фасада и на сколько
# метров выступает. Цвет — тот же, что на листе (render/svg.element_fill, палитра дома).
[house3d.relief_role]
plinth = 0.05
[house3d.relief_cls]
cornice = 0.25
sill = 0.06
canopy = 0.6
porch = 1.0            # площадка перед дверью (gf#276): без выступа она — плашка на стене

[review]
# Слепая проверка листов глазами (gf#268): `genfacade serve --review <папка realtest>`, страница
# /review. Строки — начала имён папок строк реального теста; на доме они идут в случайном порядке
# без названий, порядок — от seed, режима и дома. Сводка по отметкам — `genfacade review <папка>`.
# Строка с режимом впереди («blind/model-») — из папки того режима, а не режима страницы: так на
# одном доме рядом встают ответы обоих режимов и настоящий дом вслепую (хозяин 04.11, gf#272).
rows = ["model-", "random", "genplan"]
seed = 0
modes = ["with_openings", "blind"]   # по каким режимам идут дома проверки
reference = true                     # настоящий дом — отдельно и с подписью, не вслепую

[markup]
# Правка автоматической разметки в браузере (gf#348): страница /markup. Очередь — разметки папки
# `folder` (`genfacade serve --markup <папка>` берёт другую), правка пишется в те же файлы, и
# `genfacade manual` собирает их как есть. Исходная разметка автоматики остаётся в original_dir.
folder = "markup/stroim"
source = "stroim"                    # где листы: [manual.paths.pdf_dirs] data.toml
state_file = "check.json"            # проверено / осталось и секунды на дом — в папке разметки
original_dir = "orig"
cache_dir = "outputs/markup_cache"
image_max_side = 2400                # сжатие листа для телефона; координаты разметки не меняются
add_classes = ["window", "door", "garage_door", "porch", "canopy"]
min_box_m = 0.15                     # рамка уже этого — касание: ставится рамка по умолчанию

[markup.default_size_m]              # ширина × высота рамки, поставленной касанием
window = [1.2, 1.4]
door = [1.0, 2.1]
garage_door = [2.5, 2.2]
porch = [2.0, 0.6]
canopy = [2.0, 0.4]

[markup.colors]
levels = "blue"          # земля, чистый пол, верх этажей, края стены
zone = "magenta"
outline = "deepskyblue"
roof = "saddlebrown"
selected = "gold"

[markup.colors.cls]
window = "red"
door = "green"
garage_door = "green"
pillar = "orange"
sill = "orange"
blind = "orange"
deco = "orange"
cornice = "orange"
balcony = "orange"
molding = "orange"
shop = "orange"
facade = "orange"
porch = "orange"
chimney = "orange"
canopy = "orange"

[markup.labels.state]
unchecked = "не проверен"
good = "хорошо"
edited = "поправлен"
rejected = "негоден"

[markup.labels.level]
ground = "земля"
floor = "чистый пол"
top = "верх этажа"

[markup.labels.reason]
no_facades = "нет четырёх читаемых фасадов"
bad_scale = "масштаб не определить"
complex = "форма дома не по силам модулю"
bad_drawing = "чертёж нечитаем или искажён"
other = "другое"

# Подписи к значениям из schema.py. Страница получает их через /api/options и сама
# значений не знает: новый режим или класс элемента — строка здесь, а не правка JS.

[labels.mode.with_openings]
title = "Окна из плана"
hint = "Режим 2: окна стоят там, где их задал план"

[labels.mode.blind]
title = "Глухой куб"
hint = "Режим 1: разрывы плана заделаны, кроме входа; окна ставит модель (пока стаб)"

