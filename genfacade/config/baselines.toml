# Базовые подходы для таблицы метрик (`evaluation: Базовые подходы`).

[genplan]   # правило GenPlan (gf#141): окна — разрывы плана, высота одна на дом
# Низ и верх окна — доли высоты этажа от его пола: WindowSizeType.STANDARD GenPlan
# (dto/enum/window_size_type.py, docs/decisions.md 30.09). Текст не читается — уровень один.
window = [0.2, 0.9]

[vectorizer]   # растр стены → готовый векторизатор → элементы (gf#17); сторонний код — вне репо
python = "python3"                       # интерпретатор venv, где стоят EvoVec и vtracer
worker = "tools/vectorize_worker.py"
jobs = 3
long_side_px = 512                       # EvoVec сжимает растр до 512 (config.MAX_W/MAX_H)
min_side_px = 2                          # крошка трассировки: пятно уже 2 пикселей — не элемент
match_iou = 0.5                          # элемент векторизатора — элемент эталона от этого IoU
min_visible = 0.5                        # доля коробки элемента, видимая на растре его цветом
hidden_path_share = 0.05                 # путь SVG закрыт, если его цвет виден меньше чем на 5 % рамки
open_radius_px = 1                       # открытие маски класса квадратом 3×3: убирает кольцо сглаживания на краю
align_px = 1.5                           # допуск «на одной линии» в пикселях растра (≈ 3 см)

[vectorizer.texture]                     # по умолчанию растр плоский — верхняя граница векторизатора
siding_px = 0                            # линия обшивки каждые N строк на цвете стены
siding_dim = 0.12                        # на сколько линия темнее стены
noise = 0.0                              # шум по каналу, 0–255

[vectorizer.evovec]
code = "ext/VGLib/EvoVec-Evolutionary-Image-Vectorization"  # git clone --depth 1 …/CTLab-ITMO/VGLib
generations = 300                        # STEP_EVOL EvoVec по умолчанию
individuals = 30                         # INDIVIDUAL_COUNT по умолчанию

[vectorizer.vtracer]                     # умолчания vtracer 0.6 (stacked — слои друг над другом)
colormode = "color"
hierarchical = "stacked"
mode = "spline"
filter_speckle = 4
color_precision = 6
layer_difference = 16
corner_threshold = 60
length_threshold = 4.0
max_iterations = 10
splice_threshold = 45
path_precision = 8

[vectorizer.colors]   # растр стены: цвет класса; не цвета листа и не маски FID — разведены по тону
facade = "#e6e6e6"
window = "#0044ff"
door = "#8b4513"
cornice = "#ff00ff"
sill = "#00b400"
balcony = "#ffa500"
blind = "#ffff00"
deco = "#00ffff"
molding = "#800080"
pillar = "#ff0000"
shop = "#006400"
garage_door = "#404040"
porch = "#ff69b4"
chimney = "#808000"
canopy = "#00ced1"

[generator]   # растр от генератора вместо рендера эталона (gf#17, «генератор → векторизатор»)
seed = 17     # один на все стены: прогон повторяем

[generator.size]
long_side_px = 1024       # А; Б — свой размер, см. [generator.cnet]
step_px = 64
min_side_px = 256

[generator.prompt]
house = "a {floors}-storey {building} with {walls} walls and a {roof} roof"
drawing = "architectural elevation drawing of one house wall, orthographic, flat colors, no perspective, no sky"
negative = "perspective, photo, sky, clouds, lawn, grass, trees, people, cars, street, shadows, text, watermark"

[generator.prompt.colors]   # называем цвет материала словом: SD не читает #rrggbb
white = "#f0f0f0"
beige = "#d9c9a8"
gray = "#9a9a96"
"light blue" = "#a8c0d0"
brown = "#8c5a3a"
"red brick" = "#8c4a3a"
yellow = "#e0c060"
green = "#7a9a7a"
black = "#33373b"

[generator.sdxl]
model = "stabilityai/stable-diffusion-xl-base-1.0"   # OpenRAIL++-M [проверено: карточка]
steps = 30
guidance = 7.5
long_side_px = 1024

[generator.cnet]
model = "doguilmak/facade-controlnet-sd15"            # MIT; SD 1.5 + ControlNet [проверено: карточка]
subfolder = "full_pipeline"
steps = 30
guidance = 9.0
long_side_px = 512
conditioning_scale = 1.0
# Цвета маски — [не проверено]: карточка пишет «Facades-style RGB masks» и не называет палитру;
# взяты с примера карточки (цвет класса в jet, окна — узкие синие столбики). Проба решает.
background = "#000080"
facade = "#0032ff"
window = "#007dff"
door = "#00ffff"

[generator.detect]
through_vtracer = true
min_w = 0.02    # доли стены: окно уже 2 % или шире 50 % стены — не окно
max_w = 0.5
min_h = 0.04
max_h = 0.9
