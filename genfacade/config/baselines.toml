# Базовые подходы для таблицы метрик (`evaluation: Базовые подходы`).

[genplan]   # правило GenPlan (gf#141): окна — разрывы плана, высота одна на дом
# Низ и верх окна — доли высоты этажа от его пола: WindowSizeType.STANDARD GenPlan
# (dto/enum/window_size_type.py, docs/decisions.md 30.09). Текст не читается — уровень один.
window = [0.2, 0.9]

[vectorizer]   # растр стены → готовый векторизатор → элементы (gf#17); сторонний код — вне репо
python = "python3"                       # интерпретатор venv, где стоят EvoVec и vtracer
worker = "tools/vectorize_worker.py"
jobs = 3
long_side_px = 512                       # EvoVec сжимает растр до 512 (config.MAX_W/MAX_H)
min_side_px = 2                          # крошка трассировки: пятно уже 2 пикселей — не элемент
match_iou = 0.5                          # элемент векторизатора — элемент эталона от этого IoU
min_visible = 0.5                        # доля коробки элемента, видимая на растре его цветом
hidden_path_share = 0.05                 # путь SVG закрыт, если его цвет виден меньше чем на 5 % рамки
open_radius_px = 1                       # открытие маски класса квадратом 3×3: убирает кольцо сглаживания на краю
align_px = 1.5                           # допуск «на одной линии» в пикселях растра (≈ 3 см)

[vectorizer.texture]                     # по умолчанию растр плоский — верхняя граница векторизатора
siding_px = 0                            # линия обшивки каждые N строк на цвете стены
siding_dim = 0.12                        # на сколько линия темнее стены
noise = 0.0                              # шум по каналу, 0–255

[vectorizer.evovec]
code = "ext/VGLib/EvoVec-Evolutionary-Image-Vectorization"  # git clone --depth 1 …/CTLab-ITMO/VGLib
generations = 300                        # STEP_EVOL EvoVec по умолчанию
individuals = 30                         # INDIVIDUAL_COUNT по умолчанию

[vectorizer.vtracer]                     # умолчания vtracer 0.6 (stacked — слои друг над другом)
colormode = "color"
hierarchical = "stacked"
mode = "spline"
filter_speckle = 4
color_precision = 6
layer_difference = 16
corner_threshold = 60
length_threshold = 4.0
max_iterations = 10
splice_threshold = 45
path_precision = 8

[vectorizer.colors]   # растр стены: цвет класса; не цвета листа и не маски FID — разведены по тону
facade = "#e6e6e6"
window = "#0044ff"
door = "#8b4513"
cornice = "#ff00ff"
sill = "#00b400"
balcony = "#ffa500"
blind = "#ffff00"
deco = "#00ffff"
molding = "#800080"
pillar = "#ff0000"
shop = "#006400"
garage_door = "#404040"
porch = "#ff69b4"
chimney = "#808000"
canopy = "#00ced1"

[llm]   # LLM без дообучения (gf#162): запись токенами и few-shot из синтетики; запросы платные
shots = 8                # примеров в промпте: ближайшие по числу сторон, этажей и периметру
pool = 300               # домов синтетики train, из которых выбираются примеры (реальный тест — вне пула)
seed = 0
attempts = 3             # попыток на дом; брак — ответ не разобран или ошибка валидатора
temperature = 0.7
max_output_tokens = 4096
timeout_s = 120.0
chars_per_token = 2.5    # оценка для --dry-run: запись токенами — слова вида `cls:window`, цифры

# Цена — доллары за 1 млн токенов. Claude Sonnet 5.5 — [проверено: platform.claude.com/docs/en/
# about-claude/pricing, 02.11]; модели и цены OpenAI и DeepSeek — [не проверено]: сверить с
# прайсом поставщика перед настоящим прогоном.
[llm.providers.claude]
model = "claude-sonnet-5-5"
key_env = "ANTHROPIC_API_KEY"
usd_per_mtok_in = 2.0
usd_per_mtok_out = 10.0

[llm.providers.openai]
model = "gpt-4.1"
key_env = "OPENAI_API_KEY"
usd_per_mtok_in = 2.0
usd_per_mtok_out = 8.0

[llm.providers.deepseek]
model = "deepseek-chat"
key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
usd_per_mtok_in = 0.27
usd_per_mtok_out = 1.1

[llm.providers.stub]
model = "stub"
usd_per_mtok_in = 0.0
usd_per_mtok_out = 0.0

[llm.prompt]
instruction = """Ты строишь фасады дома. Дом записан последовательностью токенов, токены разделены \
пробелами. Все длины — целые числа шагов сетки по {grid_m} м. Условие описывает дом и его стены \
(`<side>` — стена с длиной и проёмами плана, которые уже стоят). Ответ — `<answer>`, типоразмеры \
окон `<types>`, затем для каждой стены по порядку `<wall>`, её элементы и зоны отделки, в конце \
`<end>`. Отвечай только записью ответа в том же виде, что в примерах, без пояснений."""
vocabulary = "Служебные токены и слова записи: {words}. Остальные токены — числа."
example = "Пример {n}"
house = "{type}, этажей {floors}, крыша {roof}, стиль {style}, стен {sides}."
condition = "Условие:"
answer = "Ответ:"

[llm.prompt.mode]
with_openings = "Режим: окна и двери из плана заданы условием, остальное достраиваешь ты."
blind = "Режим: глухой куб, окон плана нет, окна расставляешь ты."
