# Правило шага 4: раскладка стены до модели (specs/generation.md, п. 3–4; facade.md, правило 9; gf#50).
# Размеры — метры натуры. Высоты цоколя и карниза — не здесь: они в HouseSpec, одни на дом.

[windows]
# Низ и верх окна — доли высоты этажа от его пола, как WindowSizeType GenPlan
# (dto/enum/window_size_type.py): тогда окна фасада сходятся с окнами его 3D-модели.
size.small = [0.4, 0.9]
size.standard = [0.2, 0.9]
size.high = [0.0, 1.0]
level = "standard"        # какой уровень ставит правило: один на все дома — текст не читается
sash_max_w_m = 0.8        # шире — рама делится на столбцы створок
transom_min_h_m = 1.8     # выше — два ряда (фрамуга)
lintel_m = 0.25           # перемычка: от верха окна до перекрытия или карниза не меньше

[blind]
# режим 1 (глухой куб): окна ставит правило. Ширина и шаг осей — один выбор на дом по seed.
widths_m = [0.9, 1.2, 1.5]
pitches_m = [2.4, 3.0, 3.6]   # желаемое расстояние между осями окон
edge_m = 0.8                  # от угла дома до окна
clearance_m = 0.3             # от двери и запретной зоны до окна
min_gap_m = 0.6               # между окнами

[door]
height_m = 2.1

[sill]
overhang_m = 0.05     # подоконник шире окна с каждой стороны
height_m = 0.06

[casing]
# наличник вокруг окна (класс molding) — у этих стилей HouseSpec.style
styles = ["classic", "chalet"]
width_m = 0.1

[cornice]
height_m = 0.25

[band]
height_m = 0.15       # пояс по линии перекрытия между этажами

[accent]
entrance_pad_m = 0.4  # акцентная полоса у входа на стене без фронтона
