# Метрики оценки (`evaluation: Пять групп метрик`, gf#16): genfacade metrics и genfacade calibrate.

seed = 0              # выбор пар стен для разнообразия и случайная расстановка окон при калибровке
pairs = 2000          # случайных пар стен: разнообразие — среднее расстояние между ними
quantile_points = 200 # точек квантилей, по которым считается расстояние Вассерштейна

[svd]                 # SVD-метрика Beyond Segmentation — вспомогательная колонка (docs/metrics.md)
px_per_m = 20         # маска окон стены растрируется с этим шагом
k_max = 25            # rank-k приближения k = 1..k_max, как в статье

[realism]             # слой «отличим ли от настоящего» метрики правдоподобия (gf#210)
k = 5                 # density и coverage: радиус шара эталонной стены — до k-го соседа (Naeem 2020)
subsets = 50          # подвыборок: c2st, density, coverage — среднее по ним, c2st_sd — разброс (gf#235)
# признаки стены (metrics/wall_features.py, номера кандидатов gf#243 — в описании функций);
# признак дома одинаков у всех его стен. Набор — по согласию с хозяином на 48 парах (gf#243,
# docs/metrics-results.md); группа А (брак листа) — место для функции валидатора gf#242
features = [
    # прежние 11 (gf#210)
    "windows_per_m", "width_m", "height_m", "sill_m", "head_m", "glass", "top_spread",
    "axis_offset", "gap_cv", "edge_share", "doors_per_m",
    # Б, В, Г: не ухудшают согласие
    "min_pier_m", "sizes_floor", "sizes_house", "axis_share", "bottom_spread", "aspect",
    # Г23, Д: карниз, цоколь, зоны отделки
    "plinth_share", "cornice_share", "zones", "second_finish", "corner_mismatch", "hidden_zones",
]
# Выключены до решения хозяина (gf#243): ухудшают согласие с хозяином — blind_walls,
# opening_share, house_doors, edge_m, symmetry, frieze_m, height_share, front_rich, floor_lines,
# end_windows, trim_mixed; не различают (1 у всех домов данных) — front_door.
size_tol_m = 0.05     # окна ближе по ширине и высоте — один типоразмер (sizes_floor, sizes_house)
axis_tol_m = 0.1      # центры ближе — одна ось (axis_share), зеркальный двойник (symmetry)
zone_step_m = 0.25    # шаг по высоте, с которым сравнивается отделка у угла (corner_mismatch)

[realtest]            # genfacade realtest: сводная таблица summary.md — все строки, оба режима
# годных листов (valid × домов) — первой колонкой всегда; дальше — эти колонки metrics.json
summary = ["rules", "c2st", "density", "coverage", "fid", "kid", "windows_per_wall"]

[calibrate]           # genfacade calibrate: эталон генератора против подмен
reference = 1000      # домов train — эталонное распределение структуры и разнообразия

[visual]              # FID и KID по растрам стен (gf#143): маска классов, а не оформленный лист
px_per_m = 20         # шаг растра
canvas_m = [16, 8]    # холст стены, м: стена — от левого нижнего угла; не влезает — уменьшается
batch = 32            # растров за проход Inception
device = "auto"       # где считать Inception: auto — GPU, если PyTorch его видит
kid_subset = 1000     # размер подвыборки KID; меньше растров в папке — берётся сколько есть
kid_subsets = 100     # подвыборок KID: число — среднее по ним
background = "#000000" # холст вне стены

[visual.colors]       # цвет класса на маске; facade — сама стена, элементы — поверх в порядке листа
facade = "#0000ff"
window = "#0055ff"
door = "#00aaff"
cornice = "#00ffff"
sill = "#55ffaa"
balcony = "#aaff55"
blind = "#ffff00"
deco = "#ffaa00"
molding = "#ff5500"
pillar = "#ff0000"
shop = "#aa0000"
garage_door = "#aa00aa"
porch = "#ff55ff"
chimney = "#888888"
canopy = "#55aa55"
