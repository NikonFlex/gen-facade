# Модели шагов конвейера (gf#107). Путь — от папки, где запущена команда.

[spec]               # шаг 1: стаб (genfacade/models/stub.py) — до модели
# Отделка дома (gf#303) — ниже, после стиля.
default_finish = "plaster_modern"  # описания нет — эта отделка и первые цвета рядов
stem_tail = 5        # слово текста совпадает с основой из списков ниже, если после неё не больше знаков;
                     # сочетание слов — слова текста подряд (genfacade/models/words.py)
reach = 3            # цвет красит роль слова, которое стоит не дальше стольких слов за ним; нет — стены
negations = ["без", "no", "without"]   # слово перед словом элемента — элемента у дома нет
# Щипец над входом (gf#455): сочетание слов ставит дому признак `HouseSpec.gable_over_entrance`, шаг 3
# строит над стеной со входом щипец, если крыша двускатная (иначе признак игнорируется). Правилом по
# плану щипец не выбрать: у настоящих домов он лишь у 5 из 32 двускатных.
entrance_gable_words = [
  "gable over the entrance", "gable over entrance", "gable over the porch", "gable over porch",
  "gable above the entrance", "cross gable", "cross-gable",
  "фронтон над вход", "щипец над вход", "фронтон над крыльц", "щипец над крыльц",
  "крыльцо под фронтон", "крыльцо под щипц",
]

# Труба и водосток (gf#454, `generation: Труба и водосток по словам текста`): слова — основы.
# Труба — если текст называет трубу, печь или камин; «водосточная труба» — не дымовая, поэтому
# слово после слова водостока трубой не считается. Место трубы — доля длины конька от его начала.
# «без водостока», «no gutters» — водостока нет (negations, как у элементов); слов нет — по умолчанию.
chimney_words = ["труб", "дымоход", "печь", "печк", "печн", "камин", "chimney", "fireplace", "stove"]
chimney_at = 0.25
gutter_words = ["водосток", "водосточ", "gutter", "downpipe", "downspout"]
gutters_default = true

# Этажность из текста (`generation: Стаб шага 1`, gf#155): число этажей — по слову, которое
# встретилось в тексте раньше других; регистр и дефис не важны («two-storey» = «two storeys»).
# Слова нет — этажей, как у заготовки.
[spec.floors_words]
1 = ["one-storey", "one-story", "single-storey", "single-story", "bungalow", "одноэтажн",
     "в один этаж"]
2 = ["two-storey", "two-story", "2-storey", "2-story", "двухэтажн", "в два этажа", "2 этажа"]
3 = ["three-storey", "three-story", "3-storey", "3-story", "трёхэтажн", "трехэтажн",
     "в три этажа", "3 этажа"]

# Нижние части дома (gf#322): сочетание «одноэтажное крыло» ставит нижним частям столько этажей
# (`HouseSpec.wing_floors`); этажность дома ищется в тексте без этих слов. Слов нет — нижнее
# крыло определяет правило конвейера (config/plan.toml, [parts]).
[spec.wing_words]
1 = ["one-storey wing", "one-story wing", "single-storey wing", "single-story wing",
     "one-storey annex", "one-story annex", "single-storey annex", "single-story annex",
     "one-storey extension", "single-storey extension", "one-storey garage", "single-storey garage",
     "garage", "одноэтажн крыл", "одноэтажн пристройк", "одноэтажн гараж", "гараж"]

# Стиль из текста (gf#212): по слову, которое встретилось раньше других; слова нет — стиль заготовки.
# Стили — те, что знает модель шага 4 (config/synthetic.toml, [spec] styles).
[spec.style_words]
modern = ["modern", "contemporary", "minimalist", "современн", "минимализм", "хай-тек"]
scandinavian = ["scandinavian", "nordic", "скандинав", "барнхаус", "barnhouse"]
chalet = ["chalet", "alpine", "шале", "альпийск"]
classic = ["classic", "neoclassic", "colonial", "traditional", "классическ", "классик",
           "неоклассич", "колониальн"]

# ——— Отделка дома (gf#303): палитра и виды выводимых элементов — одни на все стены ———
# Стиль выше — токен условия модели шага 4, отделка с ним не связана, кроме выбора по умолчанию:
# без слов в тексте отделка берётся среди тех, что подходят стилю (`styles`). Цвет отделки модель
# не выбирает: он из ряда `colors` (подобрано агентом, gf#303: готового набора с понятной лицензией
# нет, `docs/decisions.md` 05.11), стаб — по слову цвета или от текста.

# Вид материала стен → слова текста. Слово, которое встретилось раньше других, выбирает отделки с
# этим видом стен; слова нет — отделки всех видов.
[spec.material_words]
# Слова частных видов (gf#317); слов роли «камень» нет: «камень на цоколе» не делает стены каменными.
plaster = ["plaster", "stucco", "штукатур"]
brick = ["brick", "кирпич"]
brick_1_5 = ["полуторн", "5нф"]
brick_long = ["norman", "нормандск"]
clinker = ["clinker", "клинкер", "плитк"]
siding = ["siding", "clapboard", "weatherboard", "обшивк", "сайдинг", "вагонк"]
siding_dutch = ["dutch", "голландск"]
board_batten_narrow = ["batten", "реечн"]
wood = ["wood", "timber", "дерев", "брус"]
imitation_timber = ["имитаци", "imitation"]
blockhouse = ["blockhouse", "blockhaus", "хаус"]
ashlar = ["ashlar", "тёсан", "тесан"]
profiled_sheet = ["профлист", "профнастил", "corrugated"]

# Вид → общий вид, чьи слова называют и его: «кирпич» — это и brick, и brick_1_5; «полуторный» —
# только brick_1_5. Слово, названное в тексте, выбирает среди видов, которые оно называет.
[spec.material_like]
brick_1_5 = "brick"
brick_long = "brick"
siding_narrow = "siding"
siding_wide = "siding"
siding_dutch = "siding"

# Элемент → слова текста: слово в тексте ставит элементу вид отделки, если у неё его нет
# (`trim_default`), «без …» — убирает; цвет перед словом красит роль trim.
[spec.trim_words]
sill = ["sill", "подоконник"]
casing = ["casing", "architrave", "наличник"]
shutters = ["shutter", "ставн", "ставен"]
canopy = ["canopy", "canopies", "козыр"]

# Слуховые окна (gf#457, `generation: Слуховые окна по словам текста`): слово в тексте (без «без»
# перед ним) ставит скатному дому по дормеру на середину каждого карнизного ската; лицо и вид крыши
# — отсюда. Плана у шага 1 нет: скаты по умолчанию — на ±y (карнизы вдоль x), конвейер ставит их по
# плану (`dormers.on_eaves`).
[spec.dormer]
words = ["dormer", "дормер", "слухов окн"]
width_m = 1.6
roof = "gable"
facings = ["-y", "+y"]

# Слова текста, перед которыми цвет красит роль палитры; остальные слова — стены (main). Роль trim
# берёт ещё и слова элементов выше.
[spec.role_words]
trim = ["trim", "отделк", "обрамлен"]
plinth = ["plinth", "base", "foundation", "цокол", "фундамент"]
accent = ["accent", "акцент"]
roof = ["roof", "крыш", "кровл", "металлочерепиц", "черепиц", "ондулин", "ondulin", "shingle"]

# Вид крыши → слова текста (gf#320): по слову, которое встретилось раньше других; слова нет — вид
# крыши отделки (`roof` у [spec.finish.*]). Скаты строит код развёртки над прямоугольным домом.
[spec.roof_words]
flat = ["flat roof", "flat-roofed", "плоская крыша", "плоской крышей", "плоская кровля", "плоской кровлей"]
gable = ["gable roof", "gabled", "pitched roof", "двускатн", "щипцов"]
hip = ["hip roof", "hipped", "вальмов", "четырёхскатн", "четырехскатн"]
shed = ["shed roof", "lean-to", "mono-pitch", "односкатн"]

# Мансардные окна в плоскости ската (gf#456): слова текста — основы, как у остальных; называет текст
# окна в крыше — на каждый карнизный скат главной части столько окон. Ставит код, не модель шага 4.
[spec.skylights]
words = ["мансардн окн", "окна в крыш", "окно в крыш", "skylight", "roof window", "velux"]
default = 2

# Уклон ската по виду крыши и свесы за стену по горизонтали (gf#320); их же берёт синтетика.
# Числа — типичные для коттеджей [не проверено: источник по своду правил — gf#320]. Свес карнизный
# (за стену со скатом) и фронтонный (за стену без ската; у вальмовой его нет) — по виду крыши;
# медианы свесов по виду крыши у домов разметки со свесом с чертежа (`tools/overhang_probe.py`,
# 11.11.2026: двускатных 32, вальмовых 7, односкатных 3) — gf#451; у двускатных медиана — по
# FreeFarmhouse (27 из 32), у российских строим.дом.рф свесы больше — 0,6–0,8 м.
[spec.roof_shape]
pitch_deg = { gable = 35.0, hip = 25.0, shed = 12.0 }
overhang_m = { gable = 0.25, hip = 0.6, shed = 0.3 }
gable_overhang_m = { gable = 0.2, shed = 0.25 }

# Вид элемента → слова текста (gf#318): назван вид — он и ставится (и элемент есть, даже если у
# отделки его нет). Вид — запись config/derive.toml; новый вид с новыми словами — две записи, без
# кода и без переобучения. Слова — основы (stem_tail букв после основы).
# Сочетание слов — подряд идущие слова текста (models/words.py); одно слово «арочн» красило бы и окно.
[spec.kind_words.sill]
drip = ["drip", "отлив"]
stone = ["stone sill", "каменн подоконник"]
[spec.kind_words.casing]
pediment = ["pediment", "сандрик", "фронтон над окн"]
segment = ["segmental pediment", "сегментн сандрик", "сегментн наличник"]
wide = ["wide casing", "широк наличник"]
[spec.kind_words.shutters]
louvered = ["louvered", "жалюзи", "жалюзийн"]
board = ["board shutter", "дощат ставн"]
board_batten_z = ["batten shutter", "z-brace", "ставн на планк"]
panel = ["raised panel", "филёнчат ставн", "филенчат ставн"]
[spec.kind_words.canopy]
gable = ["gable canopy", "двускатн козыр"]
bracket = ["bracket", "кронштейн"]
arched = ["arched canopy", "арочн козыр"]
posts = ["portico", "porch roof", "на столбах", "навес на столб"]
[spec.kind_words.door]
panel6 = ["six-panel", "6-panel", "шестифилёнчат", "филёнчат дверь"]
double = ["double door", "двупольн", "двустворчат"]
sidelights = ["sidelight", "боковые стекл", "боковыми стекл"]

[spec.trim_default]    # вид элемента, который назвали в тексте, а у отделки его нет
sill = "flat"
casing = "flat"
shutters = "panel"
canopy = "flat"
door = "plain"

