[spec.colors.roof_terracotta]    # без hex — цвет вида материала из library.toml

# Сочетания цветов (gf#317, `docs/library-catalog.md`): стены (main), отделка (trim), крыша (roof).
# Стены и отделка — триады SW (роли body/wall и trim источника); крыша — из RAL по правилу
# Dunn-Edwards «коричневая крыша — оливковые, зелёные, русетовые стены; зелёная — коричневые и
# красные; красная — нейтральные»; в самих источниках SW крыши нет. Акцент SW (дверь, ставни) в
# сочетании не используется: роль accent у нас — зона отделки, а не цвет двери.
[spec.schemes.sw_arts_crafts_1]
source = "Sherwin-Williams Preservation Palette, Arts & Crafts 1900-е, триада 1"
colors = { main = "roycroft_suede", trim = "roycroft_brass", roof = "roof_brown" }
[spec.schemes.sw_arts_crafts_3]
source = "Sherwin-Williams Preservation Palette, Arts & Crafts 1900-е, триада 3"
colors = { main = "craftsman_brown", trim = "roycroft_vellum", roof = "roof_brown" }
[spec.schemes.sw_arts_crafts_4]
source = "Sherwin-Williams Preservation Palette, Arts & Crafts 1900-е, триада 4"
colors = { main = "aurora_brown", trim = "roycroft_suede", roof = "roof_green" }
[spec.schemes.sw_arts_crafts_6]
source = "Sherwin-Williams Preservation Palette, Arts & Crafts 1900-е, триада 6"
colors = { main = "bunglehouse_gray", trim = "bottle_green", roof = "roof_brown" }
[spec.schemes.sw_traditional_3]
source = "Sherwin-Williams Suburban Traditional, триада 3"
colors = { main = "summit_gray", trim = "extra_white", roof = "roof_graphite" }
[spec.schemes.sw_traditional_6]
source = "Sherwin-Williams Suburban Traditional, триада 6"
colors = { main = "red_barn", trim = "alabaster", roof = "roof_green" }
[spec.schemes.sw_modern_15]
source = "Sherwin-Williams Suburban Modern, триада 15"
colors = { main = "perfect_greige", trim = "popular_gray", roof = "roof_graphite" }
[spec.schemes.sw_modern_18]
source = "Sherwin-Williams Suburban Modern, триада 18"
colors = { main = "shoji_white", trim = "relaxed_khaki", roof = "roof_brown" }

# Отделки: виды и ряды цветов по ролям палитры (первый цвет ряда — по умолчанию; стены — ещё и по
# слову цвета или от текста; `extra` — цвета только по слову), виды выводимых элементов (config/derive.toml). Виды материалов — из
# library.toml. Стили — те, что знает модель шага 4 (config/synthetic.toml, [spec] styles).
[spec.finish.plaster_modern]       # гладкая штукатурка, без наличников и ставен
styles = ["modern"]
roof = "flat"
trim = { sill = "flat", casing = "none", shutters = "none", canopy = "flat", door = "plain" }
[spec.finish.plaster_modern.materials]
main = { kind = "plaster", colors = ["cream", "white", "grey", "beige"], extra = ["graphite", "yellow"] }
plinth = { kind = "concrete", colors = ["concrete", "graphite"] }
accent = { kind = "wood", colors = ["wood_natural"] }
trim = { kind = "metal", colors = ["graphite", "black", "white"] }
roof = { kind = "metal_roof", colors = ["roof_steel"] }

[spec.finish.plaster_classic]      # классика: штукатурка, белые наличники, ставни, скатный подоконник
styles = ["classic"]
roof = "hip"
trim = { sill = "sloped", casing = "flat", shutters = "panel", canopy = "gable", door = "plain" }
schemes = ["sw_traditional_3", "sw_traditional_6", "sw_modern_15", "sw_modern_18", "sw_arts_crafts_1"]
[spec.finish.plaster_classic.materials]
main = { kind = "plaster", colors = ["cream", "white", "yellow", "beige", "grey"], extra = ["summit_gray", "red_barn", "perfect_greige", "shoji_white", "roycroft_suede"] }
plinth = { kind = "stone", colors = ["stone_grey", "stone_sand"] }
accent = { kind = "stone", colors = ["stone_sand", "stone_grey"] }
trim = { kind = "wood", colors = ["white", "cream", "green", "brown", "graphite", "black"] }
roof = { kind = "tile_roof", colors = ["roof_terracotta"] }

[spec.finish.plaster_stone]        # штукатурка с каменным цоколем, жалюзийные ставни
styles = ["modern", "classic"]
roof = "hip"
trim = { sill = "sloped", casing = "flat", shutters = "louvered", canopy = "bracket", door = "plain" }
schemes = ["sw_traditional_3", "sw_modern_15", "sw_modern_18"]
