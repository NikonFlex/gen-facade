# Модели шагов конвейера (gf#107). Путь — от папки, где запущена команда.

[spec]               # шаг 1: стаб (genfacade/models/stub.py) — до модели
# Этажность из текста (`generation: Стаб шага 1`, gf#155): число этажей — по слову, которое
# встретилось в тексте раньше других; регистр не важен. Слова нет — этажей, как у заготовки.
[spec.floors_words]
1 = ["one-storey", "one-story", "single-storey", "single-story", "bungalow", "одноэтажн",
     "в один этаж"]
2 = ["two-storey", "two-story", "2-storey", "2-story", "двухэтажн", "в два этажа", "2 этажа"]
3 = ["three-storey", "three-story", "3-storey", "3-story", "трёхэтажн", "трехэтажн",
     "в три этажа", "3 этажа"]

# Стиль из текста (gf#212): по слову, которое встретилось раньше других; слова нет — стиль заготовки.
# Стили — те, что знает модель шага 4 (config/synthetic.toml, [spec] styles).
[spec.style_words]
modern = ["modern", "contemporary", "minimalist", "современн", "минимализм", "хай-тек"]
scandinavian = ["scandinavian", "nordic", "скандинав", "барнхаус", "barnhouse"]
chalet = ["chalet", "alpine", "шале", "альпийск"]
classic = ["classic", "colonial", "traditional", "классическ", "классик", "колониальн"]

# Виды выводимых элементов дома по стилю (gf#212, config/derive.toml): одни на все стены. Подоконник —
# у каждого стиля: заготовка стаба шага 4 (models/stub_data/facades.json) ставит плоский подоконник.
[spec.trim]
modern = { sill = "flat", casing = "none", shutters = "none", canopy = "flat" }
scandinavian = { sill = "flat", casing = "flat", shutters = "none", canopy = "gable" }
chalet = { sill = "sloped", casing = "wide", shutters = "board", canopy = "bracket" }
classic = { sill = "sloped", casing = "flat", shutters = "panel", canopy = "gable" }

[layout]             # шаг 4: обученный GPT (genfacade/models/layout.py)
# Чекпойнт genfacade train (model.pt). Файла нет — стаб (genfacade/models/stub.py).
# Скачать обученную модель: gh run download <run_id> -n train-<run_id> -D data/models/layout
checkpoint = "data/models/layout/model.pt"
attempts = 5         # ответов модели на один прогон, пока не выйдет годный; иначе — отказ
seed = 0             # попытка k сэмплирует с seed + k: прогон повторяется
temperature = 1.0
top_k = 0            # 0 — из всего словаря
device = "auto"      # auto | cuda | cpu
bf16 = true          # на GPU — в bfloat16, как при обучении; на процессоре не действует
# Запрет при генерации (genfacade/train/constraints.py): в глухом режиме — x и w окна, при которых
# оно заходит в запретную зону, на проём или за край стены (gf#132); в обоих режимах — токены,
# ломающие рамку x y w h элемента (gf#177).
constrain = true
