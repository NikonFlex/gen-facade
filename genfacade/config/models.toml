# Модели шагов конвейера (gf#107). Путь — от папки, где запущена команда.

[spec]               # шаг 1: стаб (genfacade/models/stub.py) — до модели
# Отделка дома (gf#303) — ниже, после стиля.
default_finish = "plaster_modern"  # описания нет — эта отделка и первые цвета рядов
stem_tail = 5        # слово текста совпадает с основой из списков ниже, если после неё не больше знаков;
                     # сочетание слов — слова текста подряд (genfacade/models/words.py)
reach = 3            # цвет красит роль слова, которое стоит не дальше стольких слов за ним; нет — стены
negations = ["без", "no", "without"]   # слово перед словом элемента — элемента у дома нет

# Этажность из текста (`generation: Стаб шага 1`, gf#155): число этажей — по слову, которое
# встретилось в тексте раньше других; регистр и дефис не важны («two-storey» = «two storeys»).
# Слова нет — этажей, как у заготовки.
[spec.floors_words]
1 = ["one-storey", "one-story", "single-storey", "single-story", "bungalow", "одноэтажн",
     "в один этаж"]
2 = ["two-storey", "two-story", "2-storey", "2-story", "двухэтажн", "в два этажа", "2 этажа"]
3 = ["three-storey", "three-story", "3-storey", "3-story", "трёхэтажн", "трехэтажн",
     "в три этажа", "3 этажа"]

# Стиль из текста (gf#212): по слову, которое встретилось раньше других; слова нет — стиль заготовки.
# Стили — те, что знает модель шага 4 (config/synthetic.toml, [spec] styles).
[spec.style_words]
modern = ["modern", "contemporary", "minimalist", "современн", "минимализм", "хай-тек"]
scandinavian = ["scandinavian", "nordic", "скандинав", "барнхаус", "barnhouse"]
chalet = ["chalet", "alpine", "шале", "альпийск"]
classic = ["classic", "neoclassic", "colonial", "traditional", "классическ", "классик",
           "неоклассич", "колониальн"]

# ——— Отделка дома (gf#303): палитра и виды выводимых элементов — одни на все стены ———
# Стиль выше — токен условия модели шага 4, отделка с ним не связана, кроме выбора по умолчанию:
# без слов в тексте отделка берётся среди тех, что подходят стилю (`styles`). Цвет отделки модель
# не выбирает: он из ряда `colors` (подобрано агентом, gf#303: готового набора с понятной лицензией
# нет, `docs/decisions.md` 05.11), стаб — по слову цвета или от текста.

# Вид материала стен → слова текста. Слово, которое встретилось раньше других, выбирает отделки с
# этим видом стен; слова нет — отделки всех видов.
[spec.material_words]
plaster = ["plaster", "stucco", "штукатур"]
brick = ["brick", "кирпич"]
siding = ["siding", "clapboard", "weatherboard", "обшивк", "сайдинг", "вагонк"]
wood = ["wood", "timber", "дерев", "брус"]

# Элемент → слова текста: слово в тексте ставит элементу вид отделки, если у неё его нет
# (`trim_default`), «без …» — убирает; цвет перед словом красит роль trim.
[spec.trim_words]
sill = ["sill", "подоконник"]
casing = ["casing", "architrave", "наличник"]
shutters = ["shutter", "ставн", "ставен"]
canopy = ["canopy", "canopies", "козыр"]

# Слова текста, перед которыми цвет красит роль палитры; остальные слова — стены (main). Роль trim
# берёт ещё и слова элементов выше.
[spec.role_words]
trim = ["trim", "отделк", "обрамлен"]
plinth = ["plinth", "base", "foundation", "цокол", "фундамент"]
accent = ["accent", "акцент"]
roof = ["roof", "крыш"]

[spec.trim_default]    # вид элемента, который назвали в тексте, а у отделки его нет
sill = "flat"
casing = "flat"
shutters = "panel"
canopy = "flat"

# Ряд цветов отделки: имя → цвет и слова текста (подобрано агентом, не из каталога). Слово может
# быть у нескольких имён: ряд роли в отделке решает, какое из них подходит.
[spec.colors.white]
hex = "#f2efe8"
words = ["white", "бел"]
[spec.colors.cream]
hex = "#eae2d0"
words = ["cream", "ivory", "кремов", "молочн"]
[spec.colors.beige]
hex = "#d9c7a3"
words = ["beige", "sand", "бежев", "песочн"]
[spec.colors.yellow]
hex = "#e2c577"
words = ["yellow", "жёлт", "желт"]
[spec.colors.grey]
hex = "#b8bec2"
words = ["grey", "gray", "серы", "серо"]
[spec.colors.graphite]
hex = "#4b4f54"
words = ["graphite", "anthracite", "dark", "графит", "антрацит", "тёмн", "темн"]
[spec.colors.black]
hex = "#2c2e31"
words = ["black", "чёрн", "черн"]
[spec.colors.brown]
hex = "#6a4b36"
words = ["brown", "коричнев"]
[spec.colors.red]
hex = "#a94a35"
words = ["red", "красн", "бордов"]
[spec.colors.green]
hex = "#7f987a"
words = ["green", "зелён", "зелен"]
[spec.colors.blue]
hex = "#8ea8bc"
words = ["blue", "голуб", "син"]
[spec.colors.brick_red]
hex = "#9a4a38"
words = ["red", "красн"]
[spec.colors.brick_brown]
hex = "#6f4636"
words = ["brown", "коричнев"]
[spec.colors.brick_light]
hex = "#d6c4a2"
words = ["light", "светл"]
[spec.colors.brick_sand]
hex = "#c9a982"
words = ["beige", "sand", "бежев", "песочн"]
[spec.colors.wood_natural]
hex = "#b58a58"
words = ["natural", "натуральн"]
[spec.colors.wood_honey]
hex = "#c9a066"
words = ["honey", "медов"]
[spec.colors.wood_dark]
hex = "#5b4130"
words = ["dark", "тёмн", "темн"]
[spec.colors.wood_grey]
hex = "#8d877b"
words = ["grey", "gray", "weathered", "серы", "серо"]
[spec.colors.stone_grey]
hex = "#8a857c"
words = ["grey", "gray", "серы", "серо"]
[spec.colors.stone_sand]
hex = "#b9ad98"
words = ["beige", "sand", "бежев", "песочн"]
[spec.colors.concrete]    # без hex — цвет вида материала из library.toml
[spec.colors.roof_steel]    # без hex — цвет вида материала из library.toml
[spec.colors.roof_terracotta]    # без hex — цвет вида материала из library.toml

# Отделки: виды и ряды цветов по ролям палитры (первый цвет ряда — по умолчанию; стены — ещё и по
# слову цвета или от текста; `extra` — цвета только по слову), виды выводимых элементов (config/derive.toml). Виды материалов — из
# library.toml. Стили — те, что знает модель шага 4 (config/synthetic.toml, [spec] styles).
[spec.finish.plaster_modern]       # гладкая штукатурка, без наличников и ставен
styles = ["modern"]
trim = { sill = "flat", casing = "none", shutters = "none", canopy = "flat" }
[spec.finish.plaster_modern.materials]
main = { kind = "plaster", colors = ["cream", "white", "grey", "beige"], extra = ["graphite", "yellow"] }
plinth = { kind = "concrete", colors = ["concrete", "graphite"] }
accent = { kind = "wood", colors = ["wood_natural"] }
trim = { kind = "metal", colors = ["graphite", "black", "white"] }
roof = { kind = "metal_roof", colors = ["roof_steel"] }

[spec.finish.plaster_classic]      # классика: штукатурка, белые наличники, ставни, скатный подоконник
styles = ["classic"]
trim = { sill = "sloped", casing = "flat", shutters = "panel", canopy = "gable" }
[spec.finish.plaster_classic.materials]
main = { kind = "plaster", colors = ["cream", "white", "yellow", "beige", "grey"] }
plinth = { kind = "stone", colors = ["stone_grey", "stone_sand"] }
accent = { kind = "stone", colors = ["stone_sand", "stone_grey"] }
trim = { kind = "wood", colors = ["white", "cream", "green", "brown", "graphite", "black"] }
roof = { kind = "tile_roof", colors = ["roof_terracotta"] }

[spec.finish.plaster_stone]        # штукатурка с каменным цоколем, жалюзийные ставни
styles = ["modern", "classic"]
trim = { sill = "sloped", casing = "flat", shutters = "louvered", canopy = "bracket" }
[spec.finish.plaster_stone.materials]
main = { kind = "plaster", colors = ["white", "beige", "grey", "yellow", "cream"] }
plinth = { kind = "stone", colors = ["stone_grey", "stone_sand"] }
accent = { kind = "stone", colors = ["stone_grey", "stone_sand"] }
trim = { kind = "wood", colors = ["brown", "white", "graphite", "green", "black"] }
roof = { kind = "metal_roof", colors = ["roof_steel"] }

[spec.finish.siding_painted]       # крашеная обшивка: цвет стен — из ряда
styles = ["scandinavian", "classic", "modern"]
trim = { sill = "flat", casing = "flat", shutters = "louvered", canopy = "gable" }
[spec.finish.siding_painted.materials]
main = { kind = "siding", colors = ["blue", "white", "cream", "yellow", "grey", "green", "red", "graphite"] }
plinth = { kind = "concrete", colors = ["concrete", "graphite"] }
accent = { kind = "wood", colors = ["wood_natural", "wood_dark"] }
trim = { kind = "wood", colors = ["white", "cream", "graphite", "black", "brown"] }
roof = { kind = "metal_roof", colors = ["roof_steel"] }

[spec.finish.wood_natural]         # натуральное дерево, широкие наличники, дощатые ставни
styles = ["scandinavian", "chalet", "modern"]
trim = { sill = "flat", casing = "wide", shutters = "board", canopy = "bracket" }
[spec.finish.wood_natural.materials]
main = { kind = "wood", colors = ["wood_natural", "wood_honey", "wood_grey"], extra = ["green", "red", "white", "blue", "black"] }
plinth = { kind = "concrete", colors = ["concrete", "graphite"] }
accent = { kind = "wood", colors = ["wood_dark", "wood_honey"] }
trim = { kind = "wood", colors = ["wood_dark", "white", "brown", "graphite"] }
roof = { kind = "metal_roof", colors = ["roof_steel"] }

[spec.finish.wood_dark]            # тёмное дерево, скандинавский: чёрная отделка, без ставен
styles = ["scandinavian", "modern"]
trim = { sill = "flat", casing = "flat", shutters = "none", canopy = "gable" }
[spec.finish.wood_dark.materials]
main = { kind = "wood", colors = ["wood_dark", "black"], extra = ["graphite"] }
plinth = { kind = "concrete", colors = ["graphite", "concrete"] }
accent = { kind = "wood", colors = ["wood_natural", "wood_honey"] }
trim = { kind = "metal", colors = ["black", "graphite", "white"] }
roof = { kind = "metal_roof", colors = ["roof_steel"] }

[spec.finish.brick_red]            # красный кирпич, белые наличники и ставни
styles = ["classic", "modern"]
trim = { sill = "sloped", casing = "flat", shutters = "panel", canopy = "gable" }
[spec.finish.brick_red.materials]
main = { kind = "brick", colors = ["brick_red", "brick_brown"] }
plinth = { kind = "stone", colors = ["stone_grey", "stone_sand"] }
accent = { kind = "wood", colors = ["wood_natural", "wood_dark"] }
trim = { kind = "wood", colors = ["white", "cream", "graphite", "brown"] }
roof = { kind = "tile_roof", colors = ["roof_terracotta"] }

[spec.finish.brick_light]          # светлый кирпич, тёмная отделка, без наличников
styles = ["modern", "scandinavian"]
trim = { sill = "flat", casing = "none", shutters = "none", canopy = "flat" }
[spec.finish.brick_light.materials]
main = { kind = "brick", colors = ["brick_light", "brick_sand"] }
plinth = { kind = "concrete", colors = ["concrete", "graphite"] }
accent = { kind = "wood", colors = ["wood_natural", "wood_dark"] }
trim = { kind = "metal", colors = ["graphite", "black", "brown"] }
roof = { kind = "metal_roof", colors = ["roof_steel"] }

[spec.finish.chalet_wood_stone]    # шале: дерево и камень, широкие наличники, дощатые ставни
styles = ["chalet"]
trim = { sill = "sloped", casing = "wide", shutters = "board", canopy = "bracket" }
[spec.finish.chalet_wood_stone.materials]
main = { kind = "wood", colors = ["wood_honey", "wood_natural", "wood_dark"], extra = ["green"] }
plinth = { kind = "stone", colors = ["stone_grey", "stone_sand"] }
accent = { kind = "stone", colors = ["stone_grey", "stone_sand"] }
trim = { kind = "wood", colors = ["wood_dark", "brown", "white", "green"] }
roof = { kind = "metal_roof", colors = ["roof_steel"] }

[spec.finish.stone_house]          # камень стен, дощатые ставни
styles = ["classic", "chalet", "modern"]
trim = { sill = "sloped", casing = "flat", shutters = "louvered", canopy = "gable" }
[spec.finish.stone_house.materials]
main = { kind = "stone", colors = ["stone_grey", "stone_sand"], extra = ["graphite"] }
plinth = { kind = "concrete", colors = ["concrete", "graphite"] }
accent = { kind = "wood", colors = ["wood_natural", "wood_dark"] }
trim = { kind = "wood", colors = ["white", "wood_dark", "brown", "graphite"] }
roof = { kind = "tile_roof", colors = ["roof_terracotta"] }

[layout]             # шаг 4: обученный GPT (genfacade/models/layout.py)
# Чекпойнт genfacade train (model.pt). Файла нет — стаб (genfacade/models/stub.py).
# Скачать обученную модель: gh run download <run_id> -n train-<run_id> -D data/models/layout
checkpoint = "data/models/layout/model.pt"
attempts = 5         # раундов генерации, пока не наберётся best_of годных; ни одного — отказ
# Лучший из N (gf#213): годных ответов на дом, из них берётся самый правдоподобный —
# `metrics.realism.house_density` против домов [layout.reference]; недостающие до N ответы раунда
# сэмплируются одной пачкой. 1 — первый годный, раунд — одна попытка.
best_of = 1
# Брак только на одних стенах (gf#213): в следующем раунде досэмплировать первую бракованную
# стену — ответ до неё и стены после неё те же; false — весь дом заново.
wall_retry = false
seed = 0             # раунд k сэмплирует с seed + k: прогон повторяется
# 0,8 вместо 1,0 (gf#257, `docs/decisions.md` 03.11): годны все дома реального теста при каждом
# сиде, c2st — в пределах разброса; таблицы метрик до 03.11 посчитаны при 1,0.
temperature = 0.8
top_k = 0            # 0 — из всего словаря
device = "auto"      # auto | cuda | cpu
bf16 = true          # на GPU — в bfloat16, как при обучении; на процессоре не действует
# Запрет при генерации (genfacade/train/constraints.py): в глухом режиме — x и w окна, при которых
# оно заходит в запретную зону, на проём или за край стены (gf#132); в обоих режимах — токены,
# ломающие рамку x y w h элемента (gf#177).
constrain = true

[layout.reference]   # с чем сравнивается правдоподобие в «лучшем из N»: дома источника и части
# BuildingNet train, а не реальный тест: отбор по тем же домам, на которых меряют, завышает метрику
# (gf#213: c2st 0,596 при отборе по тесту против 0,682 по BuildingNet train). Дом с тем же именем,
# что план запроса, — не в счёт: иначе его стены находят в эталоне сами себя.
source = "buildingnet"
split = "train"
