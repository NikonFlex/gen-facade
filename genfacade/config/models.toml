[layout]             # шаг 4: обученный GPT (genfacade/models/layout.py)
# Чекпойнт genfacade train (model.pt). Файла нет — стаб (genfacade/models/stub.py).
# Скачать обученную модель: gh run download <run_id> -n train-<run_id> -D data/models/layout
checkpoint = "data/models/layout/model.pt"
attempts = 5         # раундов генерации, пока не наберётся best_of годных; ни одного — отказ
# Лучший из N (gf#213): годных ответов на дом, из них берётся самый правдоподобный —
# `metrics.realism.house_density` против домов [layout.reference]; недостающие до N ответы раунда
# сэмплируются одной пачкой. 1 — первый годный, раунд — одна попытка.
best_of = 1
# Брак только на одних стенах (gf#213): в следующем раунде досэмплировать первую бракованную
# стену — ответ до неё и стены после неё те же; false — весь дом заново.
wall_retry = false
seed = 0             # раунд k сэмплирует с seed + k: прогон повторяется
# 0,8 вместо 1,0 (gf#257, `docs/decisions.md` 03.11): годны все дома реального теста при каждом
# сиде, c2st — в пределах разброса; таблицы метрик до 03.11 посчитаны при 1,0.
temperature = 0.8
top_k = 0            # 0 — из всего словаря
device = "auto"      # auto | cuda | cpu
bf16 = true          # на GPU — в bfloat16, как при обучении; на процессоре не действует
# Запрет при генерации (genfacade/train/constraints.py): в глухом режиме — x и w окна, при которых
# оно заходит в запретную зону, на проём или за край стены (gf#132); в обоих режимах — токены,
# ломающие рамку x y w h элемента (gf#177).
constrain = true

[layout.reference]   # с чем сравнивается правдоподобие в «лучшем из N»: дома источника и части
# BuildingNet train, а не реальный тест: отбор по тем же домам, на которых меряют, завышает метрику
# (gf#213: c2st 0,596 при отборе по тесту против 0,682 по BuildingNet train). Дом с тем же именем,
# что план запроса, — не в счёт: иначе его стены находят в эталоне сами себя.
source = "buildingnet"
split = "train"
