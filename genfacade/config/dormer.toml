# Слуховые окна (дормеры, gf#457, genfacade/dormers.py): размеры лица, крыши и окна, имена в IFC.
# Модель шага 4 дормеров не ставит и не видит: их строит код по `HouseSpec.dormers`.
#
# Источники [проверено, gf#457]: Midlothian Dormer Extensions SPG — лицо одиночного дормера до 2 м,
# все дормеры до 35 % ширины ската, стенка шире рамы окна до 300 мм с каждой стороны, крыша дормера
# ниже конька, между ними по возможности не меньше 500 мм; Planning Portal (loft conversion) —
# от карниза по возможности не ближе 20 см; Fine Homebuilding «Designing shed dormers» — крыша
# шед-дормера не положе 4:12 (18,4°) и положе основной крыши.

face_offset_m = 0.3        # лицо — в плоскости, параллельной карнизной стене, на столько внутрь от неё
face_top_m = 1.2           # верх лица — на столько выше карниза
min_pitch_deg = 25.0       # на скате положе дормер не ставится: ниже лица и крыши дормера не уместить
below_ridge_m = 0.1        # вершина крыши дормера не выше конька дома минус это
gable_pitch_deg = 45.0     # скаты двускатной крыши дормера
shed_pitch_deg = 18.4      # односкатная крыша: 4:12
window_side_m = 0.3        # окно уже лица на столько с каждой стороны (щёчка шире рамы не более 300 мм)
window_sill_m = 0.1        # низ окна — выше кровли у лица на столько
window_head_m = 0.1        # верх окна — ниже верха лица на столько
window_min_h_m = 0.4       # окно ниже не ставится: дормер не строится

[names]                    # имена объектов IFC; {n} — номер дормера с единицы
face = "Стена дормера {n}"
cheek = "Щёчка дормера {n}"
