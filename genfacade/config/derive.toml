# Выводимые элементы проёма (gf#212, `facade: Состав фасада по уровням`; genfacade/derive.py).
# Модель шага 4 ставит у проёма только признак — подоконник, наличник, ставни, козырёк; прямоугольник
# считает код. Вид элемента — параметр дома (шаг 1), один на все стены; размеры вида — здесь,
# по своду правил фасада config/guidelines.toml (gf#209). Числа — метры.

[sill]
# Под окном, шире окна на свес с каждой стороны (sill_under_window); верх — низ окна.
flat = { overhang_m = 0.05, height_m = 0.06 }
sloped = { overhang_m = 0.08, height_m = 0.1 }

[casing]
# Ширина доски наличника по бокам и сверху окна (window_trim_width: 4 или 6 дюймов).
flat = 0.10
wide = 0.15

[shutters]
# Пара створок по бокам окна вплотную к раме, а при наличнике — к наличнику; высота — окна, ширина
# створки — доля ширины окна (shutter_width_us: «1/2 sash width», 0,45–0,55). Окну, которому
# с ними тесно (угол стены, соседний проём или его ставни), ставен нет.
share = 0.5

[canopy]
# Над дверью: шире двери на свес с каждой стороны (pad_m), от верха двери — зазор (gap_m), высота
# на фасаде — height_m (canopy_min_size_us: не уже 0,91 м). Под карнизом места меньше — козырёк
# ниже, но не ниже min_h_m; иначе его нет.
min_h_m = 0.1
flat = { pad_m = 0.2, gap_m = 0.05, height_m = 0.1 }
gable = { pad_m = 0.25, gap_m = 0.05, height_m = 0.4 }
bracket = { pad_m = 0.2, gap_m = 0.05, height_m = 0.25 }
