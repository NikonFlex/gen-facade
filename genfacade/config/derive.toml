# Выводимые элементы проёма (gf#212, `facade: Состав фасада по уровням`; genfacade/derive.py).
# Модель шага 4 ставит у проёма только признак — подоконник, наличник, ставни, козырёк; прямоугольник
# считает код. Вид элемента — параметр дома (шаг 1), один на все стены; он НЕ токен условия модели
# (gf#318: модель видит только «элемент есть / нет»), поэтому новый вид — это запись ниже, без
# переобучения. Запись: `shape` — рисунок на листе и форма в 3D (набор форм — enum в schema.py,
# новая форма — код в render/svg.py и house3d_relief.js), остальное — размеры в метрах. Вид «none»
# (элемента нет) в записях не нужен. Размеры по своду правил config/guidelines.toml (gf#209);
# [допущение] — источников с размерами нет, число взято как правдоподобное (docs/library-catalog.md,
# раздел «Выводимые элементы и двери», там же источник каждого вида).

canopy_min_h_m = 0.1  # козырёк под карнизом ниже полной высоты, но не ниже этого; иначе его нет

[sill.flat]
# Под окном, шире окна на свес с каждой стороны (sill_under_window); верх — низ окна.
shape = "shelf"
overhang_m = 0.05
height_m = 0.06
[sill.sloped]
shape = "wedge"
overhang_m = 0.08
height_m = 0.1
[sill.drip]    # металлический отлив: тонкий, с уклоном [допущение]
shape = "wedge"
overhang_m = 0.04
height_m = 0.04
[sill.stone]   # каменная плита: толще и шире полки [допущение]
shape = "shelf"
overhang_m = 0.07
height_m = 0.09

[casing.flat]
# Ширина доски наличника по бокам и сверху окна (window_trim_width: 4 или 6 дюймов); rise_m —
# сандрик над рамкой, прямоугольник элемента выше окна на ширину доски и сандрик.
shape = "frame"
width_m = 0.10
[casing.wide]
shape = "frame"
width_m = 0.15
[casing.pediment]   # треугольный сандрик: выступ фронтона не более 6 дюймов (0,15 м) [допущение]
shape = "pediment"
width_m = 0.10
rise_m = 0.15
[casing.segment]    # сегментный сандрик: дуга ниже треугольного [допущение]
shape = "segment"
width_m = 0.10
rise_m = 0.10

[shutters.panel]
# Пара створок по бокам окна вплотную к раме, а при наличнике — к наличнику; высота — окна, ширина
# створки — доля ширины окна (shutter_width_us: «1/2 sash width», 0,45–0,55) и у всех видов одна:
# вид меняет рисунок, а не прямоугольник (Architectural Depot: у всех видов ширина 9–36 дюймов).
# Окну, которому с ними тесно (угол стены, соседний проём или его ставни), ставен нет.
shape = "panel"
share = 0.5
[shutters.louvered]
shape = "louver"
share = 0.5
[shutters.board]
shape = "board"
share = 0.5
[shutters.board_batten_z]   # доски на двух планках с диагональю
shape = "batten_z"
share = 0.5

[canopy.flat]
# Над дверью: шире двери на свес с каждой стороны (pad_m), от верха двери — зазор (gap_m), высота
# на фасаде — height_m (canopy_min_size_us: не уже 0,91 м). Под карнизом места меньше — козырёк
# ниже, но не ниже canopy_min_h_m; иначе его нет.
shape = "slab"
pad_m = 0.2
gap_m = 0.05
height_m = 0.1
[canopy.gable]
shape = "gable"
pad_m = 0.25
gap_m = 0.05
height_m = 0.4
[canopy.bracket]
shape = "bracket"
pad_m = 0.2
gap_m = 0.05
height_m = 0.25
[canopy.arched]    # свод дугой [допущение]
shape = "arched"
pad_m = 0.25
gap_m = 0.05
height_m = 0.3
[canopy.posts]
# Навес на столбах (portico): прямоугольник элемента — плита над дверью, как у остальных видов;
# столбы рисуются от плиты вниз до низа двери — в свесе по бокам двери, поэтому свес шире
# [допущение].
shape = "posts"
pad_m = 0.4
gap_m = 0.05
height_m = 0.15

[door.plain]
# Полотно двери: рисунок — вид дома, остекление (стекло, фрамуга) — решение модели (docs/decisions.md,
# gf#318). Размеры рисунка — доли полотна; ГОСТ 475-2016: от 1300 мм проём двупольный.
shape = "plain"
[door.panel6]      # шесть филёнок: 2 в ряду, 3 ряда (Colonial) [допущение: пропорций в источниках нет]
shape = "panels"
cols = 2
rows = 3
inset = 0.14
[door.double]      # двупольная: шов по центру, на каждом поле по три филёнки
shape = "double"
rows = 3
inset = 0.1
[door.sidelights]  # боковые стёкла по 12–14 дюймов (0,30–0,36 м) у двери 0,9–1,0 м → доля проёма
shape = "sidelights"
side_share = 0.2
