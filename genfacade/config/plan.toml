# Препроцессор плана (спека plan-input, шаг 2). Пороги — в пикселях SVG GenPlan
# (холст 512–1024 px, вход 90–120 px на примерах).

[gaps]
min_opening_px = 20       # разрыв короче — шов векторизации, а не проём: стены сливаются
min_band_overlap = 0.5    # доля толщины, на которую должны перекрываться соосные стены

[outline]
jog_px = 4                # ступенька контура короче — шум толщины стен, выпрямляется
stray_area = 0.05         # отдельный кусок стен больше этой доли площади дома — план отклоняется
                          # («стены не связаны»); меньше — мусор векторизации, отбрасывается

[parts]                   # части дома разной высоты (gf#322)
ratio = 0.6               # крыло меньше этой доли площади главного — кандидат в нижнее
wing_min_m = 2.0          # крыло уже (меньшая сторона) — эркер или выступ, на высоте главной части
drop_floors = 1           # на сколько этажей нижнее крыло ниже главной, если текст молчит
# Крыша пристройки при генерации (gf#431): крыло ниже главного на его общей стене — односкатная
# низом от главного; уклон — медиана пристроек настоящих домов (3/12)
annex_shed = true
annex_pitch_deg = 14.0
# Щипец над входом, когда текст его назвал (gf#455): ширина и уклон — середины диапазонов синтетики
# (config/synthetic.toml, [spec.composite]: доля участка 0,3–0,45, уклон 42–53°), дальше — решение агента
entrance_gable_share = 0.375
entrance_gable_pitch_deg = 47.0
entrance_gable_min_m = 3.0
