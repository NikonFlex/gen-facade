# Препроцессор плана (specs/plan-input.md, шаг 2). Пороги — в пикселях SVG GenPlan
# (холст 512–1024 px, вход 90–120 px на примерах).

[gaps]
min_opening_px = 20       # разрыв короче — шов векторизации, а не проём: стены сливаются
min_band_overlap = 0.5    # доля толщины, на которую должны перекрываться соосные стены

[outline]
jog_px = 4                # ступенька контура короче — шум толщины стен, выпрямляется
stray_area = 0.05         # отдельный кусок стен больше этой доли площади дома — план отклоняется
                          # («стены не связаны»); меньше — мусор векторизации, отбрасывается
