<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14171c">
  <title>GenFacade · смотрелка</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0a35b'/%3E%3Cpath d='M7 15 16 8l9 7M9 14v10h14V14' fill='none' stroke='%2314171c' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar"></header>

  <main class="main">
    <section class="home" id="houses" hidden aria-labelledby="houses-title">
      <div class="page">
        <div class="page-head">
          <h1 id="houses-title">Дома</h1><span class="count" id="runs-count"></span>
          <label class="end search">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3" stroke-linecap="round"/></svg>
            <span class="visually-hidden">Поиск по домам</span>
            <input class="input" id="runs-search" type="search" autocomplete="off" placeholder="Имя, описание, материал…">
          </label>
        </div>
        <div class="filters" id="runs-filters" role="group" aria-label="Фильтры"></div>
        <ul class="cards" id="runs" aria-live="polite"></ul>
      </div>
    </section>

    <section class="home" id="new" hidden aria-labelledby="new-title">
      <div class="page">
        <div class="page-head">
          <h1 id="new-title">Новый дом</h1>
          <span class="count">SVG-план GenPlan и описание → фасады, все шаги конвейера</span>
        </div>
        <form class="plan-form" id="plan-form" inert>
          <div class="plan-thumb" id="plan-thumb"></div>
          <div class="plan-fields">
            <div class="plan-row">
              <select class="select" id="plan-select" aria-label="План"></select>
              <label class="btn" title="Свой SVG-план в формате GenPlan">
                <input type="file" accept=".svg,image/svg+xml" id="plan-file" hidden><span>Свой SVG</span>
              </label>
            </div>
            <textarea class="textarea" id="plan-text" rows="3" spellcheck="false" aria-label="Описание дома"
              placeholder="A simple one-storey house with a flat roof."></textarea>
            <div class="plan-row">
              <div class="segmented" id="mode-group" role="radiogroup" aria-label="Режим"></div>
              <button class="btn primary" id="plan-go" type="submit"></button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <section class="home" id="datasets" hidden>
      <div class="page" id="samples"></div>
    </section>

    <section class="run" id="run" hidden>
      <div class="run-head">
        <button class="btn ghost" id="back-btn" title="Назад к списку (Esc)"></button>
        <h1 id="run-title"></h1>
        <div class="chips" id="run-chips"></div>
        <div class="run-actions" id="run-actions"></div>
      </div>
      <nav class="stepper" id="stepper" aria-label="Шаги конвейера"></nav>
      <section class="stage" id="stage"></section>
    </section>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
