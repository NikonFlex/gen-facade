[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "genfacade"
version = "0.0.1"
description = "Генерация векторных чертежей фасадов по плану дома и текстовому описанию"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13", "shapely>=2.1"]

[project.scripts]
genfacade = "genfacade.cli:main"

[project.optional-dependencies]
# pyyaml — для tools/spec_check.py, он проверяет входящие и в пакет не входит
dev = ["pytest", "pytest-testmon>=2.2", "ruff", "pyyaml>=6", "httpx2", "genfacade[viewer]"]
# смотрелка прогонов: genfacade serve
viewer = ["fastapi>=0.142", "uvicorn>=0.54"]
# обучение — отдельно, чтобы CI и смотрелка не тянули torch
train = ["torch"]

[tool.setuptools.packages.find]
include = ["genfacade*"]

[tool.setuptools.package-data]
# настройки по умолчанию — внутри пакета, чтобы работали и при обычной установке
"genfacade.config" = ["*.toml", "*.css"]
"genfacade.viewer" = ["static/*"]
"genfacade.models" = ["stub_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# общие данные тестов — tests/simple_house.py
pythonpath = ["tests"]
