<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1400 710" width="2800" height="1420" role="img"
           aria-label="Пайплайн от текста до 3D-модели: полоса Егора — GenPlan от текста до плана и 3D-конвертер; полоса Никона — фасадный модуль от разбора описания и плана до листа фасадов; полоса коллег — планы многоквартирных домов; 3D-модель делается вместе">
        <rect x="0" y="50" width="1400" height="710" fill="#FFFFFF"/><defs><style>
  .lane-egor { fill: #E1F1ED; }
  .lane-mine { fill: #EAEFFB; }
  .lane-other { fill: #E8ECF0; }
  .box { fill: #FFFFFF; stroke: #C7CFD8; stroke-width: 1.2; }
  .box-egor { fill: #FFFFFF; stroke: #0E7C6B; stroke-width: 1.4; }
  .box-mine { fill: #FFFFFF; stroke: #2952C7; stroke-width: 1.4; }
  .box-key { fill: #FFFFFF; stroke: #2952C7; stroke-width: 2.4; }
  .box-model { fill: #FFFFFF; stroke: #C2552C; stroke-width: 2; }
  .box-joint { fill: #FFFFFF; stroke: #16202B; stroke-width: 1.6; stroke-dasharray: 6 4; }
  .box-later { fill: none; stroke: #5B6875; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .lane-t { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; }
  .lt-egor { fill: #0E7C6B; }
  .lt-mine { fill: #2952C7; }
  .lt-other { fill: #5B6875; }
  .t { font-family: "Golos Text", system-ui, sans-serif; font-size: 14.5px; font-weight: 600; fill: #16202B; }
  .s { font-family: "Golos Text", system-ui, sans-serif; font-size: 12px; fill: #5B6875; }
  .m { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; fill: #16202B; }
  .lbl { font-family: "Golos Text", system-ui, sans-serif; font-size: 11.5px; fill: #5B6875; }
  .lbl-acc { fill: #2952C7; }
  .lbl-mod { fill: #C2552C; }
  .lbl-ink { fill: #16202B; font-weight: 600; }
  .flow { fill: none; stroke: #5B6875; stroke-width: 1.4; }
  .flow-acc { fill: none; stroke: #2952C7; stroke-width: 2; }
  .flow-later { fill: none; stroke: #5B6875; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .halo { fill: none; stroke: #EAEFFB; stroke-width: 8; }
  .head { fill: #5B6875; }
  .head-acc { fill: #2952C7; }
  .fw { fill: #FFFFFF; stroke: #16202B; stroke-width: 1.2; }
  .fr { fill: #5B6875; fill-opacity: 0.35; stroke: #16202B; stroke-width: 1.2; }
  .fg { fill: #9DB6E8; }
  .fd { fill: #C2552C; fill-opacity: 0.75; }
  .eave { stroke: #2952C7; stroke-width: 1.2; stroke-dasharray: 3 3; }
  .ground { stroke: #16202B; stroke-width: 1.2; }
</style>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="head"/>
          </marker>
          <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="head-acc"/>
          </marker>
        </defs>

        <!-- полосы -->
        <rect class="lane-egor" x="190" y="70" width="1196" height="230" rx="8"/>
        <rect class="lane-mine" x="190" y="330" width="1196" height="310" rx="8"/>
        <rect class="lane-other" x="190" y="660" width="1196" height="84" rx="8"/>
        <text class="lane-t lt-egor" x="206" y="96">ЕГОР · GENPLAN</text>
        <text class="lane-t lt-mine" x="206" y="356">НИКОН · ФАСАДНЫЙ МОДУЛЬ</text>
        <text class="lane-t lt-other" x="206" y="706">КОЛЛЕГИ</text>

        <!-- общий вход -->
        <rect class="box" x="24" y="260" width="146" height="110" rx="6"/>
        <text class="t" x="38" y="286">Текст</text>
        <text class="m" x="38" y="310">«двухэтажный</text>
        <text class="m" x="38" y="328">коттедж, вальмовая</text>
        <text class="m" x="38" y="346">крыша, кирпич»</text>
        <polyline class="flow" points="170,290 184,290 184,170 202,170" marker-end="url(#ah)"/>
        <polyline class="flow" points="170,340 184,340 184,410 202,410" marker-end="url(#ah)"/>

        <!-- GenPlan -->
        <rect class="box-egor" x="206" y="120" width="160" height="100" rx="6"/>
        <text class="t" x="220" y="146">Растр плана</text>
        <text class="s" x="220" y="168">SDXL + white loss,</text>
        <text class="s" x="220" y="186">без дообучения</text>

        <rect class="box-egor" x="386" y="120" width="160" height="100" rx="6"/>
        <text class="t" x="400" y="146">Векторизация</text>
        <text class="s" x="400" y="168">стены по углам —</text>
        <text class="s" x="400" y="186">прямоугольниками</text>
        <line class="flow" x1="366" y1="170" x2="382" y2="170" marker-end="url(#ah)"/>

        <rect class="box-egor" x="566" y="120" width="170" height="100" rx="6"/>
        <text class="t" x="580" y="146">Окна и двери</text>
        <text class="s" x="580" y="168">разрывы в стенах</text>
        <text class="s" x="580" y="186">→ проёмы (правило)</text>
        <line class="flow" x1="546" y1="170" x2="562" y2="170" marker-end="url(#ah)"/>

        <rect class="box-egor" x="756" y="120" width="130" height="100" rx="6"/>
        <text class="t" x="770" y="146">SVG-план</text>
        <text class="s" x="770" y="168">один этаж,</text>
        <text class="s" x="770" y="186">в пикселях</text>
        <line class="flow" x1="736" y1="170" x2="752" y2="170" marker-end="url(#ah)"/>

        <rect class="box-egor" x="1000" y="120" width="180" height="100" rx="6"/>
        <text class="t" x="1014" y="146">3D-конвертер</text>
        <text class="s" x="1014" y="168">высоты стен и окон</text>
        <text class="s" x="1014" y="186">по тексту (BART)</text>
        <text class="s" x="1014" y="204">крыша двускатная</text>
        <line class="flow" x1="886" y1="170" x2="996" y2="170" marker-end="url(#ah)"/>
        <text class="lbl" x="943" y="161" text-anchor="middle">сейчас</text>

        <rect class="box-joint" x="1206" y="120" width="164" height="100" rx="6"/>
        <text class="t" x="1220" y="146">3D-модель</text>
        <text class="s" x="1220" y="168">BIM: IFC · OBJ · glTF</text>
        <text class="lbl lbl-ink" x="1220" y="204">делаем вместе</text>
        <line class="flow" x1="1180" y1="170" x2="1202" y2="170" marker-end="url(#ah)"/>

        <rect class="box-later" x="1206" y="240" width="164" height="44" rx="6"/>
        <text class="s" x="1220" y="267">рендеры из BIM · позже</text>
        <line class="flow-later" x1="1288" y1="220" x2="1288" y2="237" marker-end="url(#ah)"/>

        <!-- фасадный модуль: верхний ряд -->
        <rect class="box-mine" x="206" y="370" width="170" height="80" rx="6"/>
        <text class="t" x="220" y="396">Разбор описания</text>
        <text class="s" x="220" y="418">тип, этажи, высоты,</text>
        <text class="s" x="220" y="436">крыша, материалы</text>

        <rect class="box-key" x="406" y="370" width="200" height="80" rx="6"/>
        <text class="t" x="420" y="396" style="fill: #2952C7">Параметры дома</text>
        <text class="m" x="420" y="418">этажей 2 · 2.7 м</text>
        <text class="m" x="420" y="436">крыша вальмовая 30°</text>
        <line class="flow" x1="376" y1="410" x2="402" y2="410" marker-end="url(#ah)"/>

        <polyline class="flow-acc" points="606,410 1030,410 1030,495" marker-end="url(#ah-acc)"/>
        <text class="lbl lbl-acc" x="700" y="401">одни на все стороны</text>

        <rect class="box-later" x="1150" y="380" width="220" height="60" rx="6"/>
        <text class="s" x="1166" y="408">разрезы · позже</text>

        <!-- обучение и оценка -->
        <rect class="box-mine" x="206" y="490" width="480" height="130" rx="6"/>
        <text class="t" x="220" y="516">Обучение и оценка</text>
        <text class="lbl lbl-ink" x="220" y="540">данные</text>
        <text class="s" x="220" y="560">синтетика building_tools</text>
        <text class="s" x="220" y="578">CMP — многоквартирные</text>
        <text class="s" x="220" y="596">Solar Decathlon — тест</text>
        <text class="lbl lbl-ink" x="450" y="540">метрики</text>
        <text class="s" x="450" y="560">геометрия, структура</text>
        <text class="s" x="450" y="578">разнообразие, валидность SVG</text>
        <text class="s" x="450" y="596">согласованность с планом</text>
        <text class="s" x="450" y="614">и с описанием</text>

        <!-- фасадный модуль: нижний ряд -->
        <rect class="box-mine" x="721" y="500" width="200" height="120" rx="6"/>
        <text class="t" x="735" y="526">Препроцессор плана</text>
        <text class="s" x="735" y="548">стороны дома и проёмы</text>
        <text class="s" x="735" y="566">запретные зоны</text>
        <text class="s" x="735" y="590">глухой режим: заделать</text>
        <text class="s" x="735" y="608">разрывы, кроме входа</text>

        <!-- план сверху вниз, мостик над шиной параметров -->
        <line class="halo" x1="821" y1="400" x2="821" y2="420"/>
        <line class="flow" x1="821" y1="220" x2="821" y2="496" marker-end="url(#ah)"/>
        <text class="lbl" x="829" y="317">SVG-план</text>

        <rect class="box-model" x="945" y="500" width="170" height="120" rx="6"/>
        <text class="t" x="959" y="526">Генератор</text>
        <text class="s" x="959" y="548">элементы по сторонам</text>
        <text class="lbl lbl-mod" x="959" y="568">модель · пока правило</text>
        <text class="s" x="959" y="592">+ сетка этажей и осей</text>
        <text class="s" x="959" y="610">+ валидатор</text>
        <line class="flow" x1="921" y1="560" x2="941" y2="560" marker-end="url(#ah)"/>

        <rect class="box-mine" x="1140" y="500" width="230" height="120" rx="6"/>
        <text class="t" x="1154" y="524">Лист фасадов</text>
        <text class="m" x="1296" y="524">SVG+JSON</text>
        <line class="flow" x1="1115" y1="560" x2="1136" y2="560" marker-end="url(#ah)"/>
        <!-- мини-фасады: длинная и короткая сторона -->
        <polygon class="fr" points="1152,574 1260,574 1236,548 1176,548"/>
        <rect class="fw" x="1160" y="574" width="92" height="36"/>
        <rect class="fg" x="1168" y="579" width="7" height="8"/>
        <rect class="fg" x="1188" y="579" width="7" height="8"/>
        <rect class="fg" x="1216" y="579" width="7" height="8"/>
        <rect class="fg" x="1236" y="579" width="7" height="8"/>
        <rect class="fg" x="1168" y="597" width="7" height="8"/>
        <rect class="fd" x="1200" y="594" width="11" height="16"/>
        <rect class="fg" x="1236" y="597" width="7" height="8"/>
        <polygon class="fr" points="1268,574 1360,574 1314,548"/>
        <rect class="fw" x="1280" y="574" width="68" height="36"/>
        <rect class="fg" x="1292" y="579" width="7" height="8"/>
        <rect class="fg" x="1328" y="579" width="7" height="8"/>
        <rect class="fg" x="1292" y="597" width="7" height="8"/>
        <rect class="fg" x="1328" y="597" width="7" height="8"/>
        <line class="eave" x1="1148" y1="574" x2="1364" y2="574"/>
        <line class="eave" x1="1148" y1="592" x2="1364" y2="592"/>
        <line class="ground" x1="1148" y1="610" x2="1364" y2="610"/>

        <!-- фасады в 3D -->
        <polyline class="flow-later" points="1150,500 1150,482 1127,482 1127,224" marker-end="url(#ah)"/>
        <text class="lbl" x="1119" y="318" text-anchor="end">позже: окна из фасадов</text>

        <!-- коллеги -->
        <rect class="box" x="701" y="672" width="240" height="58" rx="6"/>
        <text class="t" x="715" y="696">Планы многоквартирных</text>
        <text class="s" x="715" y="716">формат уточняется</text>
        <line class="flow" x1="821" y1="672" x2="821" y2="624" marker-end="url(#ah)"/>
      </svg>