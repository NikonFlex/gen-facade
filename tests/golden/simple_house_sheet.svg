<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32.0 16.0" width="320mm" height="160mm">
  <style>/* Оформление листа фасадов. Единицы — метры натуры (viewBox в метрах).
   Свой файл sheet.css в --config дописывается после этого и переопределяет его. */

svg { font-family: "Golos Text", "DejaVu Sans", sans-serif; font-size: 0.3px; }
.background { fill: #ffffff; }

.facade { stroke: #2b2b2b; stroke-width: 0.02px; stroke-linejoin: round; }
.facade [data-role] { stroke: none; }
.outline { fill: none; stroke-width: 0.04px; }
.facade [data-cls="window"] { stroke-width: 0.06px; }
.skylight { stroke-width: 0.06px; }
.mullion { stroke-width: 0.04px; }
/* окно не прямоугольником (gf#319): контур по виду, рамка — только для разбора */
.window-shape { stroke-width: 0.06px; }
/* Выводимые элементы (gf#212): рисунок вида поверх прямоугольника; у двускатного козырька и
   козырька на кронштейнах прямоугольник — только рамка разбора, его не видно */
.trim-line { stroke-width: 0.015px; }
.trim-frame { fill: none; stroke: none; }
.door-glass { stroke-width: 0.03px; }

.annotations { stroke: #2b2b2b; stroke-width: 0.015px; fill: #2b2b2b; }
.annotations text { stroke: none; }
.ground { stroke-width: 0.05px; }
.level-marker, .axis-bubble { fill: none; }
.level-text { font-size: 0.27px; }
.axis-line { stroke-dasharray: 0.15 0.1; }
.axis-text { text-anchor: middle; }
.title { font-size: 0.42px; text-anchor: middle; }

/* Трасса шага 1: образец стены и палитра дома (render/spec_svg.py) */
.spec-swatch { stroke: #2b2b2b; stroke-width: 0.02px; }
.spec-label { font-size: 0.27px; fill: #2b2b2b; }

/* Трасса шага 2: план после препроцессора (render/plan_svg.py) */
.plan-wall { fill: #9a9a9a; stroke: none; }
.plan-outline { fill: none; stroke: #2b2b2b; stroke-width: 0.04px; }
.plan-window { fill: #99ccff; }
.plan-door { fill: #b07a4a; }
.plan-entrance { fill: #3aa655; }
.plan-sealed { fill: #f2a33a; }
.plan-forbidden { stroke: #d33a2c; stroke-width: 0.12px; stroke-linecap: butt; }
.plan-label { font-size: 0.35px; text-anchor: middle; fill: #2b2b2b; }
.plan-legend { font-size: 0.2px; fill: #6a707a; }

/* Трасса шагов 4–5: запретные зоны и нарушения валидатора поверх листа */
.forbidden-zone { fill: #d33a2c; fill-opacity: 0.12; stroke: none; }
.violation { fill: none; stroke-width: 0.06px; stroke-dasharray: 0.15 0.08; }
.violation.error { stroke: #d33a2c; }
.violation.warning { stroke: #e8a33a; }
</style>
