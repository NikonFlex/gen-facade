  { side = 0, x = [435.0, 1977.0], y = [746.0, 930.0], kind = "shed", posts = 4, depth_m = 2.0 },
]
cut = ["east: ступени крыльца перед террасой (по центру), перила-ригели между столбами — не размечены",
       "все стороны: водосточные трубы по углам и лотки; сваи ниже цоколя — не размечены",
       "south/west/north: карнизная доска над окном (верхняя планка наличника) — в наличнике wide",
       "east: терраса 2 × 6 м — открытая, контур дома 6 × 6 м без неё; кровля террасы только в porch_roofs"]
