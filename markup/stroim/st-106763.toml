# Проект № 106763 на строим.дом.рф (одноэтажный дом из бруса 6×6 м с террасой 2×6 м под односкатной кровлей).
# https://строим.дом.рф/project/106763 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — восток (вход: дверь за террасой, щипец), стр. 1 — юг (2 окна, терраса справа), стр. 3 — запад
# (щипец, 1 окно), стр. 4 — север (1 окно, терраса слева). План — стр. 5: короб 6000 × 6000 мм (оси А–В × 1–3),
# терраса 2000 × 6000 по оси 3–4 справа. Подписи «7 000» на виде — длина кровли со свесами, а не стены.
# Порядок по часовой от входа: восток → юг → запад → север. Проверка: в виде с востока слева ось А (юг);
# с юга слева ось 1 (запад); с запада слева ось В (север); с севера слева ось 4 (восток, терраса слева на стр. 4).
# Масштаб у вида свой: восток 6 м = 1379 pt (оси А–В) → 229,8; юг 1455/6 = 242,5 (оси 1–3); запад 1357/6 = 226,2;
# север 1428/6 = 238,0. Сверка по высоте (конёк 4,615 ↔ −0,560): восток 5,175 м = 1190 pt → 230 pt/м — сходится;
# расхождение между видами до 7 % (виды в разных масштабах), у каждой стороны свой pt_per_unit.
# Отметки: ±0,000 — верх светлой полосы перекрытия над тёмным цоколем (y 1407 / 1385 / 1401 / 1373); цоколь
# до низа тёмной полосы ≈ 0,36 м (сваи ниже и до −0,56 не размечены). Карниз (низ стены у свеса) ≈ 3,0 м
# по основанию щипца на востоке/западе; на южном виде стена видна до 2,82 м (под фасадной доской).
id = "st-106763"
pdf = "106763/sheet.pdf"
roof = "двускатная, конёк вдоль 7 м (запад–восток), +4,615; пролёт 6 м, свесы 0,355 м у карнизных и 0,5 м у щипцов; на подписи 24°; терраса 2 м справа (восток) под односкатной кровлей 8° на 4 столбах"
roof_kind = "gable"
# tg = (4,615 − 3,05) / (3,0 + 0,355) = 0,466 = 25,0°; линия ската на виде восток: 24° по подписи — расхождение < 2°, беру 24
pitch_deg = 24.0
overhang_m = 0.355
gable_overhang_m = 0.5
overhang_by = "drawing"
roof_material = "shingle_roof"
unit = "m"
pt_per_unit = 236.0
# отделка: горизонтальный брус с выпусками на углах — log (по рисунку, подписи нет)
material = "log"
colors = { main = "#a19685", plinth = "#928174", roof = "#c9c9c9" }
plinth = 0.36
plinth_material = "wood"
floor_heights = [3.0]
gutters = true
trim = { sill = "flat", casing = "wide", door = "plain" }
