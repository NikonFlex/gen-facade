# Брусовый - 85 — ИП ВИНОКУРОВ Д. Н.; проект № 54553 на строим.дом.рф
# https://строим.дом.рф/project/54553 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — юг (вход, ось 1→4; слева запад), стр. 2 — север (ось 4→1), стр. 3 — восток (А→Д, слева юг),
# стр. 4 — запад (Д→А, слева север), стр. 5 — план; 1 pt = 1 px. План: 10,0 x 8,5 м наружные (оси 9830 и 8330 + 170 мм).
# Контур Т-образный: крылья 3 + 3 м глубиной 7,0 м и центральный объём 4,0 x 8,5 м, выступающий на юг на 1,5 м (план: 3,00/4,00/3,00, 7,00 + 1,50).
# Стороны по часовой от входа (дверь в западном крыле): юг-запад (стр.1, x 272–778), запад (стр.4, крыло 7 м), север (стр.2),
# восток (стр.3, крыло 7 м), юг-восток (стр.1, внутренний угол после неё), восток-центр (стр.3, 1,5 м), юг-центр (стр.1, 4 м),
# запад-центр (стр.4, 1,5 м, внутренний угол после неё). Невязка 0. Проверка порядка: слева у юга запад (Д на стр.4 — север слева у запада,
# у севера слева восток, у востока слева юг (А)).
# Масштаб: стр.1 стена 272–1960 = 1688 pt / 10,0 м = 168,8; стр.2 217–1905 = 1688 / 10,0 = 168,8; стр.3 559–1995 = 1437 / 8,5 = 169,0; стр.4 431–1865 = 1434 / 8,5 = 168,8.
# Сверка по отметкам: +5192 над ±0 = 873 pt (стр.1) / 5,192 = 168,2 — расхождение 0,4 %, один масштаб 168,8 на все виды.
# Пол ±0,000 — отметка «+0» на виде; низ бруса −150, низ фундамента −480: plinth = 0,48 (до низа цоколя, земля не подписана — не уверен).
# Карниз: стена на линии кровли у стены +2,85 м (линия щипца стр.1/2 на краю стены); нижний край свеса +2573, верх свеса +2791, конёк +5192.
id = "st-54553"
pdf = "54553/sheet.pdf"
roof = "двускатная, конёк с севера на юг (щипцы на юге и на севере), конёк +5192, нижний край свеса +2573 (верх +2791), свесы 0,8 м со всех сторон; кровля продолжена над террасой на 1,5 м по обе стороны центрального объёма"
roof_kind = "gable"
# tg = (5,192 − 2,791) / (5,0 + 0,8) = 0,414 = 22,5°; линия ската на стр.1: (433−160)/(1535−875) = 0,414 = 22,5° — сходятся
pitch_deg = 22.5
overhang_m = 0.8
gable_overhang_m = 0.8
overhang_by = "drawing"
unit = "m"
pt_per_unit = 168.8
# горизонтальный брус (рисунок бруса шагом ≈0,15 м), подписи отделки нет — по рисунку, не уверен: брус или имитация
material = "imitation_timber"
plinth = 0.48
plinth_material = "concrete"   # полоса ниже −150 на видах без рисунка — по умолчанию, не уверен
# фронтоны: диагональная («ёлочкой») обшивка досками — вторая отделка, вид по рисунку, не уверен
trim = { casing = "flat", door = "plain" }
floor_heights = [2.85]
cut = ["юг, запад: терраса 19 м² перед западным крылом (по плану 3,0 x 2,5 м) и перед восточным (3,0 x 2,5 м): настил, ступени, 4 столба на краю — на листе фасадов не нарисованы; скат кровли над ними (1,5 м свеса сверх 0,8) в виде не виден [не уверен: porch_roofs не писал]",
       "все стороны: угловые торцы бруса (выпуски) и пилястры бруса у выступа центрального объёма",
       "запад: тонкая вертикаль у края (x ≈ 2030) — край террасы"]
absent = ["все стороны: нет карнизной полосы, ставен, подоконников, козырьков, труб, мансардных и слуховых окон, водостока",
          "восток, запад, север: нет дверей"]

