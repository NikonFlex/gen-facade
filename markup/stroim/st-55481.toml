# Дом с двускатной крышей и фронтоном над входом — проект № 55481 на строим.дом.рф
# https://строим.дом.рф/project/55481 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 1–3 (западный торец), стр. 2 — Ф. Б–А (северная длинная), стр. 3 — Ф. А–Б
# (южная длинная, вход под фронтоном), стр. 4 — Ф. 3–1 (восточный торец); 1 pt = 1 px.
# Длинная стена ≈ 14,0 м, торец ≈ 9,0 м. Масштаб у вида свой: pt/м по размерам, подписанным красным
# на листе (окно 1800 мм по высоте = 223–274 pt по видам; сверка по ширине окон 800 и 1800 мм — в
# пределах 2 %). Отметки: +0,000 чистый пол, −0,150 низ кладки, −0,450 земля, +0,900 низ окон,
# +2,700 верх окон, +3,000 низ свеса, +5,740 конёк. «Пол» разметки — низ видимой кладки (−0,150);
# карниз у длинных стен — 3,0 м над +0,000, то есть 3,13 м над низом кладки.
# Крыша (gf#336): свес — по умолчанию ([spec.roof_shape], на листе не подписан).
