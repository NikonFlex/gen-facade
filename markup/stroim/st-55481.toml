# Дом с двускатной крышей и фронтоном над входом — проект № 55481 на строим.дом.рф
# https://строим.дом.рф/project/55481 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 1–3 (западный торец), стр. 2 — Ф. Б–А (северная длинная), стр. 3 — Ф. А–Б
# (южная длинная, вход под фронтоном), стр. 4 — Ф. 3–1 (восточный торец); 1 pt = 1 px.
# Длинная стена ≈ 14,0 м, торец ≈ 9,0 м. Масштаб у вида свой: pt/м по размерам, подписанным красным
# на листе (окно 1800 мм по высоте = 223–274 pt по видам; сверка по ширине окон 800 и 1800 мм — в
# пределах 2 %). Отметки: +0,000 чистый пол, −0,150 низ кладки, −0,450 земля, +0,900 низ окон,
# +2,700 верх окон, +3,000 низ свеса, +5,740 конёк. «Пол» разметки — низ видимой кладки (−0,150);
# карниз у длинных стен — 3,0 м над +0,000, то есть 3,13 м над низом кладки.
id = "st-55481"
pdf = "55481/sheet.pdf"
roof = "двускатная ≈25° (конёк +5,740, низ свеса +3,000), листовая; свесы, водосточные трубы; фронтон над входом"
roof_kind = "gable"
# кровля: в описании проекта — листовая; вид на чертеже не показан (линии без рисунка), поэтому profiled_sheet
# [не проверено: профнастил это, металлочерепица или фальц — по листу не различить]
roof_material = "profiled_sheet"
# труб нет: тонкие вентвыходы у конька на торцах (стр. 1, 4) — в cut; мансардных окон нет
# водосток: водосточные трубы по углам на Ф. стр. 2, 3 (тонкие, у осей)
gutters = true
pitch_deg = 25.0
# свес: карнизный — Ф. 1–3 (торец) стр. 1, 221 pt / 284,9 = 0,77 м; фронтонный — Ф. А–Б стр. 3, 211–262 pt / 301,4 = 0,7–0,87 м
overhang_m = 0.75
gable_overhang_m = 0.8
overhang_by = "drawing"
unit = "m"
pt_per_unit = 301.4
material = "brick"  # светлый облицовочный кирпич
plinth = 0.3  # −0,150…−0,450 под низом кладки
floor_heights = [3.13]
plinth_material = "concrete"
# обрамление (стр. 1–4): окна и дверь — чёрный контур без подоконника, наличника и ставен; входная дверь Дн1 —
# глухая с горизонтальными планками (стр. 3, 4); козырька нет, фронтон над входом — часть стены
trim = { door = "plain" }
absent = [
  "все стороны: нет карнизной полосы и поясов — только свес кровли",
  "все стороны: нет зон второй отделки — вся стена кирпичом",
]
cut = [
  "south: фронтон над входом и козырёк выше карниза; водосточные трубы, вентвыходы у конька",
  "east: пристроенный свес и желоб слева у угла",
  "south, east: окно в пол ОК3 (2,2 × 2,7 м, фрамуга сверху) размечено дверью с фрамугой",
]

