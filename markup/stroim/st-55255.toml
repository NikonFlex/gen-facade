# Дом по проекту №34 «Кулешовка», ООО «СК ГАРАНТ48» — проект № 55255 на строим.дом.рф
# https://строим.дом.рф/project/55255 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Фасад 1 (юг, вход; 11,95 м), стр. 2 — Фасад 2 (восток), стр. 3 — Фасад 3 (север),
# стр. 4 — Фасад 4 (запад), стр. 5 — план; 1 pt = 1 px. Порядок сторон определён по плану (проёмы стен
# совпадают с окнами видов: восток — 3-створчатая дверь-окно, запад — единственное окно спальни).
# План — Г-образный: крыло спален тянется на юг до y=1697 pt плана, основной корпус (кухня-гостиная,
# прихожая) кончается на y=1495; в нише — открытое крыльцо 9,27 м² на двух столбах. Стороны по часовой
# от входа: 0 юг ниши (вход, Ф. 1, правая часть), 1 восток крыла (1,29 м, участок Ф. 2), 2 юг крыла
# (Ф. 1, левая часть), 3 запад (Ф. 4), 4 север (Ф. 3), 5 восток (Ф. 2). После стороны 0 угол внутренний.
# Масштаб: на всех видах 149 pt/м — по отметкам ±0,000…+3,000 (426–448 pt на 3,0 м: 149,0 / 148,8 / 148,7 /
# 148,3 на Ф. 1–4), сверка по +5,533 (Ф. 1: 825 pt = 5,53 м, 149,1) и +1,900. Длины сторон по виду: юг ниши
# 5,19, восток крыла 1,29, юг крыла 6,75, запад 10,13, север 11,95, восток 8,85 м; контур замыкается
# (x: 11,95 / 11,94; y: 8,85 / 8,84). Сверка с планом (156,5 pt/м): окна юга и входа ложатся на проёмы плана
# в пределах 5 pt; ширина дома 1870 pt плана = 11,95 м.
# Уровни: ±0,000 — верх бетонного цоколя (низ кладки), земля −0,600, цоколь 0,6 м; низ свеса +3,000 —
# карниз стены; пояс «ёлочкой»-подзор на +1,900…+2,160, коричневый кирпич выше +2,160.
id = "st-55255"
pdf = "55255/sheet.pdf"
roof = "вальмовая, ≈22° (конёк +5,533 — торцевой, низ свеса +3,000), тёмная кровля с вертикальными рёбрами; свес 0,8 м со всех сторон, над крыльцом кровля продолжена"
roof_kind = "hip"
# pitch: tg = (5,533 − 3,000) / (половина пролёта 5,07 м + свес 0,8 м) = 0,431 -> 23,3°; по линии ската на видах
# (Ф. 2: 333 pt подъёма на 837 pt по горизонтали = 21,7°; Ф. 1: 333/818 = 22,2°) ≈ 22°; расходятся меньше 2°, беру по линии
pitch_deg = 22.0
overhang_m = 0.8
overhang_by = "drawing"
# кровля: рёбра вертикальные, без уступа — профнастил (по рисунку, не по подписи, не уверен: может быть металлочерепица)
roof_material = "profiled_sheet"
unit = "m"
pt_per_unit = 149.0
material = "brick"        # облицовочный кирпич «Слоновая кость» (подпись в легенде)
colors = { main = "#f8f4c6", plinth = "#898989", accent = "#56412f" }
plinth = 0.6              # бетон по легенде: от −0,600 до ±0,000
plinth_material = "concrete"
floor_heights = [3.0]
# обрамление: окна в тёмных рамах, подоконников/наличников/ставен нет; входная дверь — коричневая глухая в портале
trim = { door = "plain" }
absent = [
  "все стороны: нет карнизной полосы — только свес кровли; нет водостока, труб и мансардных окон",
  "все стороны: нет подоконников, наличников и ставен",
]
cut = [
  "все стороны: ряд кирпича «ёлочкой»/тычком +1,900…+2,160 под коричневым поясом — не размечен (тот же материал, что стена)",
  "юг: столбы крыльца (кирпич «Коричневый», 0,38 м) и ступени у входа, площадка 9,27 м² — на Ф. 1 столбов не нарисовано, на Ф. 2 и Ф. 4 видны у края (коричневая колонка и белая полоса рядом) — не размечены элементами",
  "восток и запад: белая вертикальная полоса у южного края (≈15 pt) — зазор у столба крыльца, не размечена",
  "юг: на листе нет бокового вида ниши — вынос крыльца 1,8 м взят с плана (y 1495…1775 pt при 156,5 pt/м)",
]
porch_roofs = [
  { side = 0, x = [1428.0, 2202.0], y = [651.0, 683.0], kind = "hip", posts = 2, depth_m = 1.8 },
]
roof_gaps = ["крыльцо в нише Г-образного плана: кровля дома продолжена над ним до столбов (свес 0,5 м за стену крыла)"]

