# Хвойный-4.1 (ИП Ликоренко М. А.); проект № 53922 на строим.дом.рф
# https://строим.дом.рф/project/53922 ; разметка gf#470 (волна 2), 1 этаж, вальмовая кровля, гараж 61,5 м² в доме.
# Листы: стр. 2 — юг (вход с крыльцом под щипцом, 3 окна, гаражные ворота), стр. 3 — запад (терраса 3 м), стр. 1 — север
# (дверь в гараж, 3 окна), стр. 4 — восток (2 окна гаража); план — стр. 5. 1 pt = 1 px.
# Порядок по часовой от входа: юг → запад → север → восток. Слева на юге терраса (запад), на западе слева север,
# на севере слева ось 5 (восток), на востоке слева крыльцо (юг) — порядок сходится.
# Размеры по осям (план): 19 150 × 9 450 мм. Масштаб каждого вида свой: юг 2450 pt / 19,15 = 127,9; север 2391/19,15 = 124,9;
# запад 1918 / 9,45 = 203,0; восток 2126 / 9,45 = 225,0. Сверка по отметкам: юг окно +0,85…+2,35 = 185 pt / 1,5 м = 123,3 (≈3,6 %,
# цифры отметок округлены) и конёк +6,147: 6,15 м · 127,9 = 787 pt, на виде 6,15 м по y — сходится; восток +1,60…+2,35: 175 pt / 0,75 = 233 (3,6 %).
# Отметки: ±0,000 — верх настила/порога (стр. 2 y 945), цоколь до земли −0,55; карниз (низ свеса) +2,9 по чертежу: (765−460)/103,6 px/м.
id = "st-53922"
pdf = "53922/sheet.pdf"
roof = "вальмовая, конёк +6,147, свес ≈0,7 м, уклон по линии ската на западном виде; кровля — рисунок «кирпичной» чешуи"
roof_kind = "hip"
# западный вид: от свеса (a3: x 193, y 825 px) к коньку (1165, 263): tg = 562/972 = 0,578 = 30,0°;
# расчёт: (6,147 − 2,99) / (4,725 + 0,7) = 0,582 = 30,2° — сходятся
pitch_deg = 30.0
overhang_m = 0.7
overhang_by = "drawing"
roof_material = "shingle_roof"  # рисунок рядов-«кирпичиков» без подписи — по рисунку, не уверен
unit = "m"
pt_per_unit = 127.9
material = "plaster"  # гладкая светлая стена без рисунка и подписи — по рисунку, не уверен
colors = { main = "#a7a4a5", plinth = "#c9c9c9" }
plinth = 0.55
plinth_material = "plaster"
floor_heights = [2.9]
trim = { door = "plain" }
# крыльцо у двери (юг): щипец на двух столбах, глубина по плану ≈1,4 м; терраса 3 × 9,3 м на западе под продолжением кровли дома,
# 6 столбов, ограждение; выступ террасы стороной запад не размечен отдельным контуром — принят вровень со стеной [не проверено]
porch_roofs = [
  { side = 0, x = [1518.8, 2160.9], y = [376.6, 565.5], kind = "gable", posts = 2, depth_m = 1.4 },
  { side = 1, x = [378.1, 2296.0], y = [934.0, 1095.2], kind = "hip", posts = 6, depth_m = 3.0 },
]
roof_gaps = ["терраса 3 м у западной стены: низкая кровля со своим уклоном (≈13° на южном виде) — не строится отдельно"]
cut = ["south: ступени крыльца, перила крыльца, затемнённые пилястры вокруг двери — не размечены",
       "south: гаражные ворота уходят ниже ±0,000 до −0,55 — рамка обрезана по полу",
       "west: ограждение террасы (балясины), ступени у двери террасы — не размечены; стена за террасой не отличается",
       "north: терраса справа (запад) с ограждением и ступенями — не размечена",
       "east: боковой вид крыльца слева — не размечен; затемнение углов под свесом — тень"]
absent = ["все стороны: нет карнизной полосы, наличников, ставен, подоконников",
          "все стороны: нет зон второй отделки",
          "все стороны: нет труб, мансардных окон, слуховых окон, водостока",
          "west: нет дверей кроме остекления террасы"]

