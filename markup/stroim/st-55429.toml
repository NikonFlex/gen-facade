# «Глэмп-45» — ООО «ПОКА НЕТ ДОМА»; проект № 55429 на строим.дом.рф
# https://строим.дом.рф/project/55429 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 1 — длинный фасад с террасой (вход, «восток»), стр. 3 — торец с окном 1500x600 («юг»),
# стр. 4 — длинный фасад глухой с одним окном («запад»), стр. 2 — торец с окном 600x600 («север»);
# план — стр. 5. «Север» на плане условно вверху: терраса справа — вход справа, обход по часовой:
# вход (стр. 1) → низ плана (стр. 3) → слева (стр. 4) → верх (стр. 2). Проверка: у вида стр. 1 слева
# низ плана — окно 1500x600 южной стены и окно 600x600 санузла на северной видны на своих торцах.
# План: 5,000 x 8,500 м (размеры 1050+600+850+2500 и 1850+1500+2650+2500), стены 240 мм.
# Масштаб — по отметкам: стр. 1 лидеры +1,300 → −0,200 → −0,650 = 582 → 881 → 971 pt = 200 pt/м
# (стена 8,5 м = 1700 pt, сходится); стр. 2–4 вид уже другого масштаба: +2,846…−0,200 = 662 pt / 3,05 м
# = 217 pt/м; стены стр. 4 (1840 pt / 8,5 м = 216,5) и торцов (1100 pt / 5,0 м) сведены с планом.
# Чистый пол ±0,000 — верх террасы: −0,200 (низ обшивки) — лидер на 881 pt, значит ±0,000 на 841 pt;
# земля −0,650 (дом на винтовых сваях: под полом решётчатая обшивка). Карниз стены +2,25…2,35 м.
id = "st-55429"
pdf = "55429/sheet.pdf"
roof = "двускатная, конёк вдоль 8,5 м +2,846; карниз (низ кровли у стены) ≈ +2,30; кровля вертикальным фальцем тёмная; свесов почти нет"
roof_kind = "gable"
# tg = (2,846 − 2,30) / (2,5 + 0,05) = 0,214 = 12,1°; линия ската на торце стр. 2: (345−224)/(872−320) = 0,219 = 12,4°,
# стр. 3: 11,7° — сходятся; берём 12,0
pitch_deg = 12.0
overhang_m = 0.05
gable_overhang_m = 0.05
overhang_by = "default"   # свесов на листе нет: кромка кровли вровень со стеной
# кровля: тёмные вертикальные полосы с фальцем — по рисунку, не уверен
roof_material = "metal_roof"
gutters = true            # водосточные трубы на стр. 1, 4 (светлая вертикаль у угла)
unit = "m"
pt_per_unit = 217.0
plinth = 0.65             # земля −0,650 до чистого пола; сваи с горизонтальной обшивкой
floor_heights = [2.3]
material = "board_batten" # тёмная вертикальная доска, подписи нет — по рисунку
colors = { main = "#2d2c2c", plinth = "#373737", accent = "#b29772" }
plinth_material = "wood"  # горизонтальные рейки под полом — по рисунку, не уверен
trim = { sill = "flat", casing = "flat", door = "plain" }
absent = [
  "все стороны: нет карнизной полосы, ставен, козырьков, труб, мансардных и слуховых окон",
  "west: дверей нет — глухая стена с одним окном",
]
cut = [
  "все стороны: светлые вертикальные рейки над и под окнами размечены зонами акцента (по цвету, не уверен, что другой материал — wood)",
  "east: терраса 2,5 x 3,3 м внутри контура под основной кровлей (на листе дверь отнесена вглубь), отдельной крыши нет — porch_roofs не пишу",
  "east, west: светлая вертикальная труба у угла и светильники на стенах; тонкая полоса под карнизом",
  "east: ступени крыльца у террасы",
]

