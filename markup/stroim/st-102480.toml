# Одноэтажный дом, двускатная крыша, штукатурка — проект № 102480 на строим.дом.рф
# https://строим.дом.рф/project/102480 ; разметка gf#470 (волна 2).
# Листы: стр. 3 — юг (вход, дверь, 2 окна, деревянная вставка), стр. 4 — запад (окно 2 створки + малое;
# слева терраса 2 севера), стр. 2 — север (2 окна в пол к террасе 2), стр. 1 — восток (малое окно слева + большое); стр. 5 — план.
# Порядок по часовой от входа: юг, запад, север, восток. Проверка по левому краю вида: юг — слева запад (окно
# 1,6–3,0 м от запада и на плане, и на виде), запад — слева север (терраса 2), север — слева восток, восток — слева юг (малое окно 3,1 м от юга).
# Контур по наружным граням: 9,92 × 12,64 м (оси 1–7 на плане 9 920 мм = 558 pt, глубина 711 pt при том же масштабе).
# Отметок уровней и размеров на фасадах нет; масштаб вида = ширина стены в pt / длина стены с плана:
# юг 1648/9,92 = 166,1; север 1679/9,92 = 169,2; восток 2150/12,64 = 170,1; запад 2134/12,64 = 168,8 (разброс 2 % — своё у вида).
# Сверка по окнам: юг 513–755 от угла 232 = 1,7 м от запада; план 1,6 м — сходится.
# floor — низ двери на крыльце (юг) и низ окон в пол (север); цоколь 0,4 м — тёмная полоса 0,2 м низа стены + 0,2 м штукатурки.
# Уровней нет: plinth 0,4 и высота этажа 3,0 м — по масштабу [не проверено].
id = "st-102480"
pdf = "102480/sheet.pdf"
roof = "двускатная, конёк север–юг, ≈20°, свес карнизный 1,0 м и фронтонный 1,2 м, кровля волнистая (чешуя), две тонкие трубы на восточном скате"
roof_kind = "gable"
roof_material = "tile_roof"  # по рисунку (ряды волн), подписи нет — не уверен
# tg по линии ската на виде: верх (1056,108)→(64,470) = 0,365 = 20,1°; по нижней кромке фронтона (212,477)–(1052,160) = 0,377 = 20,7°; отметок нет
pitch_deg = 20.0
overhang_m = 1.0
gable_overhang_m = 1.2
overhang_by = "drawing"
unit = "m"
pt_per_unit = 169.0
material = "plaster"  # гладкая светлая стена, подписи нет — по рисунку
colors = { main = "#90a4bb", plinth = "#6f7f91", accent = "#94865c", roof = "#b2a57d" }
plinth = 0.4
plinth_material = "concrete"  # тёмная полоса низа стены, по цвету, не уверен
floor_heights = [3.0]
gutters = true
trim = { door = "plain" }
# трубы на восточном скате (на видах севера и юга смещены в сторону востока от конька); x — на виде востока (стр. 1);
# тонкие (0,25 м) — могут быть вентвыходами
chimneys = [
  { side = 3, x = 911.0 },
  { side = 3, x = 1004.0 },
]
absent = ["все стороны: нет карнизной полосы и поясов",
          "все стороны: нет ставен, наличников и подоконников",
          "все стороны: нет мансардных и слуховых окон"]
cut = ["юг: вторая отделка — только деревянная вставка слева от двери; ступень крыльца под дверью — площадкой",
       "север: терраса 2 — настил по низу стены, перил и ступеней на виде нет",
       "все стороны: водосточные трубы по углам",
       "север: окна в пол с дверной створкой (ручка), размечены как окно panoramic — см. сомнения"]

