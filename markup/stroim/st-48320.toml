# «Боковой вход слева Фатима» — ИП Михайленко С. М.; проект № 48320 на строим.дом.рф
# https://строим.дом.рф/project/48320 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 3 — оси 1–2 (юг, вход), стр. 2 — Б–А (запад), стр. 1 — 2–1 (север), стр. 4 — А–Б (восток);
# план 1-го этажа — стр. 6 (ось А снизу = юг, 1 слева = запад); 1 pt = 1 px.
# Порядок сторон: юг (вход с панельной дверью в холл), запад, север, восток; слева на виде предыдущей — следующая по часовой.
# Прямоугольник по стенам 9,17 × 6,17 м (оси 9000 × 6000 + по 85 мм; плана: 9 170 и 6 170).
# Масштаб у каждого вида свой, pt/м = ширина стены в pt / длина стены: юг 1216/9,17 = 132,6 (оси 1191/9,0 = 132,3);
# запад 798/6,17 = 129,3 (оси 774/6,0 = 129,0); север 1171/9,17 = 127,7 (оси 1149/9,0); восток 788/6,17 = 127,7 (оси 767/6,0).
# Сверка по уровням: юг 0,000 → 4,135 = 550 pt (133,0); запад 537 pt (129,9). Расхождение < 3 %.
# Пол — отметка ±0,000, цоколь −0,355 (низ тёмной полосы кирпичного рисунка).
# Мансарда (2-й этаж): стена выше нуля до карниза +4,135, окна 2-го этажа — во фронтонах (3,465–4,965);
# высоты этажей: 1-й 2,71 (карточка), мансардный до карниза 1,425.
id = "st-48320"
pdf = "48320/sheet.pdf"
roof = "двускатная, конёк вдоль длинной оси, +7,044; уклон ≈35° по линии ската на Ф. Б–А (кончик свеса +4,49, конёк +7,044, пролёт 3,085+0,55); расчёт от отметки +4,135 (низ подшивки) дал бы ≈39°; фальцевая кровля тёмная"
roof_kind = "gable"
roof_material = "metal_roof"  # вертикальные полосы с фальцем, гладкие
# труб, мансардных окон и водостока на листе нет
pitch_deg = 35.0
# свес: карнизный — Ф. Б–А, кончик на 71 pt за стеной / 129 pt/м = 0,55 м; щипцовый — Ф. 2–1, 66–69 pt / 127,7 = 0,5 м
overhang_m = 0.55
gable_overhang_m = 0.5
overhang_by = "drawing"
unit = "m"
pt_per_unit = 132.6
material = "board_batten_narrow"  # тёплая вертикальная обшивка, по рисунку (подписи нет), не уверен
colors = { main = "#cabd9e", plinth = "#46484e", roof = "#2f373a" }
plinth = 0.355
floor_heights = [2.71, 1.425]
plinth_material = "brick"  # тёмная полоса с рисунком кладки, по рисунку
# обрамление: окна в белой коробке с плоским подоконником без наличников и ставен; входная дверь — панельная
trim = { sill = "flat", door = "panel6" }
absent = [
  "все стороны: нет карнизной полосы — только подшивка свеса",
  "все стороны: нет зон второй отделки — вся стена одной обшивкой",
  "все стороны: нет труб, мансардных окон, слуховых, водостока, крыльца",
]
cut = [
  "west, east: небольшие кронштейны у карниза и вентблок на коньке фронтона",
  "south: ступеньки и площадка у входной двери на листе не показаны",
  "east: вторая дверь (стекло) — боковой вход из кухни-гостиной",
]

