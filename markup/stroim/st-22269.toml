# Двухэтажный кирпичный дом с навесом (carport) — проект № 22269 на строим.дом.рф (12,5 × 8,4 м по стенам, конёк вдоль длинной стороны)
# https://строим.дом.рф/project/22269 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — восток (вход: дверь с боковой фрамугой и деревянная панель, навес справа), стр. 2 — юг (угловое и
# панорамное окна, два мансардных), стр. 1 — запад (щипец, два окна-пентагона, навес слева), стр. 3 — север (навес слева,
# 3 мансардных окна); 1 pt = 1 px. План — plan1-0 (1 этаж) и plan0-0 (2 этаж): оси Г–А 11 700 мм, 1–5 7 600 мм,
# стены наружу от осей на 0,4 м (по плану, 55 px при 135 px/м) -> 12,5 × 8,4 м. Вход — крыльцо в нише восточной стены (план,
# ось А между 3 и 5); порядок по часовой от входа: восток, юг, запад, север. Сверка: на востоке слева юг (окно спальни
# у оси 1), на юге слева запад (угловое окно гостиной), на западе слева север (навес), на севере слева восток (навес у А).
# Масштаб — по ширине стены: восток 1020 pt / 8,4 = 121,4; юг 1530 / 12,5 = 122,4; запад 1019 / 8,4 = 121,3; север 1532 / 12,5 = 122,6.
# На листе нет ни отметок уровней, ни высотных размеров: сверка по окнам с плана (юг: окно спальни 1430–1678 = 2,03 м, на плане
# 2,1 м; восток: окно спальни 405–650 = 2,0 м, на плане 1,8–1,9 м) — расхождение до 10 %, масштаб держится на длине стен.
# Пол первого этажа — низ рам окон/дверей: восток 1245, юг 1265, запад 1228, север 1262 (низ кладки совпадает, цоколя на видах нет).
# Контур: 12,5 × 8,4 м, невязки нет.
id = "st-22269"
pdf = "22269/sheet.pdf"
roof = "двускатная, конёк вдоль длинной стороны (запад–восток), чёрная кровля, свес по длинным стенам ≈0,55 м, по щипцовым нет; водосток с трубами; навес на 3 столбах у северной стены (плоская кровля, +2,875)"
roof_kind = "gable"
# pitch: отметок на листе нет; по линии ската на щипце (стр. 4): (550 − 143) / (1210 − 700) = 0,798 -> 38,6°; (стр. 1) (555 − 148) / (1105 − 595) = 0,798 — сходятся
pitch_deg = 38.6
# свес: карнизный — кончик карниза на щипце (стр. 4) x 122 при стене 190 = 68 pt / 121,4 = 0,56 м; (стр. 1) 63 pt = 0,52 м; щипцовый — кромка кровли вровень со стеной
overhang_m = 0.55
gable_overhang_m = 0.0
overhang_by = "drawing"
gutters = true
# кровля: чёрные горизонтальные ряды шагом ≈0,29 м с вертикальными швами — плоская плитка, подписи нет — по рисунку, не уверен
roof_material = "tile_roof"
unit = "m"
pt_per_unit = 121.9
material = "brick"   # кирпич с рельефными вставками узором; подписи нет — по рисунку (может быть клинкер)
colors = { main = "#8b625b", accent = "#604843", roof = "#151922" }
plinth = 0.0         # цоколя на видах нет, стена до настила
# высоты по двум этажам: стр. 4 пол 1 эт. 1225–1245, пол 2 эт. (низ рам-французов) y 828 -> (1245 − 828)/121,4 = 3,4 м; верх стены (угол щипца) y 550 -> до карниза 5,7 м
floor_heights = [3.4, 2.3]
trim = { canopy = "flat", door = "sidelights" }
cut = ["все стороны: рельефные вставки кладки (узор из выступающих кирпичей) — тот же кирпич, не зона",
       "все стороны: водосточные трубы и кронштейны карниза у краёв стен, чёрные боковые полосы краёв (x ≈120–135 и 1640–1652 на севере)",
       "east: тонкие металлические перила (французские балконы) в окнах 2 этажа, настил/ступени перед дверью и порог",
       "east, west: чёрный столб навеса за краем стены (x ≈1640–1655 на востоке), кровля навеса вне стены",
       "north: навес с обрешёткой-экраном из горизонтальных реек под ним (x 125–870), машина, два окна под навесом с жалюзи/рейками — по рисунку window без створок",
       "north, south: чёрные вертикальные парапеты/торцы кровли выше конька на краях (x 125–178 и 1603–1655 на севере)",
       "west: угловое окно гостиной продолжается на южную стену (x 1157–1626 на западе, 168–388 на юге)",
       "south, north: тёмный промежуток простенков — тень свеса, не зона"]
absent = ["все стороны: нет карнизной полосы — только свес кровли",
          "все стороны: нет подоконников, наличников, ставен, дымовых труб, слуховых окон",
          "все стороны: нет цоколя"]

