# «Барн 85,0» — ООО «ДОМ ВАШЕЙ МЕЧТЫ»; проект № 52759 на строим.дом.рф
# https://строим.дом.рф/project/52759 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 1 — юг (вход, оси 1–4), стр. 3 — запад (оси А–В, юг слева), стр. 2 — север (терраса, окна, оси 4–1),
# стр. 4 — восток (оси В–А, север слева); 1 pt = 1 px. План: 10,225 × 6,8 м по осям; вход (ДВ 1) на юге справа,
# терраса 25,3 м2 (2,5 × 10,2 м) с севера под продолжением кровли. Порядок: юг, запад, север, восток; проверка: у южного вида
# слева ось 1 (запад), у западного слева юг (А), у северного слева ось 4 (восток), у восточного слева север (В).
# Масштаб: стр. 1 стена 1224 pt / 10,225 = 119,7; стр. 2 1227 / 10,225 = 120,0; стр. 3 ось А–В 803 pt / 6,8 = 118,1 (стена 814 → 119,7);
# по уровням ±0,000 → +2,500 = 298 pt (119,2), → +3,750 = 446 pt (118,9): расхождение < 1 %.
# Пол (±0,000) ≈ y 934 на всех видах; земля −0,500 ниже на 58 pt. Стр. 3 и 4 шире стены: добавлена терраса 2,5 м (справа на западе, слева на востоке).
