# Одноэтажный дом 10,2 × 8,15 м с вальмовой крышей — проект № 30944 на строим.дом.рф
# https://строим.дом.рф/project/30944 ; разметка gf#470 (волна 2, Sonnet по брифу).
# Листы (1 pt = 1 px, 1440 × 1080): стр. 1 — Б-А = запад (окно ОК-7), стр. 2 — 3-1 = север (ОК-1, ОК-3, ОБ-1),
# стр. 3 — А-Б = восток (ОК-4), стр. 4 — 1-3 = юг, вход (ОК-5, ОК-2, ДН-1, ОК-6). Вход (тамбур) на юге плана;
# порядок юг, запад, север, восток — по часовой; примыкание слева на видах проверено по плану.
# Масштаб — по размерной цепочке между осями (у каждого вида свой, лист «1:50» в разном сжатии):
# юг 969 pt / 9,37 м = 103,4; север 962 / 9,37 = 102,7; запад 677 / 7,35 = 92,1; восток 689 / 7,35 = 93,7.
# Сверка по отметкам: юг +5,295 (y 207) и ±0,000 (y 752) = 103,9 pt/м (расхождение 0,5 %); запад +2,891/−0,050 = 92,8 (0,8 %).
# Стена шире осей на 0,4 м с каждой стороны: длины сторон 10,2 / 8,15 м, контур замыкается.
# Чистый пол ±0,000 = низ белой стены; ниже — тёмный цоколь ≈ 0,16 м до земли (на листе −0,050 у отмостки).
id = "st-30944"
pdf = "30944/sheet.pdf"
roof = "вальмовая, ≈26° (конёк +5,295, низ свеса +2,891, свес ≈0,8 м), тёмно-серая кровля; водосток по периметру"
roof_kind = "hip"
roof_material = "tile_roof"  # по рисунку (ровные ряды плиток), подписи нет — не уверен: может быть металлочерепица
# pitch: расчёт tg = (5,295 − 2,891) / (4,075 + 0,8) = 0,493 → 26,2°; по линии ската на виде запад 24,4°; расхождение < 2° — взят расчёт
pitch_deg = 26.0
overhang_m = 0.8      # юг: 81 pt / 103,4 = 0,78; запад: 75 / 92,1 = 0,81
overhang_by = "drawing"
unit = "m"
pt_per_unit = 103.4
material = "plaster"  # светлая штукатурка (кремовая заливка)
colors = { main = "#fbfae6", plinth = "#5f605c", accent = "#656a64" }
plinth = 0.17
floor_heights = [2.89]
plinth_material = "concrete"  # тёмно-серая полоса цоколя; по цвету, не уверен
gutters = true
trim = { door = "plain" }
# зона второй отделки — тёмно-серый участок вокруг окон и входа (юг, север): гладкая заливка, подписи материала нет —
# plaster по цвету, не уверен (возможно фиброцемент или окрашенная штукатурка)
absent = [
  "все стороны: нет карнизной полосы — только свес кровли и водосточный жёлоб",
  "все стороны: нет наличников, ставней, подоконников",
  "все стороны: труб и мансардных окон нет",
  "юг: нет крыльца и козырька над входом",
]
cut = [
  "все стороны: водосточные трубы и воронки",
  "все стороны: отмостка у цоколя",
  "все стороны: верх кровли — на углах у конька видны кронштейны снегозадержателей",
]

