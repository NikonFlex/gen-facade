# Одноэтажный дом 11,06 x 11,06 м, четырёхскатная крыша — проект № 36813 на строим.дом.рф
# https://строим.дом.рф/project/36813 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — юг (вход, ОК-3 x2, ДН-1, ОК-1), стр. 2 — запад (ОК-4), стр. 3 — север (ОКД-5, ОК-2 x2),
# стр. 1 — восток (ОКД-5); 1 pt = 1 px. План — стр. 5: 11 060 x 11 060 мм по наружным граням стен.
# Порядок по часовой от входа: юг -> запад -> север -> восток. Проверка по плану: на юге слева запад
# (две спальни слева, котельная справа); на западе (смотрим на восток) слева север; на севере слева
# восток (дверь-окно гостиной справа вверху плана -> слева на виде); на востоке слева юг (окно кухни слева).
# Масштаб: оси 10 800 мм; юг 1407 pt (оси 1-4) -> 130,3; запад 1510 -> 139,8; север 1497 -> 138,6;
# восток 1512 -> 140,0. Стена = оси + 130 мм с каждой стороны (юг 1442 pt / 11,06 = 130,4 — сходится).
# Сверка по отметкам: юг +0,650 -> +2,680 = 264 pt / 2,03 м = 130,0; север 281/2,03 = 138,4;
# запад +2,986 -> 0,000 = 417 / 2,986 = 139,7 — расхождение до 0,3 %.
# Уровни: ±0,000 — линия низа белой стены (верх цоколя); земля -0,300 -> plinth 0,30. Карниз (низ
# подшивки) +2,986: на видах запад/восток совпадает с линией +2,986, на юге/севере по рисунку тоже.
# Дом в плане квадрат, невязка 0. Входное крыльцо 2,8 м2 утоплено в стену (план) — дверь на виде в
# плоскости стены [не проверено: модуль не строит нишу].
id = "st-36813"
pdf = "36813/sheet.pdf"
roof = "четырёхскатная (шатровая), конёк в точке: низ кровли +3,344, конёк +5,697, свесы ≈0,6 м со всех сторон, вентвыходы и труба на скатах"
roof_kind = "hip"
# tg = (5,697 - 3,344) / (5,53 + 0,62) = 0,383 = 20,9°; линия ската на юге: (485-177)/(1100-298) = 0,384 = 21,0° — сходятся
pitch_deg = 21.0
# свес: юг — кромка кровли на 80-83 pt за стеной при 130,3 pt/м = 0,61-0,64 м
overhang_m = 0.6
gable_overhang_m = 0.6
overhang_by = "drawing"
gutters = true  # водосточные трубы по углам на всех видах
unit = "m"
pt_per_unit = 130.3
# отделка: стены белые гладкие (1), пилястры, панели и цоколь коричневые гладкие (2); подписи материала нет,
# оба — plaster по гладкому рисунку [по цвету, не уверен: акцент может быть фиброцементом или краской]
material = "plaster"
colors = { plinth = "#6e5b4a", accent = "#7b6351" }
plinth = 0.3
plinth_material = "plaster"
floor_heights = [2.986]
trim = { door = "plain" }
chimneys = [
  { side = 0, x = 1365.0 },
]
cut = ["все стороны: вентвыходы на скатах (круглые с дефлектором) — не трубы",
       "юг: ступени и ниша крыльца 2,8 м2 (серая зона x 920-1160 — тень ниши, не зона отделки)",
       "все стороны: водосточные трубы, воронки, жёлоб",
       "восток: ОКД-5 размечено окном panoramic по плану (окно кухни), на листе подписано как окно-дверь [не уверен]"]
absent = ["все стороны: нет карнизной полосы кроме белой подшивки свеса",
          "все стороны: нет подоконников, наличников, ставен, козырьков",
          "все стороны: нет мансардных окон и слуховых окон",
          "все стороны: нет столбов, терраса не нарисована"]

