# Жилой дом «Восточный 169» — ООО «ЛУКС»; проект № 54392 на строим.дом.рф
# https://строим.дом.рф/project/54392 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 3–1 (север), стр. 2 — Ф. А–В (восток, вход с крыльцом), стр. 3 — Ф. В–А (запад),
# стр. 4 — Ф. 1–3 (юг); 1 pt = 1 px. План: 7,0 × 9,0 м по наружным граням (оси 1–3 6,7 м и А–В 8,7 м).
# Порядок сторон по часовой от входа: восток (вход, плана справа), юг, запад, север. Проверка: слева на
# виде востока — ось А (юг), слева на виде юга — ось 1 (запад), слева на виде запада — В (север), слева на
# виде севера — ось 3 (восток).
# Масштаб у каждого вида свой: pt/м = ширина стены / длина с плана (9,0 или 7,0 м): восток 87,5, юг 88,0,
# запад 86,7, север 90,4. Сверка по уровням (по шкале отметок вида): восток 85,6 pt/м (3 % до 87,5),
# юг 87,5, запад 86, север 90,2 — в пределах 3 %.
# Отметки: ±0,000 пол, +3,100 пол 2 этажа, верх парапета/кровли ≈ +6,95…+7,0 (плоская крыша), земля
# уходит с −0,15 у востока до −1,6 на юге/западе (участок с уклоном).
id = "st-54392"
pdf = "54392/sheet.pdf"
roof = "плоская с парапетом, верх ≈ +6,95…+7,2; на листе кровля не показана (в карточке проекта — односкатная, на чертеже не видна)"
roof_kind = "flat"
gutters = false
pitch_deg = 0.0
overhang_m = 0.0
overhang_by = "default"
unit = "m"
pt_per_unit = 87.5
material = "plaster"      # белая штукатурка
colors = { main = "#f4f5ef", plinth = "#5b5b5b", accent = "#5b5b5b" }
# цоколь: от земли до пола 0,15…0,5 м у востока; у юга и запада земля уходит на −1,6 (тёмный цоколь до 1,6 м)
plinth = 0.5
plinth_material = "concrete"  # тёмно-серый цоколь, по цвету, не уверен
floor_heights = [3.1, 3.9]
# обрамление: наличников, подоконников и ставен нет; вход — глухая дверь без стекла
trim = { door = "plain" }
cut = ["east: труба на парапете у юго-восточного угла, x ~482 pt (сборщик не принимает трубу без конька)",
       "east: ступень-площадка у двери (x 795–1000 pt)",
       "south, west, east: водосточные и вентиляционные трубы по стене (вент-труба на юго-западном краю с белым оголовком)",
       "south, west: тёмный цоколь 1,6 м под стеной (земля с уклоном), ступеньки и пандус участка",
       "north: вентвыход тоньше трубы над парапетом x ~893 и оголовок x ~907 pt ниже парапета; тёмная полоса над +5,9 до парапета — не разобрана",
       "все стороны: перила франц. окон входят в окно"]
absent = ["все стороны: нет карнизной полосы и свеса — плоская крыша с парапетом"]

