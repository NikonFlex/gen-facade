# Одноэтажный дом 22,5 x 6,7 м, плоская кровля, вертикальная деревянная рейка — проект № 39522 на строим.дом.рф
# https://строим.дом.рф/project/39522 ; разметка gf#470 (волна 2). Названия проекта на листе нет.
# Листы: стр. 2 — юг (вход, крыльцо 4 м² с козырьком, 3 малых окна, 4 высоких), стр. 3 — запад
# (остеклённая терраса, дверь по центру), стр. 4 — север (9 высоких окон), стр. 1 — восток (глухая стена); 1 pt = 1 px.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: на виде с юга слева белое окно у
# западного торца (по плану оно у террасы), на виде с запада справа крыльцо с козырьком (юг), на виде
# с востока слева крыльцо (юг) — порядок сходится.
# Масштаб: юг 1495 pt / 22,5 м = 66,44; север 1494,5 / 22,5 = 66,42; запад 462 / 6,7 = 68,96; восток 462 / 6,7 = 68,96.
# Расхождение длинных и коротких видов 3,8 % (>3 %): либо план 22,5 x 6,7 неточен, либо вид растянут; отметок на листе
# нет, сверить нечем — масштаб у вида свой, как требует бриф. Дверь на юге 144 pt = 2,17 / 2,09 м — обе правдоподобны.
# Невязка контура 0 (22,5 / 6,7 / 22,5 / 6,7).
# Уровни: отметок на листе нет. Пол ±0,000 — по низу окон и двери (y 630), низ рейки на 18 pt ниже (сваи под ним) —
# plinth 0,27 м. Высота от пола до верха стены 213 pt = 3,21 (юг/север) и 3,09 (запад/восток) — взято 3,15.
id = "st-39522"
pdf = "39522/sheet.pdf"
roof = "плоская (односкатная неразличимо пологая), серая кромка кровли вровень со стеной, свесов нет; материал — одна заливка"
roof_kind = "flat"
pitch_deg = 0.0
overhang_m = 0.0
gable_overhang_m = 0.0
overhang_by = "default"
unit = "m"
pt_per_unit = 66.44
# вертикальная деревянная рейка шагом ≈ 0,06 м, подписи нет — wood по рисунку [не проверено: вид по рисунку]
material = "wood"
colors = { main = "#92714f", plinth = "#81664b" }
plinth = 0.27
plinth_material = "wood"
trim_material = "wood"
floor_heights = [3.15]
# обрамление: тёмные рамы без наличников и ставен; козырёк над входной дверью; подоконники — тонкая светлая линия
trim = { canopy = "flat", door = "plain" }
cut = ["все стороны: верхний пояс y 417-446 (≈0,44 м) отделён тёмной линией, но та же рейка — не зона",
       "все стороны: белые окна (south: окно у западного торца; north: у западного торца) залиты белым без стекла и штор — размечены окнами в пол",
       "south, east: ступени у крыльца и западного торца, настил крыльца ниже пола",
       "west: терраса 2,5 x 6,7 м (деревянный настил) под остеклением и перед ним — не размечена",
       "south: ставень нет; козырёк над дверью стеклянный на тягах, наклонный (вынос ≈0,9 м по боковому виду)",
       "все стороны: сваи под домом — не размечены"]
absent = ["все стороны: нет карнизной полосы и свесов",
          "все стороны: нет зон второй отделки",
          "все стороны: нет труб, мансардных окон, слуховых окон, водостока",
          "east: нет окон и дверей"]

