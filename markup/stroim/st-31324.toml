# Бавария_110 — ИП Нечаев А. Е.; проект № 31324 на строим.дом.рф (одноэтажный, кирпич, терраса 3 м у восточной стены)
# https://строим.дом.рф/project/31324 ; разметка gf#470 (волна 1, учебная, см. LICENSE.md).
# Листы: стр. 2 — юг (вход, крыльцо под щипцом), стр. 4 — запад (глухой щипец), стр. 3 — север,
# стр. 1 — восток (терраса со своим щипцом, остекление гостиной); стр. 5 — план. 1 pt = 1 px.
# Порядок сторон: юг, запад, север, восток; проверка по левому краю вида — юг слева запад, запад слева север,
# север слева восток (терраса слева на стр. 3), восток слева юг (крыльцо слева на стр. 1).
# Размеры с плана (мм, по наружной стороне): 11 900 (запад-восток) × 8 890 (юг-север), терраса +3 000.
# Масштаб: длинные стены (стр. 2, 3) — 4682 pt / 11,9 м = 393,4 pt/м; торцы (стр. 1, 4) — 4667 pt / 8,89 м = 525,0 pt/м
# (виды масштабом разные — каждая сторона листа вписана в формат). Отметок на листе нет, сверка по
# высотам: низ карниза над чистым полом на стр. 2 — 1172 pt / 393,4 = 2,98 м, а на торце стр. 4 — стена до
# подошвы щипца 1778 pt / 525 = 3,39 м и свес 0,73 м · tg28° = 0,39 м → низ подшивки 3,00 м: сходится;
# цоколь 158 pt / 393,4 = 0,40 м на стр. 2, 214 / 525 = 0,41 м на стр. 4; конёк 6,0 м над землёй — как в карточке проекта (6 м).
# «Пол» разметки — верх цоколя (кладка начинается на нём; ±0,000 на листе не подписана).
id = "st-31324"
pdf = "31324/sheet.pdf"
roof = "двускатная, щипцы на запад и восток, конёк вдоль плана (запад-восток), ≈28°, конёк ≈ +6,0 м над землёй; фальцевая кровля; над террасой (с востока) — отдельный щипец 31° ниже конька, над крыльцом — малый щипец"
roof_kind = "gable"
# уклон: по линии щипца на стр. 4 — 28,0° (брусчатка под кровлей, tg = 0,531); по краю кровли: конёк 801 → свес (490, 2335),
# tg = 1534 / 2715 = 0,565 = 29,5°; расхождение 1,5° — беру по линии щипца
pitch_deg = 28.0
# свес карнизный (север, юг): стр. 4 — кровля выступает на 381 pt за стену / 525 = 0,73 м; свес щипцовый (запад) — стр. 2, 200 pt / 393,4 = 0,51 м
overhang_m = 0.73
gable_overhang_m = 0.5
overhang_by = "drawing"
# кровля: вертикальные гладкие полосы с фальцем, без волны — фальц; по рисунку, подписи на листе нет
roof_material = "metal_roof"
unit = "m"
pt_per_unit = 393.4
material = "brick"       # красная кирпичная кладка (рисунок кладки), подписи нет
plinth = 0.40
plinth_material = "concrete"   # серый цоколь плитами — по цвету и швам, не уверен
floor_heights = [3.4]    # от верха цоколя до подошвы щипца; на длинных стенах низ кровли виден на 3,0 м
# обрамление: окна в белых рамах, над окнами кирпичная перемычка-замок (рисунком) — наличника, подоконника, ставен нет;
# дверь стеклянная со стеклопакетом (панели) — вид двери «двухстворчатая/панельная» не угадываю
chimneys = [
  { side = 0, x = 3220.0 },
]
# труба одна, кирпичная (серая), выходит на южном скате правее середины конька: стр. 2 x 3180–3260, стр. 3 x 3760–3840 (сходится, 6,71 м от запада)
porch_roofs = [
  { side = 0, x = [1960.0, 3360.0], y = [1948.0, 2388.0], kind = "gable", posts = 2, depth_m = 1.35 },
  { side = 3, x = [1711.0, 5913.0], y = [1390.0, 2659.0], kind = "gable", posts = 4, depth_m = 3.0 },
]
# крыльцо у двери: щипец проступает на южном скате (тонкая линия на стр. 2, вершина x=2660 — над дверью), глубина по плану 1,35 м;
# терраса у восточной стены: 21 м², 4 столба по наружному краю (план), щипец на стр. 1 с вершиной (3805, 1390), tg = (2659 − 1390)/2102 = 0,60 = 31°
cut = ["south: столбы и площадка крыльца, ступени",
       "east: столбы и стропила террасы перед стеной, ступени",
       "west: кровля крыльца и террасы за домом (выглядывает из-за ската)",
       "east, south, north: рельеф кладки над окнами (перемычки-замки)",
       "north: уступ кровли над террасой (левее стены)"]
absent = ["все стороны: нет карнизной полосы, подоконников, ставен, наличников, водостока",
          "west: нет окон и дверей — глухой щипец",
          "все стороны: нет зон второй отделки"]

