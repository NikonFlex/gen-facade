# Проект № 47250 на строим.дом.рф (одноэтажный дом из бруса/бревна с гаражом, план 14,0 × 7,0 м)
# https://строим.дом.рф/project/47250 ; разметка gf#470 (волна 2).
# Листы: стр. 3 «1–5» — восток (главный вход в прихожую, по центру), стр. 1 «Д–А» — юг (4 окна),
# стр. 2 «5–1» — запад (дверь из гаража у севера, окно), стр. 4 «А–Д» — север (3 окна, малое окно, ворота гаража).
# Порядок по часовой от входа: восток → юг → запад → север. Проверка: в виде с востока слева ось 1 (юг),
# с юга слева ось Д (запад), с запада слева ось 5 (север), с севера слева ось А (восток).
# План — стр. 5: наружные стены 14 000 × 7 000 мм (оси 13 820 × 6 820). Масштаб один на дом, pt/м:
# юг 1555 pt / 14,0 = 111,1; север 1554 / 14,0 = 111,0; восток 781 / 7,0 = 111,6; запад 781,5 / 7,0 = 111,6;
# сверка по отметкам: ±0,000 → +5,300 = 590 pt / 5,3 = 111,3; +1,080 → +2,280 = 127 pt / 1,2 = 106 (разброс 5 % —
# от толщины линий отметок, окна 1,2 м по плану сходятся) — взято 111,3. Невязка контура 0,06 м.
# Отметки: ±0,000 — низ бревенчатой стены (y 1060), ниже — основание до земли −0,400 (y 1100). Чистый пол дома
# на +0,360 (порог двери), но floor взят по низу стены ±0,000, plinth = 0,4 до земли; дверь поэтому стоит на 0,36 выше floor.
# Карниз стены +2,85 (низ свеса +2,9, верх стены под подшивкой не виден).
id = "st-47250"
pdf = "47250/sheet.pdf"
roof = "двускатная, конёк вдоль плана (запад–восток) +5,300, край кровли +2,900; 30° по подписи (расчёт: 2,4 / 4,07 = 30,5°, линия ската на виде 30°); свесы 0,55 м карнизные, 0,5 м торцевые; кровля — рисунок черепицы/металлочерепицы"
roof_kind = "gable"
pitch_deg = 30.0
overhang_m = 0.55
gable_overhang_m = 0.5
overhang_by = "drawing"
roof_material = "metal_tile"
unit = "m"
pt_per_unit = 111.3
# стена — горизонтальные венцы шагом ≈0,2 м с рублеными углами, подписи нет — log по рисунку, не уверен (может быть брус)
material = "log"
colors = { main = "#d7b077", plinth = "#8f8f8f", roof = "#d0aa77" }
plinth = 0.4
# основание ниже ±0,000 — гладкая серая заливка без рисунка: concrete по цвету, не уверен
plinth_material = "concrete"
floor_heights = [2.85]
trim = { sill = "flat", casing = "flat", door = "plain" }
absent = ["все стороны: нет карнизной полосы, поясов и зон второй отделки",
          "все стороны: нет труб, мансардных, слуховых окон и водостока",
          "все стороны: нет ставен и козырьков"]
cut = ["восток, запад: ступени и площадки крыльца за порогом (площадка записана элементом porch)",
       "север: пандус или площадка перед воротами гаража ниже +0,26",
       "все стороны: подоконники и наличники окон не размечены отдельными элементами",
       "восток, запад: вентиляционная «пила» в основании фронтона под коньковой обрешёткой — часть рисунка кровли"]

