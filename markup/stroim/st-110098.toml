# Одноэтажный дом 10,72 × 9,04 м (между осями), вальмовая крыша — проект № 110098 на строим.дом.рф
# https://строим.дом.рф/project/110098 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — Ф. 1–5 (юг, вход в нише между осями 3–4), стр. 1 — Ф. В–А (запад), стр. 3 — Ф. 5–1 (север,
# терраса в СВ-углу), стр. 2 — Ф. А–В (восток, терраса справа). Страницы 4961 × 3508 pt, 1 pt = 1 px.
# План (стр. 5): ось 1 слева, ось В сверху → вход (ось А) на юге. Порядок по часовой от входа: юг → запад → север → восток.
# Проверка: слева на Ф. 1–5 ось 1 (запад), на Ф. В–А слева В (север), на Ф. 5–1 слева 5 (восток), на Ф. А–В слева А (юг).
# Масштаб у вида свой (между осями / размер плана): юг 3840 pt / 10,72 = 358,2; север 3725 / 10,72 = 347,5;
# запад 3336 / 9,04 = 369,0; восток 3336 / 9,04 = 369,0. Сверка по уровням (±0,000 → +3,200): юг 1144 pt / 3,2 = 357,5;
# север 1111 / 3,2 = 347,2; запад 1182 / 3,2 = 369,4; восток 1181 / 3,2 = 369,0 — расхождение до 0,3 %. Стена снаружи
# 10,97 × 9,29 м (оси + по ~0,125 м), по плану то же.
# Отметки: ±0,000 чистый пол, −0,450 земля (цоколь серый на всех видах), +3,200 край кровли у свеса, +5,600 конёк.
# Стена до низа свеса = 3,0 м над полом (низ полосы свеса на листе; +3,200 стоит у верха свеса).
# Терраса 4,265 × 2,05 м утоплена в СВ-угол объёма под общей вальмовой кровлей, вход — в нише ≈2,1 × 1,2 м: контур взят
# прямоугольником 10,97 × 9,29, остекление террасы (север) и дверь входа (юг) поставлены в плоскость стены
# [не проверено: модуль не строит утопленные объёмы].
id = "st-110098"
pdf = "110098/sheet.pdf"
roof = "вальмовая, конёк +5,600 (длина ≈1,7 м), край кровли +3,200, свес ≈0,39 м со всех сторон, черепица волной"
roof_kind = "hip"
# tg = (5,600 − 3,200) / (9,295/2 + 0,39) = 0,476 = 25,5°; линия ската на Ф. 1–5: (535−198)/(862−140) = 0,467 = 25,0° — сходятся
pitch_deg = 25.4
overhang_m = 0.39
gable_overhang_m = 0.39
overhang_by = "drawing"
# кровля — S-образная волна с уступом (рисунок): черепица; металлочерепица не исключена [не уверен]
roof_material = "tile_roof"
unit = "m"
pt_per_unit = 358.2
# стены без рисунка и подписи отделки — гладкая заливка: штукатурка по умолчанию [по виду, не уверен]
material = "plaster"
colors = { plinth = "#e8e8e8" }
plinth = 0.45
plinth_material = "plaster"
floor_heights = [3.0]
# обрамления нет: окна в простых рамах; подоконников нет, ставен и козырька нет; входная дверь — 4 филёнки
trim = { door = "panel6" }
cut = ["юг: ниша крыльца 2,1 × 1,2 м, дверь стоит глубже стены — не размечено глубиной",
       "север: терраса 4,265 × 2,05 м утоплена в объём; её проём (между столбом и стеной) на виде не размечен",
       "восток: проём террасы между осью Б и угловым столбом — пустота, не размечена",
       "все стороны: короткие чёрточки у края стены (≈ место водосточных труб) — водосток не размечен, gutters не ставлю"]
absent = ["все стороны: нет карнизной полосы — только свес кровли",
          "все стороны: нет зон второй отделки",
          "все стороны: нет труб, мансардных окон, слуховых окон",
          "все стороны: нет подоконников, наличников, ставен"]

