# Дом 11369-ОС-6х8-50,5 (одноэтажный, двускатная кровля, терраса-крыльцо на юге); проект № 55368 на строим.дом.рф
# https://строим.дом.рф/project/55368 ; разметка gf#470 (волна 2).
# Листы: стр. 3 — юг (вход, терраса с ограждением), стр. 1 — запад (юг справа, окно, терраса справа),
# стр. 4 — север (2 окна), стр. 2 — восток (юг слева, малое окно). План — стр. 5: 8188 × 6188 мм, крыльцо 1400 мм на юге.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: на юге слева запад, на западе слева север
# (крыльцо справа), на севере слева восток, на востоке слева юг (терраса слева на стр. 2).
# Масштаб у видов разный: юг 1424 pt / 8,188 м = 173,9 (сверка по размерам 3621+3000+1567: 174); север 1313/8,188 = 160,4
# (окно 1200: 192/1,2 = 160); запад 1152/6,188 = 186,2 (высота 4918: 919/4,918 = 186,9); восток 992/6,188 = 160,3.
# Отметки: ±0,000 на листе нет. floor = верх настила террасы (0,3 м над землёй: на юге 52 pt / 174), низ стены — на земле;
# plinth = 0,3 по этому расчёту [не проверено: нет отметок]. Высота стены до низа свеса 3,205 от земли (размер на западе), конёк 4,918.
# Невязка контура: 6185 против 6188 на плане — 3 мм.
id = "st-55368"
pdf = "55368/sheet.pdf"
roof = "двускатная, конёк вдоль 8,2 м (щипцы на запад и восток), карниз 3,205 от земли, конёк 4,918, кровля мягкая «чешуя»; свесы ≈0,55 м; над террасой юга кровля продолжена тем же скатом"
roof_kind = "gable"
# tg = (4,918 − 3,205) / (3,094 + 0,55) = 0,470 = 25,2°; линия ската на виде запад: (345−28)/(700−25) = 0,470 = 25,2° — сходятся
pitch_deg = 25.0
overhang_m = 0.55
gable_overhang_m = 0.54
overhang_by = "drawing"
roof_material = "shingle_roof"
porch_roofs = [
  { side = 0, x = [748.0, 1455.0], y = [342.0, 475.0], kind = "shed", posts = 3, depth_m = 1.4 },
]
unit = "m"
pt_per_unit = 160.4
# отделка: горизонтальная узкая обшивка ≈0,15 м по всем стенам, подписи нет — siding по рисунку [не проверено: вид по рисунку]
material = "siding"
colors = { main = "#d2d1b8" }
plinth = 0.3
floor_heights = [2.9]
trim = { door = "plain" }
cut = ["south: ступени крыльца слева от террасы — не размечены",
       "south: ограждение террасы (балясины), настил и свайное основание — не размечены",
       "west, east: ограждение террасы сбоку — не размечено",
       "все стороны: тёмные угловые доски (≈0,05 м) на краях стен — не размечены",
       "east: прямоугольник у конька (x 880–975, y 215–340) — вент. выход или труба? не размечен"]
absent = ["все стороны: нет карнизной полосы",
          "все стороны: нет цоколя другого материала, зон второй отделки",
          "все стороны: нет труб, мансардных окон, слуховых окон, водостока",
          "south: окон нет, только дверь под террасой"]

