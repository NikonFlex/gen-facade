# Стильный Дом — ИП Фоминов А. А.; проект № 55367 на строим.дом.рф
# https://строим.дом.рф/project/55367 ; разметка gf#470 (волна 2).
# Лист — 8504 × 6378 pt, 1 pt = 1 px. Стр. 3 — юг (ось А, дверь, 2 дымовых выхода), стр. 4 — запад (остеклённая
# терраса-стена), стр. 2 — север (ось Б, дверь), стр. 1 — восток (2 группы окон). План — стр. 5: 9 × 6 м по осям (+ терраса 2 м).
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: на виде юга слева запад, на виде запада слева север
# (дымовой выход справа), на виде севера слева восток (дверь 3,6-4,5 м от восточного края — по плану сверху), на виде востока слева юг.
# Входов две (обе двери на плане одинаковые, сверху и снизу): «вход» выбран южный [не проверено: какая главная].
# Масштаб: нет отметок и размеров на видах; стена севера 1315 px (миниатюра 1600) = 9,0 м по осям 1-5 -> 146,2 px/m в миниатюре
# = 777 pt/м; щипец 878 px / 6,0 м = 146,3 — сходятся (< 0,5 %). Двери 0,82 × 2,0 м — правдоподобно.
# Высоты: на видах юг/север стена от пола до карниза 510 px = 3,5 м, на щипцах 600 px = 4,1 м — расхождение 0,6 м (рендеры
# несогласованы по вертикали [не проверено]). floor_heights = 4,1 по щипцам; у длинных стен floor взят по низу настила террасы (y 1070/1078 миниатюры), чтобы карниз (470) лёг на 4,1 м; низ стены закрыт настилом.
id = "st-55367"
pdf = "55367/sheet.pdf"
roof = "двускатная, конёк вдоль 9 м; уклон по линии ската на щипце 40°; тёмная кровля с вертикальными рёбрами; свес щипца 0,3 м; водосток с трубами по углам"
roof_kind = "gable"
# расчёт: tg = (конёк − верх стены) / половина пролёта = (445−88)/146,3/3,0 = 0,81 = 39°; внешняя кромка щипца (435→30)/483 = 40° — взято 40
pitch_deg = 40.0
overhang_m = 0.3
gable_overhang_m = 0.3
overhang_by = "default"
roof_material = "profiled_sheet"  # вертикальные рёбра, подписи нет — по рисунку, не уверен (может быть фальц)
unit = "m"
pt_per_unit = 777.0
material = "wood"  # вертикальная доска цвета дерева, подписи нет
colors = { main = "#b68b57", accent = "#82898d" }
plinth = 0.0
floor_heights = [4.1]
gutters = true
chimneys = [{ side = 0, x = 6128.2, depth_m = 0.05 }, { side = 0, x = 6324.9, depth_m = 0.05 }]
trim = { door = "plain" }
absent = ["все стороны: нет карнизной полосы, цоколя, наличников, ставен, подоконников, козырька",
          "west: нет второй отделки", "south, north: нет окон"]
cut = ["все стороны: терраса-настил из реек перед домом (на плане 2 м с запада) — не размечена",
       "south, north: снегозадержатель на кровле, вентвыход у труб",
       "south: два дымовых выхода рядом — размечены как трубы",
       "east: серая обшивка горизонтальной доской (зоны) между окнами — siding, по цвету",
       "west: тёмные участки щипца — та же доска в тени, не зона"]

