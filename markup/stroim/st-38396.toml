# «Акцент» — ООО "ГАРАНТСТРОЙГРУПП"; проект № 38396 на строим.дом.рф
# https://строим.дом.рф/project/38396 ; разметка gf#470 (волна 1, один проход, учебная, см. LICENSE.md).
# Листы: стр. 2 — фасад со входом (юг, щипец 7,5 м), стр. 3 — западный (длинный, окно слева, крыльцо справа),
# стр. 4 — северный щипец, стр. 1 — восточный (длинный, крыльцо слева, без окон); 1 pt = 1 px.
# Порядок сторон по геометрии вида: с юга смотрим на сторону, у которой крыльцо у правого края — это
# запад (стоишь с запада лицом на восток, юг справа); у восточной крыльцо слева. Контур 7,5 × 8,0 м.
# Масштаб: ширина стены / длина с плана и размерных цепочек 7 500 и 8 000: юг 1495,5/7,5 = 199,4;
# запад 1593,9/8 = 199,2; север 1496,9/7,5 = 199,6; восток 1596,4/8 = 199,5 pt/м — берём 199,5 для всех.
# Сверка по отметкам: юг ±0,000 → +2,480 = 488,8 pt (197,1 pt/м), ±0,000 → +7,648 = 196,7 pt/м; расхождение
# с шириной 1,4 % (< 3 %), отдельных масштабов нет.
# Пол — отметка ±0,000 (верх тёмной полосы цоколя), цоколь до земли −0,300 = 0,3 м. Низ стены под свесом на
# длинных сторонах — подшивка карниза (стр. 1, y 835 pt): 4,35 м над ±0,000; щипец упирается в низ кровли на 4,68 м.
# Окна на плане и на фасадах по положению не совпадают (план: окна 2-го этажа у севера/юга по одному в двух
# местах, фасады: пары) — разметка по фасадам; окно запада на плане — на западной стене у севера, как на фасаде.
id = "st-38396"
pdf = "38396/sheet.pdf"
roof = "двускатная, конёк с запада на восток вдоль 8 м (щипцы на юге и севере), +7,648; карниз +4,672 (верх кровли на краю свеса); уклон по линии ската ≈35°, мягкая (гибкая) черепица «чешуя»; свесы 0,45 м со всех сторон; водосток"
roof_kind = "gable"
roof_material = "shingle_roof"  # рисунок «чешуя» на всех видах
gutters = true
# уклон: tg = (7,648 − 4,672 верх кровли у края свеса) / (3,75 + 0,45 свес) = 2,976 / 4,20 = 0,709 → 35,3°;
# линия ската на стр. 2: (y 575−198)/(x 866−328) px = 0,70 → 35,0° — расхождение 0,3°, берём 35,0
pitch_deg = 35.0
# свес: на стр. 2 кромка кровли 66 px за стеной (262/328 px) = 0,46 м; на стр. 1 — 53 px = 0,45 м
overhang_m = 0.45
gable_overhang_m = 0.45
overhang_by = "drawing"
unit = "m"
pt_per_unit = 199.5
material = "plaster"            # светлые стены без рисунка — белая штукатурка (по цвету, не уверен)
colors = { plinth = "#727272", accent = "#727272", roof = "#7c7c7c" }
plinth = 0.3
plinth_material = "concrete"    # тёмная полоса цоколя (по цвету, не уверен)
floor_heights = [3.0, 1.35]     # 2-й этаж +3,000 (высота этажа по карточке), стена под свесом +4,35
# вторая отделка — серые вертикальные полосы вокруг окон: вид по цвету, не уверен (siding)
trim = { canopy = "posts", door = "plain" }
# навес над входом на юге: односкатный на двух столбах, мягкая кровля; на боковом виде (стр. 1, 3) вынос
# 170 px при 0,5963 = 325 pt = 1,63 м от стены (до кромки кровли)
porch_roofs = [
  { side = 0, x = [1109.4, 2010.6], y = [1180.2, 1294.1], kind = "shed", posts = 2, depth_m = 1.65 },
]
chimneys = [
  { side = 3, x = 2297.5 },
]
absent = [
  "все стороны: нет карнизной полосы — только свес кровли и подшивка",
  "все стороны: нет наличников, ставен и подоконников — окна в тёмной раме внутри серой полосы",
  "east: окон и дверей на стене нет",
]
cut = [
  "east: два тонких выхода (вентиляция/дымоход, 0,27 м) на скате на x 1288 pt, y 335–440 и 570–670 — не размечены, не уверен: трубы или вент-выходы",
  "north: ящик/шкаф на стене слева (стр. 4, x 590–633, y 1150–1265)",
  "south, west, north, east: водосточные трубы с воронками и колена",
  "east, west: скат и столб навеса входа в профиль",
  "south: окно справа от двери — верх скрыт козырьком, рамка обрезана по низу козырька",
]

