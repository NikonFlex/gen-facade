# «Коричнево белый» — ИП ЕФИМОВА Г. В.; проект № 55477 на строим.дом.рф
# https://строим.дом.рф/project/55477 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. В–А, стр. 2 — Ф. 3–1, стр. 3 — Ф. 1–3 (вход), стр. 4 — Ф. А–В; 1 pt = 1 px картинки.
# Масштаб у каждого вида свой (картинки разной ширины): pt/м = ширина стены между осями / 9,000 м
# (оси на листе стоят по краям стены); сверка по уровням: −0,600…±0,000 на Ф. 1–3 = 108 pt →
# 180 pt/м (по ширине 180,7), дверь 2,100 = 379 pt → 180,5. Квадрат 9,0 × 9,0 м, вход с юга (ось 1–3),
# отметки: ±0,000 чистый пол, −0,600 земля, +2,600 верх окон, +3,226 верх свеса, +5,160 конёк.
# Карниз дома — низ свеса кровли у стены, 3,08 м над полом (на листе отметки нет — по картинке).
id = "st-55477"
pdf = "55477/sheet.pdf"
roof = "вальмовая, ≈22° (конёк +5,160, свес +3,226), керамическая черепица; свесы со всех сторон, водосточные трубы"
roof_kind = "hip"
# кровля: керамическая черепица, рисунок волны красно-розового цвета на всех видах (стр. 1–4)
roof_material = "tile_roof"
# труба: Ф. А–В стр. 4, центр ~1240 pt (стена 535–2171 pt), дымник +5,160 на скате левее середины конька, виден и на Ф. 1–3 стр. 3
chimneys = [
  { side = 3, x = 1240 },
]
# водосток: желоб по карнизу и водосточные трубы на Ф. 1–3 стр. 3, А–В стр. 4
gutters = true
pitch_deg = 22.0
# свес: вальмовая — Ф. 1–3 стр. 3, 98 pt / 180,7 pt/м = 0,55 м
overhang_m = 0.55
overhang_by = "drawing"
unit = "m"
pt_per_unit = 180.7
# обрамление (стр. 2, 3): под окнами тонкая тёмная полка-подоконник; наличников и ставен нет; входная
# дверь глухая с узкой вертикальной вставкой (стр. 3), навеса над входом нет
trim = { sill = "flat", door = "plain" }
material = "plaster"  # серая штукатурка стен
colors = { main = "#cacaca", plinth = "#7e635a", accent = "#7e635a" }
plinth = 0.6  # земля −0,600 под чистым полом
floor_heights = [3.08]
plinth_material = "brick"  # коричневый цоколь
absent = [
  "все стороны: нет карнизной полосы — только свес кровли с желобом",
  "east: окон и дверей нет — глухая стена",
]
cut = [
  "south: три ступени крыльца",
  "все стороны: водосточные трубы и воронки",
  "south, west: подоконные панели и угловые пилястры того же коричневого кирпича размечены зонами акцента (одна вторая отделка)",
]

