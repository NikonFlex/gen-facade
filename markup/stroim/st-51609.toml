# Проект № 51609 (одноэтажный дом 10 × 8 м, 3 спальни, терраса) на строим.дом.рф
# https://строим.дом.рф/project/51609 ; разметка gf#470 (волна 2).
# Листы: стр. 3 — «Фасад В-А» = запад (вход), стр. 2 — «2-1» = север (2 окна), стр. 4 — «А-В» = восток
# (терраса, остеклённая дверь), стр. 1 — «1-2» = юг (малое окно). План (оси 1–2 слева направо, А снизу,
# В сверху): 10 000 × 8 000 мм, вход ДВ-03 в западной стене (крыльцо 2 × 1,5 м), терраса 3 × 5 м у восточной.
# Порядок по часовой от входа: запад → север → восток → юг. Проверка: на западе слева В (север), на севере
# слева ось 2 (восток), на востоке слева А (юг), на юге слева ось 1 (запад).
# Масштаб: запад 1414 pt / 8 м = 176,8; север 1776 / 10 = 177,6; восток 1425 / 8 = 178,1; юг 1789 / 10 = 178,9.
# Сверка по отметкам ±0,000 → +3,000: запад 529/3 = 176,3; север 532/3 = 177,3; восток 532/3 = 177,3 — до 0,6 %.
# Уровни: ±0,000 — верх цоколя (чистый пол), цоколь до земли −0,600; карниз на отметке +3,000, конёк +5,500.
id = "st-51609"
pdf = "51609/sheet.pdf"
roof = "вальмовая, четыре ската 30°, конёк 2 м вдоль 10 м, отметки +3,000 / +5,500, свес 0,4 м; над террасой на востоке пологий односкатный навес (≈6°, край +2,400), над входом на западе малый щипцовый козырёк; металлическая кровля тёмно-коричневая"
roof_kind = "hip"
# tg = (5,5 − 3,0) / (4,0 + 0,4) = 0,568 = 29,6°; линия ската на виде запад (610,632)→(1157,315): 0,58 = 30,1° — сходятся
pitch_deg = 29.6
overhang_m = 0.4
gable_overhang_m = 0.4
overhang_by = "drawing"
# кровля: вертикальные тонкие рёбра без волны — профнастил [не уверен: может быть фальц]
roof_material = "profiled_sheet"
gutters = true
unit = "m"
pt_per_unit = 177.0
# стена — штукатурка бежевая (зернистая заливка), по рисунку; цоколь — серый бетон с швами панелей
material = "plaster"
colors = { main = "#c1ab91", plinth = "#898a87" }
plinth = 0.6
plinth_material = "concrete"
floor_heights = [3.0]
trim = { door = "plain" }
porch_roofs = [
  # запад, стр. 3: щипцовый козырёк входа (x 1530–2045, конёк 758, низ 908), вынос 1,5 м по плану, без столбов
  { side = 0, x = [1530.0, 2045.0], y = [758.0, 908.0], kind = "gable", posts = 0, depth_m = 1.5 },
  # восток, стр. 4: навес над террасой на двух столбах (x 836–1895, полоса 915–1001), вынос 3,0 м по плану
  { side = 2, x = [836.0, 1895.0], y = [915.0, 1001.0], kind = "shed", posts = 2, depth_m = 3.0 },
]
cut = ["север: пологий навес террасы виден сбоку слева (≈6°, край +2,400) — размечен на востоке",
       "юг: терраса и её ограждение видны справа сбоку — размечены на востоке",
       "юг: малое круглое отверстие у стены (вентвыход, x≈780, y≈985) — не размечено",
       "запад, юг: ступени крыльца, боковая стенка крыльца — не размечены",
       "восток: ограждение террасы (две секции, балюстрада) и ступени — не размечены",
       "все стороны: водосточные трубы по углам — только gutters = true"]
absent = ["все стороны: нет карнизной полосы кроме подшивки свеса",
          "все стороны: нет зон второй отделки, ставен, наличников, подоконников",
          "все стороны: нет труб, мансардных и слуховых окон"]

