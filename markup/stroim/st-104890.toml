# Проект № 104890 на строим.дом.рф (одноэтажный кирпичный дом с террасой, вальмовая крыша);
# https://строим.дом.рф/project/104890 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — Ф. 1–2 (юг, вход со ступенями), стр. 3 — Ф. Б–А (запад), стр. 4 — Ф. 2–1 (север, терраса
# с остеклённой двустворчатой дверью), стр. 1 — Ф. А–Б (восток); 1 pt = 1 px. План — стр. 5: прямоугольник
# оси 1–2 = 10,0 м, оси А–Б = 11,5 м; стены наружу от осей на 0,5 м: контур 11,0 × 12,5 м. Терраса (3,0 м вынос,
# 5,0 м шириной, у западного края) выступает с севера под своей вальмовой кровлей; план — вверху север.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: с юга слева запад (ось 1), с запада слева
# север (Б), с севера слева восток (ось 2), с востока слева юг (А); терраса на западе стр. 3 слева, на востоке стр. 1 справа.
# Масштаб единый 97,6 pt/м: юг 1073 pt / 11,0 = 97,5, запад 1220 / 12,5 = 97,6, север 1074 / 11,0 = 97,6,
# восток 1220 / 12,5 = 97,6; по осям 975 pt / 10 м и 1121 pt / 11,5 м = 97,5; по отметкам юг ±0,000→+2,860: 279 pt / 2,86 = 97,6;
# ±0,000→+6,000: 585 / 6,0 = 97,5 — расхождение < 0,2 %.
# Уровни: ±0,000 — чистый пол по маркеру на виде (y 802 / 808 / 810 / 901); земля −0,600 по маркеру,
# но на видах она на 0,46 м ниже чистого пола (45 pt) — цоколь по рисунку 0,46 м; карниз (низ свеса) +2,860.
id = "st-104890"
pdf = "104890/sheet.pdf"
roof = "вальмовая, короткий конёк 1,5 м вдоль С–Ю, конёк +6,000, низ свеса +2,860; над террасой своя вальмовая крыша ниже (конёк +4,580/+4,815 по видам); свесы ≈0,6 м со всех сторон"
roof_kind = "hip"
# pitch: tg = (6,000 − 2,860) / (половина пролёта 5,5 м + свес 0,58 м) = 0,516 -> 27,3°, но отметка +2,860 стоит у низа
# подшивки; по линии ската на виде юг (595 pt по горизонтали при 280 pt подъёма) 25,2°, на виде восток 282/597 -> 25,3°;
# расходятся больше 2° — беру по линии ската.
pitch_deg = 25.3
overhang_m = 0.6
overhang_by = "drawing"
unit = "m"
pt_per_unit = 97.6
# кладка кирпичом с рисунком швов, подписи нет — по рисунку; кровля — штриховка «ёлочкой», вид кровли не читается, roof_material не пишу
material = "brick"
colors = { main = "#ebebeb", plinth = "#d4d4d4" }
plinth = 0.46
plinth_material = "stone"  # цоколь — булыжник/бутовый камень, рисунок
floor_heights = [2.86]
# подоконников, наличников, ставен, козырьков нет; дверь юга — одностворчатая глухая, дверь террасы — двустворчатая с фрамугой
trim = { door = "plain" }
roof_gaps = ["терраса: отдельная вальмовая крыша ниже главной — модуль строит одну крышу дома"]
absent = ["все стороны: нет карнизной полосы кроме подшивки свеса",
          "все стороны: нет труб, мансардных и слуховых окон, водостока",
          "все стороны: нет подоконников, наличников, ставен, козырьков"]
cut = ["все стороны: угловые и промежуточные пилястры кладки (горизонтальная штриховка рядов без вертикальных швов, цвет тот же) не размечены зонами — по рисунку тот же кирпич [не уверен: может быть другая кладка]",
       "south: три ступени крыльца у двери, столбы крыльца с плана (площадка 5,7 м²) на виде не нарисованы",
       "north: три ступени террасы у двери — только площадкой",
       "east/west: кровля террасы видна ступенью справа/слева от стены — учтена porch_roofs на north"]
porch_roofs = [
  { side = 2, x = [817.0, 1420.0], y = [362.0, 530.0], kind = "hip", posts = 2, depth_m = 3.0 },
]

