# Проект каркасного дома [Vito] — ИП Кузин А. А.; проект № 54687 на строим.дом.рф
# https://строим.дом.рф/project/54687 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 1–3 (юг, вход под крыльцом), стр. 2 — Ф. 3–1 (север), стр. 3 — Ф. А–Е (восток),
# стр. 4 — Ф. Е–А (запад); 1 pt = 1 px. План 1-го этажа: Г-образный контур — корпус 7,95 x 5,75 м (оси 1–3 x Е–Б)
# и выступ кухни 4,10 x 1,50 м на юго-востоке (оси 2–3 x Б–А); юго-западный угол — открытое крыльцо 5,78 м² на двух
# столбах под общей крышей (стена Б отодвинута на 1,5 м). Стены 0,25 м, размеры осей 7 700 x 7 000, габарит 7 950 x 7 250.
# Стороны по часовой от входа: юг-Б (стр. 1, левая часть, дверь тамбура под крыльцом), запад-корпус (стр. 4, левая часть 5,75 м),
# север (стр. 2), восток (стр. 3), юг-кухня (стр. 1, правая часть 4,10 м), запад-выступ (стр. 4, правая часть 1,50 м,
# внутренний угол после неё). Невязка 0 (3,85 + 4,10 = 7,95; 5,75 + 1,50 = 7,25).
# Масштаб у каждого вида свой (pt/м = ширина стены / длина по плану): юг 1008/7,95 = 126,8; запад 930/7,25 = 128,3;
# север 1031/7,95 = 129,7; восток 916,5/7,25 = 126,4. Сверка по отметкам: стр. 1 +0,900…+3,950 (980 → 590 pt) = 390 pt
# при 126,8 = 3,08 м против 3,05 по листу (1 %); стр. 3 ±0,000…−0,600 = 72 pt / 126,4 = 0,57 м (5 %, цоколь 0,6 по отметке).
# Пол ±0,000 — низ кирпичной кладки (верх цоколя; отметка листа +0,040 стоит на 5 pt выше); цоколь 0,6 м (до отметки −0,600).
# Дом полуторный: 2-й этаж — под скатом, окна 2-го этажа (+3,95…+5,35) уходят во фронтоны юга и севера; карниз на востоке и
# западе — низ свеса 4,45–4,46 м над полом (стр. 3: 563 pt / 126,4; стр. 4: 572 / 128,3); floor_heights = [2,9 до перекрытия, 1,55].
