# «Водолей 2 этажа» — ИП Рубцова Ольга Леонидовна; проект № 39988 на строим.дом.рф
# https://строим.дом.рф/project/39988 ; разметка gf#470 (волна 1, учебная, см. LICENSE.md).
# Листы: стр. 4 — вход (запад: терраса 1,45 м, дверь, окно), стр. 1 — север (тройное окно; слева большая терраса),
# стр. 2 — восток (щипец, терраса 2,47 м на всю стену), стр. 3 — юг (узкое окно). 1 pt = 1 px.
# ВАЖНО: план на листе отражён сверху вниз относительно фасадов. Порядок сторон взят по фасадам, а не по плану:
# у входа (стр. 4) слева стена стр. 1 (там слева большая терраса = восточная), у стр. 1 слева щипец стр. 2,
# у стр. 2 слева стр. 3, у стр. 3 слева терраса 1,45 м = вход. Окна сходятся с планом (юг: окно 0,55 м на 1,4 м от
# запада; север: окно 1,45 м на 1,2 м от востока; 1-й этаж запад: окно 1,0 м у юга), если план отразить.
# Контур 7,9 × 7,2 м (план: 7,90 и 7,20; терраса 2,47 м справа и терраса 1,45 м слева — в контур не входят).
# Масштаб: pt/м = ширина стены / длина: север 1163/7,9 = 147,2; юг 1165/7,9 = 147,5; запад 1500/7,2 = 208,3;
# восток 1485/7,2 = 206,3 (север и юг — один масштаб, щипцы — другой). Отметок уровней на листе нет;
# сверка по двери: 1 155 → 1 568 = 413 pt / 208,3 = 1,98 м (2 м), по окну севера 0,9 м от пола — как на юге.
# Пол — верх настила террасы (дверь стоит на нём), цоколь от земли до него: камень 0,45 + настил над ним 0,4 = 0,85 м;
# низ кирпича на 0,4 м ниже пола (север 1330 при полу 1265).
id = "st-39988"
pdf = "39988/sheet.pdf"
roof = "двускатная ≈33° (конёк +7,46 от пола), профлист; свесы: карнизный 0,9 м, щипцовый 0,55 м; конёк север-юг; под ней мансарда, окна во щипцах"
roof_kind = "gable"
roof_material = "profiled_sheet"  # по рисунку: вертикальные рёбра без волны, подписи нет; не уверен (может быть металлочерепица)
# уклон: tg = (7,46 − 4,54) / (3,6 + 0,9) = 0,649 → 33,0°; по линии ската на щипце (15,622)→(955,15): 605/940 = 0,644 → 32,8°
pitch_deg = 33.0
# свесы: карнизный — щипец стр. 4, кромка кровли 15 pt за стеной 205 = 190 pt / 208,3 = 0,9 м; щипцовый — стр. 1, 85 pt / 147,2 = 0,58 м
overhang_m = 0.9
gable_overhang_m = 0.58
overhang_by = "drawing"
unit = "m"
pt_per_unit = 147.4
material = "brick"        # кирпич: рисунок кладки на всех стенах (цвет на листе синеватый — тонировка)
colors = { main = "#575a69", plinth = "#535763", accent = "#946c45" }
plinth = 0.85
plinth_material = "stone" # рваный камень; рисунок, подписи нет
trim_material = "wood"    # свес и торцевая доска светло-коричневые
floor_heights = [2.8, 2.15]  # этаж 2,8 (карточка); до карниза 4,95 над настилом: север (1265 − 535)/147,2 = 4,96, щипец (1568 − 538)/208,3 = 4,94
trim = { canopy = "posts", door = "plain" }
# входная терраса (запад) и боковая терраса (восток) — односкатные кровли на столбах, скат от стены
porch_roofs = [
  { side = 0, x = [610.0, 1328.0], y = [770.0, 880.0], kind = "shed", posts = 2, depth_m = 1.45 },
  { side = 2, x = [152.0, 1760.0], y = [757.0, 925.0], kind = "shed", posts = 4, depth_m = 2.47 },
]
absent = [
  "все стороны: нет карнизной полосы — только свес и торцевая доска",
  "все стороны: нет подоконников, наличников, ставен и водостока",
  "north, south: нет труб, мансардных и слуховых окон",
]
cut = [
  "west: ступени крыльца к двери (стр. 4 x 520–700, y 1650–1735), перила террасы",
  "west, east: свесы кровли соседней террасы выступают за стену по бокам (стр. 4 x 140–205 и 1705–1770, y 760–935)",
  "north, south: кровля, столбы, ограждение и ступени боковых террас видны сбоку (стр. 1: x 65–500 и 1648–1895; стр. 3: x 5–250 и 1415–1830)",
  "east: ступени террасы в центре (стр. 2 x 745–1170, y 1642–1735)",
  "east: стена под террасой — доски цвета дерева (зона accent wood, по цвету, не уверен)",
  "east: окно в пол 1,5 × 1,9 м — на плане окно, на виде похоже на дверь на террасу; размечено окном panoramic, не уверен",
]

