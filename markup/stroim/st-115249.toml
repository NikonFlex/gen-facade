# Дом без названия на листе (карточка: ИП); проект № 115249 на строим.дом.рф
# https://строим.дом.рф/project/115249 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — юг (вход в нише 4,4 x 1,2 м), стр. 2 — запад (слева север), стр. 3 — восток (слева юг),
# стр. 4 — север (слева восток); стр. 5 — план: 11 595 x 10 050 мм. Порядок листа не по часовой — стороны
# собраны по плану и окнам (окна запада/севера/востока сверены с планом по положению, ошибка до 0,1 м).
# Контур — прямоугольник 11,595 x 10,05 м с нишей входа на юге (план: ниша x 6,9–11,3 м от запада, глубина 1,2 м,
# дверь в глубине). Порядок по часовой от входа: задняя стена ниши (с дверью), западная стенка ниши
# (внутренний угол после задней), южная левая часть 6,91 м, запад, север, восток, столб юго-востока 0,3 м,
# восточная стенка ниши (внутренний угол после неё). Невязка 0. Стенки ниши на листе видны ребром: им
# дан условный отрезок справа от дома на стр. 1, без элементов. Выступ 0,22 м у СВ-угла и выступ дымохода
# на севере (0,3 м) — не размечены.
# Масштаб у каждого вида свой (pt/м): юг 109,45 x 1,96 = 214,5 (стена 1269 px / 11,595 м; сверка по
# отметкам +3,000 → ±0 : 109,3 x 1,96); запад 111,7 x 1,92 = 214,5 (отметки 111,7); север 120 x 1,79 = 214,8
# (отметки 120); восток 121,7 x 1,76 = 214,2 (отметки 121,7; стена на виде 10,29 м — с выступом СВ-угла,
# взято 10,05). Расхождения между отметками и планом менее 1 %. Координаты — pt листа (px картинки).
# Отметки: ±0,000 — верх серой полосы цоколя на видах (юг: +0,200 у низа окон + 0,2 м); карниз +3,000,
# конёк +5,555, низ цоколя −0,180 -> plinth 0,18.
id = "st-115249"
pdf = "115249/sheet.pdf"
roof = "вальмовая, конёк +5,555, карниз +3,000, уклон 20°, свесы ≈1,1 м со всех сторон, кровля серая чешуйчатая"
roof_kind = "hip"
# расчёт по отметкам: (5,555 − 3,000) / (5,025 + 1,1) = 0,417 = 22,7°; линия ската: стр. 3 (777 → 1138; 656 → 384 px) — 272/751 = 20,0°,
# стр. 1 — 244/(5,025+1,1)·109,45 = 20,0°: расходятся >2°, отметка +3,000 у низа свеса — беру по линии ската
pitch_deg = 20.0
overhang_m = 1.1
gable_overhang_m = 1.1
overhang_by = "drawing"
roof_material = "shingle_roof"  # чешуйчатый рисунок рядов, подписи нет — по рисунку, не уверен
unit = "m"
pt_per_unit = 214.5
material = "plaster"  # белая стена без рисунка, подписи нет — по цвету, не уверен
colors = { plinth = "#797979" }
plinth = 0.18
plinth_material = "concrete"  # серая полоса цоколя, по цвету, не уверен
floor_heights = [3.0]
trim = { door = "plain" }
cut = ["north: выступ 0,3 м у x ≈ 5 м от востока — по плану дымоход камина, на кровлю не выходит, не размечен",
       "northeast: выступ угла на 0,22 м к северу — не размечен",
       "south: остекление ниши — окно постирочной стоит в глубине ниши (1,2 м)"]
absent = ["все стороны: нет карнизной полосы, подоконников, наличников, ставен, козырьков",
          "все стороны: нет труб, мансардных и слуховых окон, водостока",
          "все стороны: нет зон второй отделки"]

