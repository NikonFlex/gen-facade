# Ёджили — ООО "ЁХАУС"; проект № 53112 на строим.дом.рф
# https://строим.дом.рф/project/53112 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 1 — фасад 1–4 (юг, вход с козырьком), стр. 3 — А–Д (восток), стр. 2 — 4–1 (север,
# остеклённый щипец), стр. 4 — Д–А (запад); 1 pt = 1 px. Прямоугольник стен 8,6 × 12,0 м (цепочки
# 8 600 и 12 000 мм; крыльцо 1 200 мм на западной и восточной сторонах — вне стен, стойки без стены).
# Масштаб у вида свой: pt/м = ширина стены / длина; сверка по уровням: на Ф. 4–1 +2,890 → +0,084 = 358 pt
# при 2,806 м (≈127 pt/м; по ширине 1062 pt / 8,6 = 123,5), на Ф. А–Д +2,284 → +0,084 = 234 pt при 2,2 м
# (106 pt/м; по ширине 1272 pt / 12,0 = 106), на Ф. 1–4 ширина 1165 pt / 8,6 = 135,5.
# Отметки: ±0,000 — верх тёмного цоколя, −0,800 земля (видимый цоколь 0,29–0,32 м, ниже него на листе
# ничего нет), +3,118 свес, +5,110 конёк. Карниз — стена до свеса на длинных сторонах, 3,12 м над цоколем.
# Три верхних окна щипца — трапеции и пятиугольник по скату: рамка описанным прямоугольником,
# вид `slope` (gf#319) — контур срезает скат модуля.
id = "st-53112"
pdf = "53112/sheet.pdf"
roof = "двускатная ≈22° (конёк +5,110, свес +3,118), металлическая кровля; щипцы на торцах 8,6 м, козырёк над входом на коньковой стойке"
roof_kind = "gable"
# кровля: в описании проекта — металлическая; на видах гладкая серая заливка без профиля волны и швов,
# поэтому metal_roof (фальц), а не metal_tile [не проверено: тип металла по листу не различить]
roof_material = "metal_roof"
# труб, мансардных окон и водостока на листе нет
pitch_deg = 20.0  # уклон: tg = (5,110 − (3,118 + 0,21 толщина свеса)) / (4,3 + 0,6 свес) = 0,363 = 19,9° (gf#470, расчёт; 3,118 — низ свеса)
# свес: карнизный — Ф. 1–4 стр. 1, 63 px у края (0,6 м); фронтонный — Ф. А–Д стр. 3, 46–48 px = 0,6 м
overhang_m = 0.6
gable_overhang_m = 0.6
overhang_by = "drawing"
unit = "m"
pt_per_unit = 135.5
material = "plaster"      # серая штукатурка
plinth = 0.3
plinth_material = "stone" # тёмный цоколь
floor_heights = [3.12]
# обрамление (стр. 1–4): окна и двери в тёмной рамке без подоконника и наличника, ставен нет; входная дверь —
# филёнчатая (4 филёнки, стр. 1); навес над входом двускатный на двух стойках с балкой и фермой (стр. 1)
trim = { canopy = "gable", door = "panel6" }
# крыльцо 2,5 × 1,2 м (план: крыльцо 2,97 м², «Стол, Балка, Столб» с двух сторон) — на виде стр. 1 (x 729–1233, верх 599, низ 717);
# с запада и востока (стр. 3, 4) видно в профиле
porch_roofs = [
  { side = 0, x = [729.0, 1233.0], y = [599.0, 717.0], kind = "gable", posts = 2, depth_m = 1.2 },
]
cut = ["south: двускатный козырёк над дверью на двух стойках размечен как canopy; его стойки и ферма не размечены",
       "south: щипец с отметками +3,946/+3,064 — силуэт в outline, скат кровли не размечен"]
absent = ["все стороны: нет карнизной полосы — только свес кровли",
          "все стороны: нет зон второй отделки"]

