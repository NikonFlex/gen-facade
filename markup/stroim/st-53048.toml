# Одноэтажный дом «План А» 6,5 × 8,0 м с верандой 6,5 × 2,5 м на юге, двускатная крыша — проект № 53048 на строим.дом.рф
# https://строим.дом.рф/project/53048 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 3 — «Фасад-1» (юг, вход с веранды), стр. 1 — «Фасад-2» (запад, веранда справа),
# стр. 2 — «Фасад-3» (север), стр. 4 — «Фасад-4» (восток, веранда слева); 1 pt = 1 px; порядок сторон по часовой от входа.
# План: тамбур с входной дверью выходит на веранду (юг), окно гостиной слева (запад) — как на Ф-1; два окна запада и
# два севера совпали с планом (расстояния от угла сверены с планом). Контур 6,5 × 8,0 м (веранда 2,5 м — вне контура).
# Масштаб у вида свой: юг и север 237,1 pt/м (1541 pt / 6,5 м; отметки +1,250 и +2,750 — 353 pt на 1,5 м = 235, расхождение 0,8 %);
# запад и восток 197 pt/м (1576 pt / 8,0 м; отметки +1,250…+2,750 — 296 pt = 197, веранда 489 pt = 2,48 м).
# Отметки: 0,000 земля, +0,400 низ обшивки (на юге перекрыт настилом веранды +0,650), +1,250 подоконник,
# +2,750 верх окон и двери, +3,096/+3,046 низ свеса, +3,900 верх кровли у конька. «Пол» разметки — низ обшивки (+0,400).
id = "st-53048"
pdf = "53048/sheet.pdf"
roof = "двускатная ≈8,8° (конёк +3,900), конёк с юга на север, черепица по рисунку; скат продолжен над верандой юга (2,5 м); свесы 0,35 и 0,25 м"
roof_kind = "gable"
roof_material = "tile_roof"  # рисунок ступенчатой черепицы на стр. 1 и 4, подписи нет — по рисунку, не уверен (на уклоне 9° чаще металлочерепица)
# уклон: по линии ската — (850 − 983) / (1690 − 837) = 8,9° (стр. 2) и 8,6° (стр. 3), взято 8,8°; по отметкам
# (3,900 − 3,046) / (3,25 + 0,35) = 13,3° — отметка 3,046 у низа свеса, не у кровли, расходятся больше 2°, взято по линии
pitch_deg = 8.8
# свес: карнизный — стр. 3, край кровли 84 pt за стеной / 237 = 0,35 м; фронтонный (север/юг) — стр. 1, 47 pt / 197 = 0,25 м
overhang_m = 0.35
gable_overhang_m = 0.25
overhang_by = "drawing"
unit = "m"
pt_per_unit = 237.1
material = "board_batten"  # вертикальная обшивка узкой доской, подписей нет — по рисунку
plinth = 0.4
plinth_material = "concrete"  # цоколь +0,000…+0,400 гладкий, по цвету/рисунку, не уверен
floor_heights = [2.7]  # +3,096 − +0,400 = 2,70 (по картинке запада 535 pt / 197 = 2,72)
# обрамление: плоский наличник и плоский подоконник у каждого окна; дверь — плоская с остеклённой вставкой
trim = { sill = "flat", casing = "flat", door = "plain" }
# веранда 6,5 × 2,5 м (план) под кровлей дома, продолженной вперёд: на виде юга скат от верха кровли до низа свеса
porch_roofs = [
  { side = 0, x = [917.0, 2458.0], y = [755.0, 967.0], kind = "main", posts = 2, depth_m = 2.5 },  # продолжение крыши дома (gf#472, по чертежу)
]
absent = ["все стороны: нет зон второй отделки — вся стена одной вертикальной доской", "все стороны: нет водостока, труб, мансардных и слуховых окон", "все стороны: нет карнизной полосы кроме подшивки свеса"]
cut = [
  "юг: ограждение веранды из горизонтальных досок высотой ~1,0 м (x 950–1673, y 1345–1543) перед окном, ступени крыльца и столбы-опоры",
  "запад, восток: ограждение веранды из горизонтальных досок (y 1525–1695) и угловые столбы, ступени у веранды",
  "юг: дверь — вставка стекла в полотне, вид двери не уверен",
]

