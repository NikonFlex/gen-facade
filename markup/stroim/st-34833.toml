# «Имам 1» — ИП Мустафин Ингел Радикович; проект № 34833 на строим.дом.рф
# https://строим.дом.рф/project/34833 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. Г–А (запад), стр. 2 — Ф. 4–1 (север, терраса), стр. 3 — Ф. А–Г (восток),
# стр. 4 — Ф. 1–4 (юг, вход; гараж слева); 1 pt = 1 px. План (стр. 5): Г-образный дом — крыло с гаражом
# по осям 1–2 тянется от оси А до оси Г, основной корпус по осям 2–4 только от Б до Г; с севера открытая
# терраса. Стороны по часовой от входа: 0 юг (стена по оси Б, вход), 1 восток крыла, 2 юг крыла (гараж),
# 3 запад, 4 север, 5 восток. После стороны 0 угол внутренний.
# Масштаб у каждого вида свой, pt/м по осям: юг 58,4 (5,1 м = 298 pt, 6,5 м = 380 pt), север 59,1 (5,1 м = 302 pt),
# запад 59,0 (Г–А 15,3 м = 902 pt), восток 56,6 (А–Б 4,99 м = 282 pt, В–Г 5,64 м = 319 pt).
# Уровни: отметка 0,000 — на фасадах ≈ 3,1 м ниже низа свеса и 0,8 м выше земли (−0,800); карниз стены +2,847;
# низ кладки −0,150, поэтому «пол» разметки — чистый пол ±0,000 (y 641 / 655 / 658 по видам).
id = "st-34833"
pdf = "34833/sheet.pdf"
roof = "вальмовая, ≈25,7° (конёк +6,201 у основного корпуса, +4,847 у крыла с гаражом, низ свеса +3,100, карниз стены +2,847); свесы со всех сторон"
roof_kind = "hip"
# pitch: tg = (6,201 − 3,100) / (половина пролёта 5,6 м + свес 0,8 м = 6,4 м) = 0,48 -> 25,8°; по линии ската на виде юг
# (385 pt по горизонтали при 185 pt подъёма) 25,7° — расходятся меньше 2°
pitch_deg = 25.7
overhang_m = 0.8
overhang_by = "drawing"
gutters = true  # водосточные трубы и воронки нарисованы у углов
# кровля на листе: тёмная заливка с вертикальной штриховкой, вид (профнастил, металлочерепица) по рисунку не определить —
# roof_material не пишу
unit = "m"
pt_per_unit = 58.4
material = "brick"  # светлая кирпичная кладка с лёгким рисунком швов, подписей нет — по рисунку, не уверен (может быть штукатурка)
colors = { main = "#8e7c6b", plinth = "#7f5c4a" }
plinth = 0.8
floor_heights = [2.85]
plinth_material = "brick"  # цоколь — кирпичная кладка рядами, по рисунку
# наличники окон — кирпичная рамка «зубчиком» по периметру, подоконников и ставен нет (по рисунку, не по подписи)
trim = { casing = "flat" }
absent = [
  "все стороны: нет карнизной полосы кроме подшивки свеса, подоконников и ставен",
  "все стороны: труб и мансардных окон нет",
]
cut = [
  "все стороны: угловые пилоны (кирпичные столбы 0,55 м с рядами) не размечены зонами",
  "south: козырёк входа на двух столбах — крыша порча под главной кровлей, porch_roofs не записан, виден кронштейн",
  "north: ограждение террасы — стойки и перила не размечены, терраса только площадкой",
  "south: ступени крыльца у входа не размечены",
]

