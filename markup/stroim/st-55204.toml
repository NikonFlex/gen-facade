# Листы: стр. 4 — Ф. 1–2 (юг, вход слева, терраса); стр. 1 — Ф. Г–А (запад, слева север); стр. 2 — Ф. 2–1 (север, глухая);
# стр. 3 — Ф. А–Г (восток, слева юг, терраса). Порядок по плану: вход с юга, далее запад, север, восток (слева у вида — следующая по часовой).
# Контур по плану: 8,161 x 8,759 м (оси), терраса 2,0 м вдоль юга под продолженной кровлей дома.
# Масштаб: юг 8,161 м = 1523,5 pt (186,7 pt/м); запад/восток 8,759 м = 1634 pt (186,6); север 1541 pt (188,8 pt/м, свой масштаб).
# Сверка по высоте: окно 1,4 м = 261 pt (186,4), дверь 2,1 м = 392,5 pt (186,9), дверь 2,3 м = 429 pt (186,5).
# Отметок уровней на листе нет; пол — низ коробок окон и дверей на 0,9 м ниже подоконника; плита/цоколь ниже пола на 0,83 м.
# Стена до карниза: пол -> низ подшивки свеса 2,72 м (карточка: этаж 2,8 м, дом 5 м).
