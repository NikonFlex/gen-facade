# BARN-63 (ООО «БРИГАДА-ПРО»); проект № 54544 на строим.дом.рф, двухэтажный А-образный дом на сваях
# https://строим.дом.рф/project/54544 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 4 — север (вход, дверь слева), стр. 1 — восток (окно у лестницы, терраса слева), стр. 3 — юг (терраса,
# остекление), стр. 2 — запад (глухая); стр. 5–6 — планы. 1 pt = 1 px. Порядок по часовой от входа: север, восток, юг, запад.
# Проверка: слева на виде севера — восток (дверь справа на плане), слева на востоке — юг (терраса 1,335 м слева),
# слева на юге — запад, слева на западе — север (ступень крыльца слева).
# Размеры: 6120 (запад-восток, по наружным граням) × 7635 (север-юг = 300 + 7035 + 300 по плану).
# Масштаб у видов свой: север 788 pt / 6,12 = 128,8 (по отметкам ±0 -> +6,665: 855 pt = 128,3; беру 128,5);
# юг 747 / 6,12 = 122,1 (по отметкам 121,7); восток 898 / 7,635 = 117,6 (по отметкам 117,5);
# запад 818 / 7,635 = 107,1 (по отметкам 106,8). Везде в пределах 3 %.
# Пол разметки — чистый пол ±0,000; сваи, земля -0,800, тёмная обшивка-цоколь 0,5 м ниже пола.
id = "st-54544"
pdf = "54544/sheet.pdf"
roof = "двускатная А-образная 44,8°, конёк +6,665 вдоль север-юг, низ ската у стены +3,62 над чистым полом, свесов нет; кровля тёмная, вертикальные полосы"
roof_kind = "gable"
# уклон: расчёт (6,665 - 3,62) / 3,06 = 0,995 = 44,9°; линия щипца на юге (462-92)/(801-428) = 0,992 = 44,8°; сошлись
pitch_deg = 44.8
overhang_m = 0.0
gable_overhang_m = 0.0
overhang_by = "drawing"
roof_material = "metal_roof"  # тёмные вертикальные полосы со швами; по рисунку, не уверен
unit = "m"
pt_per_unit = 121.7
material = "board_batten"  # тёмная вертикальная обшивка, по рисунку, не уверен (может быть siding_narrow)
colors = { main = "#525252", plinth = "#464646", accent = "#b9a685" }
plinth = 0.5
plinth_material = "board_batten"  # тёмная обшивка на сваях, по рисунку
# этаж один до низа ската: 2-й этаж в мансарде, его окна во фронтоне; перекрытие на +2,3…+2,69 (полоса на югe и севере)
floor_heights = [3.62]
trim = { door = "plain" }
absent = ["все стороны: нет карнизной полосы, свесов, подоконников, наличников, ставен",
          "все стороны: нет труб, водостока, мансардных и слуховых окон",
          "запад: нет окон и дверей"]
cut = ["юг: терраса 1,335 м (настил, ступени) без кровли и перил; светлые доски по скату фронтона (полосы вдоль конька) не размечены",
       "север: крыльцо в нише под балконом 2-го этажа (1,29 м2), ступени; светлые доски по скату фронтона",
       "восток, запад: настил террасы и крыльца виден ступенью слева и справа от стены",
       "север: балкон 2-го этажа — на листе без ограждения, дверь на него размечена как door"]

