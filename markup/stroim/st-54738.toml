  "юг: ограждение террасы (горизонтальные рейки на x 950–2200, y 1390–1490) перекрывает низ окон и дверей — не размечено",
  "юг: боковые части террасы за стеной (ограждение справа x 2290–2450, y 1370–1490) — не размечены",
  "восток: ступени крыльца слева и справа от площадки, ограждение крыльца — не размечены",
