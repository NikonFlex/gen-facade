# Фердинанд Лыткарино (ИП Смирнов М. В.) — проект № 54738 на строим.дом.рф
# https://строим.дом.рф/project/54738 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — восток (вход: крыльцо под навесом, 2 окна, слева крыша террасы), стр. 1 — юг (терраса с остеклением и двумя
# дверями, щипец), стр. 3 — запад (2 окна), стр. 4 — север (щипец, 2 окна во фронтоне, малое окно); стр. 5–6 — планы 2-го и 1-го этажей.
# Порядок по часовой от входа: восток → юг → запад → север. Проверка по левому краю вида: слева у востока — юг (крыша террасы на
# стр. 2), у юга — запад (справа на стр. 1 — крыльцо востока), у запада — север (окно OK-05 слева), у севера — восток (крыша крыльца слева).
# Контур 8,114 × 9,114 м (с плана, стена 307 мм). Масштаб у каждого вида свой, pt/м = ширина стены / длина с плана:
# восток 1586/9,114 = 174,0; юг 1369/8,114 = 168,7; запад 1765/9,114 = 193,6; север 1625/8,114 = 200,3 (расхождение до 15 %).
# Отметок уровней на листе нет: уровни по размеру «0,900» (низ окон над чистым полом) и этажу 2,9 м из карточки: на юге низ окон 2-го
# этажа 0,87 м над полом 2-го, на севере 0,86 — сходится. floor каждой стороны = низ нормального окна + 0,9 м (юг: низ стекла дверей).
# Низ кладки (земля) на 0,72 м ниже чистого пола на всех трёх видах (0,74 / 0,70 / 0,72); цоколь из камня снизу ≈0,35 м, выше — кирпич.
# Карниз (верх стены под свесом) 5,0 м над чистым полом: фронтон юга и севера — 5,01 / 5,09; низ фасции на длинных стенах 4,7 м + подъём ската под свесом.
id = "st-54738"
pdf = "54738/sheet.pdf"
roof = "двускатная 30°, конёк вдоль 9,114 м (север–юг), конёк на 8,4 м над землёй, свесы 0,6 м со всех сторон, водосток; над террасой юга и крыльцом востока свои односкатные 15°, кровля одним тёмным цветом"
roof_kind = "gable"
roof_material = "shingle_roof"  # по рисунку (ряды прямоугольных «чешуек» со смещением, подписи нет) — не уверен: shingle_roof или tile_roof
# tg = (рис. конёк y 191 — край кровли y 641 = 450 pt = 2,67 м) / (4,057 + 0,6) = 0,573 = 29,8°; подпись на листе 30°; линия ската на стр. 4: 465/810 = 0,574 — сходятся
pitch_deg = 30.0
overhang_m = 0.6   # стр. 2: 101 pt / 174 = 0,58; стр. 3: 113 / 193,6 = 0,58
gable_overhang_m = 0.6  # стр. 1: кровля 9,314 м при стене 8,114 — по 0,6 м
overhang_by = "drawing"
unit = "m"
pt_per_unit = 174.0
material = "brick"  # кладка рядами, подписи нет — по рисунку; цвет серо-коричневый, оттенки не читаются
colors = { main = "#84695b", plinth = "#96847b", roof = "#2d2c31" }
plinth = 0.72
plinth_material = "stone"  # цоколь — рваный камень ≈0,35 м над землёй, по рисунку, не уверен: stone или ashlar
floor_heights = [2.9, 2.1]  # второй этаж под скатом: 5,0 м до карниза (2-й этаж по карточке 2,9 м, но стена до карниза выше не идёт)
# обрамления нет: окна в тёмных рамах без подоконников, наличников и ставен; навес над входом на стойках; дверь — стеклянная
trim = { canopy = "posts", door = "plain" }
gutters = true  # водосточные трубы и желоб на стр. 1–4
# терраса юга: односкатная 15° на столбах над деревянной площадкой 7,5 × 3,0 м (план); крыльцо востока: навес 15° на двух стойках, вынос 2,1 м
porch_roofs = [
  { side = 1, x = [797.0, 2360.0], y = [899.0, 1111.0], kind = "shed", posts = 2, depth_m = 3.6 },
  { side = 0, x = [1698.0, 2300.0], y = [1062.0, 1185.0], kind = "shed", posts = 2, depth_m = 2.1 },
]
absent = [
