# Одноэтажный дом, вальмовая крыша; проект № 34984 на строим.дом.рф (название на листе не указано)
# https://строим.дом.рф/project/34984 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — юг (вход, 4 окна, дверь), стр. 2 — запад (одно малое окно ОК 4), стр. 1 — север (ОКД-5 и два окна),
# стр. 3 — восток (ОКД-5); 1 pt = 1 px. План — стр. 5: 13 460 × 10 460 мм, контур прямоугольный, невязка 0.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: на южном виде слева запад, на западном виде
# слева север (окно ОК 4 санузла у середины стены, ближе к северу), на северном слева восток (ОКД-5 гостиной — слева),
# на восточном слева юг (ОКД-5 в середине, чуть ближе к югу) — всё сходится с планом.
# Масштаб — по размерам между осями: юг 1801 pt / 13,2 м = 136,4; запад 1438 / 10,2 = 141,0; север 1820 / 13,2 = 137,9;
# восток 1417 / 10,2 = 138,9. Ширина стены (оси ± 130 мм) сходится с планом: 13,47 / 10,45 / 13,46 / 10,46 м.
# Сверка по отметкам: юг +0,830 → +2,730 = 259 pt / 1,9 м = 136,3; запад +1,700 → +2,300 = 85 / 0,6 = 141,7;
# северный ±0,000 = земля −0,300 + 0,3 м; расхождение < 1 %.
# ±0,000 — верх тёмной полосы цоколя (низ окрашенной стены), юг y 862, запад 912, север 882, восток 873.
id = "st-34984"
pdf = "34984/sheet.pdf"
roof = "вальмовая, четыре ската, конёк вдоль 13,46 м, +5,416; верх кровли у края свеса +3,294; свес ≈0,6 м со всех сторон; водосток; цвет тёмно-коричневый, рисунка кровли нет"
roof_kind = "hip"
# tg = (5,416 − 3,294) / (5,23 + 0,6) = 0,364 → 20,0°; линия ската на западном виде: (447−148)/(1250−427) = 0,363 → 19,9° — сходятся
pitch_deg = 20.0
# свес: на западном виде кромка кровли 87 px за стеной / 141 = 0,6 м; на южном 84 / 136,4 = 0,62 м
overhang_m = 0.6
gable_overhang_m = 0.6
overhang_by = "drawing"
gutters = true
unit = "m"
pt_per_unit = 138.0
# стены окрашены в голубой цвет, рисунка кладки нет — штукатурка (по цвету, не уверен)
material = "plaster"
colors = { main = "#8996a5", plinth = "#595750" }
plinth = 0.3
plinth_material = "plaster"      # тёмно-серая полоса цоколя без рисунка (по цвету, не уверен)
# стена до низа карниза: верх покрашенной стены ≈ +3,05, белая полоса водостока/фасции до +3,2; берём 3,1
floor_heights = [3.1]
trim = { door = "plain" }
chimneys = [
  { side = 0, x = 1770.0, depth_m = 1.9 },
]
absent = [
  "все стороны: нет карнизной полосы кроме белого водостока/фасции",
  "все стороны: нет подоконников, наличников, ставен, козырьков",
  "все стороны: нет мансардных и слуховых окон",
  "west: нет дверей, одно окно; east: нет дверей",
]
cut = [
  "south: вход — затемнённый портал между пилястрами (x 1318–1548, y 475–862, тот же голубой, но темнее — тень или ниша), ступени крыльца под дверью (y 862–900)",
  "south: дверь — тёмная с горизонтальными панелями и ручкой, ДВ-1; вариант plain",
  "все стороны: два вентиляционных выхода на скате (юг x 600–680, запад x 1515, север x 2000–2060, восток x 1010) — не трубы",
  "все стороны: водосточные трубы и воронки на углах",
  "north, east: ОКД-5 — окно в пол с фрамугой сверху, низ на +0,080",
]

