# Barnhouse 8х16 H — ООО "МИНИДОМ.РУ"; проект № 12769 на строим.дом.рф
# https://строим.дом.рф/project/12769 ; разметка gf#470 (волна 1).
# Листы: стр. 4 — запад (вход, остеклённый щипец, дверь), стр. 1 — север (4 окна), стр. 2 — восток
# (глухой щипец), стр. 3 — юг (терраса с остеклением, 3 окна); 1 pt = 1 px. План — стр. 5: 16 000 × 8 000 мм.
# Порядок по часовой от входа: запад → север → восток → юг. Проверка: в виде с запада слева север,
# с севера слева восток, с востока слева юг (ступени террасы слева на стр. 2), с юга слева запад (ступени слева на стр. 3).
# Масштаб у вида свой: север 2147 pt / 16 м = 134,2; юг 2090 / 16 = 130,75; запад 1439 / 8 = 180,0;
# восток 1432 / 8 = 179,0. Сверка по отметкам: север +4,850→+2,550 = 307 pt / 2,3 м = 133,5; юг 300/2,3 = 130,4;
# восток 413/2,3 = 179,6; запад 416/2,3 = 180,9 — расхождение до 0,6 %.
# Отметки: ±0,000 — по маркеру на виде (y 913 / 893 / 962 / 968), он на уровне низа окон; низ обшивки на
# 0,45 м ниже (сваи под ним не размечены), plinth = 0,45 от низа обшивки; карниз +2,550, конёк +4,850.
# Терраса 7,55 × 2,7 м утоплена в юго-западный угол объёма под общей кровлей (план); контур взят
# прямоугольником 16 × 8: остекление террасы и дверь входа поставлены в плоскость стены [не проверено:
# модуль не строит утопленный объём]. Невязка контура 0.
id = "st-12769"
pdf = "12769/sheet.pdf"
roof = "двускатная, конёк вдоль 16 м; карниз +2,550, конёк +4,850, пролёт 8 м, свесов нет (кромки кровли вровень со стеной), кровля в цвет стен"
roof_kind = "gable"
# tg = (4,850 − 2,550) / 4,0 = 0,575 = 29,9°; линия ската на виде запад: (514−98)/(1153−433) = 0,578 = 30,0° — сходятся
pitch_deg = 30.0
overhang_m = 0.0
gable_overhang_m = 0.0
overhang_by = "drawing"
unit = "m"
pt_per_unit = 134.2
# отделка: тонкая вертикальная рейка/доска шагом ≈ 0,11 м по всему фасаду и крыше, подписи нет —
# board_batten_narrow по рисунку [не проверено: вид по рисунку, цвет серый]
material = "board_batten_narrow"
plinth = 0.45
plinth_material = "board_batten_narrow"
floor_heights = [2.55]
# обрамления нет: окна и дверь в тёмных рамах без подоконников, наличников, ставен, козырька
trim = { door = "plain" }
cut = ["west: ступени крыльца террасы у двери и настил — не размечены",
       "south: ступени и настил террасы под остеклением, торец ограждающей стенки террасы слева (3 м) — не размечены",
       "все стороны: сваи под домом (≈0,2 м) — не размечены",
       "south: остекление террасы — одно окно panoramic 3 створки, стоит глубже стены на 2,7 м"]
absent = ["все стороны: нет карнизной полосы и свесов",
          "все стороны: нет зон второй отделки",
          "все стороны: нет труб, мансардных окон, слуховых окон, водостока",
          "east: нет окон и дверей"]

