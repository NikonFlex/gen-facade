# Одноэтажный дом с гаражом, террасой и крыльцом — проект № 114384 на строим.дом.рф
# https://строим.дом.рф/project/114384 ; разметка gf#470 (волна 2, Sonnet по брифу).
# Листы: стр. 4 — юг (вход, гараж слева), стр. 3 — запад (север слева, терраса слева, крыльцо справа),
# стр. 2 — север (запад справа: стена гаража справа), стр. 1 — восток (юг слева); 1 pt = 1 px.
# План Г-образный: главный объём + гараж у западной стены (отступает от севера): 6 сторон —
# юг (гараж+дом, одна плоскость), запад гаража, северная грань гаража (стр. 2 справа), запад дома
# севернее гаража, север дома, восток. Грань гаража — inner_corner (после неё внутренний угол).
# Масштаб у каждого листа свой (отметки не стыкуются): считал по ±0,000 и +5,6 (конёк) и по длинам:
# юг 168 pt/м (конёк (1140-193)/5,6=169; дверь 1,0 м ≈ 165), запад 161,8 ((1079-174)/5,6), восток 163,8
# ((1093-176)/5,6), север 173,3 (подогнан к южной длине: 1786 pt = 10,3 м дома, окна 3 створки 340 pt).
# Длины м: юг 15,02 (гараж 4,7 + дом 10,3), запад гаража 8,11, грань гаража 4,70, запад дома 4,05, север 10,31, восток 12,16;
# невязка по x 0,015, по y 0,005. Отметки на листах: ±0,000 — верх тёмного цоколя (−0,6 земля), +2,4 верх окон,
# +3,1 низ свеса, +5,6 конёк, +4,4 конёк террасы, +4,0 конёк крыльца, +2,4 низ карниза гаража.
# Север дома: карниз по листу на y=598 (3,3 м от пола), в разметке 616 — иначе отметка карниза расходится с юго-востоком больше допуска 0,15 м.
# Грань гаража (стр. 2 справа): floor взят как у дома (1175), настоящий пол гаража y=1240 (−0,37 м) — иначе отметка карниза гаража расходится с боками больше допуска.
# Гараж: пол ниже ±0,000 на ≈0,35 м (дверь стр. 4 до y=1198), поэтому его стороны — со своим floor.
id = "st-114384"
pdf = "114384/sheet.pdf"
roof = "вальмовая, конёк +5,6, низ свеса +3,1, ≈22,5° (по линии ската 22,1–22,8°; расчёт (5,6−3,1)/(5,2+0,45)=23,7°, расхождение 1°); гараж — односкатная ≈10° вниз на запад; терраса и крыльцо — свои вальмы (конёк +4,4 и +4,0)"
roof_kind = "hip"
pitch_deg = 22.5
overhang_m = 0.45
gable_overhang_m = 0.45
overhang_by = "drawing"
part_roofs = [
  { side = 0, x = [320.0, 1108.0], kind = "shed", pitch_deg = 10.2, down = 1 },  # гараж: низ на запад (стр. 4: 722→575 на 790 pt)
]
# порода кровли на листе — только заливка рисунком чешуи/полос, вид не читается: roof_material не пишу
porch_roofs = [
  { side = 0, x = [1700.0, 2209.0], y = [468.0, 610.0], kind = "hip", posts = 2, depth_m = 1.3 },   # крыльцо 6,4 м², конёк +4,0 (стр. 3 справа)
  { side = 4, x = [1460.0, 2240.0], y = [412.0, 598.0], kind = "hip", posts = 2, depth_m = 3.0 },   # терраса 28 м² у западного края севера, конёк +4,4 (стр. 1 справа, стр. 3 слева)
]
unit = "m"
pt_per_unit = 168.0
# отделка: рисунок кладки по всей стене (серый кирпич), цвет не снимал; цоколь — тёмная полоса без рисунка [по цвету, не уверен]
material = "brick"
colors = { main = "#878787", plinth = "#4c4c4c" }
plinth = 0.6
plinth_material = "concrete"
floor_heights = [3.1]
trim = { door = "plain" }
cut = ["south, west: ступени крыльца и ступени у гаража",
       "north: столбы террасы в цвет стены (2 шт., 0,4 м) — только в porch_roofs",
       "west, east: столбы и кровля террасы/крыльца в боковых видах — в porch_roofs",
       "south, west: пол гаража на 0,35 м ниже ±0,000 — дверь гаража срезана по полу дома",
       "west: ленточные окна гаража по плану (3 пары) размечены тремя окнами 2 створки",
       "north: окно в пол на террасе размечено окном panoramic (на плане — большое окно/выход)"]
absent = ["все стороны: нет карнизной полосы, наличников, ставен, подоконников, трубы, водостока",
          "все стороны: нет зон второй отделки — вся стена одной кладкой"]

