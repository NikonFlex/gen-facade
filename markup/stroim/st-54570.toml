# М2 ОПТИ без террасы — ИП Хорольский М. В.; проект № 54570 на строим.дом.рф
# https://строим.дом.рф/project/54570 ; разметка gf#470 (волна 2). Один этаж, вальмовая крыша, кирпич.
# Листы (стр. = facadeN+1, 1 pt = 1 px): стр. 3 — юг (вход, дверь с крыльцом справа), стр. 4 — запад (одно окно, крыльцо справа),
# стр. 2 — север (два окна), стр. 1 — восток (крыльцо слева, два окна). План — стр. 5, размеров в мм на нём нет.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: слева на виде юга — запад (окно спальни 1), слева на виде запада —
# север (крыльцо справа = юг), слева на виде севера — восток (труба в углу с востока), слева на виде востока — юг (крыльцо).
# Масштаб — по отметкам (ни размеров стен, ни габаритов на листе нет): юг ±0,000→+2,350 = 224 px/2,35 м = 95,3 px/м (295,5 pt/м),
# север +0,200→+2,400 = 95,5 (295,9), восток ±0,000→+2,400 = 77,0 (238,8 pt/м), запад 76,7–77,8 (238,8). Ширина юг/север 910 px → 9,55 м,
# восток/запад 917 px → 11,9 м; отношение 1,246, на плане 615/490 px = 1,255 — сходится; полная невязка проверена сборкой.
# Отметки: ±0,000 — низ кладки на всех видах; цоколь (серый бетонный фундамент) уходит до −0,59 (север, восток) и −0,82 (юг, запад) —
# рельеф разный; plinth взят 0,6 [не уверен: у юга и запада 0,82].
id = "st-54570"
pdf = "54570/sheet.pdf"
roof = "вальмовая; конёк +5,288 (2,475 м длиной) и пониженный участок конька +4,483 (1,8 м) над передней частью, кромка кровли +3,35, свес 0,55 м, кровля — мягкая чешуя, тёмно-серая"
roof_kind = "hip"
# tg = (5,288 − 3,350) / (4,775 + 0,55) = 0,364 = 20,0°; линия ската на виде север: (5,31 м по x, 1,94 м по y) = 20,1° — сходятся
pitch_deg = 20.0
overhang_m = 0.55
gable_overhang_m = 0.55
overhang_by = "drawing"
roof_gaps = ["два уровня конька: главный +5,288 и пониженный +4,483 над южной частью (ступень на вальме); модуль строит одну вальму с коньком +5,288"]
roof_material = "shingle_roof"   # «чешуя» мелкими плитками — мягкая кровля, подписи нет
unit = "m"
pt_per_unit = 295.5
material = "brick"    # кирпичная кладка с рисунком шва; светлая (песочная) — основная, подписи нет
colors = { main = "#b9ab8b", plinth = "#6e6e6e", accent = "#525252" }
plinth = 0.6
plinth_material = "concrete"   # гладкий серый цоколь — по цвету, не уверен
trim_material = "wood"   # рыжая подшивка свеса под фасадной доской — по цвету, не уверен
# стена до низа подшивки: +2,93 м от низа кладки (кромка кровли +3,05 / +3,35)
floor_heights = [2.93]
gutters = false
trim = { sill = "flat", door = "plain" }
# труба (канал ~1 м × 0,25 м, серая с рёбрами) в юго-восточной части: на виде юг x ≈ 3683 pt (0,9 м от восточного угла), на виде восток 2,9 м от юга
chimneys = [
  { side = 0, x = 3683.0 },
]
# крыльцо под продолжением кровли на столбах, справа на виде юг (восточная часть фасада): план — столбы 4,9–9,55 м от запада
porch_roofs = [
  { side = 0, x = [2579.0, 4114.0], y = [884.0, 1215.0], kind = "hip", posts = 2, depth_m = 1.7 },
]
cut = ["south, east, west: ограждение крыльца (горизонтальные доски) и ступени — не размечены",
       "south, north, east, west: тёмная доска над окнами (пояс над проёмом) — вторая отделка уже кирпич, не размечено",
       "все стороны: оранжевая подшивка карниза под фасадной доской — одна полоса",
       "south: дверь с деревянным наличником и филёнками (две филёнки с арочным верхом)",
       "south: крыльцо — левый столб за пилястрой, правый столб у угла (план), не размечены",
       "east: вентканал/труба ~1 м × 0,25 м — труба принята одна"]
absent = ["все стороны: нет водостока, ставен, мансардных и слуховых окон",
          "все стороны: нет наличников у окон (только тёмная доска над проёмом)"]

