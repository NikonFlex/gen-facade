# Каркасный дом КД-4 — ИП СТЕКЛОВ Д. А.; проект № 53422 на строим.дом.рф
# https://строим.дом.рф/project/53422 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 2 — Ф. в осях 1–4 (юг, вход), стр. 3 — Ф. А–В (запад), стр. 4 — Ф. 4–1 (север),
# стр. 1 — Ф. В–А (восток); 1 pt = 1 px. Прямоугольник 10,6 × 6,2 м (оси 1–4 и А–В по краям стены).
# Масштаб у вида свой: pt/м = ширина стены / длина оси; сверка по подписанным размерам: окно ОК-2 1200 мм
# (подоконник 800) — 364 pt при 309,6 pt/м (1,18 м), дверь 2060 мм — 638 pt (309 pt/м).
# Отметки: ±0,000 ЧП (пунктир), +2,510 карниз, +2,825 свес, +4,550 конёк. Обшивка идёт на 0,22 м ниже
# ±0,000; ниже неё — тёмный цоколь 0,39 м, поэтому «пол» разметки — низ обшивки, а карниз 2,51 над
# ±0,000 = 2,73 м над ним. Рамки окон и дверей — по внешнему краю наличника.
id = "st-53422"
pdf = "53422/sheet.pdf"
roof = "двускатная ≈32° (конёк +4,550, карниз +2,510), металлочерепица; свесы 0,5 м, водосточные трубы"
roof_kind = "gable"
pitch_deg = 32.0
# свес: карнизный — Ф. А–В стр. 3, край кровли ~190 pt за стеной / 312 pt/м = 0,6 м (в шапке «0,5 м»); фронтонный — Ф. 1–4 стр. 2, 163–180 pt / 309,6 = 0,55 м
overhang_m = 0.6
gable_overhang_m = 0.55
overhang_by = "drawing"
unit = "m"
pt_per_unit = 309.6
material = "wood"         # коричневая обшивка «имитация бруса» горизонтально
plinth = 0.39
plinth_material = "concrete"  # тёмно-серый цоколь
floor_heights = [2.73]
cut = ["south: площадка и три ступени крыльца перед дверью ДН-1",
       "east: контур двери 2 600 мм без полотна (глухое поле на торце) — окна нет, не размечен",
       "south: окно ОК-4 заходит ниже пола крыльца на 0,06 м — обрезано по стене",
       "все стороны: водосточные трубы, фронтонные свесы"]
absent = ["все стороны: нет карнизной полосы — только свес кровли с желобом; west, east: щипцовые стены",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой"]

