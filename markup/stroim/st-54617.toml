# Двухэтажный дом ДК-120 — ИП Бобров А. П.; проект № 54617 на строим.дом.рф
# https://строим.дом.рф/project/54617 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. А–Г/1 (восток, слева юг), стр. 2 — Ф. Г/1–А (запад, слева север; справа торец ниши),
# стр. 3 — Ф. 3–1 (север, терраса под кровлей), стр. 4 — Ф. 1–3 (юг, вход ДВ-01); 1 pt = 1 px.
# Дом 8,58 × 9,45 м по наружным граням (оси 1–3 7,67 м, А–Г 7,15 м, терраса Г–Г/1 3,26 м), Г-образный контур
# с нишей крыльца (под балконом) в юго-западном углу; шесть сторон по часовой от юго-восточной части (стр. 4 справа):
# 0 юг-спальня 4,23 · 1 торец ниши крыльца (запад, стр. 2 справа) 1,43 · 2 юг-вход 4,33 · 3 запад 8,03 · 4 север 8,58 · 5 восток 9,45.
# Порядок: слева на виде юга — ось 1 (запад), слева на виде запада — Г/1 (север), слева на севере — 3 (восток),
# слева на востоке — А (юг).
# Масштаб — у каждого вида свой, pt/м = ширина стены / длина с плана: юг 1455/8,58 = 169,6; запад 1075/8,03 = 133,9;
# север 1220/8,58 = 142,2; восток 1327/9,45 = 140,4. Сверка: дверь ДВ-01 2,1 м = 353 pt (168 pt/м, юг);
# ряд окон/этаж 3,05 м (пол 1 — пол 2) = 518 pt (170); дом 4,32 м до карниза (север 614/142,2, восток 607/140,4) — в пределах 3 %.
# Отметки: ±0,000 на листе — у низа цоколя; пол — по низу кладки (граница кладки и серого цоколя), цоколь 0,28–0,3 м;
# конёк +7,95 (над цоколем ≈ 7,65 над полом: по пикселям 7,5–7,6 м — в пределах 3 %).
# Два этажа: пол 1 → пол 2 ≈ 3,05 м, но второй этаж мансардный — стена до карниза 4,32 м (окна и дверь 2 этажа во
# фронтоне), поэтому floor_heights одно число (бриф: мансарда без карниза выше — не этаж).
id = "st-54617"
pdf = "54617/sheet.pdf"
roof = "двускатная ≈30°, конёк +7,95 вдоль оси А–Г/1 (щипцы на юге и севере), свес карнизный ≈0,70 м, щипцовый ≈0,63 м, кровля чешуйчатая (гибкая), трубы две; над террасой на севере — односкатный навес"
roof_kind = "gable"
# уклон: по отметкам (7,95 − ≈5,0 у низа свеса) / (4,29 + 0,70) ≈ 30°; по линии ската на видах (стр. 3: (985−565)/709) = 30,6°; расхождение <2° — взято 30
pitch_deg = 30.0
overhang_m = 0.70
gable_overhang_m = 0.63
overhang_by = "drawing"
roof_material = "shingle_roof"   # «чешуя» с выемками на всех видах — гибкая кровля, по рисунку, подписи нет
gutters = true
chimneys = [
  { side = 3, x = 1097.0, depth_m = 0.9 },    # запад (стр. 2): труба над западным скатом, ось В
  { side = 5, x = 845.0, depth_m = 2.98 },     # восток (стр. 1): труба над восточным скатом, ось В
]
unit = "m"
pt_per_unit = 169.6
material = "brick"          # светлая кладка (рисунок кирпича, подписи нет)
colors = { main = "#958a6f", plinth = "#d9832f", accent = "#4d423a", roof = "#3d342c" }
plinth = 0.3
plinth_material = "concrete"   # серый цоколь без рисунка, по цвету, не уверен
floor_heights = [4.32]
porch_roofs = [
  # терраса 3,26 м по оси Г/1 (от стены ≈2,83 м), четыре кирпичных столба, односкатный навес; на севере (стр. 3) — лицом
  { side = 4, x = [225.0, 1485.0], y = [1140.0, 1250.0], kind = "shed", posts = 4, depth_m = 2.83 },
]
cut = ["юг: балкон 2 этажа над нишей крыльца — край плиты (x 355–1090, y ≈1453–1465), перила не нарисованы; крыльцо 6 м² и ступени у ДВ-01 не размечены",
       "юг: угловой столб ниши у оси А/1 (план) на виде не читается",
       "восток, запад, север: водосточные желоба и трубы по краям, антенна/громоотвод у коньков (стр. 1, 3, 4)",
       "запад: у ниши (x 1590–1780) светлое пятно/тень — торец ниши, элементов нет; терраса справа на стр. 1 и слева на стр. 2 — только навес и кирпичный столб",
       "восток: на стене рядом с ОК-01 (x 705–800) тёмная полоса высотой в стену отнесена в зону тёмной кладки, не уверен, что это не канал/вставка",
       "север: тёмный ригель (y 1140–1250) — навес террасы, размечен porch_roofs; кирпичные столбы террасы — pillar по плану (x 272, 664, 1049, 1437)",
       "все стороны: вентвыход/флюгер у труб на стр. 3, 4"]
absent = ["все стороны: нет карнизной полосы, подоконников, наличников, ставен, козырьков",
          "все стороны: нет мансардных и слуховых окон"]

