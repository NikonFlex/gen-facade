# Одноэтажный дом 10,0 × 6,7 м (+ терраса 2,5 м с запада) с плоской крышей, обшивка вертикальной доской — проект № 54963 на строим.дом.рф
# https://строим.дом.рф/project/54963 ; разметка gf#470 (волна 2, Sonnet по брифу целиком).
# Листы: стр. 1 — север (терраса, панорамные окна; слева восток), стр. 2 — восток (глухой), стр. 3 — запад
# (слева север: дверь на террасу и остекление), стр. 4 — юг (вход со ступенями; слева запад); 1 pt = 1 px.
# Порядок сторон по часовой от входа: юг, запад, север, восток (проверено по плану и сопряжению слева).
# Масштаб: на листе нет отметок; pt/м = ширина вида / размер плана: юг и север 1327–1332 pt / 12,5 м
# (10,0 + 2,5 терраса, пол-дома с западной террасой под одной стеной) ≈ 106,3; запад и восток 762 pt / 6,7 м ≈ 113,7.
# Расхождение видов 7 % — у каждого вида свой pt_per_unit. Высота карниза: 335 pt от пола до низа кровли ≈ 3,0 м
# (3,15 по северному масштабу, 2,95 по западному) — взято 3,0 [не проверено: отметок нет].
# Пол — низ окон/порога (y 685), цоколь — низ обшивки до сваи ≈ 0,3 м.
