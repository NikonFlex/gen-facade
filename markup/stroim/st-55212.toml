# ELITE129 (ИП Жаров В. С.), одноэтажный дом 15,76 × 9,55 м с вальмовой крышей — проект № 55212 на строим.дом.рф
# https://строим.дом.рф/project/55212 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы (4096 pt по ширине, 1 pt = 1 px): стр. 4 — Ф. 1–5 (юг, вход между осями 2 и 3), стр. 1 — Ф. В–А (запад),
# стр. 3 — Ф. 5–1 (север), стр. 2 — Ф. А–В (восток). Координаты сняты с уменьшенной копии листа и пересчитаны (×2,2756).
# Контур по часовой от входа, 10 сторон: 0 стена крыльца (оси 2–3, внутренний угол), 1 восточная грань блока спальни (0,65 м),
# 2 юг спальни (оси 1–2), 3 запад, 4 север, 5 восток, 6 юг котельной (оси 4–5, на оси Б, внутренний угол),
# 7 восточная грань блока кухни (0,65 м), 8 юг кухни (оси 3–4, на оси А), 9 западная грань блока кухни (внутренний угол).
# Стороны 1 и 9 на листах закрыты ближними стенами (1 — гранью 7, 9 — западной стеной 3): им даны те же диапазоны, окон на них нет.
# Масштаб у видов свой: юг — 14 960 мм осей 1–5 = 1445 px уменьшенной копии → 219,8 pt/м; север — 1467 px → 223,1 pt/м;
# запад/восток — 8740 мм осей В–Б = 985 px → 256,5 pt/м. Сверка: высота стены 3,30 м (0,000 → верх стены) = 372 px на западе/востоке
# (3,30 м по масштабу), на юге 319 px (3,30 м). Расхождения менее 3 %.
# Отметки: ±0,000 чистый пол = низ стены, −0,150 земля, +2,400 верх окон, +0,900 низ окон юга/востока/запада, +2,100 верх двери,
# +3,383 у свеса, +6,165 и +6,015 коньки. Стена от пола до карниза 3,30 м.
id = "st-55212"
pdf = "55212/sheet.pdf"
roof = "вальмовая, ≈26°, коньки +6,165 и +6,015 (два уровня над Г-образным контуром), свес ≈0,5 м, гибкая черепица с кирпичным рисунком, водосток по периметру"
roof_kind = "hip"
roof_material = "shingle_roof"  # рисунок «кирпичной» гибкой черепицы; подписи нет, не уверен
# уклон: расчёт (6,165 − 3,383)/(5,59 + 0,5) = 0,457 → 24,6°; по линии ската на Ф. В–А: 295/630 px = 0,468 → 25,1°; расхождение < 2°, взят расчёт с запасом на свес
pitch_deg = 25.0
overhang_m = 0.5
overhang_by = "drawing"
gutters = true
unit = "m"
pt_per_unit = 256.5
material = "plaster"      # светло-жёлтая гладкая штукатурка
colors = { main = "#f4ebc2", plinth = "#a08f72", accent = "#b2a180" }
plinth = 0.15
plinth_material = "stone" # полоса цоколя «рваный камень», по рисунку
floor_heights = [3.3]
trim = { door = "plain" }
roof_gaps = ["два уровня конька (+6,165 над осями 1–3 / +6,015 над 3–5) на одной вальме — сведены в одну крышу"]
cut = ["юг/север/запад/восток: вертикальная деревянная обшивка (wood) вокруг окон — не вторая отделка, камень по площади чуть больше (по цвету, не уверен)",
       "юг: ступеней и площадки крыльца на виде нет (План: крыльцо 2,69 м² открытое)",
       "все стороны: вентвыходы (дымники) на кровле у углов и светильники на стенах",
       "стороны 5 и 3: деревянная полоса за окном — часть деревянной обшивки",
       "север: стеклянные створки в пол вместо дверей — разметка как окна panoramic (не уверен: у 2-го слева створка похожа на дверь)"]
absent = ["все стороны: нет карнизной полосы — только фасция с желобом", "все стороны: нет подоконников, наличников и ставен"]

