# Каркасный дом «Каркас 3» — ИП Коротаева Т. Ю.; проект № 43341 на строим.дом.рф
# https://строим.дом.рф/project/43341 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 4 — юг (вход, терраса на столбах), стр. 2 — запад (щипец), стр. 3 — север, стр. 1 — восток (щипец);
# порядок сторон проверен по плану: терраса у юга с западного края (на южном виде слева, на западном — справа),
# окно севера — на 2,8–4,5 м от восточного угла (на северном виде слева). 1 pt = 1 px.
# Прямоугольник дома 10,43 × 7,50 м (план, размеры в мм); терраса 7,91 × 1,50 м вынесена на юг, не в контуре.
# Масштаб у каждого вида свой: pt/м = ширина стены / длина стены: юг 1352/10,43 = 129,6; север 1306/10,43 = 125,2;
# запад 990/7,5 = 132,0; восток 1001/7,5 = 133,6. Отметок уровней на листе нет — сверка по высоте окон:
# везде 1,70 м (юг 219 pt, север 212 pt, запад 224 pt, восток 227 pt) и по высоте карниза 2,99 м на всех четырёх видах.
# Пол — низ обшивки (отметок нет); ниже тёмно-серый цоколь ≈ 0,15 м.
id = "st-43341"
pdf = "43341/sheet.pdf"
roof = "двускатная ≈25° (конёк ≈5,07 м над полом, карниз 2,99 м), мягкая кровля; свесы 0,5 м со всех сторон, южный скат продолжен над террасой на 1,5 м; водосток"
roof_kind = "gable"
# кровля: на видах север и юг рисунок «чешуйчатой» мозаики — мягкая кровля
roof_material = "shingle_roof"
# труб и мансардных окон нет
gutters = true
# уклон: отметок нет, считаю по виду восток: подшивка у стены 464 → низ щипца 232 pt при полупролёте 3,75 м (133,6 pt/м):
# tg = 232 / (3,75 · 133,6) = 0,463 = 24,8°; линия ската по кромке свеса (823,187)→(1390,450): tg = 263 / 567 = 0,464 = 24,9°
pitch_deg = 25.0
# свес: восток, правый край кровли 1390 против стены 1323 = 67 pt / 133,6 = 0,50 м; щипцовый: север, 63 и 61 pt / 125,2 = 0,5 м
overhang_m = 0.5
gable_overhang_m = 0.5
overhang_by = "drawing"
unit = "m"
pt_per_unit = 129.6
# обшивка — зелёные узкие горизонтальные доски с пазами через ≈0,11 м; вид по рисунку, подписи нет — не уверен (siding или imitation_timber)
material = "siding"
colors = { main = "#878c69", plinth = "#99948b" }
plinth = 0.15
plinth_material = "concrete"  # серый цоколь по низу стены, по цвету — не уверен
floor_heights = [2.99]
# обрамление: белая плоская коробка вокруг окон (≈0,09 м), подоконников и ставен нет; входная дверь — тёмная глухая с раскосом
trim = { casing = "flat", door = "plain" }
# терраса 7,91 × 1,50 м на 5 столбах под продолженным южным скатом (план: «Терраса 10,8 м²»; на южном виде x 204–1229,
# верх ската над террасой 550 — кромка свеса востока, низ 680 — низ фасции у столбов)
porch_roofs = [
  { side = 0, x = [140.0, 1229.0], y = [550.0, 680.0], kind = "gable", posts = 5, depth_m = 1.5 },
]
cut = ["south: ступени крыльца (2,04 м) и настил террасы, угловые столбы закрыты водосточными трубами",
       "все стороны: водосточные трубы и воронки, щипцовые свесы, карнизная фасция",
       "south: верх двери и двух окон террасы закрыт фасцией — высота по 1,70 м окна и двери по соседним видам"]
absent = ["все стороны: нет карнизной полосы — только свес кровли с желобом",
          "все стороны: нет зон второй отделки, подоконников, ставен, наличников шире плоской коробки"]

