# Кирпичный дом (Авиастрой) — ИП ЖИЛЬЦОВ А. Е.; проект № 43877 на строим.дом.рф
# https://строим.дом.рф/project/43877 ; разметка gf#470, волна 1 (учебная, см. LICENSE.md).
# Листы: стр. 1 — фасад 11180 мм (запад, окна слева, крыльцо справа), стр. 2 — фасад 18470 мм (север, терраса
# 3000 мм справа), стр. 3 — фасад 11180 мм (восток, крыльцо слева), стр. 4 — фасад 18470 мм (юг, вход,
# терраса слева); 1 pt = 1 px. Порядок сторон по плану: юг (вход) -> запад -> север -> восток (по часовой).
# Стены 15,47 x 9,75 м (план: 15470 и 9750 мм); терраса 3000 мм у северного конца западной стены и крыльцо
# 1430 мм у южной — вне стен. Масштаб у каждого вида свой: pt/м = ширина стены / длина.
# Сверка: юг стена 657-2614 = 1957 pt / 15,47 = 126,5; север 288-2183 = 1895 / 15,47 = 122,5; запад 271-1553 =
# 1282 / 9,75 = 131,4; восток 551-1911 = 1360 / 9,75 = 139,5. Проверка по стене до карниза 3,0 м: юг 380 pt (126,7),
# север 368 (122,7), запад 395 (131,7), восток 416 (138,8) — совпало, расхождение менее 1 %.
# Отметок уровней на листе нет; размеры: полная высота 5944 мм от земли, стена до карниза 3000, цоколь по рисунку.
# floor — низ кладки (верх красной цокольной полосы; порог входной двери +150 мм выше него).
id = "st-43877"
pdf = "43877/sheet.pdf"
roof = "вальмовая, ≈20° (по линии ската, высота от земли 5944 мм), свес ≈0,5 м, тёмно-коричневая мягкая кровля; над террасой и крыльцом свои пониженные кровли; две трубы на коньке"
roof_kind = "hip"
roof_material = "shingle_roof"  # мелкая «чешуя» на видах; по рисунку, не уверен (может быть и черепица)
# pitch: от карниза (низ свеса, отметка 380 pt на стр. 1) до конька вальмы (122 pt): 258 pt = 1,96 м; половина пролёта
# 4,875 м + свес 0,5 м = 5,375 м -> tg 0,365 -> 20,0°; по отметке стены (2,17 м) вышло бы 22° — берём по линии ската (20°)
pitch_deg = 20.0
overhang_m = 0.5
gable_overhang_m = 0.5
overhang_by = "drawing"
unit = "m"
pt_per_unit = 126.5
material = "brick"        # светло-жёлтый облицовочный кирпич
colors = { main = "#bea474", plinth = "#b38767" }
plinth = 0.78
plinth_material = "brick" # красная кирпичная полоса и светлая гладкая нижняя — по цвету, не уверен (возможно штукатурка/камень)
trim_material = "wood"    # тёмно-коричневая фризовая доска свеса — по цвету, не уверен
floor_heights = [3.0]
# обрамление (стр. 1-4): окна в тёмной коробке с наличником-рамкой из кирпича вокруг (flat, не уверен); без подоконника
# и ставен; входная дверь тёмная глухая плоская (стр. 4)
trim = { casing = "flat", door = "plain" }
chimneys = [
  { side = 2, x = 1153.0, depth_m = 1.85 },
  { side = 2, x = 1537.0, depth_m = 1.3 },
]
# вход: открытое крыльцо 1430 мм на двух кирпичных столбах под щипцовой кровлей (стр. 4, x 1187-1702 pt, верх 243)
# терраса 3000 x 3770 мм у северного конца западной стены под пониженной вальмой на столбах, парапет 975 мм (стр. 2)
porch_roofs = [
  { side = 0, x = [1187.0, 1702.0], y = [243.0, 362.0], kind = "gable", posts = 2, depth_m = 1.43 },
  # терраса — у западной (торцевой) стены, а не у северной: на северном виде (стр. 2) она видна справа за краем стены
  # профилем (x 2183–2613 — вынос 3,0 м), на западном (стр. 1) — лицом слева: x 271–766 (3,77 м от северного конца),
  # конёк у х 520 на y 265 (+4,09 над полом), низ кровли y 406 (+3,0). Была на северной стене за её концом — навес висел в воздухе
  { side = 1, x = [271.0, 766.0], y = [265.0, 406.0], kind = "hip", posts = 2, depth_m = 3.0 },
]
cut = ["все стороны: угловые и проёмные пилястры из тёмного кирпича с рустовкой (не зоны, та же кладка)",
       "север: парапет террасы 975 мм и два столба террасы (левый сливается с пилястрой стены)",
       "запад: низкая кирпичная стенка 975 мм под окном 1 — часть террасы",
       "юг, восток: боковые стенки крыльца 975 мм и ступень порога",
       "запад, восток: широкая труба с двумя стволами видна на коньке — размечено как две трубы по северному виду"]
absent = ["все стороны: нет карнизной полосы — только фризовая доска свеса",
          "все стороны: нет водостока, ставен, подоконников и мансардных окон",
          "все стороны: нет зон второй отделки"]

