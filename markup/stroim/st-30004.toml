# Проект № 30004 на строим.дом.рф — https://строим.дом.рф/project/30004 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — север (вход под двускатным навесом, слева терраса под продолжением ската), стр. 2 — восток
# (щипец с двумя окнами по скату, справа навес входа), стр. 4 — юг (4 окна, справа терраса), стр. 3 — запад (щипец,
# одно окно в пол, слева навес входа); 1 pt = 1 px. План — стр. 5: 13 400 × 7 660 мм по осям 1–6 и Д–А, терраса 3 м за осью 6 на восток.
# Порядок по часовой от входа (вход — на северной стене плана): север → восток → юг → запад. Проверка: на севере слева
# терраса/восток, на востоке слева юг (навес входа справа = север), на юге слева запад, на западе слева навес входа = север.
# Масштаб: север 2110 pt / 13,4 м = 157,5 (сверка: 0 → 2,35 = 370 pt / 2,35 = 157,4); восток 1807/7,66 = 236,0;
# запад 1808/7,66 = 236,0 (0 → 2,8 = 662 pt / 2,8 = 236,6); юг 3166/13,4 = 236,3 — расхождение до 0,3 %, на востоке по отметке 3,024 — 2 %.
# Отметки: ±0,000 — чистый пол (маркер 0 на видах), низ пола −0,224 (дом на сваях), земля −0,774; цоколь = 0,224 м от пола вниз,
# сваи под полом не размечены. Стена из панелей до +2,80, выше — пояс до +3,024 (низ кровли на стене) -> floor_heights 3,02.
# Контур замкнут: 13,4 + 7,66 + 13,4 + 7,66, невязка 0.
id = "st-30004"
pdf = "30004/sheet.pdf"
roof = "двускатная, конёк вдоль 13,4 м, +4,838, низ кровли на стене +3,024, уклон 20° (отметка на листе); свес 0,6 м со всех сторон; скат над севером продолжен над входом (навес) и над террасой на востоке"
roof_kind = "gable"
roof_material = "metal_tile"  # волнистый рисунок с уступом, подписи нет — по рисунку, не уверен
# tg = (4,838 − 3,17) / (3,83 + 0,6) = 0,377 = 20,6°; линия ската на виде восток: 260/710 = 0,366 = 20,1°; метка 20° — сходится
pitch_deg = 20.0
overhang_m = 0.6
gable_overhang_m = 0.6
overhang_by = "drawing"
unit = "m"
pt_per_unit = 157.5
material = "board_batten"  # вертикальные панели шириной 0,4–0,8 м, подписи нет — по рисунку, не уверен
plinth = 0.224
plinth_material = "concrete"
floor_heights = [3.02]
trim = { canopy = "gable", door = "plain" }
porch_roofs = [
  { side = 0, x = [260.0, 827.0], y = [761.0, 807.0], kind = "main", posts = 2, depth_m = 3.0 },  # продолжение крыши дома (gf#472, по чертежу)
  { side = 0, x = [1691.0, 2181.0], y = [761.0, 893.0], kind = "main", posts = 2, depth_m = 1.7 },  # продолжение крыши дома (gf#472, по чертежу)
  { side = 2, x = [3391.0, 4242.0], y = [512.0, 566.0], kind = "main", posts = 2, depth_m = 3.0 },  # продолжение крыши дома (gf#472, по чертежу)
]
absent = ["все стороны: нет карнизной полосы — только свес кровли",
          "все стороны: нет зон второй отделки, труб, мансардных и слуховых окон, водостока"]
cut = ["все стороны: сваи и цоколь на сваях ниже пола, земля −0,774 — не размечены",
       "north, east, south: ступени у террасы и навеса — не размечены",
       "east: терраса 3 м перед стеной (столб по центру, кровля вровень со скатом) — на виде восток размечен только столб",
       "east: окна по скату — два окна slope по 2 створки; на плане восточная стена с тремя проёмами, раскладка по виду"]

