# Одноэтажный дом 11,0 × 9,0 м с двускатной крышей и южным щипцом — проект № 111464 на строим.дом.рф
# https://строим.дом.рф/project/111464 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. Е–А (запад), стр. 2 — Ф. А–Е (восток), стр. 3 — Ф. 1–4 (юг, вход), стр. 4 — Ф. 4–1 (север);
# 1 pt = 1 px. Порядок сторон по плану (А снизу = юг): юг, запад, север, восток; сверен с левым краем вида
# (юг слева — ось 1 = запад; запад слева — Е = север; север слева — 4 = восток; восток слева — А = юг).
# Масштаб у вида свой: pt/м = расстояние между крайними осями / размер плана: юг 1485/11,0 = 135,0; запад 1188/9,0 = 132,0;
# север 1438/11,0 = 130,7; восток 1224/9,0 = 136,0. Сверка по уровням: земля −0,870 … ±0,000 = 117 / 115 / 114 / 118 pt
# (по масштабу 118 / 115 / 114 / 118); верх окон +2,300 над ±0,000 = 311 pt на юге при 135 pt/м — совпадает.
# Отметки: ±0,000 чистый пол (низ сайдинга на ~0,1 м ниже), земля −0,870, +2,715 верх стены под свесом, +4,914 конёк.
# Устройство: прямоугольник 11,0 × 9,0 м; в юго-западном углу терраса (2,0 м) и в юго-восточном крыльцо (2,0 м) — оба
# вдвинуты в контур под основную кровлю, стена на виде юга по линии А у гостиной и по линии Б у террасы и крыльца.
# Контур как прямоугольник по осям.
id = "st-111464"
pdf = "111464/sheet.pdf"
roof = "двускатная, конёк вдоль восток-запад, ≈20,5° (конёк +4,914, низ свеса +2,715), мягкая кровля «чешуёй»; на юге крутой поперечный щипец ≈38° над гостиной; свесы со всех сторон, водосток, вентвыходы"
roof_kind = "gable"
# pitch: расчёт tg = (4,914 − 2,715)/(4,5 + 0,5) = 0,44 -> 23,7°; линия ската на листе (стр. 1: 224 pt на 605 pt по горизонтали,
# 0,374; стр. 3: 265 на 668 = 0,397) даёт 20,5-21,6°, расхождение больше 2° — взята линия ската: 20,5
pitch_deg = 20.5
# отметка +2,715 стоит у низа свеса, не у кровли
roof_material = "shingle_roof"  # «чешуя» со скруглёнными лепестками; по рисунку, не уверен (может быть черепица)
# свес: стр. 1 — край ската на 70 pt за стеной (132 pt/м) = 0,53 м; щипцовый: стр. 3 — 57 pt при 135 = 0,42 м
overhang_m = 0.5
gable_overhang_m = 0.42
overhang_by = "drawing"
# поперечный щипец на юге: основание 820–1530 pt (5,3 м), конёк на высоте основного; линия ската 0,78 -> 38°
# (расчёт (4,914 − 2,715)/2,63 = 0,84 -> 40°, расхождение < 2°)
roof_gaps = ["south: поперечный щипец 38° над гостиной круче основной крыши (20,5°), коньки на одной высоте"]
chimneys = []
gutters = true
unit = "m"
pt_per_unit = 135.0
material = "imitation_timber"  # горизонтальная обшивка, шаг ≈0,33 м с тонкими линиями — по рисунку, не уверен (может быть siding)
colors = { main = "#5f6063", plinth = "#6d6d6c", roof = "#505154" }
plinth = 0.87
plinth_material = "concrete"   # гладкий серый цоколь — по цвету, не уверен
trim_material = "wood"
floor_heights = [2.715]
trim = { door = "plain" }
cut = ["все стороны: водосточные трубы и воронки, вентвыходы на кровле (4 на западе и востоке, 3 на юге и севере — тоньше трубы)",
       "south: перила террасы и крыльца (балясины 0,7 м), угловые столбы террасы, ступени террасы (под гостиной) и крыльца",
       "west: перила террасы и столб на углу; east: ступени крыльца и террасы",
       "south: стена верхнего света щипца — окна ОК-3/ОК-4 над ОК-1/ОК-2 размечены одним окном со скатом на каждый блок"]
absent = ["все стороны: нет карнизной полосы, зон второй отделки, наличников, подоконников, ставен и козырьков"]
