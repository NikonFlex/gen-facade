# Одноэтажный дом 14,0 x 8,5 м с террасой — проект № 53180 на строим.дом.рф (одноэтажный, кирпич, двускатная)
# https://строим.дом.рф/project/53180 ; разметка gf#470 (волна 2).
# Листы: стр. 3 — юг (вход, оси 1–5), стр. 1 — запад (оси В–Б–А слева направо: слева север), стр. 4 — север
# (оси 5–1: слева восток), стр. 2 — восток (оси А–Б–В: слева юг; два окна в пол на террасу); 1 pt = 1 px. План — стр. 5.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: слева в виде юга — запад (ось 1), слева
# в виде запада — север (ось В), слева в виде севера — восток (ось 5, терраса), слева в виде востока — юг (А).
# Длины: оси 1–5 = 13 200, А–В = 7 700 мм; стены выступают за оси на ~0,4 м (по чертежу и плану) → 14,0 x 8,5 м.
# Масштаб: юг стена 290–1057 = 767 pt / 14,0 = 54,8; север 388–1156 = 768 / 14,0 = 54,9; запад 422,5–1022,5 =
# 600 / 8,5 = 70,6; восток 423–1023 = 70,6. Сверка по отметкам: юг 0,000→+2,950 = 590→428 = 162 pt / 2,95 = 54,9;
# запад 0,000→+5,370 = 602→225 = 377 / 5,37 = 70,2 — расхождение до 0,6 %.
# Отметки: ±0,000 — верх цоколя/низ кирпича (y 590 юг/север, 602 запад/восток), земля −0,700 (plinth 0,7);
# карниз длинных стен +2,950; щипец торцов начинается на +3,230 (y 375) — карниз по чертежу тут выше на 0,28 м; конёк +5,370.
# Терраса 21 м2 с востока (плита на уровне цоколя за осью 5) — на фасадах видна только плитой, кровли и столбов нет.
# Невязка контура 0.
id = "st-53180"
pdf = "53180/sheet.pdf"
roof = "двускатная, конёк вдоль 14 м; конёк +5,370, торцевой карниз +3,230, пролёт 8,5 м, свес карнизный ≈0,7 м, щипцовый ≈0,55 м; кровля мягкая тёмная; над входом односкатный козырёк выносом ≈1,4 м"
roof_kind = "gable"
# tg = (5,370 − 3,230) / (4,25 + 0,71) = 0,431 = 23,3°; линия ската торца (375→247,5 по кладке; 376→225 по кромке) = 23,0–23,5° — сходятся
pitch_deg = 23.3
overhang_m = 0.7
gable_overhang_m = 0.55
overhang_by = "drawing"
gutters = true
unit = "m"
pt_per_unit = 54.8
# кирпичная кладка с рисунком перевязки (светлая; тёмные участки — тот же рисунок тёмнее: простенки и портал входа)
material = "brick"
colors = { main = "#e1e1e1", plinth = "#707271", accent = "#767577" }
plinth = 0.7
# цоколь — тёмный бутовый (рваный) камень
plinth_material = "stone"
roof_material = "shingle_roof"
floor_heights = [2.95]
trim = { shutters = "board", canopy = "flat", door = "plain" }
cut = ["south: фонари у двери, дверь с 10 малыми квадратными стёклами — без variant, не уверен (стекло или накладки)",
       "south, north: плита террасы справа (юг) и слева (север) за углом, высотой до +0,0 — не размечена",
       "west, east: ступени входа (3 проступи) у южного угла, водосточные трубы",
       "south: водосточные воронки и трубы по углам",
       "east: рифлёные панели шириной ≈0,85 м по бокам окон — ставни, board по рисунку, не уверен (могут быть сдвижные)",
       "east: по плану стена террасы остеклена шире (≈5,5 м, дверь у юга), на фасаде два окна в пол по 1,75 м — взято с фасада",
       "темнее кладка простенков и портала — вторая отделка brick, не уверен: по цвету, надписи нет"]
absent = ["все стороны: нет карнизной полосы",
