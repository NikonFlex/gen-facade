# «Коттедж 1» — ИП АСАДОВ Ф. А.; проект № 55456 на строим.дом.рф
# https://строим.дом.рф/project/55456 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 5–1 (север; слева восток), стр. 2 — Ф. К–А (запад; слева север, терраса),
# стр. 3 — Ф. 1–5 (юг, вход под фронтоном), стр. 4 — Ф. А–К (восток; слева юг). 1 pt = 1 px картинки.
# Устройство: одноэтажный кирпичный дом ~12,7 x 13,4 м, на северо-западе терраса 4,5 x 3,5 м под своей
# кровлей на столбах, на юге крыльцо под фронтоном 4,6 x 2,0 м; юго-восточный объём (спальня) выступает
# на юг на 0,85 м. Стороны по часовой от входа: 0 юг-запад (стр.3), 1 запад (стр.2), 2 стена террасы,
# смотрит на север (стр.1), 3 торец террасы, смотрит на запад (стр.2), 4 север (стр.1), 5 восток (стр.4),
# 6 юг-восток (стр.3), 7 западная грань выступа (стр.2). Контур — с плана стр. 5 (1 м = 49,6 pt по размеру 16360).
# Масштаб у каждого вида свой (pt/м по размерам листа и стене): стр. 3 — 842 pt / 12,7 = 66,3 (дверь 2,1 м = 140 pt);
# стр. 1 — 8000 мм = 523 pt -> 65,4; стр. 2 — 16360 мм = 846 pt -> 51,7; стр. 4 — 12480 мм = 666 pt -> 53,4.
# Сверка по уровням (0,000…+3,100 до карниза): стр. 3 205 pt = 66,1; стр. 1 203 pt = 65,5; стр. 2 160 pt = 51,6 — в пределах 1 %.
# Отметки: ±0,000 чистый пол = низ кирпича, −0,600 земля, +3,100 карниз (низ подшивки +3,300), +4,263 конёк
# крыши террасы, +4,392 конёк фронтона крыльца, +5,799 конёк главной крыши.
id = "st-55456"
pdf = "55456/sheet.pdf"
roof = "вальмовая ≈20° (конёк +5,799, край +3,300), кровля тёмно-серая; свес ≈0,5 м; над террасой своя вальмовая (конёк +4,263), над крыльцом — фронтон (конёк +4,392)"
roof_kind = "hip"
# уклон: tg = (5,799 − 3,300) / (6,35 + 0,5) = 0,365 -> 20,0°; линия ската на видах 19–21,5° — сходится
pitch_deg = 20.0
overhang_m = 0.5
gable_overhang_m = 0.5
overhang_by = "drawing"
# кровля — одна тёмная заливка с рисунком, вид не читается: roof_material не пишу
porch_roofs = [
  { side = 0, x = [525.0, 920.0], y = [359.0, 444.0], kind = "gable", posts = 2, depth_m = 2.0 },
  { side = 2, x = [822.0, 1170.0], y = [320.0, 396.0], kind = "hip", posts = 2, depth_m = 3.5 },
]
unit = "m"
pt_per_unit = 66.3
material = "brick"  # светлый кирпич, кладка видна на всех видах
colors = { main = "#d4ba89", plinth = "#73756d" }
plinth = 0.6  # земля −0,600 … чистый пол ±0,000
floor_heights = [3.1]
plinth_material = "stone"  # цоколь с рисунком бутового камня — по рисунку, не уверен
trim = { door = "plain" }
absent = [
  "все стороны: нет карнизной полосы, поясов и зон второй отделки — вся стена кирпичом",
  "все стороны: нет подоконников, наличников и ставен — окна в тёмном контуре",
  "все стороны: нет труб, мансардных и слуховых окон, водостока",
]
cut = [
  "south: фронтон над крыльцом (кирпич между кромками кровли), ступени крыльца, пилястры у выступа",
  "south, west, east: столбы крыльца и террасы на концах видов, ступени внизу слева на стр. 1 и 4",
  "north, west: терраса 4,5 x 3,5 м открытая, столбы по углам не размечены, только кровля — porch_roofs",
  "west: крыша выступа юго-востока не отделена от главной — ломаные линии кровли не размечены",
]

