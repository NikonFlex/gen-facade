# Дом 108060 (одноэтажный, 3 спальни, терраса 24 м² с запада, крыльцо 2,46 м² с востока) — строим.дом.рф
# https://строим.дом.рф/project/108060 ; разметка gf#470 (волна 2). Карточки проекта в candidates.json нет.
# Листы: стр. 1 — запад (остеклённый щипец, Ок-7…Ок-15), стр. 2 — восток (вход Дн-1, Ок-3, щипец),
# стр. 3 — юг (Ок-4, Ок-1, Ок-2), стр. 4 — север (Ок-6, Ок-5, Ок-6, Ок-6); план — стр. 5. 1 pt = 1 px.
# Вход с востока (крыльцо на плане справа). Порядок по часовой: восток → юг → запад → север. Проверка: с востока
# слева юг (Дн-1 ближе к югу, Ок-3 к северу — как на плане), с юга слева запад (Ок-4 у запада), с запада слева
# север (Ок-11/Ок-7 у оси Г), с севера слева восток (крыльцо 1,2 м слева на стр. 4).
# Длины: плана 10 000 между осями + по 0,5 м угловых простенков запада (штриховка на плане, 500 у оси 2) —
# глухие стены юга и севера 10,5 м, торцы 8,0 м; остеклённая стена запада на плане отодвинута на 0,5 м — взята в плоскость
# торца [не проверено: модуль не строит западную нишу 0,5 м]. Невязка 0 (8 / 10,5 / 8 / 10,5).
# Масштаб — по размерам на видах, не по отметкам: восток 1212 pt / 8 м = 151,5 (дверь 1000 → 152); запад 1213 / 8 = 151,6
# (Ок-10 1670 → 150,9; взят 151,3); юг 1137 / 10,5 = 108,3 (Ок-1 1000 → 108, Ок-4 1500 → 108,7); север 1136 / 10,5 = 108,2
# (Ок-6 1200 → 108,3). Отметки уровней: между ±0,000 и +5,000 по высоте не сходится (коньк на видах 4,23 м по размерам
# против +5,000 по подписи, расхождение ~18 %) — верю размерам окон, подпись +5,000 не использована.
# Уровни: ±0,000 — пунктир на y 834 / 762 / 836 / 782 (низ окон на 50 мм выше); земля на 0,40 м ниже (цоколь 0,40).
# Карниз: стена обрывается на y 413 (щипец) / 461 (юг) / 483 (север) → 2,78 м от пола; конёк 4,23 м.
id = "st-108060"
pdf = "108060/sheet.pdf"
roof = "двускатная, конёк вдоль 10,5 м (запад-восток), карниз 2,78 м, конёк 4,23 м от пола, пролёт 8 м, свесов нет (кромка кровли вровень со стеной), кровля без рисунка"
roof_kind = "gable"
# tg = (4,23 − 2,78) / 4,0 = 0,36 = 20,0°; линия ската на виде восток: (413−193)/(891−285) = 0,363 = 20,0° — сходятся
pitch_deg = 20.0
overhang_m = 0.0
gable_overhang_m = 0.0
overhang_by = "drawing"
unit = "m"
pt_per_unit = 151.5
# отделка на листе не показана (чистый контур без текстуры и подписи) — plaster по умолчанию [не проверено]
material = "plaster"
plinth = 0.4
plinth_material = "plaster"
floor_heights = [2.78]
trim = { door = "plain" }
cut = ["east: ступени и настил крыльца под дверью — только площадка porch",
       "south, north: площадка крыльца 1,2 м (справа на юге, слева на севере) и террасы 3 м (на другом краю) — не размечены",
       "west: нижний ряд Ок-7, Ок-8, Ок-9, Ок-10 в пол (50 мм над полом), верхний ряд Ок-11…Ок-15 — окна со скошенным верхом; рамы между рядами 200 мм",
       "west: стены вид внутренним контуром (на 28 pt правее/левее кромок) — это угловые простенки 0,5 м, не размечены"]
absent = ["все стороны: нет карнизной полосы и свесов",
          "все стороны: нет зон второй отделки, обрамления окон (подоконников, наличников, ставен)",
          "все стороны: нет труб, мансардных окон, слуховых окон, водостока",
          "south: нет дверей; north: нет дверей; east: нет козырька над дверью"]

