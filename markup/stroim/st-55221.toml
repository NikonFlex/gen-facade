# Барн С54-4 — ООО "ИСИДОР"; проект № 55221 на строим.дом.рф
# https://строим.дом.рф/project/55221 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — запад (Фасад А-Г: вход, дверь справа, окно в пол слева, терраса под кровлей), стр. 1 — юг (Фасад 2-1:
# одно окно в пол, торец террасы деревом слева, лестница слева), стр. 2 — восток (Фасад Г-А: два окна в пол),
# стр. 3 — север (Фасад 1-2: два горизонтальных окна, торец террасы деревом слева, лестница справа); 1 pt = 1 px. План — стр. 5: 11 500 × 6 800 мм
# вместе с террасами по 1 м на торцах (стена дома 9 030 × 6 360).
# Порядок по часовой от входа: запад → север → восток → юг. Проверка: с запада слева север (окно спальни), с севера слева
# восток (деревянный торец террасы), с востока слева юг (кухня), с юга слева запад (лестница, деревянный торец).
# Масштаб: длинные стены 1361 pt / 11,5 м = 118,3; запад 809/6,8 = 119,0; восток 811/6,8 = 119,3. Сверка по отметкам:
# +2,630 → +3,470 = 99 pt / 0,84 м = 118; ±0,000 → +2,630 = 311 pt → 118,3; расхождение до 1 %.
# Отметки: ±0,000 — по маркеру на виде (верх настила террасы / пола; y 1002 / 1003 / 994 / 1005), низ стены на 0,23–0,33 м ниже
# (балка пола на сваях), plinth = 0,25 от ±0,000 до низа; карниз +2,630, конёк +3,470.
# Переразметка 14.11 (gf#470/gf#472): контур — только стены дома по плану: 9,5 × 6,8 м (план: стены 402-1420 px при 107,4 px/м; 11,5 м — вместе
# с террасами по 1,0 м на торцах). Терраса на каждом торце — НЕ в контуре, а навес `[[porch_roofs]]` kind = "main" (продолжение щипца
# основной кровли на 1 м за торцевую стену, свес щипца в роли — 0), столбы — по 3 на навес. Длинные стены сократились с 11,5 до 9,5 м
# (северная x 642,8-1766,7, южная x 725,3-1849,2; 118,3 pt/м): окна на них остались на местах; торцы террас (деревянные панели слева на
# севере и юге) в контур не входят.
id = "st-55221"
pdf = "55221/sheet.pdf"
roof = "двускатная, конёк вдоль 11,5 м посередине пролёта 6,8 м; карниз +2,630, конёк +3,470, свесов не видно, кровля тёмная с вертикальными фальцами"
roof_kind = "gable"
# tg = (3,470 − 2,630) / 3,4 = 0,247 = 13,9°; линия ската на виде запад: (690−590)/(1249−843) = 0,246 = 13,8° — сходятся
pitch_deg = 13.9
overhang_m = 0.0
gable_overhang_m = 0.0
overhang_by = "drawing"
roof_material = "metal_roof"
unit = "m"
pt_per_unit = 118.3
# основная отделка — тёмный металл вертикальными лентами с фальцем (по рисунку, подписи нет) [не уверен: вид по рисунку];
# вторая — тёплое дерево горизонтальной доской: торцы (запад, восток целиком) и боковые торцы террас
material = "metal"
colors = { main = "#373636", plinth = "#3e3d3b", accent = "#6e5346" }
plinth = 0.25
plinth_material = "metal"
floor_heights = [2.63]
trim = { door = "plain" }
porch_roofs = [
  # терраса на западном торце, Ф. А-Г: вынос 1,0 м, кровля — продолжение щипца (низ свеса +2,63 → y 690, конёк +3,47 → y 590)
  { side = 0, x = [843.0, 1652.0], y = [590.0, 690.0], kind = "main", posts = 3, depth_m = 1.0 },
  # терраса на восточном торце, Ф. Г-А
  { side = 2, x = [831.0, 1642.0], y = [580.0, 679.0], kind = "main", posts = 3, depth_m = 1.0 },
]
cut = ["west, east: ограждение террасы (брусья, стойки шагом ≈0,9 м) и настил — не размечены",
       "west: лестница на террасу у двери слева (на листе у стороны юг справа) — не размечена",
       "south, north: свайное основание с подкосами под домом — не размечено",
       "north, south: деревянные торцы террас (x 524,5-640 на севере, 607-722 на юге) — в контур не входят, навес porch_roofs",
       "west: ниша под настилом у двери (серые щиты) — не размечена"]
absent = ["все стороны: нет карнизной полосы, наличников, подоконников, ставен, козырьков",
          "все стороны: нет труб, мансардных окон, слуховых окон, водостока"]

