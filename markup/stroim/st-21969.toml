# Одноэтажный дом 12,0 × 10,0 м с вырезом-крыльцом 5,0 × 1,3 м (Г-контур), вальмовая крыша — проект № 21969
# https://строим.дом.рф/project/21969 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 1–3 (юг, вход; слева стена по оси Б, справа — по оси А), стр. 2 — Ф. А–Г (восток),
# стр. 3 — Ф. 3–1 (север), стр. 4 — Ф. Г–А (запад: стена по оси 1 и боковая стена выреза у оси 2); стр. 5 — план.
# 1 pt = 1 px. Лист чёрно-белый, линейный, без подписей отделки и кровли.
# Стороны по часовой от входа: 0 юг-Б (5,0 м, вход), 1 запад (8,7 м), 2 север (12,0 м), 3 восток (10,0 м),
# 4 юг-А (7,0 м), 5 запад выреза (1,3 м; угол после неё внутренний).
# Масштаб у вида свой, pt/м по ширине: юг 144,2 (12,0 м = 1731 pt; 5,0 м = 721 pt, 7,0 м = 1010 pt),
# запад 149,5 (10,0 м = 1495 pt; 8,7 м = 1300 pt), север 150,2 (12,0 м = 1802 pt), восток 157,0 (10,0 м = 1571 pt).
# Сверка по высоте: стена +3,100 над ±0,000 = 448 / 461 / 465 pt -> 144,5 / 148,7 / 150 pt/м: юг, запад, север сходятся (<3 %);
# на восточном виде по высоте 148,7 против 157 по ширине (5,6 %) — вид растянут по x, взят масштаб по ширине (сомнительно).
# Отметки: 0,000 чистый пол, −0,500 земля, +0,800 низ окон, +2,600 верх окон, +2,220 верх двери, +3,100 верх стены,
# +3,250 низ кровли у свеса, +5,520 конёк.
id = "st-21969"
pdf = "21969/sheet.pdf"
roof = "вальмовая, конёк вдоль юга длиной 2,0 м, ≈22° (конёк +5,520, низ свеса +3,250), свес ≈0,5 м; кровля продолжена над вырезом-крыльцом"
roof_kind = "hip"
# pitch: tg = (5,520 − 3,250) / (половина пролёта 5,0 м + свес 0,5 м) = 0,413 -> 22,4°; по линии ската на виде восток
# (859 pt по горизонтали при 341 pt подъёма) 21,7°, подпись на листе 22° — расходятся меньше 2°
pitch_deg = 22.0
overhang_m = 0.5  # юг: 71 pt / 144,2 = 0,49 м слева, 78 pt = 0,54 м справа; восток 0,48 м
overhang_by = "drawing"
unit = "m"
pt_per_unit = 144.2
material = "plaster"  # на листе отделки нет (линейный чертёж) — штукатурка по умолчанию, не по чертежу
plinth = 0.5
floor_heights = [3.1]
plinth_material = "concrete"  # цоколь −0,500…0,000, по умолчанию, не по чертежу
trim = { door = "plain" }
# вырез-крыльцо 5,0 × 1,3 м (план: «Крыльцо 6,23») под продолжением главной кровли, один столб 0,38 × 0,38 м в юго-западном углу
porch_roofs = [
  { side = 0, x = [539.0, 1331.0], y = [596.0, 618.0], kind = "hip", posts = 1, depth_m = 1.3 },
]
absent = [
  "все стороны: нет карнизной полосы — только свес кровли",
  "все стороны: нет подоконников, наличников, ставен",
  "все стороны: труб, мансардных окон, слуховых окон и водостока нет",
  "все стороны: нет зон второй отделки (лист без заливки)",
]
cut = [
  "south: ступени и площадка крыльца у входа не нарисованы",
  "north: широкое остекление в пол (3 створки) — возможно, дверь на террасу, на плане проём 2,3 м без обозначения двери",
  "north, south: вертикальная линия в 0,38 м от западного угла — торец западной стены, не размечена",
]

