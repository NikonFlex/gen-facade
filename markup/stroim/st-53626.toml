# Зелёный дом (ИП Смирнов А. Н.); проект № 53626 на строим.дом.рф
# https://строим.дом.рф/project/53626 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — запад (вход, 3 окна), стр. 1 — север (глухая стена), стр. 2 — восток (3 окна в пол/на 0,9),
# стр. 3 — юг (одно панорамное окно, 3 створки); 1 pt = 1 px. План — стр. 5: 9 930 × 12 940 мм (наружные).
# Порядок по часовой от входа: запад → север → восток → юг. Проверка: слева на западном виде север, на северном — восток,
# на восточном — юг (большое окно в пол слева, как кухня-гостиная на плане), на южном — запад.
# Масштаб — ширина стены в pt / длина с плана: север 3348 / 9,93 = 337,2; юг 3258 / 9,93 = 328,1;
# запад 3473 / 12,94 = 268,4; восток 3477 / 12,94 = 268,7. Сверка: высота стены до низа карниза 3,01 / 3,02 / 3,00 м (должно 3,0);
# верх окон на 2,6 м — 2,60 по масштабу плана. Отметки на листе (6,000 у конька) с масштабом плана расходятся на 4,5 %
# (по ним конёк 6,0, по линейке плана 5,74): взят масштаб плана, он сходится с отметками 3,0 / 2,6 / 0,9.
# Отметки: ±0,000 — линия на виде (y 2566 / 2478 / 2655 / 2447); земля −0,450 → plinth 0,45.
# План — прямоугольник с нишами и пилястрами по контуру (окна в нишах), на фасадах — гладкая плоскость; контур
# взят прямоугольником 9,93 × 12,94. Невязка 0.
id = "st-53626"
pdf = "53626/sheet.pdf"
roof = "вальмовая, конёк вдоль 12,94 м длиной ≈2,9 м, снизу кровли +3,24, конёк +5,74 по линейке (на листе 6,000), кровля — черепица прямоугольной нарезки"
roof_kind = "hip"
# tg = 2,31 / 4,965 = 0,465 = 24,9° (подъём от стены до конька по линии ската на виде запад: низ кровли y 1577, конёк 905, свес 0,4 м);
# по отметкам (6,0 − 3,0) / (4,965 + 0,4) = 0,559 = 29,2° — расходятся >2°, взято по линии ската
pitch_deg = 25.0
overhang_m = 0.4
gable_overhang_m = 0.4
overhang_by = "drawing"
unit = "m"
pt_per_unit = 268.4
# отделка на листе не подписана и не нарисована: гладкая белая плоскость; wall_mm 500 — по цвету, не уверен
material = "plaster"
plinth = 0.45
plinth_material = "plaster"
roof_material = "tile_roof"
floor_heights = [3.0]
trim = { door = "plain" }
cut = ["west: ниша крыльца 2,5 м² с входом (серая заливка 1598–2117 pt — тень ниши, не отделка), выступ порога",
       "все стороны: серая полоса под свесом — тень, не зона",
       "все стороны: стены в нишах и пилястры плана на фасадах не различимы",
       "west: белая полоса фасции под кровлей (низ свеса) — карниз не размечен"]
absent = ["все стороны: нет зон второй отделки, цоколя отдельным материалом",
          "все стороны: нет труб, мансардных и слуховых окон, водостока",
          "north: нет окон и дверей",
          "все стороны: нет подоконников, наличников, ставен, козырьков"]

