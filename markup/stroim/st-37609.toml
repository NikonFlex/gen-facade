# Одноэтажный дом 11,5 х 8,3 м с террасой 3 м под общей вальмовой крышей — строим.дом.рф, проект № 37609
# https://строим.дом.рф/project/37609 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — юг (вход с крыльцом, 2 окна), стр. 2 — запад (глухая стена), стр. 1 — север (4 окна, терраса слева),
# стр. 3 — восток (терраса на 3 столбах, за ней 2 окна); 1 pt = 1 px. План — стр. 5: 11 500 х 8 300 мм + терраса 3000, крыльцо 2800 х 1800.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: слева от юга — запад (терраса справа = восток),
# слева от запада — север (крыльцо справа = юг), слева от севера — восток (терраса слева), слева от востока — юг (крыльцо слева).
# Масштаб: юг стена 1831 pt / 11,5 м = 159,2; север 1815 / 11,5 = 157,8; запад 1203 / 8,3 = 144,9; восток 1035 / 8,3 = 124,7.
# Сверка по отметкам: юг (±0,000 → +2,980) 472 pt / 2,98 = 158,4 (0,5 %); север 468/2,98 = 157,0; запад 433/2,99 = 144,8; восток 373/2,99 = 124,7.
# Отметки: ±0,000 — по маркеру (на 0,1 м выше низа кладки −0,100): floor — по маркеру, plinth = 0,1 (низ кладки); карниз +2,980, конёк +5,318.
# Терраса 3 м у восточной стены — под продолжением кровли дома, открытая, на 3 столбах: сторона дома — 11,5 х 8,3, терраса — porch_roofs
# на востоке и столбы. Невязка контура 0.
