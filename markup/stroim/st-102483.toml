# Одноэтажный дом 15,0 × 8,0 м с двускатной крышей и крыльцом под щипцом — проект № 102483 на строим.дом.рф
# https://строим.дом.рф/project/102483 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. А–Д (восток, слева ось А = юг), стр. 2 — Ф. Д–А (запад, слева Д = север), стр. 3 — Ф. 6–1 (север, слева ось 6 = восток),
# стр. 4 — Ф. 1–6 (юг, вход, слева ось 1 = запад); стр. 5 — план. Порядок по часовой от входа: юг, запад, север, восток;
# проверка по левому краю вида: у юга — ось 1 (запад), у запада — Д (север), у севера — ось 6 (восток), у востока — А (юг).
# Контур 15,0 × 8,0 м по осям (план: оси 1–6 = 15 000, Б–Д = 8 000; ещё 1 400 крыльцо до оси А, в контур не входит).
# Масштаб — по горизонтали, pt/м = расстояние между осями на листе / размер осей: стр. 4: 916/15 = 61,07; стр. 2: 487/8 = 60,9;
# стр. 3: 922/15 = 61,47; стр. 1: 490/8 = 61,25. Сверка по ширине окон и двери с планом сходится (окно запад 2,5 м, дверь 0,95 м).
# ВНИМАНИЕ: лист растянут по вертикали ≈ в 1,23 раза: по отметкам (+5,077 конёк, +2,552, +0,500, ±0,000) выходит 75–76 pt/м
# по высоте против 61 по ширине; отметки при этом сходятся между собой и с окнами (низ +0,5, верх ≈ +2,2), т.е. растянуто само
# изображение. Высоты записаны в pt чертежа / горизонтальный масштаб (метры модели завышены ≈ в 1,23 раза: этаж 3,49 «м» ≈ 2,8 м
# по отметкам). Размеры по ширине и длине верные.
# Отметка ±0,000 = линия пояса на кладке (стр. 4 y=703, стр. 1 y=664, стр. 2 y=648, стр. 3 y=675); ниже — кладка и штриховка цоколя до земли (−0,400).
id = "st-102483"
pdf = "102483/sheet.pdf"
roof = "двускатная, конёк вдоль длинной стороны (+5,077), ≈24° по линии ската; свес карнизный ≈0,8 м, фронтонный ≈0,75 м; черепичный рисунок; водосток; над входом отдельный щипец на четырёх столбах"
roof_kind = "gable"
# кровля: рисунок чешуйчатой волны со смещением рядов, подписи нет — metal_tile по цвету/рисунку, не уверен (может быть tile_roof)
roof_material = "metal_tile"
# уклон: по линии ската — стр. 1: от конька (755,275) до края (1052,442): 167 pt по высоте / 76 = 2,2 м на 297 pt / 61,25 = 4,85 м → 24,6°;
# стр. 2: (684,267)→(391,428): 2,1 м на 4,8 м → 23,6°; среднее 24,0°. По отметкам (5,077 − 2,552) / (4,0 + 0,8) = 0,526 → 27,7° — расходится
# больше чем на 2°: отметка +2,552 стоит у низа свеса/желоба, не у кровли, — взято по линии ската.
pitch_deg = 24.0
overhang_m = 0.8        # стр. 1: край кровли за стеной 54 и 48 pt / 61,25 = 0,88 и 0,78; стр. 2: 50 и 48 pt / 60,9 = 0,82 и 0,79
gable_overhang_m = 0.75 # стр. 3: слева 47, справа 48 pt / 61,47 = 0,77; стр. 4: 44 и 47 pt / 61,07 = 0,73 и 0,77
overhang_by = "drawing"
unit = "m"
pt_per_unit = 61.1
material = "brick"       # кладка в перевязку — по рисунку (узнаваемый кирпич), подписи нет
colors = { main = "#878787", plinth = "#868686", roof = "#eeeeee" }
plinth = 0.8             # от земли (стр. 4: 703→752 = 49 pt / 61,07); по отметкам было бы 0,4 м — лист растянут по высоте
# цоколь: полоса кладки до y=732 и ниже штриховка вертикальными рёбрами до земли; штриховка — concrete по рисунку, не уверен
plinth_material = "concrete"
floor_heights = [3.49]   # угол фронтона над чистым полом на стр. 1 и 2: 3,49 «м» (214 и 213 pt / 61,2); совпадает с верхом карнизной полосы на стр. 3–4
# обрамление: окна в серой двойной раме без наличника и ставен; подоконник отдельно не нарисован; входная дверь — глухая однопольная;
# над входом щипцовая кровля на четырёх столбах
trim = { canopy = "gable", door = "plain" }
gutters = true
# дымовых труб нет: на скатах только тонкие вентвыходы с дефлекторами (юг: x 843 и 872; север: x 298, 330, 973; видны и на стр. 1–2)
cut = [
  "все стороны: вентвыходы на скатах (5 шт., тонкие, с дефлекторами) — не трубы",
  "все стороны: водосточные трубы и желоба",
  "все стороны: серые полосы — тень от свеса, зонами не размечены",
  "юг: ступени и перила крыльца перед площадкой (y 735–752)",
  "восток и запад: боковое ограждение крыльца (горизонтальные рейки, x 432–500 на востоке, y 600–660) и ступени у оси А",
  "восток, запад, юг (щипец крыльца): круглые отверстия во фронтонах записаны окнами kind = oval — по рисунку это скорее вент-решётки, не уверен",
]
absent = ["все стороны: нет карнизной полосы — только свес кровли с желобом",
          "все стороны: нет второй отделки, наличников, ставен, подоконников отдельно"]

