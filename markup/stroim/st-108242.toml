# Одноэтажный дом 13,24 × 9,84 м с вальмовой крышей и входной нишей — проект № 108242 на строим.дом.рф
# https://строим.дом.рф/project/108242 ; разметка gf#470 (волна 2).
# Листы (цветные рендеры, не чертежи, отметок нет): стр. 1 — юг (вход, 13,24 м), стр. 2 — восток (8,28 м),
# стр. 3 — север (13,24 м), стр. 4 — запад (9,84 м); стр. 5 — план. 1 pt = 1 px.
# План Г-образный (западное крыло выступает к югу на 1,564 м, в нише справа крыльцо): стороны по часовой
# от входа: S0 юг-правая часть (6,35 м, вход, inner_corner), S1 торец ниши (1,564 м, лицом на восток — виден
# слева на стр. 2), S2 юг-левая часть (6,89 м), S3 запад, S4 север, S5 восток. Проверка: слева у юга —
# запад-крыло, у запада — север (окно 3,8 м от севера = 3824 с плана), у севера — восток, у востока — юг
# (ниша слева на стр. 2, окна 1,5 м и 2,5 м между ними как на плане). Невязка: 6,35 + 6,89 = 13,24; 1,564 + 8,276 = 9,84.
# Масштаб: у видов свой, pt/м = ширина стены / длина с плана: юг и север 118,2 (1564 / 13,24; окно 1500 мм на
# стр. 1 = 177 pt = 118 pt/м), запад 148,9 (1465 / 9,84), восток 148,7 (1231 / 8,276). Отметок +3,000/±0,000 нет;
# сверка по высоте стены: 3,0 м на стр. 2 и 4 (445 pt при 148,8) — одинаково; на стр. 1 и 3 мерил 2,9–3,0.
# Пол ±0,000 — по низу штукатурной стены (низ цоколя на 0,35 м ниже).
id = "st-108242"
pdf = "108242/sheet.pdf"
roof = "вальмовая, длинные скаты ≈26,5°, торцевые вальмы круче ≈37°; конёк ≈2,4 м над карнизом (по листу), свес ≈0,32 м, кровля тёмная, труба над южным крылом"
roof_kind = "hip"
# уклон по линии ската на виде (отметок нет): стр. 2 — (1370−835)/(435−165) в display → 26,8° справа, 25,5° слева;
# стр. 4 слева 26,9°; торцевая вальма на стр. 1: dy 2,37 м / dx 3,15 м = 37°. Берём 26,5 (длинные скаты)
pitch_deg = 26.5
overhang_m = 0.32  # стр. 1: 38 pt / 118,2; стр. 2: 45 pt / 148,7 = 0,30
gable_overhang_m = 0.32
overhang_by = "drawing"
roof_material = "metal_tile"  # коричневая волна с уступом по рисунку (стр. 1, 3), подписи нет — не уверен: может быть tile_roof
roof_gaps = ["торцевые вальмы круче длинных скатов (37° против 26,5°) — модуль берёт один уклон"]
unit = "m"
pt_per_unit = 118.2
# основная отделка — светлая штукатурка с рисунком кладки-швов; акцент — тёмная кирпичная кладка
# (угловые пилястры, обрамление окон, столб крыльца) — по рисунку, подписи нет [не уверен]
material = "plaster"
colors = { main = "#c2bab6", plinth = "#8d8577", accent = "#604339" }
plinth = 0.35
plinth_material = "stone"  # крапчатая серая фактура по цвету и рисунку, не уверен
trim_material = "plaster"
floor_heights = [3.0]
# обрамление: белые рамы без подоконников и ставен; дверь тёмная, плоская с филёнками
trim = { door = "plain" }
# труба: стр. 1, центр ≈769 pt на южном скате над западным крылом (5,45 м от запада, на стр. 3 — 5,4 м от запада)
chimneys = [
  { side = 2, x = 769.0 },
]
# вход: кровля над нишей и крыльцом, столб кирпичный; тип кровли по рисунку (скошенная светлая кромка) — не уверен
porch_roofs = [
  { side = 0, x = [940.0, 1225.0], y = [598.0, 650.0], kind = "shed", posts = 2, depth_m = 1.57 },
]
cut = ["юг: тёмная ниша слева от двери (x 970–1030) — тень/кирпич ниши, не зона",
       "юг: ступени и площадка крыльца не нарисованы",
       "запад, восток: торцы выступа/ниши на дальнем плане — торец ниши размечен стороной S1",
       "пилястры углов: светлые полосы между кирпичными рядами не размечены, зона целиком",
       "кровля: рисунок — вертикальные полосы без подписи, вид не писал [не читается]"]
absent = ["все стороны: нет карнизной полосы — только свес кровли",
          "все стороны: нет подоконников, наличников, ставен",
          "все стороны: нет мансардных и слуховых окон, водостока",
          "S1 (торец ниши): нет окон и дверей",
          "восток, север, запад: нет дверей"]

