# Сибирский шале «3» с навесом — проект № 22175 на строим.дом.рф (одноэтажный дом 7,5 × 10,0 м, терраса 2,5 м под продолжением кровли)
# https://строим.дом.рф/project/22175 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. А–В (восток, вход ДВ-5, слева терраса), стр. 2 — Ф. В–А (запад, справа терраса),
# стр. 3 — Ф. 2–1 (север, щипец, два окна ОК-2), стр. 4 — Ф. 1–2 (юг, щипец, терраса с двумя стеклянными
# дверями); 1 pt = 1 px. Вход — ДВ-5 в приходжей на восточной стене (план); порядок сторон по часовой от неё:
# восток, юг, запад, север. Сверка: на виде восток слева терраса (юг), на западе — справа; на юге слева запад.
# Масштаб у каждого вида свой (pt/м = ширина стены / длина с плана): восток 1545 pt / 10,0 м = 154,5;
# запад 1610 / 10,0 = 161,0; юг 1584 / 7,5 = 211,2; север 1588 / 7,5 = 211,7. Сверка по высоте: 2,283 м
# от ±0,000 до низа карниза = 353 pt (восток, 154,6), 366 pt (запад, 160,3), 483 pt (север, 211,6),
# 482 pt (юг, 211,1) — расхождение с масштабом по ширине меньше 1 %.
# Отметки: ±0,000 чистый пол, −0,031 пол террасы, +0,600 низ окон ОК-2, +2,200 верх окон, +2,283 низ карниза
# (фасция), +2,597 край кровли, +3,822 конёк. Низ кладки (цоколь из камня) на 0,4 м ниже пола, земля на 0,8 м.
# Контур: 7,5 × 10,0 м; на плане 7 518 мм по осям — взято по видам, невязки нет.
id = "st-22175"
pdf = "22175/sheet.pdf"
roof = "двускатная 15° (конёк +3,822, край кровли +2,597), конёк вдоль длинной стороны (север–юг), металлочерепица; свесы карниза 0,86 м, торцов 0,84 м; к югу кровля продолжена на 2,99 м над террасой"
roof_kind = "gable"
# pitch: по отметкам (3,822 − 2,597) / (3,75 + 0,86) = 0,266 → 14,9°; по линии ската на виде (стр. 3, 4): 25 pt на 93 pt = 0,269 → 15,0°; расхождение 0,1°
pitch_deg = 15.0
# свес: восток (стр. 1) от стены 2195 до края кровли ≈2325 = 130 pt / 154,5 = 0,84 м (торцевой); щипцовая стена на стр. 3 (север): 362 − 182 = 180 pt / 211,7 = 0,85; на стр. 4: 300 − 116 = 184 pt / 211,2 = 0,87
overhang_m = 0.86
gable_overhang_m = 0.84
overhang_by = "drawing"
# кровля — волна с поперечным уступом (стр. 1, 2): металлочерепица
roof_material = "metal_tile"
unit = "m"
pt_per_unit = 211.4
material = "imitation_timber"   # горизонтальная доска/брус шагом 0,15 м (по рисунку, подписи нет — не уверен: может быть брус или блок-хаус)
plinth = 0.8                    # земля −0,8 под ±0,000 (камень от −0,4 до земли)
plinth_material = "stone"       # рваный камень (рисунок кладки)
floor_heights = [2.283]
trim = { casing = "flat", door = "panel6" }
# терраса 2,5 м вдоль южной стены на трёх столбах (план: по линии А) под продолжением кровли дома;
# на виде юг (стр. 4) её кровля — весь скат (x 116–2068, верх 56, низ 422); на востоке (стр. 1) — x 183–650, y 174–400
porch_roofs = [
  { side = 1, x = [116.0, 2068.0], y = [56.0, 422.0], kind = "gable", posts = 3, depth_m = 2.5 },
]
cut = ["south: перила террасы (два пролёта, высота ≈0,7 м), ступени террасы под правой дверью и справа, плита террасы −0,031",
       "east: ступени/площадка перед дверью ДВ-5 размечены порчем, перила террасы и угловой столб террасы (x 281–304) — вне стены",
       "west: угловой столб террасы (x 2210–2234) вне стены, перила террасы, ступени справа",
       "east, west, north, south: тёмные детали у края стен (x ≈2195–2210 и ≈225–240; 345–362 и 1950–1965) — водосточные трубы или откосы, не размечены",
       "north, south: шапки наличников окон/дверей и подоконные тени — только casing = flat",
       "south: центральный столб террасы поднят до фасции (x 1075–1105), в элементе — только до карниза"]
absent = ["все стороны: нет карнизной полосы — только фасция свеса",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой",
          "все стороны: нет дымовых труб, мансардных и слуховых окон, ставен, подоконников"]

