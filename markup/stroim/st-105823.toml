# Одноэтажный дом 13,45 × 9,02 м, вальмовая крыша; проект № 105823 на строим.дом.рф
# https://строим.дом.рф/project/105823 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — фасад 1–4 (юг, вход), стр. 1 — Г–А (запад, глухой), стр. 2 — 4–1 (север, 4 окна подряд + 2 по 2),
# стр. 3 — А–Г (восток, одно окно). План — стр. 5: 13 450 × 9 020 мм по осям, замкнут.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: слева у юга ось 1 (запад), у запада — Г (север),
# у севера — ось 4 (восток), у востока — А (юг).
# Масштаб один на все виды: юг 1245 pt / 13,45 м = 92,6; запад 834 / 9,02 = 92,5. Сверка по отметкам: ±0,000 y850, +3,150 y558 —
# 292 / 3,15 = 92,7; +0,900 y767 и +2,400 y628 — 139 / 1,5 = 92,7. Расхождение < 0,3 %.
# ±0,000 — чистый пол (y850), низ кладки −0,400 (y887): plinth = 0,4.
# Карниз: низ стены под свесом y572 = +3,0 (отметка +3,150 — край кровли у свеса) [не уверен: 3,0 или 3,15].
id = "st-105823"
pdf = "105823/sheet.pdf"
roof = "вальмовая, конёк +5,150 вдоль 13,45 м (4,4 м), край кровли +3,150, свес ≈0,45 м, водосток с трубами по углам"
roof_kind = "hip"
# tg = (5,150 − 3,150) / (4,51 + 0,45) = 0,403 = 21,9°; по линии ската на виде запад (400,555)→(858,373): 0,397 = 21,7° — сходятся
pitch_deg = 21.8
overhang_m = 0.45
gable_overhang_m = 0.45
overhang_by = "drawing"
unit = "m"
pt_per_unit = 92.6
# отделка на листе не подписана и не штрихована — plaster по умолчанию [по умолчанию, не уверен]
