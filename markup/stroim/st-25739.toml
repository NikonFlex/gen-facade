# «Сторика эко-80» — ИП МУСИН А. В.; проект № 25739 на строим.дом.рф
# https://строим.дом.рф/project/25739 ; разметка gf#470 (волна 1, учебная, см. LICENSE.md).
# Листы: стр. 3 — Фасад 4.1 (юг, вход с крыльцом, терраса слева), стр. 1 — Фасад 1.1 (запад, торец: терраса
# в глубине, крыльцо справа), стр. 2 — Фасад 3.1 (север), стр. 4 — Фасад 2.1 (восток, торец, крыльцо слева);
# 1 pt = 1 px. Порядок сторон по плану: вход (тамбур 07, крыльцо 09) на юге, терраса 08 на западе; у южного
# вида терраса слева, у западного крыльцо справа, у северного терраса справа, у восточного крыльцо слева.
# Длины сторон — не подписаны на плане (размеров нет): коробка 10,5 × 8,5 м по плану (1605 × 1310 ед. — 1,225)
# и по трём ручным сверкам; терраса 24 м2 = 3,0 × 8,0 м, крыльцо 4,5 м2 = 2,35 × 1,9 — сходится.
# Масштаб у каждого вида свой, pt/м = ширина стены в pt / длина стены. Сверка по уровням: стр. 3 — 0,000 → 0,900
# ≈125 pt и 0,900 → 2,250 ≈180 pt (≈135 pt/м); стр. 4 — 120 и 181 pt (≈134); стр. 1 — 0,900 над 0,000 ≈266 pt
# (≈295 pt/м) при ширине торца 2502 pt / 8,5 м = 294.
# «Пол» — низ кладки на отметке ±0,000 (стр. 1: 1793, стр. 3: 878, стр. 2: 867, стр. 4: 858); земля ≈0,45 м ниже
# (на листе −0,500 у террасы, −0,100 — пол террасы и крыльца).
id = "st-25739"
pdf = "25739/sheet.pdf"
roof = "двускатная, конёк вдоль длинной стены ≈25° (конёк +5,580, низ свеса +3,000), профнастил; свесы 0,8 м (торцевой 0,9), терраса слева на западе и крыльцо справа под продолжением ската"
roof_kind = "gable"
roof_material = "profiled_sheet"  # по рисунку: частые вертикальные трапециевидные рёбра шагом ≈0,2 м, подписи нет [не уверен: профнастил или металлочерепица]
# уклон: расчёт (5,580 − 3,300) / (4,25 + 0,78) = 0,453 → 24,4°; по линии ската на торцах (стр. 4: 672 × 314 pt, стр. 1: 921 × 432) 25,0°
pitch_deg = 25.0
overhang_m = 0.8        # карнизный: стр. 4 — 105 pt / 134 = 0,78 м
gable_overhang_m = 0.9  # торцевой: стр. 2 — 120 pt / 134 = 0,9 м
overhang_by = "drawing"
unit = "m"
pt_per_unit = 135.0
material = "imitation_timber"  # горизонтальные доски шагом 0,15 м по рисунку, подписей нет [по рисунку, не уверен: имитация бруса или блок-хаус]
colors = { main = "#dedede", plinth = "#eeeeee" }
plinth = 0.45
floor_heights = [3.15]  # торец стр. 4: верх стены под свесом 436 при полу 858 и 134 pt/м = 3,15 м; низ свеса +2,85
plinth_material = "stone"  # каменный/бутовый рисунок под кладкой
# обрамление: окна и двери в светлом наличнике с «шапкой» и подоконной доской, ставен нет; входная дверь — филёнчатая;
# крыльцо и терраса на столбах с перилами «крестом»
trim = { sill = "flat", casing = "flat", canopy = "posts", door = "panel6" }
gutters = false
porch_roofs = [
  # крыльцо у двери на юге (стр. 3): продолжение ската, низ кровли 2,3 м; столбы и плита — элементами; вынос 1,4–1,5 м (план; стр. 1)
  { side = 0, x = [1555.0, 1925.0], y = [445.0, 565.0], kind = "shed", posts = 2, depth_m = 1.45 },
  # терраса 08 на западе (стр. 1) под продолжением ската главной крыши; вынос 3,0 м (план; стр. 2, 3)
  { side = 1, x = [200.0, 3187.0], y = [143.0, 950.0], kind = "main", posts = 4, depth_m = 3.0 },  # продолжение крыши дома (gf#472, по чертежу)
]
absent = [
  "все стороны: нет карнизной полосы и поясов — только свес кровли с досками подшивки",
  "все стороны: нет зон второй отделки, ставен, труб, мансардных окон и водостока",
]
cut = [
  "south: перила крыльца с крестовинами, ступени у крыльца (справа от плиты), горизонтальный брус козырька над дверью (y 520–545)",
  "west: перила террасы с крестовинами между столбами, ступени; два узких бруса в щипце над столбами",
  "north: терраса справа (столб x 2065–2085, перила крестом, ступени) — столб только в porch_roofs",
  "east: столб крыльца слева (x 415–435), перила крестом, ступени; два узких бруса в щипце (y 235–280)",
]

