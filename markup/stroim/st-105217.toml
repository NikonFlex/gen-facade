# Двухэтажный дом 8,75 × 8,125 м на сваях, двускатная крыша, терраса на востоке, крыльцо слева на юге — проект № 105217 на строим.дом.рф
# https://строим.дом.рф/project/105217 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 1 — юг (вход, крыльцо слева, терраса справа), стр. 4 — запад (торец 8,125 м, крыльцо справа),
# стр. 2 — север (терраса слева), стр. 3 — восток (терраса со стеклянной дверью, крыльцо слева); стр. 5 — план 2 этажа,
# стр. 6 — план 1 этажа; 1 pt = 1 px. Размеров и отметок на фасадах нет — масштаб по плану (оси 1–4 = 8750, А–Б = 8125).
# Масштаб у каждого вида свой, pt/м = ширина стены в pt / длина: юг 801/8,75 = 91,5; север 807/8,75 = 92,2;
# восток 813/8,125 = 100,1; запад 805/8,125 = 99,1. Сверка: окна севера 1250/1000/1250 дают 92,3 pt/м по шагу рам;
# окно 1400 высотой — юг 128 pt (91,5), север 140 pt (100): листы по вертикали растянуты неодинаково (до 8 %), высоты брал с юга.
# «Пол» — верх настила (низ дверей, юг 783, север 828, восток 858, запад 858); сваи под настилом ≈0,95 м до земли.
id = "st-105217"
pdf = "105217/sheet.pdf"
roof = "двускатная, конёк вдоль длинной оси на север–юг, ≈25° (по линии ската на фронтоне юга 208/447 и по низу 0,48); щипцы на юге и севере, свесы ≈0,5 м; над террасой на востоке и над крыльцом на юге односкатные навесы ≈15°"
roof_kind = "gable"
# кровля: на скатах рисунок кирпичной кладки (прямоугольники вразбежку), подписи нет — черепица [по рисунку, не уверен: может быть мягкая]
roof_material = "tile_roof"
# уклон: отметок нет, считать не из чего; по линии ската на фронтонах юг 24,9° (наружная кромка) — 25,6° (низ)
pitch_deg = 25.0
overhang_m = 0.5        # карнизный: восток стр. 3 — 49 pt / 100 = 0,49 м
gable_overhang_m = 0.5  # щипцовый: юг стр. 1 — 47 pt / 91,5 = 0,51 м
overhang_by = "drawing"
unit = "m"
pt_per_unit = 91.5
material = "plaster"    # белые гладкие стены, подписей нет [по цвету, не уверен]
colors = { plinth = "#d8c6ab" }
plinth = 0.95
plinth_material = "concrete"  # сваи под настилом [по цвету, не уверен]
# этажи: низ второго по поясу (юг y 527) ≈2,8 м; верх стены под свесом (юг y 255) — 5,77 м от настила
floor_heights = [2.8, 2.97]
trim = { door = "plain" }
gutters = false
porch_roofs = [
  # крыльцо у двери на юге (стр. 1): навес-козырёк с кирпичным рисунком, два столба; вынос 1,5 м (план 1 этажа)
  { side = 0, x = [133.0, 526.0], y = [505.0, 570.0], kind = "shed", posts = 2, depth_m = 1.5 },
  # терраса 24,4 м2 на востоке (стр. 3): односкатный навес на четырёх столбах; вынос 3,0 м (план)
  { side = 3, x = [278.0, 1190.0], y = [508.0, 625.0], kind = "shed", posts = 4, depth_m = 3.0 },
]
absent = [
  "все стороны: нет цветовых зон второй отделки, ставен, наличников, труб, мансардных окон",
  "все стороны: нет подписей отметок и размеров на фасадах",
]
cut = [
  "south: горизонтальный пояс-свес над террасой (x 682–981, y 506–527), настил и сваи под домом (сваи, y 822–868)",
