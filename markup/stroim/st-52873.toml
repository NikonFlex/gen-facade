# Полутораэтажный дом Д-62 — ООО "ДОМАСТРОЙ"; проект № 52873 на строим.дом.рф
# https://строим.дом.рф/project/52873 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 4 — фасад юг (вход, торец 6 м), стр. 1 — запад, стр. 2 — север (торец), стр. 3 — восток.
# Порядок сторон проверен по плану 1 этажа: терраса 2 × 1,5 м на южной (нижней) стороне; на стр. 1 она справа,
# на стр. 3 слева, значит стр. 1 — запад, стр. 3 — восток; окна сходятся с планом (кухня 1,0×1,2 и прихожая на
# западе; кухня и санузел 0,5×0,5 на востоке; на втором этаже окна 1,0×1,2 только на торцах — юг и север).
# План: 6,0 × 7,0 м (цепочки 6 000 и 7 000 мм), терраса 1,5 м вне стен.
# Масштаб — по ширине стены, у каждого вида свой (отметок уровней на листе нет): стр. 4: 1368 pt / 6,0 = 228,0;
# стр. 2: 780 / 6,0 = 130,0; стр. 1: 746 / 7,0 = 106,6; стр. 3: 782 / 7,0 = 111,7. Сверка: цоколь шире стены
# на 0,15 м на всех видах (стр. 4: 1402 / 228 = 6,15 м; стр. 2: 801 / 130 = 6,16 м), вынос кровли над террасой на
# стр. 1 и 3 — 205–215 pt = 1,95 м при 1,5 + 0,47 свеса, высота стены до карниза на стр. 4 и 2 — 4,53 м и там, и там.
# Уровни: пол — по низу брёвен (верх тёмного цоколя); порог двери и крыльцо стоят выше на ~0,43 м
# (дверь внизу y 1580 при полу 1683 на стр. 4), вероятно отметка ±0,000 — там, но на листе её нет [не проверено].
# Цоколь — тёмная полоса 0,45 м. Верх стены до карниза 4,53 м (низ стропил у стены; у конца свеса 4,19 м).
# Второй этаж — мансарда под крышей (окна во фронтонах, стены 1,33 м); уровень перекрытия 3,2 м взят
# по подоконникам (стр. 4: подоконник 4,05 м от пола) при высоте этажа 2,6 в карточке [не проверено].
id = "st-52873"
pdf = "52873/sheet.pdf"
roof = "двускатная ≈37°, конёк вдоль длинной стороны 7 м, щипцы на торцах (юг, север), свесы ≈0,47 м; над террасой на юге свой двускатный козырёк"
roof_kind = "gable"
# кровля: на видах одна тёмная заливка без волны и швов — тип не читается, roof_material не пишу
pitch_deg = 37.0  # отметок на листе нет; по линии ската на стр. 4: верх ската (1200, 70) → (410, 665): 595 / 790 = 0,753 = 37,0°; низ ската (1200, 140) → (517, 651): 0,748 = 36,8°
overhang_m = 0.47        # стр. 4: конец кровли x 410 при стене 517 → 107 pt / 228
gable_overhang_m = 0.48  # стр. 1: кровля 197..1045 при стене 248..994 → 51 pt / 106,6
overhang_by = "drawing"
unit = "m"
pt_per_unit = 228.0
material = "log"           # круглое бревно, горизонтальные венцы (стр. 1, 3)
plinth = 0.45
plinth_material = "concrete"  # тёмная гладкая полоса; по цвету, не уверен
floor_heights = [3.2, 1.33]
# обрамление: окна в рамке с наличником-рамкой (стр. 1–4, плоский), подоконной полки нет; дверь гладкая
# тёмная; над террасой двускатный козырёк на двух столбах
trim = { casing = "flat", canopy = "gable", door = "plain" }
porch_roofs = [
  { side = 0, x = [868.0, 1533.0], y = [692.0, 1010.0], kind = "gable", posts = 2, depth_m = 1.5 },
]
cut = ["south: под козырьком, вдоль стены, ступенчатый «фонарь» (пирамида) y 950–1040 — часть кровли террасы, не размечено",
       "south, west, east: ступени и перила террасы, диагональные тени — не размечены",
       "south (стр. 4): вентиляционная решётка во фронтоне x 1170–1235, y 215–270; north (стр. 2): вентвыход x 625–650, y 130–160",
       "west, east: столбы и перила террасы в профиле — не размечены"]
absent = ["все стороны: нет карнизной полосы — только торец кровли",
          "все стороны: нет зон второй отделки, ставен, подоконников",
          "все стороны: труб, мансардных окон, водостока нет"]

