# Дом из бруса 8×6 м, одноэтажный, двускатный; проект № 36453 на строим.дом.рф
# https://строим.дом.рф/project/36453 ; разметка gf#470 (волна 2). В candidates.json карточки нет.
# Листы: стр. 2 — юг (вход, дверь + окно, ось 1→3), стр. 1 — запад (щипец, окно, ось В→А),
# стр. 3 — север (окно, ось 3→1), стр. 4 — восток (щипец, окно, ось А→В). План — стр. 5: 8000 × 6000 мм
# между осями (наружные грани стен на осях), 1–3 горизонтально, А (низ, юг) — В (верх, север).
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: слева на виде юга — ось 1 (запад),
# слева на виде запада — ось В (север), слева на севере — ось 3 (восток), слева на востоке — А (юг).
# Масштаб по ширине стен: юг 1523/8 = 190,4; запад 1135/6 = 189,2; север 1507/8 = 188,4; восток 1117/6 = 186,2.
# По размерам на виде (окно 1200, дверь 1000 / 2070) сходится в пределах 3 %. Отметки уровней на листе
# не сходятся с размерами (+5,010 → 176 pt/м, −0,560 → 116 pt/м), им не верю: уровни снимал по геометрии
# при масштабе ≈ 189 pt/м [не проверено].
# floor: низ светлой стены (на юге 1030, на севере 1035, запад 1000, восток 995); тёмный цоколь под ней ≈ 65 pt = 0,34 м
# (по отметке −0,560 был бы 0,56 м; взято по рисунку).
id = "st-36453"
pdf = "36453/sheet.pdf"
roof = "двускатная, конёк вдоль 8 м, щипцы на западе и востоке; уклон по линии ската 23,7°, свесы ≈ 0,5 м, водосток с трубами по углам; кровля тёмная с фигурным нижним краем"
roof_kind = "gable"
# по линии ската на щипце: запад (215,405)-(865,118) tg 0,4415; восток (240,410)-(878,135) tg 0,431; отметок карниза нет — расчёт по отметке +5,010 не сделан
pitch_deg = 23.7
overhang_m = 0.5
gable_overhang_m = 0.45
overhang_by = "drawing"
roof_material = "shingle_roof"
gutters = true
unit = "m"
pt_per_unit = 189.0
# горизонтальные пазы между брусьями ≈ 0,2 м; профиль бруса не читается — imitation_timber [не проверено: может быть log/wood]
material = "imitation_timber"
colors = { main = "#ebc284", plinth = "#2d2d2c", accent = "#f1c98e" }
plinth = 0.34
plinth_material = "concrete"
floor_heights = [3.0]
trim = { sill = "flat", casing = "flat", door = "panel6" }
cut = ["south: ступень-площадка под дверью 700–1150 pt, шириной ≈ 2,4 м — размечена как porch, ступени не видны",
       "west, east: крылечко-ступени у правого угла (запад слева у стены на y 995–1050) — не размечены",
       "все стороны: водосточные трубы и воронки — только gutters = true",
       "south: козырёк-карниз над дверью и окном (узкая полка над наличником) — не размечен"]
absent = ["все стороны: нет карнизной полосы",
          "все стороны: нет труб, мансардных и слуховых окон",
          "south, north: нет зон второй отделки",
          "west, east: цоколь — тёмная полоса, второй отделки кроме обшивки щипца нет"]

