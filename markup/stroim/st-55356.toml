# Прайм (дом из бруса, 1 этаж, 8 × 10 м) — ИП Галанов А. Н.; проект № 55356 на строим.дом.рф
# https://строим.дом.рф/project/55356 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — восток (вход, крыльцо под продолжением ската), стр. 1 — юг (щипец, 2 окна), стр. 3 — запад (глухой
# скат, окон нет), стр. 2 — север (щипец, 2 окна); 1 pt = 1 px. План — стр. 5: 8 × 10 м, вход с востока через тамбур.
# Порядок по часовой от входа: восток -> юг -> запад -> север. Проверка: слева на востоке юг (крыльцо справа на стр. 1), слева на
# юге запад, на севере слева крыльцо (восток).
# Масштаб — ширина вида стены / длина стены с плана (отметок уровней на листе нет; чертёж 10 x 8 м по размерным линиям): восток
# 1657.4/10 = 165.7; юг 1422.4/8 = 177.8; запад 1689.1/10 = 168.9; север 1365.2/8 = 170.7 pt/м (виды разнятся до 5 %,
# поэтому у каждой стороны свой). Сверка по высоте: цоколь 0,54 м на востоке и на юге, высота стены 2,7 м на востоке и западе.
# Расчёт сделан по пикселям вручную, не по snap [не проверено: точность ±1 %].
id = "st-55356"
pdf = "55356/sheet.pdf"
roof = "двускатная, конёк вдоль 10 м (щипцы на севере и юге), свес ~0,7 м со всех сторон, кровля тёмная чешуйчатая; скат на востоке продолжен над крыльцом"
roof_kind = "gable"
# щипец на юге: подъём конька над краем ската 275 px*1,27 = 349 pt = 1,97 м, пролёт 4 + свес 0,68 = 4,68 м; tg = 0,42 = 22,8 град;
# линия ската на виде (150,965)-(805,690) px: 0,42 — сходятся
pitch_deg = 23.0
overhang_m = 0.7
gable_overhang_m = 0.7
overhang_by = "drawing"
roof_material = "shingle_roof"
unit = "m"
pt_per_unit = 177.8
material = "log"
colors = { main = "#a19683", plinth = "#7d522d" }
plinth = 0.55
# пол первого этажа — по низу бруса (между брусом и цоколем отметок нет)
plinth_material = "brick"
floor_heights = [2.7]
trim = { casing = "wide", canopy = "gable", door = "plain" }
