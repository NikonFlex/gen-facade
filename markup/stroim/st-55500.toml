# «Байкал» — ООО «ПИК»; проект № 55500 на строим.дом.рф
# https://строим.дом.рф/project/55500 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — Ф. А–Г (вход, юг), стр. 4 — Ф. 6–1 (запад), стр. 2 — Ф. Г–А (север, терраса), стр. 3 — Ф. 1–6 (восток);
# 1 pt = 1 px картинки. План 6,0 × 10,5 м (оси А–Г, 1–5) + открытая терраса 1,5 м под продолженной кровлей (оси 5–6).
# Масштаб у каждого вида свой: pt/м = ширина между осями / длина с плана: юг 747/6,0 = 124,5; запад 1033/10,5 = 98,4;
# север 697/6,0 = 116,2; восток 1038/10,5 = 98,9. Сверка: на востоке вся длина 12,0 м по осям 1–6 = 1187 pt → 98,9 pt/м;
# высота стены: восток 292 pt = 2,95 м, запад 234 pt = 2,38 м (разность 0,57 м на 6,0 м = 5,4°, линия ската даёт 5,0°).
# Отметок уровней на листе нет — высоты по масштабу. Пол — верх тёмного цоколя (низ кладки, ±0,000 не подписан).
id = "st-55500"
pdf = "55500/sheet.pdf"
roof = "односкатная, скат на запад, ≈5° (по линии ската 5,0°; по высотам 2,95 и 2,38 м на 6,0 м пролёта 5,4°), серая кровля; белый фасадный свес; кровля продолжена над террасой на севере"
roof_kind = "shed"
pitch_deg = 5.0
roof_down = 1
# свес: юг стр. 1 — 51 pt / 124,5 = 0,41 м за запад/восток; на восточном виде — 43 pt / 98,9 = 0,43 м за южную стену
overhang_m = 0.4
gable_overhang_m = 0.43
overhang_by = "drawing"
# кровля: серая «чешуя» с волной на стр. 4 — по рисунку металлочерепица, не уверен
roof_material = "metal_tile"
unit = "m"
pt_per_unit = 124.5
# обрамление: тонкий подоконник под окнами, рамочный наличник у двери и окон, ставен и козырька нет
trim = { sill = "flat", casing = "flat", door = "plain" }
material = "board_batten_narrow"  # вертикальная доска с узкими рейками, по рисунку, цвет коричневый
colors = { main = "#856d4e", plinth = "#3b3127", roof = "#e0e0e0" }
plinth_material = "wood"  # тёмный цоколь горизонтальными досками, по цвету, не уверен
plinth = 0.47  # 59 pt / 124,5 на юге; 46 pt / 98,9 на востоке
floor_heights = [2.4]  # до карниза низкой (западной) стороны; восточная стена выше — 2,95 м, показана eaves на стр. 3
absent = [
  "все стороны: нет карнизной полосы — только белый фасадный свес",
  "все стороны: нет наличников-пилястр, ставен, козырьков",
]
cut = [
  "south, east: площадка и ступени у входа на плане",
  "west, east: столбы террасы (по одному у угла, учтены в porch_roofs)",
  "north: тёмный настил террасы на уровне цоколя",
]
part_roofs = []

