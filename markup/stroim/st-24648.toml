# Одноэтажный дом 10 × 8 м с двускатной крышей — проект № 24648 на строим.дом.рф
# https://строим.дом.рф/project/24648 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — юг (вход: дверь с фрамугой + 2 окна, 10 м), стр. 3 — запад (щипец: остеклённая дверь
# и окно в пол, 8 м), стр. 4 — север (3 окна, 10 м), стр. 2 — восток (щипец, одно окно, 8 м); план — стр. 5,
# 10 000 × 8 000 мм; 1 pt = 1 px. Вход на плане — дверь тамбура на нижней (южной) стороне слева; ещё одна
# дверь (кухня-гостиная) в западной стене. Порядок по часовой от входа: юг → запад → север → восток.
# Проверка: с юга слева запад (дверь+окно на стр. 3), с запада слева север, с севера слева восток, с востока слева юг.
# Масштаб у вида свой: юг 1420 pt / 10 м = 142,0; север 1420/10 = 142,0; запад 1420/8 = 177,5; восток 1420/8 = 177,5.
# Сверка по отметкам: юг +0,900 → ±0,000 = 127 pt / 0,9 = 141,1, +2,400 → 340/2,4 = 141,7; север 126/0,9 = 140,0,
# 339/2,4 = 141,3; восток 158/0,9 = 175,6, 424/2,4 = 176,7; запад +2,400 → 424/2,4 = 176,7 — расхождение до 1,2 %.
# Отметки: ±0,000 — чистый пол (линия на цоколе), −0,500 земля; верх окон и двери +2,400, подоконники +0,900,
# низ свеса +2,767, конёк +5,086. Стена под свесом: на юге/севере видна до низа фасции (+2,77), по щипцам
# уходит выше до +2,99 (свес 0,5 м × уклон) — floor_heights взята 2,77 по видимой стене.
id = "st-24648"
pdf = "24648/sheet.pdf"
roof = "двускатная, конёк вдоль 10 м, свесы 0,5 м со всех сторон, конёк +5,086, низ свеса +2,767, черепица тёмная"
roof_kind = "gable"
roof_material = "metal_tile"  # рисунок — волна с уступом; подписи нет — по рисунку, не уверен (может быть tile_roof)
# tg по формуле = (5,086 − 2,767) / (4,0 + 0,5) = 0,515 = 27,3°; по линии ската на виде восток:
# (1213−683 … верх свеса y=683 на x=233; конёк y=313 на x=1031) = 370 / 798 = 0,464 = 24,9° — расходятся >2°, взято по линии
pitch_deg = 25.0
overhang_m = 0.5
gable_overhang_m = 0.5
overhang_by = "drawing"
unit = "m"
pt_per_unit = 142.0
material = "plaster"  # белая заливка, подписи нет — штукатурка по цвету, не уверен
colors = { main = "#f5f5f5", plinth = "#2e2e2e" }
plinth = 0.5
plinth_material = "concrete"  # тёмная заливка −0,500…0,000, по цвету, не уверен
floor_heights = [2.77]
# обрамления нет: окна в тёмных рамках без подоконников, наличников и ставен; козырька над входом нет
trim = { door = "panel6" }
cut = ["east: цоколь на виде 55 pt = 0,31 м, а не 0,5 м — отметки −0,500 на виде нет (перепад рельефа?)",
       "south: фасция (тёмная полоса 0,16 м) под кровлей — часть кровли, не размечена",
       "west: у стены слева низ рамы и пол двери у цоколя без порога — не размечено"]
absent = ["все стороны: нет карнизной полосы кроме фасции кровли",
          "все стороны: нет зон второй отделки",
          "все стороны: нет труб, мансардных окон, слуховых окон, водостока, крыльца и столбов"]

