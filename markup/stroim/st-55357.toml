pdf = "55357/sheet.pdf"
roof = "двускатная 33°, конёк +5,425 вдоль север-юг, скаты на восток и запад, низ свеса +2,852, верх +3,172, свес 0,4 м; щипцы — юг и север (в южном окно)"
roof_kind = "gable"
# уклон: на листе i=33°; расчёт (5,425 - 3,172)/(3,07 + 0,4) = 0,649 = 33,0°; линия ската совпала
