# Finkston11 (ООО СТРОЙКА63) — проект № 55357 на строим.дом.рф
# https://строим.дом.рф/project/55357 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — Ф. А–Б (восток, вход Д1 слева — у оси А, окно ОК1 справа), стр. 4 — Ф. 1–2 (юг, два окна ОК1 и окно в щипце),
# стр. 3 — Ф. Б–А (запад, глухая), стр. 2 — Ф. 2–1 (север, окно ОК3 3x2). Порядок по часовой от стороны входа (Д1 на оси 2 плана): восток, юг, запад, север;
# проверка: у востока слева А (юг), у юга слева 1 (запад), у запада слева Б (север), у севера слева 2 (восток) — сходится.
# Контур по наружным граням стен (план 1-го этажа): 9,65 x 6,14 м.
# Масштаб: стр. 1 и 3 — 9,15 м осей = 1128 pt -> 123,2 pt/м (сверка по ±0,000 -> -0,730: 0,77 м на стр. 3, стена 9,65 м = 1190 pt ✓);
# стр. 4 — 5,64 м = 794 pt -> 141 pt/м (стена 6,14 м = 867 pt ✓); стр. 2 — 5,64 м = 810 pt -> 143,6 pt/м (расхождение с юго-видом 2 %, взят свой).
# Чистый пол ±0,000 = верх цоколя (тёмная кладка), цоколь 0,73 м до земли.
# Высота стены: по длинным стенам верх 2,852 (низ свеса); у щипцов стена идёт до низа кровли: 2,852 + 0,4*tg33 = 3,11 (так в силуэте).
