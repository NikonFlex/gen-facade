  "конёк на 9,2 м от оси А (5,2 м от оси Б), скаты 22,3° и 23,5°; модуль строит симметричную крышу по контуру дома",
  "карпорт (А-Б) и терраса (Г-Д) — открытые части под продолжением основной кровли: стен нет, они в porch_roofs (kind main), не в контуре",
]
