  "south, north: кирпичные перемычки над окнами, тёмные вставки в простенках между остеклением (x 760-850, 980-1070) — зоны не размечены",
  "south, east: ступени террасы и крыльца, настил, ограждения не размечены; терраса у юга — стена с дверью стоит в плоскости контура",
  "west: тёмные кирпичные пилястры вокруг окна на Ф. 3-1 — наличник не размечен; верх окна на линии низа свеса +2,100",
  "south: остекление в пол — взято slope, а не panoramic, потому что верх идёт по скату щипца",
  "east: дверь — glazed по цвету, не уверен; окно x 1072-1217 с фрамугой сверху взято panoramic rows=2",
