  "все стороны: нет мансардных и слуховых окон",
  "west, north, east: нет зон второй отделки (тёмная и светлая кладка на Ф. 3-1 различимы плохо)",
]
cut = [
  "south: вентиляционные трубы (2 + 2 на скатах, металл) и вентвыходы на кровле Ф. 1-3 и 3-1 — не трубы",
  "south, north: кирпичные перемычки над окнами, тёмные вставки в простенках между остеклением (x 760-850, 980-1070) — зоны не размечены",
  "south, east: ступени террасы и крыльца, настил, ограждения не размечены",
  "west: тёмные кирпичные пилястры вокруг окна на Ф. 3-1 — наличник не размечен; верх окна на линии низа свеса +2,100",
  "south: пилястры х 4293-4430 (светлая кладка, угол террасы) — столб террасы стоит на востоке, на юге не размечен",
