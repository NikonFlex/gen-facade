# Проект № 102359 на строим.дом.рф — одноэтажный дом 17,31 x 14,0 м с карпортом слева и террасой справа под одной кровлей
# https://строим.дом.рф/project/102359 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — Ф. А-Д (юг, вход слева-направо: запад->восток), стр. 4 — Ф. 3-1 (запад), стр. 1 — Ф. Д-А (север),
# стр. 3 — Ф. 1-3 (восток); 1 pt = 1 px. План — стр. 5, оси: А..Д по горизонтали (17 310), 1..3 по вертикали (14 000), ось 1 внизу = юг.
# Порядок по часовой от входа: юг -> запад -> север -> восток. Проверка: на Ф. А-Д слева запад (А), на Ф. 3-1 слева север (3),
# на Ф. Д-А слева восток (Д), на Ф. 1-3 слева юг (1). Вход: двустворчатая дверь на юге в крыле террасы (Г-Д) под медным козырьком.
# Переразметка 14.11 (gf#470/gf#472): контур — только стены дома по плану (стр. 5). Основной объём Б-Г 10,3 x 14,0 м + топочная в оси Г-Д
# (3,0 x 3,8 м, северо-восточный угол); контур Г-образный, 6 сторон по часовой от входа (дверь топочной на юг): юг-топочная 3,0 (inner_corner),
# восток-основная 10,2, юг-основная 10,3, запад 14,0, север 13,3 (Б-Д), восток-топочная 3,8; замыкается: 10,3+3,0 = 13,3; 14,0 = 10,2+3,8.
# Карпорт (А-Б, 4,0 м, на столбах, без стен) и терраса (Г-Д, 3,0 м, у основной стены на востоке) — НЕ в контуре: навесы `[[porch_roofs]]`
# kind = "main" (продолжение основной кровли), столбы — элементами pillar на видах стен, у которых стоят (запад 4, восток 2).
# Страницы: юг стр. 2 общая у двух сторон (основная стена x 1246-3705, топочная x 3705-4421; А на 291,7, Б 1246,5, Г 3705,1, Д 4421,2),
# восток стр. 3 общая (основная стена 10,2 м: x 671-3189, топочная 3,8 м: x 3189-4128).
# Масштаб у каждого вида свой: юг 1516 pt / 17,31 м = 238,7 pt/м (сверка по уровням: +2,100 над +0,000 = 184 px = 87,6 px/м против 87,58 — 0 %);
# север 1528*2,3817/17,31 = 210,2 (сверка +2,400 = 214 px против 211,9 — 1 %); запад 14 м = 3422 pt -> 244,4 (сверка +2,100: 190 px = 90,5 px/м против 90,6);
# восток 14 м = 3459 pt -> 246,9 (сверка +2,400: 224 px = 93,3 px/м против 92,7 — 0,6 %).
# Нуль — чистый пол ±0,000, земля -0,300 (цоколь 0,3 м серый). Карниз по проекту +2,400 (низ свеса у столбов +2,100).
id = "st-102359"
pdf = "102359/sheet.pdf"
roof = "двускатная, конёк вдоль севера-юга на +6,150 (отметка 6,550 — верх труб), карнизы +2,400, свесы ~0,4 м; кровля продолжена над карпортом (запад) и террасой (восток); гибкая черепица серая"
roof_kind = "gable"
roof_material = "shingle_roof"  # «чешуя» по рисунку
# уклон: расчёт (6,150 - 2,400)/(8,655 + 0,4) = 0,414 = 22,5°; линии скатов на Ф. А-Д: запад (597-252)/840 = 0,41 = 22,3°, восток (590-263)/753 = 23,5° — сходятся
pitch_deg = 22.5
overhang_m = 0.4
gable_overhang_m = 0.85  # на Ф. 1-3: на юге 1,2 м, на севере 0,5 м — среднее
overhang_by = "drawing"
unit = "m"
pt_per_unit = 238.7
