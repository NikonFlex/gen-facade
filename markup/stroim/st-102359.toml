  "конёк на 9,2 м от оси А (смещён к западу от центра контура 8,65 м), скаты 22,3° и 23,5°; модуль строит симметричную крышу по центру контура",
  "карпорт (А-Б) и терраса (Г-Д) — открытые части под продолжением основной кровли: стен нет, контур взят вместе с ними",
]
