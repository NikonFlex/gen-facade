# Одноэтажный дом 12,03 × 7,67 м с двускатной крышей и террасой под продолжением ската — проект № 30198 на строим.дом.рф
# https://строим.дом.рф/project/30198 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — север (вход с террасы, терраса справа), стр. 2 — восток (щипец, слева юг, справа терраса),
# стр. 3 — юг, стр. 4 — запад (щипец, слева терраса); стр. 5 — план. Порядок по часовой от входа: север, восток, юг, запад;
# проверка по левому краю вида: слева у севера — восток (терраса у запада, на виде справа), у востока — юг, у юга — запад
# (ступени террасы слева), у запада — север (терраса слева).
# Контур с плана 12 030 × 7 670 мм (по наружным граням стен). Масштаб у каждого вида свой, pt/м = ширина стены / размер плана:
# стр. 1 (север): 1120 / 12,03 = 93,1; стр. 2 (восток): 798 / 7,67 = 104,0; стр. 3 (юг): 1169 / 12,03 = 97,2; стр. 4 (запад): 834 / 7,67 = 108,7.
# Сверка по отметкам: стена до +2,800 — стр. 1 (635−375)/93,1 = 2,79; стр. 2 (595−303)/104 = 2,81; стр. 3 (580−308)/97,2 = 2,80;
# стр. 4 (599−293)/108,7 = 2,81; конёк +4,324 — стр. 2 (595−147)/104 = 4,31, стр. 4 (599−130)/108,7 = 4,31; расхождение < 1 %.
# floor — чистый пол ±0,000 (линия низа стены); под ним открытое свайное основание, сплошного цоколя нет.
id = "st-30198"
pdf = "30198/sheet.pdf"
roof = "двускатная, 15° (подпись на листе; конёк +4,324, край кровли +2,882 у низа свеса), ряды плиток без подписи — не уверен; свес карнизный и фронтонный ≈0,6 м; северный скат продолжен на 2,5 м над террасой (край +2,212)"
roof_kind = "gable"
roof_material = "metal_tile"  # по рисунку (модули-плитки с рядами), подписи нет — по уклону 15° и рисунку, не уверен
# уклон: линии ската на видах: стр. 2 от конька (609,147) до края (148,268) — 121/461 = 0,262 → 14,7°; стр. 4 — 200/754 = 0,265 → 14,9°;
# расчёт по отметкам: конёк +4,324, верх края кровли ≈ +3,15, полупролёт 3,835 + свес 0,6 = 4,435 → tg = 1,17/4,435 = 0,264 → 14,8°; подпись 15°
pitch_deg = 15.0
overhang_m = 0.6   # стр. 2: (210−148)/104 = 0,60 м со стороны юга
gable_overhang_m = 0.6   # стр. 1: (173−117)/93,1 = 0,60 м (восток); стр. 3: (163−103)/97,2 = 0,62 м
overhang_by = "drawing"
unit = "m"
pt_per_unit = 93.1
material = "plaster"  # стены без подписи и рисунка материала, только швы панелей через ≈1,2 м — по умолчанию, не уверен
colors = { roof = "#eaf6fd" }
plinth = 0.6  # земля (зелёная линия) на 0,6 м ниже пола на стр. 1–4; подпись −0,774 с этим не сходится (−0,224/−0,374 — низ перекрытия)
floor_heights = [2.8]  # +2,800 — верх стены под свесом; во фронтоне верхняя обвязка до +3,024
# обрамление: наличник плоский вокруг окон и двери (двойная линия рамки), подоконник плоский; входная дверь гладкая
trim = { sill = "flat", casing = "flat", door = "plain" }
# терраса вдоль северной стены (план: 6,3 × 2,5 м), столбы 4 шт., кровля — продолжение северного ската (стр. 1: x 638–1348, верх 233, низ 430)
porch_roofs = [
  { side = 0, x = [638.0, 1348.0], y = [233.0, 430.0], kind = "main", posts = 4, depth_m = 2.5 },  # продолжение крыши дома (gf#472, по чертежу)
]
absent = [
  "все стороны: нет карнизной полосы и поясов — только свес кровли",
  "все стороны: нет зон второй отделки",
  "все стороны: нет ставен, мансардных окон и слуховых, труб, водостока",
]
cut = [
  "север: три ступени перед дверью террасы (x 690–908, y 637–690), свайное основание под полом",
  "запад: ступени террасы слева (x 58–165, y 595–650)",
  "юг: слева от стены (x 103–163, y 240–365) торец террасы/ступени",
  "восток, запад: вентиляционный выход (красный прямоугольник) и серая решётка во фронтоне у конька",
  "все стороны: вертикальные швы панелей стены",
]

