# Дом серии 106.2 Premium — ООО "КОНТРАСТ"; проект № 46800 на строим.дом.рф
# https://строим.дом.рф/project/46800 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — торец оси А–Г со входом (остеклённый, дверь по центру, справа ограждение террасы),
# стр. 2 — длинная стена с осью 6 слева (слева терраса 2,74 м, 4 окна), стр. 3 — торец Г–А (две
# тройные группы окон), стр. 4 — длинная стена с осью 1 слева (окно, окно из 4 створок, справа терраса).
# План (стр. 5) отражён относительно видов: порядок взят по осям. Вход — на стр. 1 (ДВ-3 в прихожей).
# Порядок по часовой от входа: стр. 1 → стр. 2 → стр. 3 → стр. 4. Проверка по осям: справа от стр. 1 — Г,
# слева — А; левый край стр. 1 (А) стыкуется с правым краем стр. 2 (ось 1), левый край стр. 2 (ось 6) — с
# правым стр. 3 (А), левый стр. 3 (Г) — с правым стр. 4 (ось 6); левый стр. 4 (ось 1) — с правым стр. 1 (Г).
# Масштаб у каждого вида свой (ширина стены в pt / длина по размеру): стр. 1 1770 / 9,105 = 194,4;
# стр. 2 1320 / 13,05 = 101,15; стр. 3 1134 / 9,105 = 124,55; стр. 4 3140 / 13,05 = 240,6. Сверка по высоте
# (земля → конёк 4,570 м): 1 — 890 pt = 194,7; 3 — 568 pt = 124,3; 4 — 1095 pt = 239,6; на стр. 2 — 446 pt = 97,6
# (расхождение с шириной 3,5 %, вид слегка сжат по вертикали — взят масштаб по ширине).
# Отметки: 0,000 стоит у земли, конёк 4,570 над землёй. Пол дома — низ остекления/цоколя: 0,55 м над землёй
# [не уверен: на листах нет отметки чистого пола; сверка — низ карниза 3,05 м над землёй = 0,55 + 2,5].
# Высота этажа 2,5 м по карточке сходится с низом подшивки карниза на стр. 1 и 3 (2,53–2,56 м от пола).
# Контур 13,05 × 9,105 м замкнут. План — по осям А–Г (9 105) и 1–6 (13 050).
id = "st-46800"
pdf = "46800/sheet.pdf"
roof = "двускатная 15°, конёк вдоль длинной стороны (13,05 м), конёк +4,570 над землёй, пролёт 9,1 м, свесы 0,7 м со всех сторон, кровля — тёмные полосы с вертикальным фальцем; кровля продолжена над террасой в углу дома"
roof_kind = "gable"
# tg = (4,570 − 3,16) / (4,55 + 0,7) = 0,268 → 15,0° (край кровли 3,16 м над землёй, по стр. 1 y 336 pt); линия ската на стр. 1: 245 pt на 907 pt = 0,27 → 15,1°
pitch_deg = 15.0
overhang_m = 0.7
gable_overhang_m = 0.7
overhang_by = "drawing"
# кровля — гладкие тёмные полосы шириной ≈1–1,4 м с вертикальными швами: фальц [не уверен: подписи нет]
roof_material = "metal_roof"
unit = "m"
pt_per_unit = 194.4
# стена — гладкая светлая, без рисунка и подписи: штукатурка [по цвету, не уверен]
material = "plaster"
colors = { main = "#faf6f3", plinth = "#cdcdcc", accent = "#c6c6c6", roof = "#d0d0d0" }
plinth = 0.55
# тёмная полоса 0,2 м у земли (бетон?) и над ней обшивка горизонтальной доской 0,3 м (стр. 1) [по цвету, не уверен]
plinth_material = "concrete"
floor_heights = [2.5]
gutters = true
trim = { door = "plain" }
porch_roofs = [
  { side = 1, x = [113.0, 497.0], y = [305.0, 445.0], kind = "main", posts = 3, depth_m = 5.44 },  # продолжение крыши дома (gf#472, по чертежу)
  { side = 3, x = [2920.0, 3833.0], y = [135.0, 455.0], kind = "main", posts = 3, depth_m = 5.44 },  # продолжение крыши дома (gf#472, по чертежу)
]
cut = ["north (стр. 2): ступени слева (три) и плита террасы −0,112 — не размечены; одиночные столбы 150 мм (x 783–800, 1034–1050) — декор/стойки",
       "west (стр. 1): ограждение террасы справа (x 1540–2125, y 700–800), скамья перед дверью, сходы водосточных труб с краёв кровли",
       "south (стр. 4): одиночные стойки 150 мм у стены (x 1240–1265, 1655–1680, 1065–1090) — не размечены",
       "south: второй материал под окнами (крапчатая панель) — зона stone [по рисунку, не уверен: может быть декоративная штукатурка]",
       "все стороны: верх стены на стр. 2 и 4 — глухая белая стена между столбами, без окон; рамки окон с наличником flat и глухой нижней панелью"]
absent = ["все стороны: нет карнизной полосы, ставен, подоконников, козырьков",
          "все стороны: нет труб, мансардных и слуховых окон"]

