# Светлана 111 — ООО "ПСМК "СТАЛЬМЕТ"; проект № 52790 на строим.дом.рф
# https://строим.дом.рф/project/52790 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 4 — фасад юг (вход: тамбур, крыльцо), стр. 3 — запад (слева север), стр. 2 — север
# (терраса под кровлей), стр. 1 — восток (дверь в холл). Привязка видов к сторонам — по окнам плана:
# юг — окно кухни 1830, котельная 920, дверь тамбура, окно спальни 1830 (слева направо с запада).
# Одноэтажный дом 12,9 × 12,9 м без мансарды: Г-образный план с нишей террасы в СЗ-углу и крыльцом (ниша
# в южной стене); контур — 8 сторон по часовой от южной выступающей части спальни (стр. 4 справа):
# 0 юг-спальня 4,40 · 1 торец ниши крыльца (запад) 1,25 · 2 юг-основная 8,5 · 3 запад 8,88 ·
# 4 север-гостиная (за террасой) 5,4 · 5 торец террасы (запад) 2,78 · 6 север-спальни 7,5 · 7 восток 12,9.
# Масштаб — на каждом виде свой, pt/м = ширина вида / 12,9 м (длины стен и дальше по плану: цепочки
# 2800+5495+3205+1400 = 12 900 мм; размер 13 780 на плане не сходится ни с чем, не взят): юг 1230/12,9 =
# 95,3; запад 1264/12,9 = 98,0; север 1250/12,9 = 96,9; восток 1223/12,9 = 94,8. Сверка по уровням:
# ±0,000 → +5,850 на юге 557 pt = 95,2 pt/м, на севере 566 = 96,8, на западе 567 = 96,9, на востоке 548 = 93,7
# (расхождение со шириной до 1,2 %); окна 1830 и 1960 мм на видах 172–190 pt = 94–97 pt/м. План
# вытянут иначе (63,6 pt/м по окнам), поэтому длины сторон взяты с фасадов, а не с плана по пикселям.
# Отметки: ±0,000 — чистый пол (y юг 945, север 933, запад 965, восток 945), −0,700 земля, низ окон +0,800,
# верх окон и дверей +2,500, верх стены под карнизом ≈ +3,0 (по пикселям 2,95–2,98; отметка +3,150 — низ
# свеса/край кровли, не стена), нижний конёк +5,024, верхний +5,850.
id = "st-52790"
pdf = "52790/sheet.pdf"
roof = "вальмовая ≈20° (верхний конёк +5,850, нижняя ступень +5,024 над южной частью), свес ≈0,8 м; кровля на видах — одна заливка"
roof_kind = "hip"
# уклон: tg по отметкам = (5,850 − 3,150) / (6,68 − 0 свес в пределах) ≈ 22,0°, но +3,150 стоит у низа свеса;
# по линии ската на видах (юг: (915,388)→(1552,621), 233/637) = 20,1°; расходятся на 1,9° — взято по линии ската
pitch_deg = 20.0
# свес: юг — крайний карниз 172/1552 против стен 247/1477 = 75 pt = 0,79 м; восток 76 pt = 0,80 м
overhang_m = 0.8
gable_overhang_m = 0.8
overhang_by = "drawing"
roof_gaps = ["две вальмы разной высоты: главная +5,850 и нижняя +5,024 над южной/юго-западной частью (виды стр. 1, 4) — модуль строит одну"]
chimneys = [
  { side = 7, x = 562.0 },
]
unit = "m"
pt_per_unit = 95.0
# отделка: на листе подписей и экспликации нет, серая заливка на видах — тени; материал — штукатурка по умолчанию
# [не проверено: в API facade_material = 8, расшифровки нет; рисунок — гладкая стена]
material = "plaster"
plinth = 0.7
plinth_material = "plaster"  # цоколь — гладкий, без рисунка [не проверено]
floor_heights = [3.0]
# обрамление: наличников, подоконников, ставен нет; входные двери — плоские (одна — с вертикальными полосами)
cut = ["юг: на двери вертикальные полосы (доска?) — размечена как обычная дверь; ниша крыльца — только столб и площадка",
       "север: вентвыход на коньке (стр. 2, x 897–940) — не труба",
       "север: второй столб террасы у западного угла (x ≈ 1440–1480) — не размечен",
       "запад: у торца ниши крыльца (x 1380–1465) контур 2,5 м высотой — край ниши, не размечен",
       "восток: правее стены (x 1480–1485, y 712–868) тонкая вертикаль — не размечена",
       "все стороны: ступени крыльца и террасы по краям видов (стр. 1–3) не размечены",
       "кровля над террасой на севере: край свеса на стр. 2 сплошной, отдельная кровля террасы не прочитана"]
absent = ["все стороны: нет карнизной полосы — только свес кровли",
          "все стороны: нет зон второй отделки, подоконников, наличников, ставен",
          "все стороны: нет водостока и мансардных окон"]

