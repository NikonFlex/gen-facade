# Проект № 115275 на строим.дом.рф (одноэтажный сруб 7 x 7 м с мансардным окном в щипце и террасой 2 м под общей кровлей)
# https://строим.дом.рф/project/115275 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 4 — юг (вход: дверь слева, окно справа, терраса на столбах), стр. 2 — запад (терраса справа),
# стр. 1 — север (окно справа), стр. 3 — восток (терраса слева); 1 pt = 1 px (1920 x 1080). Порядок сторон
# проверен по плану 1-го этажа: окна запада/востока (широкое у севера/юга) и левый край каждого вида сходятся.
# Это 3D-вид без отметок и размеров, обрезанный снизу кадром: масштаб — по стене 7,0 м плана (7000 мм по наружному
# контуру): 437..1483 = 1046 pt -> 149,4 pt/м (север, юг), 288..1333 = 1045 pt (запад), 587..1632 (восток);
# терраса 2,0 м = 299 pt сходится с планом (1333..1632). Сверки по двум уровням нет (отметок нет).
# Пол: чистый пол ±0,000 на виде не виден; floor = низ стены на кадре (y 1075), терраса по верху балок на y 1030
# (0,3 м выше) — пол дома, вероятно, ближе к 1030, не уверен. Карниз (верх стены) y 550: 525 pt = 3,5 м.
# План 2-го этажа (5 x 9 м) не сходится с контуром 7 x 7 и с видами — не используется; мансарда — окно в щипце.
id = "st-115275"
pdf = "115275/sheet.pdf"
roof = "двускатная, конёк вдоль север-юг (щипцы на севере и юге), уклон 40° по линии ската (отметок нет), свесы 0,5 м, кровля продолжена над террасой (общий щипец спереди); тёмная черепичная фактура с уступом"
roof_kind = "gable"
roof_material = "metal_tile"  # волна с уступом по рисунку, подписи нет
# уклон: расчёт по отметкам невозможен (их нет); по линии ската: (508 − 10) / (950 − 363) = 0,848 = 40,3° (нижний край кровли на щипце y 508, конёк y 10, край свеса x 363, середина x 950)
pitch_deg = 40.3
overhang_m = 0.5
gable_overhang_m = 0.5
overhang_by = "drawing"
unit = "m"
pt_per_unit = 149.4
material = "log"  # горизонтальные брёвна с торцами в углах
colors = { main = "#fddf6f", roof = "#fae0a6" }
plinth = 0.0
floor_heights = [3.5]
trim = { casing = "flat", door = "plain" }
roof_gaps = []
absent = [
  "все стороны: нет отметок уровней, размеров, цоколя, труб, водостока, мансардных и слуховых окон",
  "все стороны: нет зон второй отделки",
]
cut = [
  "все стороны: торцы балок под карнизом (стропильные выпуски) не размечены",
  "west, east: столбы террасы у края вида (x ~1621 запад, ~298 восток) отдельно не размечены — в стороне south",
  "south: ступеней и перил террасы на виде нет; входная площадка — балка пола террасы y 1030..1075",
]
porch_roofs = [
  { side = 0, x = [363.0, 1557.0], y = [10.0, 553.0], kind = "gable", posts = 4, depth_m = 2.0 },
]

