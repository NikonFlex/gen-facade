# Жилой дом «КП-500-3» — ООО "ЛИВВИЛ"; проект № 53372 на строим.дом.рф
# https://строим.дом.рф/project/53372 ; разметка gf#470 (волна 1, учебная, см. LICENSE.md).
# Листы: стр. 1 — восток (слева юг, справа север), стр. 2 — запад (слева север, справа юг),
# стр. 3 — юг (вход: два входа и крыльцо на трёх столбах), стр. 4 — север; стр. 5 — план 2-го этажа,
# стр. 6 — план 1-го; 1 pt = 1 px. Фасады без подписей осей и без отметок уровней.
# Контур Г-образный: корпус 10,28 x 8,98 м и выступ кухни 4,15 x 1,5 м на северо-западе (план 1-го
# этажа: 10 280, 8 980, 10 480 = 8 980 + 1 500, 4 150). Стороны по часовой от входа: юг (стр. 3), запад
# (стр. 2), север-выступ (стр. 4, правая часть), восток-выступ (стр. 1, правая часть, внутренний угол
# после неё), север-корпус (стр. 4, левая часть 6,13 м), восток-корпус (стр. 1). Невязка 0.
# Масштаб у каждого вида свой (pt/м = ширина стены / длина по плану): юг 993/10,28 = 96,6; запад 960/10,48 = 91,6;
# север 958/10,28 = 93,2 (граница выступа x 860 — водосточная труба на листе, 4,15 м даёт 860);
# восток 959/10,48 = 91,5 (корпус 8,98 м даёт x 1055 — труба на листе). Отметок уровней на листе нет, сверка по
# планам: окна востока 1,45 м по плану при 138 pt = 1,50 м; шаг окон 2-го этажа запада 2,8 м (плана 2-го этажа) при 270 pt
# = 2,9 м; конёк по видам 7,9–8,1 м над землёй (стр. 3: 777 pt / 96,6 = 8,0; стр. 4: 752/93,2 = 8,1; стр. 2: 743/91,6 = 8,1;
# стр. 1: 720/91,5 = 7,9) — сходится в пределах 3 %. Карточка (высота дома 8,8 м) на 0,7 м выше чертежа — верим чертежу.
# Пол ±0,000 — верх тёмной полосы цоколя на каждом виде; цоколь по полосе 17 pt ≈ 0,18 м.
# Дом полуторный: 2-й этаж — мансарда под скатом, стены на карнизе 3,9 м над полом (окна 2-го этажа
# 3,1–4,7 м уходят во фронтоны восточной и западной стен); поэтому floor_heights = [2,9 до перекрытия, 1,0 колено].
id = "st-53372"
pdf = "53372/sheet.pdf"
roof = "двускатная, ≈38° (линия ската стр. 1: 465/585 pt = 38,5°, стр. 2: 37,9°; отметок конька и свеса на листе нет), конёк с запада на восток, металлочерепица по рисунку; скат продолжен над крыльцом юга (1,3 м) и над выступом кухни севера (1,5 м); свесы 0,7 м"
roof_kind = "gable"
roof_material = "metal_tile"  # рисунок волнистой черепицы с уступом на всех видах; подписи нет — по рисунку, не уверен
# уклон: отметок на листе нет, считать нельзя — по линии ската на видах 1 и 2 (38,5° и 37,9°)
pitch_deg = 38.0
# свес: щипцовый — стр. 3, кровля 67 pt за стеной с обеих сторон / 96,6 = 0,7 м; карнизный над выступом — стр. 1,
# 68 pt / 91,5 = 0,74 м; у остальной части север/юг не виден за выступом и крыльцом
overhang_m = 0.7
gable_overhang_m = 0.7
overhang_by = "drawing"
gutters = true  # желоб и водосточные трубы на всех видах
# мансардное окно одно: скат юга, стр. 3 (x 672–752, y 343–420), на стр. 1 и 2 видно с ребра тёмной полосой
skylights = [
  { side = 0, x = [672.0, 752.0], y = [343.0, 420.0] },
]
# крыльцо юга 4,2 x 1,3 м (план 5,7 м²): кровля — продолжение ската дома, три столба (стр. 3: x 232, 432, 624)
porch_roofs = [
  { side = 0, x = [145.0, 710.0], y = [548.0, 621.0], kind = "main", posts = 3, depth_m = 1.3 },  # продолжение крыши дома (gf#472, по чертежу)
]
roof_gaps = ["юг и север: скат дома продолжен вниз над крыльцом (юг) и над выступом кухни (север) — свес 1,5–2,2 м от стены корпуса вместо 0,7 м"]
unit = "m"
pt_per_unit = 93.2
material = "siding_narrow"  # горизонтальная обшивка, шаг пазов 10 pt = 0,10 м — по рисунку
colors = { main = "#8d8d8c", plinth = "#605f5b", accent = "#e8ccb4" }
plinth = 0.18
plinth_material = "concrete"  # тёмно-серая полоса цоколя, по цвету, не уверен
floor_heights = [2.9, 1.0]
cut = [
  "south: тамбур и дверь выступа под крыльцом, ступени и площадка крыльца, стойки не размечены как порч",
  "north, east, south: настил террасы 35 м² (без кровли, без перил) у нижней кромки стен",
  "east, west: тёмные точки по линиям скатов — снегозадержатели или кронштейны, не размечены",
  "north: центральная створка окна гостиной — по плану там дверь на террасу, на виде ручки нет",
]
absent = [
  "все стороны: нет карнизной полосы — только свес кровли с желобом",
  "все стороны: нет подоконников, наличников и ставен — окна в тёмной раме",
  "все стороны: нет труб",
]

