# Одноэтажный дом 11,55 x 8,62 м с крыльцом — проект № 23582 на строим.дом.рф
# https://строим.дом.рф/project/23582 ; разметка gf#470 (волна 2).
# Листы (1 pt = 1 px): стр. 3 — юг (вход, крыльцо), стр. 4 — запад, стр. 1 — север, стр. 2 — восток; план — стр. 5.
# Порядок по часовой от входа: юг -> запад -> север -> восток. Проверка: у юга слева запад (окна 1,2 и 8,7 м от запада),
# у запада слева север (окно 2,7-4,0 м от севера, как на плане), у севера слева восток, у востока слева юг (крыльцо слева).
# Контур по наружным граням (план): 11 550 x 8 620, замкнут.
# Масштаб свой у каждого вида: юг 2176 pt / 11,55 = 188,4 (сверка: дверь 2,1 м = 396 pt -> 188,6); запад 1805 / 8,62 = 209,4
# (3000 = 626 pt -> 208,7); север 2339 / 11,55 = 202,5 (3000 = 607 pt -> 202,3); восток 1892 / 8,62 = 219,5, по отметке
# 3000 = 649 pt -> 216,3 — расхождение 1,5 %, взято 218.
# Отметки: ±0,000 — чистый пол (низ тёмной полосы цоколя 0,45 м над землёй); стена до подшивки свеса 2,70 м
# (отметка 3000 на листе — до верха кромки свеса, там же y карниза на виде).
id = "st-23582"
pdf = "23582/sheet.pdf"
roof = "вальмовая, конёк вдоль 11,55 м длиной 2,94 м, высота конька 2,15 м над кромкой свеса, свес 0,8 м; над крыльцом на юге вальмовый навес высотой 1,0 м"
roof_kind = "hip"
# tg = 2,15 / (4,31 + 0,8) = 0,421 = 22,8°; линия ската на севере: (503-143)/(893-40) = 0,422 = 22,9° — сходятся
