# «Одноэтажный коттедж» (блокированный жилой дом Д-120) — ИП Алексеев В. О.; проект № 52780 на строим.дом.рф
# https://строим.дом.рф/project/52780 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 4 — Ф-5 (юг, вход, ось А), стр. 2 — Ф-8 (запад, ось 1), стр. 3 — Ф-6 (север, ось Д),
# стр. 1 — Ф-7 (восток, ось 6); 1 pt = 1 px. Порядок сторон проверен по трубе: она на южном скате у восточного
# конца (Ф-5 справа, Ф-7 слева, Ф-8 справа, Ф-6 слева). Прямоугольник 15,05 × 9,0 м (план).
# Масштаб: Ф-6 стена 1148 pt / 15,05 = 76,3; Ф-7 687 / 9,0 = 76,3; Ф-8 686 / 9,0 = 76,2; Ф-5 стена 1174 pt = 78,0 pt/м
# (окно 1,5 м = 117 pt) — по высоте на Ф-5 76,2 (2,9 м = 221 pt): расхождение 2,4 %, меньше порога.
# Сверка по высоте: ±0,000 → +2,900 = 221-223 pt при 76,3 (2,90 м). Пол = низ кладки (±0,000 на уровне низа стены);
# земля ниже на 17-19 pt = 0,22-0,25 м.
id = "st-52780"
pdf = "52780/sheet.pdf"
roof = "вальмовая, ≈21° (конёк +5,092, свес +2,900), свес 0,5 м со всех сторон; кровля на листе одной заливкой"
roof_kind = "hip"
# roof_material не читается (одна серая заливка) — не пишу
# уклон: Ф-7 подъём 143 pt на 381 pt пролёта = 20,6°; по отметкам (5,092 − 3,16)/5,0 = 21,1° — беру 21°
pitch_deg = 21.0
overhang_m = 0.5
overhang_by = "drawing"
chimneys = [
  { side = 0, x = 1162.5, depth_m = 1.55 },
]
unit = "m"
pt_per_unit = 76.3
material = "plaster"  # по цвету (светло-серая заливка), подписи отделки нет — не уверен
colors = { main = "#c9c9c9", plinth = "#6e6e6e" }
plinth = 0.25
floor_heights = [2.9]
plinth_material = "concrete"  # тёмная полоса цоколя; по цвету, не уверен
trim = { door = "plain" }
absent = [
  "все стороны: нет карнизной полосы — только свес кровли",
  "все стороны: тёмная полоса под свесом на стене — тень, не отделка",
  "все стороны: нет подоконников, наличников, ставен, водостока",
  "west, east: окон и дверей нет (план: глухие торцы)",
]
cut = [
  "south: вход без крыльца на плане — площадка 2,0 × 1,8 м не размечена, на фасаде не видна",
]

