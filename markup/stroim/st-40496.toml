# Двухэтажный дом с вальмовой крышей — проект № 40496 на строим.дом.рф
# https://строим.дом.рф/project/40496 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 1–3 (вход), стр. 2 — Ф. Г–А, стр. 3 — Ф. А–Г, стр. 4 — Ф. 3–1; 1 pt = 1 px.
# Прямоугольник 9,0 × 9,04 м (размер на листе — между краями стены). Масштаб у вида свой:
# pt/м = ширина стены / подписанный размер; сверка по уровням: Ф. 1–3 — 2,600 над полом = 302 pt при
# 116 pt/м (2,60 м), Ф. 3–1 — верх окон +5,120 = 6,02 − 0,90 м.
# Отметки: ±0,000 чистый пол (низ кладки), −0,400 земля, +3,220 перекрытие, +6,220 верх свеса.
# Карниз дома — низ свеса кровли у стены, 6,02 м над полом (на листе не подписан — по картинке).
# Окно в пол (стеклянная створка у пола) размечено дверью — как и на прежних листах.
id = "st-40496"
pdf = "40496/sheet.pdf"
roof = "вальмовая, ≈33° (конёк +8,490, свес +6,220), черепица; свесы со всех сторон; навес над входом"
roof_kind = "hip"
roof_material = "tile_roof"  # кровля на всех видах — черепица волной (стр. 1–4)
# труб, мансардных окон и водостока на листе нет
pitch_deg = 24.9  # уклон: tg = (8,490 − 6,220) / (4,5 + 0,4 свес) = 0,463 = 24,9° (gf#470, расчёт; 6,220 — край кровли у карниза, пирамида 9,0 × 9,04)
# свес: вальмовая — Ф. 1–3 стр. 1, край кровли за стеной на 44 px (48,7 pt / 116 pt/м) = 0,4 м с обеих сторон
overhang_m = 0.4
overhang_by = "drawing"
unit = "m"
pt_per_unit = 116.0
material = "brick"  # светлый кирпич кладкой
plinth = 0.4
floor_heights = [2.85, 2.8]
plinth_material = "plaster"  # белый цоколь −0,400…±0,000
# обрамление (стр. 1, 4): подоконник — плоская полка под окнами; наличников и ставен нет; входная
# дверь — филёнчатая (стр. 1); навес над крыльцом на столбах (стр. 1), у террасы — тоже (стр. 4)
trim = { sill = "flat", canopy = "posts", door = "panel6" }
# крыльцо 2,25 × 1,5 м на двух столбах под вальмовым навесом (план +0,000, стр. 1, x 657–979, верх 724, низ 785);
# терраса 4,988 × 2,5 м на трёх столбах под вальмовой кровлей, на виде Ф. 3–1 (стр. 4, x 662–1247, верх 619, низ 716)
porch_roofs = [
  { side = 0, x = [657.7, 979.0], y = [724.3, 785.3], kind = "hip", posts = 2, depth_m = 1.5 },
  { side = 2, x = [661.9, 1246.7], y = [618.6, 715.6], kind = "hip", posts = 3, depth_m = 2.5 },
]
absent = [
  "все стороны: нет карнизной полосы и поясов — только свес кровли",
  "все стороны: нет зон второй отделки — вся стена кирпичом",
]
cut = [
  "все стороны: тени на рисунке",
]

