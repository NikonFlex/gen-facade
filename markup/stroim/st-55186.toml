# Одноэтажный дом с террасой и парилкой в стиле Хай-тек — ООО "СИТИ БИЛДИНГ"; проект № 55186 на строим.дом.рф
# https://строим.дом.рф/project/55186 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — запад (вход слева = север, терраса справа), стр. 2 — север (дверь слева = восток),
# стр. 4 — восток (терраса слева = юг, 2 окна), стр. 3 — юг (терраса под плитой, 4 проёма); 1 pt = 1 px.
# План: тело дома 9 530 × 9 040 мм, терраса 9 530 × 1 970 мм перед южной стеной под плитой кровли. Вход на западе,
# порядок по часовой от входа: запад → север → восток → юг. Проверка: слева на западном виде север (дверь входа
# у северного края плана), слева на северном — восток (дверь крыльца 2 в восточном углу), слева на восточном — юг
# (терраса слева), слева на южном — запад (ступени крыльца 1 слева).
# Контур — тело дома 9,53 × 9,04: стены запада и востока — 9,04 м без террасы (терраса — porch_roofs на этих видах),
# юг — стена за террасой (окна утоплены на 1,97 м), невязка 0.
# Масштаб: север 972 pt / 9,53 м = 102,0; юг 972 / 9,53 = 102,0; запад 11,01 м (с террасой) 1127 pt = 102,4, стена 923/9,04 = 102,1;
# восток 923 / 9,04 = 102,1. Общий 102,1. Сверка: дверь 2,08 м по листу ≈ 2,1 м, окно востока 1,8 м (план 1,75 м): расхождение < 3 %.
# Отметок уровней на листе нет; высота по карточке 4,5 м (этаж 3 м), по листу пол→верх плиты 421 pt = 4,1 м,
# низ кладки (y 1099) принят за чистый пол, тёмный цоколь под ним 51 pt = 0,5 м.
