# «МД Комфорт 88» — ИП ЖЕГЛОВА М. А.; проект № 42623 на строим.дом.рф
# https://строим.дом.рф/project/42623 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. Ж–А (запад, вход), стр. 2 — Ф. 1–5 (юг), стр. 3 — Ф. А–Ж (восток), стр. 4 — Ф. 5–1 (север).
# 1 pt = 1 px картинки. Масштаб у каждого вида свой (pt/м = ширина стены / длина с листа):
# стр. 1 — 1575 pt / 9,86 м = 159,7; стр. 2 — 1441 / 7,87 = 183,2; стр. 3 — 1771 / 9,86 = 179,6;
# стр. 4 — 1412,5 / 7,87 = 179,5. Сверка по уровням: 3,290…3,880 (0,59 м) = 94 / 109 / 106 / 106 pt
# (159 / 185 / 180 / 180 pt/м) — расхождение с шириной до 1 %.
# Устройство: каркасный дом 7,87 x 9,86 м (оси 2–5, Е–А), на западной стене тамбур 2,07 x 1,95 м
# (оси 1–2, Г–В) со входом; к северной стене терраса 3,0 м на сваях без кровли. Стороны по часовой от входа:
# 0 тамбур запад (стр.1), 1 тамбур север (стр.4), 2 запад-север (стр.1), 3 север (стр.4),
# 4 восток (стр.3), 5 юг (стр.2), 6 запад-юг (стр.1), 7 тамбур юг (стр.2). Порядок сверен с левым краем вида.
# Отметки: ±0,000 — низ каркаса на сваях, чистый пол +0,375 (пунктир), земля −0,500, верх обшивки
# стены +3,290, верх парапетной полосы +3,880. floor — линия пола +0,375.
id = "st-42623"
pdf = "42623/sheet.pdf"
roof = "плоская (малоуклонная) главная кровля, скрытая тёмной парапетной полосой +3,290…+3,880; тамбур — односкатная ≈11,5° (низ — на запад), металлочерепица"
roof_kind = "flat"
# тамбур: отметка +3,558 у стены дома даёт tg = 0,268 / 2,04 -> 7,5°, но линия ската на видах стр. 2 и 4
# идёт на 11,4-11,9° (75 pt на 358 pt по горизонтали) — взята линия ската, как требует бриф
part_roofs = [
  { side = 0, x = [1218.5, 1550.0], kind = "shed", pitch_deg = 11.5, down = 0 },
]
# кровля тамбура — волнистый рисунок (металлочерепица) на стр. 1; кровля главной части скрыта полосой
roof_material = "metal_tile"
gutters = true
pitch_deg = 0.0
# свеса главной кровли нет — полоса вровень со стеной (стр. 2, 4); тамбура — вровень (стр. 2, 4)
overhang_m = 0.0
overhang_by = "drawing"
unit = "m"
pt_per_unit = 180.0
trim = { sill = "flat", door = "plain" }
material = "wood"  # скандинавская доска 20x120 (узел на плане), вертикально; бежевая
colors = { main = "#d0c8bd", roof = "#5f6062" }
plinth = 0.875     # земля −0,500 … чистый пол +0,375 (под полом видны сваи, тёмный цоколь-пояс 0,375 м)
floor_heights = [2.915]  # +0,375 … +3,290: верх обшивки под парапетной полосой
plinth_material = "wood"  # тёмно-серый цоколь той же доской — по цвету, не уверен
trim_material = "metal"   # парапетная полоса +3,290…+3,880, тёмно-серая в горизонтальную полосу — по цвету, не уверен
chimneys = []
absent = [
  "все стороны: нет карнизной полосы, зон второй отделки, наличников и ставен",
  "все стороны: нет козырька над входом (над дверью — скат тамбура)",
]
cut = [
  "все стороны: водосточные трубы с креплениями и воронки",
  "west, north: терраса 3,0 м на сваях — настил виден слева на стр. 1, размечена площадкой porch на севере",
  "south, east, north: сваи под домом видны между землёй и цоколем",
  "west: тёмная тень от тамбура на стене стр. 1 (заливка, не отделка)",
]

