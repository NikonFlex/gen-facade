# Проект № 114599 на строим.дом.рф — двухэтажный дом из бруса 8,0 x 9,5 м с террасой на западе, шатровая крыша
# https://строим.дом.рф/project/114599 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 4–1 (запад, вход под террасой; слева север), стр. 2 — Ф. Г–А (север; слева восток),
# стр. 4 — Ф. 1–4 (восток; слева юг), стр. 3 — Ф. А–Д (юг; слева запад); 1 pt = 1 px (2481 x 1754).
# Порядок по часовой от входа: запад, север, восток, юг; каждая следующая примыкает к левому краю предыдущей.
# Контур по наружным граням: оси Б–Г 7,5 м и 1–4 9,0 м плюс по 0,25 м угловых венцов с каждой стороны = 8,0 x 9,5 м.
# Масштаб: 9,000 (конёк) и 0,000 на видах = 988 px по 1,08-кратному кадру; 0->9 м = 1067 pt => 118,6 pt/м; по ширине
# стен 1131 pt / 9,5 м = 119,0 pt/м (запад, восток), 952 / 8,0 = 119,0 (север, юг). Взято 119,0 для всех видов.
# Пол ±0,000 по низу бруса (y = 1393,2 pt), цоколь серый бетон 0,4 м до земли −0,400. Верх стены 6,27 м (отметка
# 6,000 стоит у верха окон 2-го этажа), этажи на глаз 3,0 + 3,27 (перекрытия на виде нет).
id = "st-114599"
pdf = "114599/sheet.pdf"
roof = "шатровая (четырёхскатная), конёк 9,000 вдоль север-юг длиной около 1,5 м, свес 0,9 м, тёмная металлочерепица; над террасой запада отдельная шатровая кровля"
roof_kind = "hip"
roof_material = "metal_tile"
# уклон: линия ската на виде (515,555)->(1065,305) в px = 0,455 = 24,4°; расчёт (9,0 − 6,65)/(4,0+0,9) = 0,48 = 25,6° (низ свеса на ~6,65 по виду).
# Отметка карниза 6,000 у окон не у кровли; по линии ската
pitch_deg = 25.0
overhang_m = 0.9
gable_overhang_m = 0.9
overhang_by = "drawing"
gutters = true
unit = "m"
pt_per_unit = 119.0
material = "log"  # горизонтальный профилированный брус тёмного цвета, по рисунку
colors = { main = "#353535", plinth = "#888885" }
plinth = 0.4
floor_heights = [3.0, 3.27]
plinth_material = "concrete"  # серые бетонные блоки, по рисунку
trim = { casing = "flat", door = "plain" }
cut = [
  "west: ограждение террасы (горизонтальные белые доски) и ступени у двери не размечены",
  "north, south, east: вентвыходы на крыше тоньше трубы (по одному-два на скат), не трубы",
  "south, north: кровля террасы на западе видна сбоку, у стены её нет; терраса размечена на западе",
  "south: верхнее окно 2,0–3,6 м у лестницы — окно над первым этажом, высота этажа на глаз",
  "все стороны: угловые и промежуточные столбы бруса того же материала — не зоны",
]
absent = [
  "все стороны: нет зон второй отделки, нет карнизной полосы кроме белого подзора под свесом",
  "все стороны: нет ставней, подоконников, козырьков над окнами",
  "все стороны: нет труб дымохода, мансардных и слуховых окон",
]
porch_roofs = [
  { side = 0, x = [1147.0, 1877.0], y = [905.0, 1042.2], kind = "hip", posts = 3, depth_m = 1.5 },
]

