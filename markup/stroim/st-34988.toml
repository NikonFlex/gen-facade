# Проект № 34988 на строим.дом.рф (двухэтажный плоскокровельный Г-образный дом, кладка не подписана)
# https://строим.дом.рф/project/34988 ; разметка gf#470 (волна 2).
# Листы: стр. 3 — юг (вход, ДВ-1, терраса-балкон), стр. 2 — запад (глухой, ступень контура), стр. 1 — север
# (два корпуса: слева выступающий, справа основной), стр. 4 — восток (глухой, окно лестницы); 1 pt = 1 px.
# План — стр. 5 (1 этаж) и 6 (2 этаж): корпус 9 660 × 8 450 мм + выступ на север 5 140 × 2 600 мм у восточной
# стены; всего 9,66 × 11,05 м. Контур по часовой от входа: юг 9,66 → запад 8,45 → север (корпус) 4,52 [внутренний
# угол] → запад (выступ) 2,60 → север (выступ) 5,14 → восток 11,05. Невязка по листам 0,03 м.
# Проверка порядка: с юга слева запад; с запада слева север (выступ); с севера слева восток; с востока слева юг
# (окно лестницы на востоке в 4,3 м от юга — по плану 4,0–4,8 м).
# Масштаб у вида свой: юг 1240 pt / 9,66 = 128,4; запад 1472/11,05 = 133,2; север 1250/9,66 = 129,4;
# восток 1394/11,05 = 126,2. Сверка по отметкам +7,010 → +0,080: юг 888/6,93 = 128,1; север 893/6,93 = 128,9;
# запад (−0,150 → +7,010) 950/7,16 = 132,7; восток 903/7,16 = 126,1 — расхождение до 0,6 %.
# Отметки: ±0,000 — низ стены над цоколем (запад y 1025, восток 1023, юг 1013, север 1016), окна 1 этажа
# от +0,080; земля −0,150 (plinth 0,15). Пол 2 этажа +3,500 (отметка на юге у балкона); верх парапета +7,010.
# floor_heights [3,5; 3,51]: этажа 2 по листу не видно, парапет не отделён от стены.
id = "st-34988"
pdf = "34988/sheet.pdf"
roof = "плоская, парапет заподлицо со стеной, верх +7,010; свесов нет; на кровле 5 вентвыходов (грибки на трубах)"
roof_kind = "flat"
pitch_deg = 0.0
overhang_m = 0.0
gable_overhang_m = 0.0
overhang_by = "drawing"
unit = "m"
pt_per_unit = 128.4
# Отделка: две — белая гладкая (подпись 3) и тёмно-зелёная гладкая (4); подписи вида нет, оба по цвету [не уверен:
# штукатурка или фасадные панели]. Основная — белая plaster, акцент — зелёная; тёмно-коричневый пояс (2) — cut.
material = "plaster"
colors = { plinth = "#908d80", accent = "#525841" }
plinth = 0.15
plinth_material = "plaster"
floor_heights = [3.5, 3.51]
gutters = true
# окна — тёмные рамы без подоконников, наличников, ставен; вход — тёмная дверь с узкой боковой вставкой
trim = { door = "sidelights" }
cut = ["south: тёмно-коричневый пояс (подпись 2) между окнами B-1 и B-2, x 612–1003, y 517–680 — отдельная отделка, не размечен",
       "north: тот же пояс между B-1 и B-2 в обоих корпусах (x 580–975 и 1187–1582, y 516–678) — не размечен",
       "south: вход отодвинут в нишу на ~1,7 м (плана 1 этажа), над ней балкон с ограждением x 1115–1437, y 462–583 — дверь поставлена в плоскость стены, балкон и ограждение не размечены",
       "south: белая вставка 1115–1437 между корпусами и тёмный козырёк-перекрытие балкона — не размечены",
       "east: белый прямоугольник справа от окна лестницы, x 1207–1395, y 393–712, внутри зелёной зоны — не размечен",
       "все стороны: вентвыходы на кровле (5 шт.) — не трубы, не размечены; водосточные трубы по углам — gutters = true"]
absent = ["все стороны: нет карнизной полосы и свесов, плоская кровля с парапетом",
          "все стороны: нет труб, мансардных окон, слуховых окон",
          "west, east: нет дверей; west: нет окон"]

