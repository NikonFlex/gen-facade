# Одноэтажный дом с двускатной крышей «Традиция 150» — проект № 18457 на строим.дом.рф
# https://строим.дом.рф/project/18457 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — фасад Б–А (запад, со стороны террасы), стр. 2 — А–Б (восток, вход), стр. 3 — 1–4 (юг, ось А),
# стр. 4 — 4–1 (север, ось Б); стр. 5 — план. Порядок по часовой от входа: восток, юг, запад, север;
# проверка по левому краю вида: слева у востока — А (юг), у юга — ось 1 (запад), у запада — Б (север), у севера — ось 4 (восток).
# Контур по наружной стороне стен: 12,78 × 9,85 м (оси 12,5 × 9,6 м + стена 200 мм, с плана).
# Масштаб у каждого вида свой, pt/м = расстояние между осями на листе / размер осей: стр. 2 (9,6 м): 1012/9,6 = 105,4,
# по стене 1032/9,85 = 104,8 → 105,0; стр. 3 (12,5 м): 1198/12,5 = 95,9; стр. 4: 1147/12,5 = 91,8; стр. 1 (9,6 м): 1063/9,6 = 110,7.
# Отметок уровней на листе нет (нет +3,000/±0,000): сверка по отметкам проёмов «0,200» (низ) и «2,300» (верх) —
# окно 2,1 м на стр. 2 = 221 pt при 105 pt/м, на стр. 3 — 202 pt при 95,9 (2,1 м), на стр. 4 — 190 pt при 91,8 (2,07 м).
# Отметка 0,200 — низ проёма над чистым полом: floor каждой стороны = низ окна + 0,2 м (по этому чтению; см. сомнения в ответе).
# Низ кладки/обшивки на 0,2 м ниже чистого пола — цоколь 0,2.
id = "st-18457"
pdf = "18457/sheet.pdf"
roof = "двускатная, ≈20° (конёк на 4,7 м над чистым полом), черепица волной; свес карнизный 0,7 м, фронтонный 0,55 м с востока и 1,5 м с запада (над террасой); водосток; над входом свой щипец"
roof_kind = "gable"
roof_material = "tile_roof"  # по рисунку (чешуйчатая волна, стр. 3–4), подписи нет — не уверен
# уклон: линия ската на виде — стр. 2 от конька y=127 до края y=342 на 591 pt = 0,363 → 20,0°; по силуэту фронтона
# (от угла 349 до конька 169 на 516 pt) 0,35 → 19,3°; отметок конька и свеса на листе нет — бери 20,0°
pitch_deg = 20.0
overhang_m = 0.7   # стр. 2: край кровли за стеной на 76 pt / 105 = 0,72 м; стр. 1: 78 / 110,8 = 0,70
gable_overhang_m = 1.0  # стр. 3: слева (запад) 145 pt / 95,9 = 1,5 м, справа (восток) 60 / 95,9 = 0,6 м; стр. 4 так же — взято среднее
overhang_by = "drawing"
unit = "m"
pt_per_unit = 95.9
material = "siding"  # горизонтальная доска шагом ≈0,15 м (стр. 2–4), подписи нет — по рисунку, не уверен
colors = { main = "#e8e8e8" }
plinth = 0.2
floor_heights = [2.9]  # угол фронтона на стр. 1 и 2: 2,89 и 2,94 м над чистым полом (карточка проекта: этаж 2,75 м)
# обрамление: плоский наличник вокруг окон и двери, плоский подоконник; ставен нет; входная дверь — гладкая однопольная;
# над входом свой щипцовый навес
trim = { sill = "flat", casing = "flat", canopy = "gable", door = "plain" }
gutters = true  # водосточные трубы по углам на всех видах (стр. 1–4)
# трубы: стр. 3 — четыре выхода на южном скате; труба на x=848 длинная с широким оголовком и муфтой — дымоход;
# x=1606 у тех. помещения с двумя котлами — тоже дымоход (по рисунку, не уверен); x=1251 и 1435 — короткие, тоньше — вентвыходы
chimneys = [
  { side = 1, x = 848.0, depth_m = 2.3 },
  { side = 1, x = 1606.0, depth_m = 3.72 },
]
# вход, сторона 0: щипцовый навес без столбов на опорах-кронштейнах (стр. 2, x 740–1082, конёк 291, низ 393), вынос 1,5 м по плану
porch_roofs = [
  { side = 0, x = [740.0, 1082.0], y = [291.0, 393.0], kind = "gable", posts = 0, depth_m = 1.5 },
]
absent = [
  "все стороны: нет карнизной полосы и поясов — только свес кровли",
  "все стороны: нет зон второй отделки — вся стена одной доской",
  "все стороны: нет ставен",
  "все стороны: нет мансардных окон и слуховых",
  "запад: нет столбов у террасы",
]
cut = [
  "юг, север: вентвыходы на скате (x 1251, 1435 стр. 3) — тоньше трубы",
  "восток: на навесе над входом две стойки-консоли без опоры на землю",
  "восток: ступени крыльца за площадкой, вентиляционные дырки в карнизе фронтона (квадраты 797–815 и 1013–1030 на y 207–230)",
  "запад: ступени террасы (4 ступени x 777–1192), вентиляционные квадраты во фронтоне на x 860–880 и 1087–1109",
  "все стороны: тени на рисунке",
  "юг, север: площадки террасы и крыльца слева и справа от стены ниже окон",
]

