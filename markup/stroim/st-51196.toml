# Одноэтажный дом 12,5 × 8,0 м с вальмовой крышей (85,74 м²) — проект № 51196 на строим.дом.рф
# https://строим.дом.рф/project/51196 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — «Фасад А–В» = восток (глухая стена, 8,0 м), стр. 2 — «Фасад 3–1» = север (3 окна, 12,5 м),
# стр. 3 — «Фасад В–А» = запад (витражная дверь 2,4 × 2,4, 8,0 м), стр. 4 — «Фасад 1–3» = юг (вход, 2 окна + малое, 12,5 м).
# 1 pt = 1 px (3480 × 2160). План: ось А внизу (юг), В вверху (север); вход ДВ-03 на южной стене.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: в виде с юга слева ось 1 (запад), с запада
# слева В (север), с севера слева 3 (восток), с востока слева А (юг; ступени и козырёк крыльца слева на стр. 1).
# Окна сверены с планом: северные ОК-01 на 1,5–3,0 м от запада — на виде 3–1 это третье окно справа ✓.
# Масштаб у вида свой: юг 2213 pt / 12,5 = 177,0; север 2203/12,5 = 176,2; запад 1417/8 = 177,1; восток 1412/8 = 176,5.
# Сверка по отметкам (±0,000 → +3,000): юг 530 pt / 3 м = 176,8 — расхождение <0,5 %.
# Отметки: ±0,000 — чистый пол, −0,600 земля, +3,000 нижний край кровли на свесе, +5,500 конёк. Невязка контура 0.
id = "st-51196"
pdf = "51196/sheet.pdf"
roof = "вальмовая, конёк вдоль 12,5 м (4,5 м), +5,500; нижний край кровли +3,000, свес ≈0,47 м со всех сторон, водосток по периметру, тёмная кровля с узкими вертикальными рёбрами"
roof_kind = "hip"
# tg = (5,5 − 3,0) / (4,0 + 0,47) = 0,559 = 29,2°; линия ската на виде стр. 1: 317/551 = 0,575 = 29,9° — сходятся
pitch_deg = 29.2
overhang_m = 0.47
gable_overhang_m = 0.47
overhang_by = "drawing"
roof_material = "metal_roof"  # узкие вертикальные рёбра/фальц, подписи нет — по рисунку, не уверен (может быть профнастил)
gutters = true
unit = "m"
pt_per_unit = 177.0
# стена до карниза: пол 0,000 → верх стены под свесом/желобом ≈2,8 м (по виду), +3,000 — край кровли над ним
floor_heights = [2.8]
plinth = 0.6
plinth_material = "concrete"  # серый цоколь с сеткой швов −0,600…0,000, по цвету и рисунку
# основная отделка — светло-серые плиты с сеткой швов, подписи нет: plaster по цвету, не уверен
material = "plaster"
colors = { main = "#d7d7d7", plinth = "#9ea29e", accent = "#464847" }
trim = { canopy = "flat", door = "plain" }
cut = ["south: ступени крыльца 1,2 м под дверью",
       "west: ступени и косой козырёк +2,300 крыльца у южной стены — виден сбоку справа",
       "east: ступени и козырёк крыльца слева (южный конец) — виден сбоку",
       "все стороны: водосточные трубы по углам",
       "все стороны: тёмные угловые столбы шириной 0,4 м — размечены зонами; материал неизвестен (по цвету)"]
absent = ["все стороны: нет подоконников, наличников, ставен",
          "все стороны: нет карнизной полосы кроме водосточного желоба",
          "все стороны: нет труб, мансардных и слуховых окон",
          "east: нет окон и дверей"]

