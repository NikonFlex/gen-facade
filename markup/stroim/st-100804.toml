# Дом 100804 на строим.дом.рф (одноэтажный каркасный дом 5 × 6 м с террасой 1,5 м под продолжением кровли, на сваях)
# https://строим.дом.рф/project/100804 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — юг (вход с террасы, дверь + окно в пол по скату), стр. 4 — запад (одно окно, терраса справа),
# стр. 3 — север (одно окно 0,6 × 0,6), стр. 1 — восток (два окна 1,6 × 1,4, терраса слева). 1 pt = 1 px.
# План — стр. 5 (plan0-0.jpg): 5 000 × 6 000 мм, терраса 1 500 мм на юге, четыре столба по углам.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: слева на юге — запад (окно запада 2,2 м от севера,
# у запада слева север; терраса запада справа = юг), слева на севере — восток; на востоке слева терраса = юг.
# Положения окон сверены с планом: юг — дверь 1,35 м от запада, окно в пол 2,75 м; восток — окна 0,8 и 3,6 м от юга; запад — окно
# 2,2 м от севера; север — окно 1,1 м от запада. Невязка контура 0 (прямоугольник 5 × 6).
# Масштаб: pt_per_unit = ширина стены / длина с плана: юг 2399/5 = 479,8; запад 2889/6 = 481,5; восток 2884/6 = 480,7;
# север 2366/5 = 473,2. Сверка по отметкам уровней: юг 306,5 px/м × 1,54 = 472,0; восток 265,4 × 1,78 = 472,4;
# запад 266 × 1,78 = 473,5; север 363 × 1,30 = 472,1 pt/м — расхождение до 1,7 % (стены на листе чуть шире плана).
# Отметки: ±0,000 — чистый пол (по маркеру на юге, на остальных видах — по шкале уровней); низ обшивки −0,200 (plinth = 0,2),
# сваи до −0,700 не размечены; окна востока от +0,4 до +1,8; карниз стены ≈ +2,1, конёк стены +2,56, верх кровли +2,76.
id = "st-100804"
pdf = "100804/sheet.pdf"
roof = "двускатная, конёк вдоль 6 м (щипцы на юге и севере), кровля продолжена над террасой; отметки +2,300 (край кровли) и +2,760 (конёк), пролёт 5 м, свес по карнизу ≈ 0,07 м, по щипцу 0; водосток по обоим карнизам"
roof_kind = "gable"
# tg = (2,760 − 2,300) / (2,5 + 0,07) = 0,179 = 10,1°; линия ската на виде юг: (268 − 133) / (1158 − 392) = 0,176 = 10,0° — сходятся
pitch_deg = 10.0
overhang_m = 0.07
gable_overhang_m = 0.0
overhang_by = "drawing"
# кровля — вертикальные полосы с фальцем, цвет тёмно-серый: metal_roof по рисунку [не проверено: подписи нет]
roof_material = "metal_roof"
gutters = true
unit = "m"
pt_per_unit = 480.0
# основная отделка — светло-коричневая доска вертикально, шаг ≈ 0,1 м, больше половины площади стен — по рисунку [не уверен, подписи нет]
material = "wood"
colors = { main = "#bd9874", plinth = "#c09874", accent = "#383838", roof = "#3b3a3b" }
plinth = 0.2
plinth_material = "wood"
floor_heights = [2.12]
# вторая отделка — тёмная вертикальная ребристая обшивка (профлист/рейка) — по цвету и рисунку, не уверен
trim = { sill = "flat", door = "plain" }
cut = ["все стороны: сваи под домом (до −0,700) и водосточные трубы с воронками — не размечены",
       "south: ступени с террасы (вниз по пандусу перед дверью), доски настила в виде крыльца",
       "west, east: ограждение террасы — вертикальные рейки-жалюзи с просветами и тёмная стена за ними, ступени справа/слева",
       "south: стена над дверью и окном — тёмная горизонтальная обшивка (другой рисунок, чем ребристая), записана зонами как accent",
       "north: тёмная полоса 0,6 м с горизонтальной обшивкой вокруг окна — записана зоной accent",
       "все стороны: нет подписи материалов, виды wood и metal — по рисунку"]
absent = ["все стороны: нет карнизной полосы, наличников, ставен, козырьков над дверью",
          "все стороны: нет труб, мансардных и слуховых окон",
          "north: нет двери",
          "east, west: нет двери"]
porch_roofs = [
  { side = 0, x = [604.0, 3003.0], y = [205.0, 531.0], kind = "gable", posts = 4, depth_m = 1.5 },
]

