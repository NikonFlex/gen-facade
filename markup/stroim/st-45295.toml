# Одноэтажный дом с односкатным навесом-крыльцом и террасой — проект № 45295 на строим.дом.рф
# https://строим.дом.рф/project/45295 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — восток (вход под навесом справа, у оси 4), стр. 3 — юг (терраса в остеклённом щипце),
# стр. 4 — запад (два окна, решётка террасы справа), стр. 1 — север (щипец, одно окно, навес крыльца слева);
# 1 pt = 1 px. Порядок по часовой от входа: восток → юг → запад → север. Проверка: на востоке слева ось 1 (юг),
# на юге слева ось А (запад), на западе слева ось 4 (север), на севере слева ось Д (крыльцо, восток).
# Контур по плану: 7,75 × 14,4 м (осевые 7,5 × 14,3 + стены), терраса 3 м утоплена в южный торец под общей
# кровлей — взята в плоскость стены, остекление и дверь террасы поставлены в плоскость юга [не проверено:
# модуль не строит утопленный объём]. Невязка контура 0.
# Масштаб: щипцовые виды (1, 3) — 8,95 м по осям Д–А = 3380 pt → 378 pt/м (дом); длинные (2, 4) — 14,3 м по осям
# = 3890 pt → 272 pt/м. Сверка по отметкам: ридж +4,121 / земля −0,70 (4,821 м) на стр. 1 = 783 px*2,33/4,821 = 378,
# стр. 2: 560*2,33/4,821 = 271 — расхождение < 1 %.
# Отметки: ±0,000 (чистый пол) по маркерам: стр. 1/3 y 1815, стр. 2/4 y 1828 (+0,135 / +0,110 у крыльца и террасы
# пересчитаны); земля ниже пола на 0,70 м, цоколь = 0,70 (низ обшивки — у земли).
id = "st-45295"
pdf = "45295/sheet.pdf"
roof = "двускатная, конёк вдоль 14,4 м на +4,121, кромка кровли +2,66, свесов почти нет; над крыльцом востока — односкатный навес, ≈ 12°, кровля фальц тёмно-серая"
roof_kind = "gable"
# tg = (4,121 − 2,664) / 3,875 = 0,376 = 20,6°; линия ската на виде юг (381,346)→(1008,112) disp: 234/627 = 0,373 = 20,5° — сходятся
pitch_deg = 20.5
overhang_m = 0.1
gable_overhang_m = 0.1
overhang_by = "drawing"
unit = "m"
pt_per_unit = 378.0
# длинные стены (восток, запад) и цоколь — тёмно-серая вертикальная обшивка (доски), кровля — стоячий фальц; щипцы юга и севера — светлое дерево
# (вертикальная доска) второй отделкой, зоной [вид по цвету и рисунку, подписи нет, не уверен]
material = "board_batten_narrow"
colors = { main = "#565656", plinth = "#565656", accent = "#8a8763" }
plinth = 0.7
plinth_material = "board_batten_narrow"
floor_heights = [2.5]
roof_material = "metal_roof"
gutters = true
# обрамление: окна с узким плоским наличником, подоконников и ставен нет; дверь — глухая плоская; навес крыльца на столбах
trim = { casing = "flat", canopy = "posts", door = "plain" }
# навес крыльца у входа на востоке (план: 2,2 × 1,45 м, два столба по внешнему краю), на виде стр. 2 — полоса x 2985–3750, y 1090–1280
porch_roofs = [
  { side = 0, x = [2985.0, 3750.0], y = [1090.0, 1280.0], kind = "shed", posts = 2, depth_m = 1.45 },
]
cut = ["east: решётка-экран боковины террасы (диагональный рисунок, насквозь) x 790–1135, y 1286–1790 — не окно, не размечена",
       "west: тот же решётчатый экран справа (юг) x 3830–4170 — не размечен",
       "east: ступени террасы слева и ступени крыльца справа, перила крыльца и террасы — не размечены",
       "south: ограждение террасы — горизонтальные рейки, столбы, вся терраса утоплена на 3 м за плоскость контура",
       "east: столбы навеса крыльца (два) — не размечены элементами",
       "east: тень навеса на стене — не зона",
       "north: водосточная труба и воронка у навеса, юг: трубы по углам — не размечены"]
absent = ["все стороны: нет карнизной полосы и зон второй отделки",
          "все стороны: нет труб, мансардных и слуховых окон",
          "north: окно одно, дверей нет"]

