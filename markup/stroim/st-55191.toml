# «Тихая Гавань» — ИП Самусь И. И.; проект № 55191 на строим.дом.рф
# https://строим.дом.рф/project/55191 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — запад (вход, дверь по центру, терраса справа), стр. 1 — север (2 окна, щипец),
# стр. 4 — восток (2 окна, терраса слева), стр. 3 — юг (щипец, остекление, 3 столба террасы). Вход — в тамбур
# на западе (план, стр. 5). 1 pt = 1 px. Порядок по часовой от входа: запад → север → восток → юг.
# Проверка: на западе справа терраса (юг), слева север; на востоке терраса слева (юг).
# МАСШТАБ — слабое место: на листе нет ни размеров, ни отметок. Масштаб плана снят по площадям
# комнат (спальня 9,1 м² = 325 × 330 pt → 108,5 pt/м; контур 62 м² → 108,6): стены 6,85 × 9,10 м.
# Масштаб видов — по длине стены: север 1120/6,85 = 163,5; юг 1226/6,85 = 179,0; запад 1325/9,08 = 145,9;
# восток 1415/9,08 = 155,8. Сверка по двери юга: 375 pt / 179 = 2,1 м, 170 pt = 0,95 м (план: дверь 0,9 м) — сходится.
# Чистый пол — по порогу двери/линии на виде (запад y 702), цоколь до земли ≈ 0,8 м (дом на сваях под обшивкой).
# Высоты этажа у видов 2,5–2,75 м (север 2,52, юг 2,57, запад/восток 2,74): в доме одна — 2,65, пол по порогу [не проверено].
# Контур замкнут (стены 6,85 × 9,08 м); терраса 1,7 м за контуром, под продолжением кровли.
id = "st-55191"
pdf = "55191/sheet.pdf"
roof = "двускатная, конёк вдоль длинной стороны (запад–восток видны прямоугольником), очень пологая; свесов нет; кровля тёмная однородная"
roof_kind = "gable"
# на щипце севера (415,250)→(975,180): tg = 70/558 = 7,1°; юг (370,235)→(985,155): 80/615 = 7,4°; по ширине полосы запада ≈ 8,5° — беру 7,5
pitch_deg = 7.5
overhang_m = 0.0
gable_overhang_m = 0.0
overhang_by = "drawing"
unit = "m"
pt_per_unit = 145.9
# вертикальные доски с рейками шагом ≈ 0,5–1 м, тёмно-серые; подписи нет — по рисунку
