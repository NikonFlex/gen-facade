       "east: ступени террасы слева (x 110–215), сваи — не размечены",
       "south: ступени слева (x 190–372), цоколь из горизонтальной обшивки y 745–890 (высота цоколя 1,0 м против 0,8 на других видах)",
       "west, east: ограждение террасы горизонтальными рейками (светлое) — вторая отделка wood по цвету, не уверен",
       "все стороны: вид отделки board_batten по рисунку, не уверен"]
