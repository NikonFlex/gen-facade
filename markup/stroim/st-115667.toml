# Типовой одноэтажный дом (план 8,13 × 8,8 м + терраса 3 м у восточной стены); проект № 115667 на строим.дом.рф
# https://строим.дом.рф/project/115667 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — юг (вход, ось 1-3), стр. 2 — запад (оси Б-А, 3 окна), стр. 1 — север (глухой, оси 3-1),
# стр. 3 — восток (терраса со щипцом, остекление); стр. 5 — план. 1 pt = 1 px.
# Порядок: юг, запад, север, восток. Проверка по левому краю вида: юг слева запад (ось 1), запад слева север (Б),
# север слева восток/терраса (ось 3 слева на стр. 1), восток слева юг (ступени у А слева на стр. 3).
# Размеры: 8130 (оси 1-2) × 8800 (А-Б), терраса +3000 до оси 3. Масштаб у видов свой: юг 1460,5 pt / 8,13 = 179,6;
# запад 1628 / 8,8 = 185,0; север 1493 / 8,13 = 183,7; восток 1704 / 8,8 = 193,6. Сверка по отметкам +3,015→+5,015:
# юг 360/2 = 180; запад 370/2 = 185; север 366/2 = 183; восток 386/2 = 193 pt/м — расхождение до 0,5 %.
# Пол (±0,000) — линия низа стены на виде, ур.з. на 0,35 м ниже (цоколь 0,35).
id = "st-115667"
pdf = "115667/sheet.pdf"
roof = "двускатная, конёк вдоль 11,13 м (север-юг в плоскости длинных видов), щипцы на запад и восток, 22° по надписи; карниз +3,015, конёк +5,015; кровля — металлочерепица; над террасой с востока кровля продолжена"
roof_kind = "gable"
# tg = (5,015 − 3,015) / (4,4 + 0,55) = 0,404 = 22,0°; по линии щипца на стр. 2 (510−250)/(983−343) = 0,406 = 22,1°; надпись 22° — сходится
pitch_deg = 22.0
# свес карниза: стр. 2, 81 px*1,27 / 185 = 0,56 м; щипцовый: стр. 4, 78 px*1,27 / 179,6 = 0,55 м
overhang_m = 0.55
gable_overhang_m = 0.55
overhang_by = "drawing"
roof_material = "metal_tile"   # волна с уступом на рисунке кровли, подписи нет
unit = "m"
pt_per_unit = 183.7
material = "brick"     # рисунок кладки в ряд по стенам, подписи нет — по рисунку, не уверен (может быть газоблок под штукатуркой)
plinth = 0.35
plinth_material = "concrete"   # цоколь без рисунка, по умолчанию — не уверен
floor_heights = [3.015]
trim = { door = "plain" }
gutters = true
porch_roofs = [
  { side = 3, x = [546.1, 2444.8], y = [284.5, 673.1], kind = "gable", posts = 4, depth_m = 3.0 },
]
# терраса 25,8 м² у восточной стены, 4 столба по краю (план, ось 3), кровля дома продолжена над ней, щипец на стр. 3
cut = ["south: ступени крыльца у двери, правый торец стены у оси 2 с кровлей террасы над ним",
       "east: столбы терраса и ступени у юго-западного угла (слева)",
       "все стороны: водосточные трубы и воронки",
       "east: остекление гостиной — одно окно panoramic 3 × 2 с дверной створкой справа (дверь ли это — по плану проём в 1,0 м у стены)"]
absent = ["все стороны: нет карнизной полосы, наличников, подоконников, ставен, зон второй отделки",
          "north: нет окон и дверей",
          "все стороны: нет труб, мансардных, слуховых окон"]

