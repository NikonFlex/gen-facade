# Двухэтажный дом 11,12 × 11,12 м с вальмовой крышей, терраса и крыльцо под кровлей — проект № 17543 на строим.дом.рф
# https://строим.дом.рф/project/17543 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — юг (вход, крыльцо по центру, терраса слева); стр. 2 — запад (терраса слева, крыльцо справа);
# стр. 3 — восток (крыльцо слева, терраса справа); стр. 4 — север (терраса справа, стеклянная дверь на террасу).
# Порядок по часовой от входа: юг, запад, север, восток; в файле стороны идут именно так (стр. 1, 2, 4, 3).
# Проверка примыкания: слева на южном виде — запад, на западном — север, на северном — восток, на восточном — юг.
# Масштаб: отметок на листе нет, у каждого вида свой — ширина стены в pt / 11,12 м (план, размер 11 120):
# юг 862 pt (77,5), запад 852 pt (76,6), север 880 pt (79,1), восток 850 pt (76,4). Ширина вида не сверена вторым размером.
# Высоты — только по этому масштабу: чистый пол — низ кладки (линия по стене), цоколь до земли 0,43–0,45 м;
# первый этаж до перекрытия ≈ 3,8–3,9 м, второй до карниза ≈ 2,3 м (по картинке, отметок нет).
id = "st-17543"
pdf = "17543/sheet.pdf"
roof = "вальмовая, ≈26° (линия ската 25–26°, подъём 2,9–3,1 м на полупролёт 6,4 м со свесом), короткий конёк, черепица по рисунку; над террасой и крыльцом — вальмовые козырьки"
roof_kind = "hip"
roof_material = "tile_roof"  # рисунок чешуйчатый, подписи нет — по рисунку, не уверен
pitch_deg = 26.0
# свес: юг (995 − 862)/2/77,5 = 0,86 м; запад (987 − 852)/2/76,6 = 0,88 м
overhang_m = 0.87
overhang_by = "drawing"
gutters = true
unit = "m"
pt_per_unit = 77.5
material = "plaster"  # белая стена листа
colors = { accent = "#a2a2a2" }
plinth = 0.44
floor_heights = [3.85, 2.3]
plinth_material = "concrete"  # по цвету, не уверен
# вторая отделка — кирпич: ниже окон и простенки первого этажа, портал входа
trim = { canopy = "posts", door = "plain" }
chimneys = [{ side = 3, x = 725.0 }]  # одна труба, у восточной стены: юг 1207, запад 1068, север 522, восток 725
porch_roofs = [
  { side = 0, x = [845.0, 1122.0], y = [570.0, 632.0], kind = "hip", posts = 2, depth_m = 2.2 },
  { side = 0, x = [270.0, 495.0], y = [570.0, 625.0], kind = "hip", posts = 2, depth_m = 2.4 },
  { side = 1, x = [255.0, 735.0], y = [550.0, 632.0], kind = "hip", posts = 3, depth_m = 2.4 },
  { side = 1, x = [1340.0, 1520.0], y = [578.0, 632.0], kind = "hip", posts = 1, depth_m = 2.2 },
  { side = 2, x = [800.0, 1470.0], y = [515.0, 595.0], kind = "hip", posts = 3, depth_m = 2.4 },
  { side = 3, x = [275.0, 455.0], y = [548.0, 603.0], kind = "hip", posts = 1, depth_m = 2.2 },
  { side = 3, x = [1305.0, 1535.0], y = [520.0, 603.0], kind = "hip", posts = 1, depth_m = 2.4 },
]
absent = ["все стороны: нет карнизной полосы — только свес кровли", "все стороны: нет отметок уровней"]
cut = [
  "все стороны: ограждения террасы и крыльца (крестовые), ступени",
  "все стороны: водосточные трубы нарисованы, воронки не размечены",
  "юг: серая тень от крыльца на стене — не зона",
  "запад/восток/север: кирпич террас под навесом заштрихован серым — границы по рисунку приблизительны",
]

