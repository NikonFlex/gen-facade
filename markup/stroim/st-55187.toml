# Одноэтажный дом «ЭРА-6» с двускатной крышей, 13,83 × 7,73 м — проект № 55187 на строим.дом.рф
# https://строим.дом.рф/project/55187 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — щипцовый фасад с двумя окнами (запад), стр. 2 — длинный фасад с дверью 2200 (север, терраса),
# стр. 3 — щипцовый фасад с одним окном (восток), стр. 4 — длинный фасад с входной дверью 900 (юг, вход); стр. 5 — план.
# Вход — дверь в прихожую на нижней стене плана (юг, стр. 4); порядок по часовой от входа: юг (стр. 4), запад (стр. 1),
# север (стр. 2), восток (стр. 3). Проверка по левому краю вида: у юга слева запад (окно на 4,6 м от угла — как на плане),
# у запада слева север (окна 1,2 и 4,8 м от северного угла), у севера слева восток (дверь у восточного угла), у востока слева юг.
# Длины: стены по размерам листа 13 828 и 7 728 мм (на плане: 1656 × 926 pt при 119,8 pt/м — те же 13,83 × 7,73).
# Масштаб у каждого вида свой, pt/м = ширина стены / размер: стр. 4 — 1945/13,828 = 140,7; стр. 2 — 2053/13,828 = 148,5;
# стр. 1 — 1277/7,728 = 165,2; стр. 3 — 1285/7,728 = 166,3. Сверка по окнам: 1500 мм по высоте = 145 pt (стр. 4) при 140,7 — +3 %,
# 1200 мм на стр. 1 и 3 — 165–167 pt: совпадает. Отметок +3,000 нет; конёк 5,55 м от ±0 (земля), под землёй 0,25 м.
# Чистый пол = низ стены на виде (верх фундаментной полосы), на ~0,14 м выше земли ±0,000 — plinth 0,15 без материала.
# Высота этажа: на длинных стенах низ свеса даёт 2,9–3,0 м от низа стены, по щипцу 3,0–3,1 м — взято 3,0 (карточка: 3,0).
id = "st-55187"
pdf = "55187/sheet.pdf"
roof = "двускатная, ≈27° (конёк 5,55 м от земли, конёк вдоль длинной стороны), свесы 0,9 м со всех сторон, водосток; кровля на чертеже без рисунка"
roof_kind = "gable"
# уклон: линия ската на стр. 1 от (110,433) до конька (895,32) = 401/785 = 0,511 → 27,1°; по отметкам
# (5,55 − 3,28 над землёй у низа ската) / (3,864 + 0,9) = 0,476 → 25,5°; расхождение 1,6° (<2°) — взято по линии
pitch_deg = 27.0
# свес: стр. 1 — край кровли за стеной на 148 pt / 165,2 = 0,90 м; общий размер 15 628 = 13 828 + 2×900 (стр. 2, 4)
overhang_m = 0.9
gable_overhang_m = 0.9
overhang_by = "drawing"
gutters = true
unit = "m"
pt_per_unit = 140.7
# отделка на листе не показана (линейный чертёж, штриховки стены нет); в карточке facade_material=6 без расшифровки — штукатурка по умолчанию, не уверен
material = "plaster"
plinth = 0.15
floor_heights = [3.0]
trim = { door = "plain" }
absent = [
  "все стороны: нет карнизной полосы — только свес кровли с желобом",
  "все стороны: нет подоконников, наличников и ставен — окна в простых коробках",
  "все стороны: нет зон второй отделки и цоколя другого материала — чертёж линейный",
  "все стороны: нет труб на кровле и мансардных окон",
]
cut = [
  "все стороны: водосточные желоба и трубы на углах",
  "юг, север: ступень/площадка у двери (фундаментная полоса шире двери, стр. 2 и 4)",
  "все стороны: материал стен и кровли не читается — штукатурка принята по умолчанию",
]

