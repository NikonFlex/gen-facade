# Одноэтажный дом с вальмовой кровлей, 13,0 × 8,3 м — проект № 34082 на строим.дом.рф
# https://строим.дом.рф/project/34082 ; разметка gf#470 (волна 2).
# Листы: стр. 3 — юг (вход, крыльцо под вальмовой кровлей; слева запад), стр. 2 — запад (оси Г–А, остеклённый
# проём с боковыми створками; слева север), стр. 1 — север (3 окна; слева восток), стр. 4 — восток (одно окно;
# слева юг, крыльцо); 1 pt = 1 px. Вход — по плану на южной стене. По часовой от входа: юг, запад, север, восток.
# Масштаб у каждого вида свой (по высоте: ±0,000 → +2,550 и окна 1,95 / 1,5 м): юг 98,5 pt/м (2,55 м = 252 pt),
# север 101,5 по высоте (1,95 м = 198 pt), взят 102,6 ради замыкания контура с югом (1 %), запад 137,5 (2,4 м между +0,150 и +2,550 = 330 pt), восток 137,5.
# По ширине: юг 1310 pt → 13,3 м, север 1365 → 13,45 м, запад 1143 → 8,31 м, восток 1135 → 8,25 м. План даёт 13,0 × 8,3 м
# по наружным граням (107,5 px/м, размер 7 490 внутри) — виды чуть шире плана (облицовка), взято по видам.
# Отметки: ±0,000 чистый пол, земля −0,300, низ окон +1,050 (юг, запад-север) и +0,600 (север, большое окно на юге),
# +2,550 верх окон, +3,000 карниз (верх стены), конёк +5,178 у трубы (подпись).
id = "st-34082"
