# Двухэтажный дом с плоской кровлей, проект № 39840 на строим.дом.рф (название на листе не читается)
# https://строим.дом.рф/project/39840 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — юг (вход, 7860 между осями), стр. 1 — запад (11750), стр. 3 — север (7860; два плана: слева
# уступ, справа выступающая часть), стр. 4 — восток (11750; справа торец уступа с дверью); стр. 5 — план 2 этажа,
# стр. 6 — план 1 этажа. 1 pt = 1 px. Стороны названы по виду плана (верх плана — север).
# Порядок по часовой от входа: юг (вход в тамбур, нижняя стена плана) → запад → север (верхняя стена) →
# торец уступа (смотрит на восток) → стена уступа (на север) → восток. Проверка: на виде юга слева запад, на
# виде запада слева север (окно санузла и дверь по плану), на севере слева восток, на востоке слева юг.
# Контур с плана: 8,12 × 12,0 м по наружным граням; в северо-восточном углу уступ 4,0 × 1,8 м (внутренний
# угол у торца уступа): запад 12,0; север-верх 4,1; торец уступа 1,8; север-уступ 4,0; восток 10,2; юг 8,12.
# Масштаб: юг 1018 pt / 8,12 = 125,4; запад 1485 / 12,0 = 123,75; север 993 / 8,12 = 122,3; восток 1392 / 12,0 = 116,0.
# Сверка по отметкам (+0,580 → +2,880 и т.д.): юг 125,4, запад 123,9, север 122,0, восток 116,2 — до 1 %.
# Пол: ±0,000 по шкале отметок (запад y 968; юг y 1000, отметка +0,100 у порога; север y 975; восток y 969);
# цоколь 0,3 м — тёмная полоса до отметки −0,300. Перекрытие — тонкая линия на +3,48; парапет +7,15.
id = "st-39840"
pdf = "39840/sheet.pdf"
roof = "плоская с парапетом, верх +7,150; кровля на листе не показана; над парапетом короткие вентвыходы до +7,650"
roof_kind = "flat"
pitch_deg = 0.0
overhang_m = 0.0
overhang_by = "default"
gutters = true
unit = "m"
pt_per_unit = 125.4
# белая гладкая стена, подписи нет — plaster по виду (не уверен); тёмные пилястры — вертикальная доска,
# по рисунку (вертикальные рейки с поперечными стыками), по цвету, не уверен
material = "plaster"
colors = { plinth = "#595950", accent = "#343430" }
plinth = 0.3
plinth_material = "concrete"
floor_heights = [3.48, 3.67]
trim = { door = "sidelights" }
absent = ["все стороны: нет карнизной полосы, свесов, наличников, подоконников, ставен",
          "все стороны: нет мансардных, слуховых окон, крыльца и козырька над входом"]
cut = ["все стороны: вентвыходы над парапетом до +7,650 (юг x 535, 620, 1322; запад x 1147, 1450, 1675; север x 520, 1210, 1290; восток x 590, 798, 1085) — тоньше трубы, возможно дымоходы котельной",
       "все стороны: тонкая линия перекрытия на +3,48, отмостка (линия −0,300), оси",
       "юг: белая прямоугольная рамка над дверью y 563–640 (не отличить от стены), тени",
       "запад, восток: водосточные трубы по углам и на x 790 (восток)",
       "север: диагональная тень на x 740–960"]

