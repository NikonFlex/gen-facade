# МНС-108 — ИП ХАДЖИМУХОМЕТОВ Р. Б.; проект № 54090 на строим.дом.рф
# https://строим.дом.рф/project/54090 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 1 — фасад 12000 мм (юг, вход), стр. 4 — левая сторона (запад, терраса слева 3000 мм),
# стр. 3 — задний фасад (север), стр. 2 — правая сторона (восток, терраса справа); 1 pt = 1 px.
# Прямоугольник стен 12,0 × 10,0 м (размерные цепочки 12000 и 10000 мм; терраса 3000 мм под общей
# крышей на столбе — вне стен). Масштаб у вида свой: pt/м = ширина стены / длина; сверка: цоколь
# 800 мм — 90 pt на Ф. 1 (113 pt/м), 96,5 pt на боковых (121 pt/м); стена 3000 мм — 339 pt (113) и 365 pt (121,7).
# Отметок уровней на листе нет — только размеры: цоколь 800, стена до карниза 3000, крыша 2500.
id = "st-54090"
pdf = "54090/sheet.pdf"
roof = "вальмовая, ≈24° (высота крыши 2 500 мм, свес ≈0,5 м), мягкая кровля; терраса 3000 мм слева-сзади под продолжением крыши на кирпичном столбе"
roof_kind = "hip"
pitch_deg = 24.0
# свес: вальмовая — Ф. 12000 стр. 1, край кровли за стеной на 70 pt / 113 pt/м = 0,6 м (в шапке ≈0,5 м)
overhang_m = 0.6
overhang_by = "drawing"
unit = "m"
pt_per_unit = 113.0
material = "brick"        # светлый облицовочный кирпич
plinth = 0.8
plinth_material = "stone" # тёмно-серый цокольный камень
floor_heights = [3.0]
cut = ["north, west, east: терраса 3000 мм вне стен — перила нет, столб и скат её крыши обрезаны",
