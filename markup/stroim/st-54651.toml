# Одноэтажный модульный дом 6,0 × 5,0 м («Север33») с террасой 2,0 м — проект № 54651 на строим.дом.рф
# https://строим.дом.рф/project/54651 ; разметка gf#470, волна 2 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. А–В (восток, дверь на террасу, 5,0 м), стр. 2 — Ф. 1–3 (юг, 8,0 м с террасой),
# стр. 3 — Ф. В–А (запад, глухая), стр. 4 — Ф. 3–1 (север, вход, 8,0 м с террасой); 1 pt = 1 px.
# Ось А на плане внизу (юг), В вверху (север), 1 слева (запад), 3 справа (восток); терраса справа от оси 2.
# Главная дверь — на север (дверь с открыванием наружу на плане, в стене В; на Ф. 3–1 дверь 2,17–2,86 м от оси 1).
# Порядок сторон по часовой от входа: север, восток, юг, запад; следующая — слева на виде предыдущей:
# север слева восток (ось 3), восток слева юг (А), юг слева запад (1), запад слева север (В) — сходится.
# Масштаб: 134,7 pt/м — 8000 мм между осями 1–3 = 1078 pt (стр. 2, 4) = 134,75; 5000 мм А–В = 673 pt (стр. 1)
# = 134,6; сверка по высоте: ±0,000 → +2,750 (конёк) = 372 pt = 2,76 м, ±0,000 → −0,500 = 67 pt = 0,50 м.
# Расхождение < 1 %, один масштаб на все виды. Корпус 6,0 м (оси 1–2), стена на Ф. 3–1 / 1–3 = 811 pt = 6,02 м.
# Отметки: ±0,000 чистый пол (на листе над стойками), −0,500 земля, +2,418 край кровли у карниза, +2,750 конёк.
# Пол: ±0,000 по отметке на листе (низ облицовки ниже на ~5 pt, тёмный пояс-обвязка 0,2 м до низа корпуса).
id = "st-54651"
pdf = "54651/sheet.pdf"
roof = "двускатная очень пологая, конёк вдоль длинной стороны (запад–восток), карнизы на север и юг; конёк +2,750, край +2,418, кровля тёмная с узким ребристым рисунком; свесы почти нет"
roof_kind = "gable"
# pitch: по отметкам (2,750 − 2,418) / 2,5 = 0,133 → 7,6°; по линии ската на Ф. А–В (стр. 1): 48 pt на 337 pt = 0,142 → 8,1°; расхождение 0,5°
pitch_deg = 8.0
# свес: на стр. 1 и 3 кровля шире стены на ~4 pt = 0,03 м; на Ф. 1–3, 3–1 кровля вровень со стеной
overhang_m = 0.03
gable_overhang_m = 0.03
overhang_by = "drawing"
# кровля — тёмная с вертикальным ребристым рисунком на стр. 2, 4: по рисунку, не уверен (может быть фальц)
roof_material = "metal_roof"
unit = "m"
pt_per_unit = 134.7
material = "board_batten_narrow"   # тёмная вертикальная обшивка; по рисунку, вид по цвету — не уверен
colors = { main = "#6d6d6d", plinth = "#cfc8b0", accent = "#c4c3bf", roof = "#6e6e6e" }
plinth = 0.5                       # от земли −0,500 до пола ±0,000, дом на стойках; тёмный пояс 0,2 м + светлая балка
plinth_material = "wood"           # по цвету, не уверен
floor_heights = [2.418]
trim = { casing = "wide", door = "plain" }
cut = ["все стороны: стойки и обвязка под полом (дом на опорах, светлая балка)",
       "север/юг: терраса 2,0 м (настил на уровне пола, слева на Ф. 3–1, справа на Ф. 1–3) без перил и крыши — не размечена",
       "восток: нет козырька; крыльцо/терраса перед дверью — настил без кровли",
       "вторая отделка — светлое дерево: рейки на севере/юге и светлая облицовка на востоке/западе; на В/З цвет серый, на С/Ю бежевый — один материал по предположению (wood), по цвету, не уверен",
       "восток: рамы окон тёмные широкие (профиль), верх и бока колонн облицовки — зоны только по светлому полю"]
absent = ["все стороны: нет карнизной полосы — только край кровли",
          "все стороны: нет водостока, труб, мансардных и слуховых окон",
          "запад: нет окон и дверей"]

