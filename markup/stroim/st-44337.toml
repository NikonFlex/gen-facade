# «Буссе 44» — ООО "МР.БРУС"; проект № 44337 на строим.дом.рф; разметка gf#470 (учебная, см. LICENSE.md).
# https://строим.дом.рф/project/44337
# Листы (1 pt = 1 px): стр. 1 — юг (вход, терраса под кровлей), стр. 4 — запад, стр. 3 — север, стр. 2 — восток.
# Порядок по часовой от входа: юг, запад, север, восток; на запад слева примыкает север, терраса справа (юг) — сходится.
# План без размеров в мм; отметок уровней на видах нет (только -0,052 у настила террасы). Масштаб — по подписанным
# размерам окон: юг 2025/2200 мм = 1270/1372 pt (≈625 pt/м), восток 1930 мм = 1050 pt (≈544), север 1400 мм = 810–830 pt
# (≈580–590), запад 600 мм = 336–342 pt (≈565). Ширина юга 4667 pt / 625 = 7,47 м; площадь террасы 14,44 м² даёт её
# глубину 1,93 м, а пропорции плана — тело дома 7,47 × 6,13 м (стены востока/запада 3353/3351 pt, терраса в 1041 pt — вне стен).
# Остальные виды: pt/м = ширина стены / длина (север 4373/7,47 = 585,7; восток и запад по 547): сверка по цоколю 0,40 м
# на всех видах (юг 245/625, север 235/585,7, восток 218/547, запад 216/547) — сходится.
# «Пол» разметки — низ обшивки (верх цоколя): настил террасы на -0,052, обшивка стоит ниже; цоколь 0,40 м от земли.
# Высота стен: на востоке/западе 2,51–2,55 м, на юге у угла 2,38 (ниже на 0,12 — нарисовано так), floor_heights = 2,45.
id = "st-44337"
pdf = "44337/sheet.pdf"
roof = "двускатная, конёк север-юг, ≈5°, свес ≈ 0 (кромка кровли у стены); кровля — тёмные вертикальные полосы с фальцем; продолжена над террасой 1,93 м на 4 столбах"
roof_kind = "gable"
roof_material = "metal_roof"  # гладкие вертикальные полосы с фальцем (стр. 1–4), подписей нет — по рисунку
# уклон: отметок нет, считаем по линии ската: Ф. юг стр. 1 верхняя кромка кровли (312→108 при x 108→2445) tg = 204/2337 = 0,087 → 5,0°;
# верх стены (457→256) tg = 0,086 → 4,9°; север стр. 3 (435→244 при 136→2322) tg = 0,087 → 5,0°
pitch_deg = 5.0
# свес: кромка кровли на южном виде совпадает со стеной (x 108 и 4775), на восточном — с краем террасы; свеса за стену не видно
overhang_m = 0.0
gable_overhang_m = 0.0
overhang_by = "drawing"
unit = "m"
pt_per_unit = 625.0
material = "wood"   # коричневые вертикальные доски, узкие (шаг ≈0,1 м) — по цвету и рисунку, не уверен
colors = { main = "#736148", plinth = "#b0a698", accent = "#5b5c5c", roof = "#4e4e4e" }
plinth = 0.40
plinth_material = "stone"   # рваный булыжник
floor_heights = [2.45]
trim = { door = "plain" }
# терраса 1,93 м под продолжением кровли на 4 столбах (стр. 1: столбы x 160–245, 1648–1735, 3150–3236, 4640–4725)
porch_roofs = [
  { side = 0, x = [108.0, 4775.0], y = [108.0, 457.0], kind = "gable", posts = 4, depth_m = 1.93 },
]
absent = [
  "все стороны: нет карнизной полосы, водостока и труб",
  "все стороны: нет подоконников, наличников и ставен — окна в тёмной коробке",
]
cut = [
  "south: настил террасы и ступени перед столбами (стр. 1 y 1850–2190)",
  "east, west: столб и балка террасы (east x 450–498, west x 4449–4494) и проём террасы без стены",
  "south: светлая балка 359–457 под кровлей — край кровли террасы, не отделка",
  "east, west: вторая отделка (тёмно-серая) — по цвету металл, не уверен в виде; main — доска по цвету",
]

