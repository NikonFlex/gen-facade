# Одноэтажный дом 13,6 × 15 м с террасой под продолжением вальмовой кровли; проект № 48416 на строим.дом.рф
# https://строим.дом.рф/project/48416 ; разметка gf#470 (волна 2).
# Листы: стр. 2 — восток (вход: ДВ-02 тамбура, окна ОК-05, ОК-06, остеклённая дверь террасы ДВ-01), стр. 1 — юг (глухая),
# стр. 4 — запад (4 окна), стр. 3 — север (одно окно ОК-01 на 2,5 м). План — стр. 5 (plan0-0.jpg): контур 10 600 × 15 000 мм
# осями 1–2 и А–Б, терраса 3 000 × 8 500 мм снаружи оси 2 в северной части восточной стены.
# Порядок по часовой от входа (восток): восток → юг → запад → север. Проверка: слева на стр. 2 ось А (юг), на стр. 1 ось 1 (запад),
# на стр. 4 ось Б (север), на стр. 3 справа ось 1 и слева терраса (восток).
# Масштаб у видов разный: 10,6 м (юг, север) — 175,5 pt/м (юг 292–2152 = 1860 pt; сверка по отметкам −0,450…0,000: 79 pt = 175,6;
# 0,000…2,817: 493 pt = 175,0); 15 м (восток, запад) — 157,7 pt/м (восток 360–2725 = 2365; запад 301–2664 = 2363; 0,000…2,817 ≈ 444 pt = 157,6).
# Расхождение по отметкам до 0,4 %.
# ±0,000 — отметка пола и террасы (по стрелке на виде); низ стены −0,450 (земля). Цоколь по рисунку идёт от земли до 0,14–0,16 м под ±0,000:
# plinth = 0,45 от пола до земли, цокольный материал занимает 0,31 м у земли, 0,14 м выше — стена [не проверено: разметка цоколя целиком 0,45].
# Низ карниза (подшивка) +2,817, кромка свеса +3,126, конёк +5,554 над домом и +5,128 над крылом террасы.
# Окна: низ +0,85, верх +2,35 (ОК-05, ОК-07..04), на севере низ +0,35 (ОК-01); у входа ДВ высотой 2,1 м (ДВ-02 и ДВ-01 до +2,1).
id = "st-48416"
pdf = "48416/sheet.pdf"
roof = "вальмовая; основной конёк +5,554, над крылом террасы конёк +5,128; кромка свеса +3,126, подшивка +2,817; свес 0,77 м; кровля — рельефная черепица (волна)"
roof_kind = "hip"
gutters = true
# tg = (5,554 − 3,126) / (5,3 + 0,77) = 0,400 = 21,8°; линия ската на виде юг: (465−140)/(925−120) = 0,404 = 22,0° — сходятся
pitch_deg = 21.8
# свес: восток, запад — кромка на 122–123 pt за стеной (157,7 pt/м) = 0,77 м; юг — 134 pt (175,5) = 0,76 м; вальма — свес со всех сторон одинаков
overhang_m = 0.77
overhang_by = "drawing"
# кровля по рисунку (чешуйчатая волна с уступом) — металлочерепица, подписи нет [по рисунку, не уверен: может быть черепица]
roof_material = "metal_tile"
roof_gaps = ["две вальмы разной высоты: основной конёк +5,554 над домом и конёк крыла +5,128 над террасой (виды стр. 1, 3) — модуль строит одну"]
unit = "m"
pt_per_unit = 157.7
# отделка: стена гладкая однотонная светло-серая, рисунка кладки и доски нет, подписи нет — plaster по рисунку; цоколь — шероховатая текстура
material = "plaster"
colors = { main = "#c8c7c8", plinth = "#74767b" }
plinth = 0.45
plinth_material = "stone"
trim = { door = "plain" }
floor_heights = [2.817]
cut = ["все стороны: тень от свеса на стене — резкая граница светлой и тёмной зон (на юге горизонтальная на y 860, на востоке, западе и севере — косая) — не зона",
       "все стороны: водосточные трубы по углам и воронки — не размечены",
       "east, north, south: перила террасы (стойки с поручнем, высота 1,1 м) и ступени — не размечены",
       "east: окно ОК-06 тамбура 0,5 × 1,5 м — размечено; вход ДВ-02 без козырька, площадка у него — часть настила террасы",
       "по рисунку на кровле видна затемнённая выступающая зона у конька — часть вальмы крыла, не размечена"]
absent = ["все стороны: нет карнизной полосы, зон второй отделки, труб, мансардных окон, слуховых окон",
          "south: нет окон и дверей",
          "все стороны: нет подоконников, наличников, ставен, козырьков"]
porch_roofs = [
  { side = 0, x = [1385.0, 2725.0], y = [199.0, 580.0], kind = "hip", posts = 5, depth_m = 3.0 },
]

