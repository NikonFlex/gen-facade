# Загородный дом R-85 (3+S), 1 этаж, вальмовая крыша — проект № 55409 на строим.дом.рф
# https://строим.дом.рф/project/55409 ; разметка gf#470 (волна 2).
# Листы: стр. 4 — Ф. 1–3 (юг, вход под малым щипцом), стр. 2 — Ф. А–Б (запад), стр. 1 — Ф. 3–1 (север, терраса),
# стр. 3 — Ф. Б–А (восток); 1 pt = 1 px. План — стр. 5, сильно сжат по вертикали (по нему только оси и размеры).
# Порядок по часовой от входа: юг → запад → север → восток. Вход на плане у оси А (внизу), на Ф. 1–3 слева ось 1 = запад,
# на Ф. А–Б слева А = юг, на Ф. 3–1 слева 3 = восток, на Ф. Б–А слева Б = север — порядок сходится.
# Масштаб: юг — оси 1–3 (3745+3995 = 7740 мм) 1079 pt → 139,4 pt/м; стена между наружными гранями 1150 pt = 8,25 м.
# Высотная сверка на юге: ±0,000→+2,900 = 405 pt / 2,9 = 139,7 — сходится. Север: оси 1032 pt / 7,74 = 133,3
# (стена 1102 pt = 8,27 м), но по высоте окна (0→2,5 = 352 pt) ≈141 — лист по горизонтали сжат на ≈4 %: взят масштаб
# по ширине (замыкание контура), высота карниза на севере из-за этого на ≈14 pt ниже нарисованного.
# Запад/восток: оси А–Б 922/928 pt при ≈138 pt/м по высоте = 6,7 м, стена 1067/1082 pt = ≈7,75 м: за осью А ещё ≈0,9 м
# (южный выступ у входа); длина 7,75 взята по листам, размер А–Б на плане не читается («10040» — плана сжат) [не проверено].
# Отметки: ±0,000 пол, −0,100 земля, +2,500 верх окон, +2,900 низ свеса, +5,130 конёк, +0,900 низ окон, +2,100 верх двери.
id = "st-55409"
pdf = "55409/sheet.pdf"
roof = "вальмовая, уклон ≈22° (по линии ската, конёк +5,130, низ свеса +2,900); свесы ≈0,5 м, над входом малый щипец на двух столбах"
roof_kind = "hip"
# tg = (5,130−2,900)/(4,125+0,62) = 0,470 = 25,2° по отметкам; по линии ската на Ф. 1–3 (357−88)/(748−85) = 0,406 = 22,1° — расхождение 3° > 2°, взята линия ската;
# на Ф. А–Б линия круче (≈29°) — лист нарисован неряшливо, конёк на боковых видах 2,4 м, на фронтальных — точка [не проверено]
pitch_deg = 22.0
overhang_m = 0.5
overhang_by = "drawing"
unit = "m"
pt_per_unit = 139.4
# отделка на листе не подписана и не нарисована (только контуры) — штукатурка по умолчанию [не проверено: вид по цвету/подписи не определить]
material = "plaster"
plinth = 0.1
plinth_material = "plaster"
floor_heights = [2.9]
trim = { door = "plain" }
# малый щипец над входом (Ф. 1–3, стр. 4): x 553–1070, конёк y 238, на двух столбах 638–692 и 934–987; вынос ≈1,5 м [не проверено: с плана не снят, план сжат]
porch_roofs = [
  { side = 0, x = [553.0, 1070.0], y = [238.0, 358.0], kind = "gable", posts = 2, depth_m = 1.5 },
]
cut = ["north: сваи под террасой (4 штуки) и настил под ними ниже уровня пола — не размечены",
       "south: ступени входа не нарисованы, площадка по линии 805–820",
       "west: блоки у углов (x 187–225 и 1110–1147) размечены зонами по рисунку — вид ashlar не проверен",
       "west/east: за осью А выступ ≈0,9 м у входа — в контур не вынесен, длина стены взята полной"]
absent = ["все стороны: нет карнизной полосы — только свес и фасция",
          "все стороны: нет подоконников, наличников, ставен",
          "все стороны: нет труб, мансардных и слуховых окон, водостока",
          "east, south: нет второй отделки (кроме запада)"]

