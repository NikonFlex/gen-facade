# Ой бэс (ИП Жуков М. С.) — проект № 55603 на строим.дом.рф
# https://строим.дом.рф/project/55603 ; разметка gf#470 (волна 1, учебная, см. LICENSE.md).
# Листы: стр. 4 — Ф. 1–6 (юг, вход под навесом слева), стр. 1 — Ф. Ж–А (запад), стр. 3 — Ф. 6–1 (север),
# стр. 2 — Ф. А–Ж (восток); 1 pt = 1 px (4961 x 3508). Вид снаружи: у запада слева Ж (север), у востока слева А (юг).
# Контур по осям (план 1-го этажа, 12 800 x 8 700 с выступом, зазор по осям): 8 сторон по часовой от юго-западного крыла с входом:
# юг-лево (оси 3→1, 4,0 м, ДВ-3), запад (Ж→В, 7,2), север (12,8), восток (Ж→В, 7,2), юг-право (6→5, 4,0 м, терраса),
# уступ востока (ось 5, В→Б, 1,5), юг-середина (5→3, 4,8 м, на оси Б — выступает на 1,5 м), уступ запада (ось 3, Б→В, 1,5).
# Масштаб у видов разный: юг/север — 12,8 м осей = 1219 px листа 2000 px (95,2 px/м ×2,4805 = 236,2 pt/м; сверка по
# уровням 0,000 → +2,635 на Ф. 6–1: 251 px = 95,3 px/м); запад/восток — 9,7 м Ж–А = 1026 px (105,8 px/м ×2,4805 = 262,4 pt/м;
# сверка 0,000 → +2,550 = 270 px = 105,9). Координаты сняты с листа 2000 px, пересчитаны на pt листа (×2,4805).
# Нулевой «пол» разметки — чистый пол ±0,000; низ венцов на −0,150, земля −0,750, цоколь (тёмный кирпич) 0,75 м от земли до пола.
# Стена до карниза: кровля у стены +5,31 (карниз по краю свеса +4,89 при свесе 0,9) -> floor_heights 3,415 (перекрытие/балкон) + 1,885.
