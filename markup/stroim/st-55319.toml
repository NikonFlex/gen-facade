# «Одноэтажный дом - 121,4 м2» — ИП Файзуллоев К. А.; проект № 55319 на строим.дом.рф
# https://строим.дом.рф/project/55319 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — запад (слева север, справа юг, ступени справа), стр. 2 — юг (вход в нише), стр. 3 — восток
# (слева юг; тёмная правая часть — терраса), стр. 4 — север (слева восток; слева терраса, справа две спальни);
# 1 pt = 1 px. План (стр. 5): корпус 12,7 × 12,2 м с двумя вырезами: ниша входа с юга 2,94 × 1,2 м (кирпичная
# стена-фон с дверью, ступени) и открытая терраса в СВ углу 4,84 × 2,1 м под продолжением вальмы на одном угловом столбе.
# Стороны по часовой от входа (10): 0 задняя стена ниши (дверь), 1 западная стена ниши, 2 юг-запад 4,36, 3 запад 12,2,
# 4 север-запад 7,86, 5 западная стена террасы 2,1, 6 задняя стена террасы 4,84, 7 восток 10,1, 8 юг-восток 5,4,
# 9 восточная стена ниши. Углы после сторон 0, 5, 9 — внутренние. Стороны 1, 5, 9 на листе не видны отдельно
# (закрыты длинными стенами): взяты участки соседних видов без элементов (1 — стр. 3 юг, 9 — стр. 1 юг, 5 — стр. 3 север).
# Масштаб: стена 12,7 м (юг) = 3002 pt -> 236,4; запад 12,2 м = 2890 pt -> 236,9; север 12,7 м = 3001 pt -> 236,3;
# восток 12,2 м = 2889 pt -> 236,8. Сверка по уровням: 0,000 -> 2,400 (верх окон) = 578 pt на юге -> 240,8 pt/м, расхождение 1,8 % < 3 %.
# Уровни: «пол» разметки — низ кирпичной кладки (стр. 2 y 1998, стр. 1 y 2038, стр. 3 y 2080, стр. 4 y 2010) ≈ отметка ±0,000
# (стрелка 0,000 на 8 pt выше низа кладки); цоколь до земли 84 pt = 0,36 м; карниз = низ подшивки свеса, 668 pt = 2,83 м над полом.
id = "st-55319"
pdf = "55319/sheet.pdf"
roof = "вальмовая, ≈25° (конёк +6,227 длиной ≈0,5 м, верх подшивки свеса ≈+3,1), мягкая кровля; свес 0,65 м со всех сторон, толстая подшивка 0,33 м; вальма продолжена над террасой СВ"
roof_kind = "hip"
# pitch: tg = (6,227 − 3,1) / (половина пролёта 6,1 м + свес 0,65 м = 6,75 м) = 0,463 -> 24,8°; по линии вальмы на виде юг
# (1607 pt по горизонтали при 750 pt подъёма) 25,0° — расходятся меньше 2°
pitch_deg = 24.9
overhang_m = 0.65
overhang_by = "drawing"
roof_material = "shingle_roof"  # рисунок «кирпичной» черепицы мелкой кладкой, подписи нет — по рисунку, не уверен (может быть мягкая или композитная)
unit = "m"
pt_per_unit = 236.5
material = "brick"  # тёмно-красная лицевая кирпичная кладка
colors = { main = "#322324", plinth = "#818080" }
plinth = 0.36
floor_heights = [2.83]
plinth_material = "brick"  # светло-серый кирпич рядами — по рисунку, не уверен (может быть клинкер или камень)
# обрамление: окна в тёмно-серых профилях, подоконников, наличников и ставен нет; входная дверь филёнчатая (стр. 2)
trim = { door = "panel6" }
# терраса СВ: вальма над ней опирается на угловой столб 0,3 × 0,3 м (план, красный квадрат), вынос от стены 2,1 м (план);
# y — вся вальма над x террасы от конька до низа свеса, на стр. 4 это треугольник под линией вальмы
porch_roofs = [
  { side = 6, x = [377.0, 1521.0], y = [655.0, 1263.0], kind = "hip", posts = 1, depth_m = 2.1 },
]
chimneys = [
  { side = 3, x = 1805.0 },
  { side = 3, x = 2052.0 },
  { side = 3, x = 2480.0 },
  { side = 3, x = 2970.0 },
]
absent = [
  "все стороны: нет карнизной полосы — только толстая подшивка свеса, подоконников, наличников, ставен, козырьков и водостока",
  "все стороны: мансардных и слуховых окон нет",
]
cut = [
  "все стороны: четыре трубы по плану (ЖК-вентканалы и котёл) — крайняя на юге вдвое шире остальных (≈1,5 м), все с зонтами; x даны на виде запад",
  "south: ступени в нише 2,9 × 0,36 м (дерево) — только площадка porch, без счёта ступеней",
  "west, east: ступени у юго-западного угла (≈3320–3590 на стр. 1 и 160–215 pt на стр. 3) — крыльцо ниши сбоку",
  "north: ступени террасы x 1167–1521, y 2010–2090 (у западного края террасы) не размечены",
  "north: угловой столб террасы 0,3 м (x 372–450) читается только тёмной полосой y 1400–1790 — отдельным элементом не записан",
  "north: терраса — ограждения и пола на листе нет, площадка и столб только по плану",
  "стороны 1, 5, 9: боковые стены ниши и террасы закрыты длинными стенами, участки листов взяты для длин, окон на них нет",
]

