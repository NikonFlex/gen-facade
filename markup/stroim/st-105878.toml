# Дом 42.1-1 (ИП Долбик В. В.); проект № 105878 на строим.дом.рф
# https://строим.дом.рф/project/105878 ; разметка gf#470 (волна 2).
# Листы: стр. 1 — «Д–А» = запад (слева север/терраса, справа юг/крыльцо), стр. 2 — «4–1» = север (терраса),
# стр. 3 — «А–Д» = восток, стр. 4 — «1–4» = юг (вход). План — стр. 5: корпус 9 350 × 10 650 мм,
# терраса 5 000 × 3 000 с севера (x 3 350 от запада), крыльцо 2 710+ × 1 500 с юга по центру. 1 pt = 1 px.
# Порядок по часовой от входа: юг → запад → север → восток. Проверка: на юге слева запад (окно 3 створки
# слева — как на плане), на западе слева север (терраса), на севере слева восток, на востоке слева юг (крыльцо).
# Масштаб: юг 690 pt / 9,35 м = 73,8; север 690/9,35 = 73,8; запад 715/10,65 = 67,1; восток 715/10,65 = 67,1.
# Сверка по отметкам: юг ±0,000 y 700 → +2,550 y 513 = 187/2,55 = 73,3 (0,7 %); запад 688→517 = 171/2,55 = 67,1.
# Отметки: ±0,000 — чистый пол (y 700 юг/север, 688 запад/восток), низ кирпича на +0,075; цоколь −0,450 → 0,45 м.
# Высота стены до карниза: +3,000 (верх кладки), отметка +2,550 — верх окон, +0,600 — низ окон, +2,180 — верх двери.
id = "st-105878"
pdf = "105878/sheet.pdf"
roof = "вальмовая, конёк +5,563 длиной ≈1,3 м, карниз +3,000, свес ≈0,5 м, над входом свой щипец +4,015; кровля — без рисунка"
roof_kind = "hip"
# tg = (5,563 − 3,000 − 0,18) / (4,675 + 0,5) = 0,46 = 24,7°; линия ската на юге (403,467)→(785,290): 177/382 = 0,463 = 24,9° — сходятся
pitch_deg = 25.0
overhang_m = 0.5
gable_overhang_m = 0.5
overhang_by = "drawing"
unit = "m"
pt_per_unit = 73.8
# кладка — узнаваемый рисунок кирпича (ложок), подписи нет; цоколь — белый без рисунка: plaster по цвету, не уверен
material = "brick"
colors = { main = "#f1f1f1" }
plinth = 0.45
plinth_material = "plaster"
floor_heights = [3.0]
trim = { door = "plain" }
porch_roofs = [
  { side = 0, x = [650.0, 922.0], y = [403.0, 478.0], kind = "gable", posts = 2, depth_m = 1.5 },
  { side = 2, x = [493.0, 865.0], y = [480.0, 512.0], kind = "shed", posts = 2, depth_m = 3.0 },
]
absent = ["все стороны: нет карнизной полосы кроме подшивки свеса, нет зон второй отделки, ставен, подоконников, наличников",
          "все стороны: нет труб, мансардных и слуховых окон, водостока",
          "west, east: нет двери"]
cut = ["south: пилоны крыльца в кирпиче — те же материал, не зона; ступени крыльца (две) — не размечены",
