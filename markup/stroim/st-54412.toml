# Двухэтажный жилой дом 6,5х9,4 — ИП Дормидонтов Е. В.; проект № 54412 на строим.дом.рф
# https://строим.дом.рф/project/54412 ; разметка gf#470 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. В–А (запад), стр. 2 — Ф. 1–3 (юг, вход), стр. 3 — Ф. 3–1 (север), стр. 4 — Ф. А–В (восток);
# 1 pt = 1 px. План 1 этажа: основной объём 6,3 x 6,2 м (оси 1–3, Б–В) и веранда 3,5 x 3,0 м на юго-западе (оси 1–2, А–Б);
# вход — в южной стене основного объёма (оси 2–3, 2,8 м), отодвинут от фасада веранды на 3,0 м. План 2 этажа (стр. 5):
# спальня 3,4 x 4,2 м у севера и балкон на столбах под плитой перед ней.
# Контур по часовой от входа: юг (основной объём, 2,8 м, перед внутренним углом) -> восток веранды (3,0, стр. 4)
# -> юг веранды (3,5, стр. 2) -> запад (9,2, стр. 1) -> север (6,3, стр. 3) -> восток основного объёма (6,2, стр. 4).
# Проверка: слева на виде юга — запад, т.е. стена, что идёт за ней по часовой. Невязка 0 (x: 2,8+3,5=6,3; y: 3,0+6,2=9,2).
# Масштаб у вида свой, pt/м = ширина стены / длина с плана: юг и север (стр. 2, 3) ~134, запад и восток (стр. 1, 4) ~107.
# Сверка по уровням: +0,170 -> +3,050 на стр. 2 — 2,88 м = 385 pt (133,6 pt/м), на стр. 1 — 2,88 м = 308 pt (107 pt/м): в пределах 3 %.
# Отметки: -0,300 земля, +0,000 фундамент, +0,170 чистый пол, +2,870 потолок 1 эт., +3,050 пол 2 эт., +5,350 потолок 2 эт., +6,561 конёк.
id = "st-54412"
pdf = "54412/sheet.pdf"
roof = "двускатная над спальней, конёк север-юг, ~29,5° по линии ската (расчёт по отметкам даёт ~34°), конёк +6,561, кровля волна с уступом; веранда — односкатная ~11,6° низом на юг; над балконом — плита на столбах"
roof_kind = "gable"
gutters = false
pitch_deg = 29.5
# свес: щипцовые края по листу стр. 2 — ~0,4 м (треугольник 460–828 против стены 497–790 pt), карнизный не измерен — 0,5 по вылету плиты
overhang_m = 0.5
gable_overhang_m = 0.4
overhang_by = "drawing"
roof_material = "metal_tile"
unit = "m"
pt_per_unit = 134.0
material = "plaster"        # по цвету, подписи отделки нет, не уверен
colors = { accent = "#f4f4f4" }
plinth = 0.47               # земля -0,300 -> чистый пол +0,170
plinth_material = "concrete"  # по цвету, не уверен
trim_material = "wood"
# 1 эт. 3,05-0,17 = 2,88; 2 эт. до потолка +5,350 -> 2,30
floor_heights = [2.88, 2.3]
trim = { door = "panel6" }
cut = ["все стороны: участки карниза (eaves) не записаны — сборщик отказывает (gf#322: на одном участке стены 2 отметки карниза; 1 эт. 2,88 м и 2 эт. 5,18 м), силуэт outline записан",
       "south: балкон 2-го этажа — столбы, плита-кровля 7,3 м на отметке ~+5,35, ферменные перила (X-крестовины) слева, ступени крыльца у двери",
       "south: ромб-окно во фронтоне спальни размечено окном (вид ромба в формате нет)",
       "west, east: ферменные перила балкона и скос плиты, столбы балкона",
       "west, east, south: верхний ряд фрамуг веранды",
       "все стороны: стены 2-го этажа спальни и балкон не в одной плоскости с наружной стеной 1-го (спальня на 2,0 м глубже Б) — сведено на виде"]
absent = ["все стороны: нет карнизной полосы",
          "все стороны: нет наличников, ставен, подоконников"]

