# Одноэтажный дом 11,0 × 7,4 м с вальмовой крышей — проект № 55707 на строим.дом.рф
# https://строим.дом.рф/project/55707 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. А–В (7,4 м), стр. 2 — Ф. 1–4 (11,0 м, вход), стр. 3 — Ф. В–А, стр. 4 — Ф. 4–1;
# 1 pt = 1 px. Масштаб у вида свой: pt/м = ширина стены между осями / подписанный размер (7400
# или 11000): 204,3 / 150,7 / 202,6 / 156,5 pt/м; сверка по высоте: 3,000 от ±0,000 до низа свеса —
# 2,99–3,00 м на всех видах. Отметки: ±0,000 пол (низ кладки), −0,300 земля, +2,450 верх окон,
# +3,000 низ свеса, +6,151 конёк. Контур: оси 1–4 и А–В по краям стены.
# Ориентация А/В относительно сторон света по листам не определяется (стороны В–А и А–В
# зеркальны друг другу) — выбрана В на севере; с планом не сверялась.
id = "st-55707"
pdf = "55707/sheet.pdf"
roof = "вальмовая, ≈33° (конёк +6,151, низ свеса +3,000), мягкая кровля; свесы со всех сторон, дымник"
roof_kind = "hip"
# труба: Ф. 4–1 (север) стр. 4, центр ~940 pt (стена 360–2081 pt), дымник +5,200 на скате левее середины конька, виден и на Ф. В–А стр. 3
chimney = { side = 2, x = 940 }
# водосток: желоб и водосточные трубы с воронками на Ф. 1–4 стр. 2, В–А стр. 3, 4–1 стр. 4
gutters = true
pitch_deg = 33.0
# свес: вальмовая — Ф. 1–4 стр. 2, край ската за стеной на 63 pt / 204,3 pt/м = 0,3 м (с фасцией ~0,45)
overhang_m = 0.35
overhang_by = "drawing"
unit = "m"
pt_per_unit = 204.3
material = "plaster"      # светлая штукатурка стен
plinth = 0.3              # −0,300 под низом кладки
plinth_material = "concrete"
floor_heights = [3.0]
cut = ["все стороны: водосточные трубы, дымник на кровле",
       "east: порожек/площадка перед стеклянной дверью",
       "кирпичные пилястры (одна вторая отделка) размечены зонами акцента вокруг окон"]
absent = ["все стороны: нет карнизной полосы — только свес кровли с желобом"]

