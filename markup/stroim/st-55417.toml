# Одноэтажный дом «Стефано 1.2» 6,2 × 8,5 м, двускатная крыша 18° — проект № 55417 на строим.дом.рф
# https://строим.дом.рф/project/55417 ; разметка gf#470 (волна 2, учебная, см. LICENSE.md).
# Листы: стр. 1 — восток (глухая, 8,5 м), стр. 2 — запад (вход, 8,5 м), стр. 3 — юг (щипец, 6,2 м,
# окна ОК_02–04), стр. 4 — север (щипец, 6,2 м, 2 окна ОК_01); 1 pt = 1 px картинки 3840x2160.
# Порядок по плану (вход Д_01 на западе): запад, север, восток, юг; следующая сторона слева от вида
# предыдущей (север — слева восток, восток — слева юг, юг — слева запад): сходится.
# Масштаб: длинные стены 3144 pt / 8,5 м = 370 pt/м (дверь 1000 мм = 370 pt); щипцовые 2398 pt /
# 6,2 м = 386,8 pt/м (окно 1300 мм = 502 pt). Сверка по высоте: окно ОК_01 1500 мм = 578 pt (1,49 м),
# подоконник 800 мм = 0,81 м; Д_01 2100 мм = 2,1 м. Отметок на листе нет — масштаб по плану и окнам.
# Стена до карниза 2,75 м (длинные виды) / 2,82–2,98 м (щипцовые); взято 2,8. Низ ОСП = чистый пол,
# цоколь — светлая доска 0,36 м ниже. Конёк ≈1,0 м над основанием щипца на полупролёте 3,1 м;
# общая высота ≈ 4,2 м по карточке.
id = "st-55417"
pdf = "55417/sheet.pdf"
roof = "двускатная, конёк вдоль длинной стороны, ≈18° (подъём 262 из 805 px на виде = 0,325; линия кровли 0,326), тёмная кровля с частым ребром; свесы 0,7 м"
roof_kind = "gable"
# кровля: вертикальные мелкие рёбра (шаг ~0,08 м) без волны — профнастил [не проверено: тип по листу]
roof_material = "profiled_sheet"
pitch_deg = 18.0
# свес: на щипцовых видах линия кровли 300..2278 px при стене 483..2093 — 0,7 м с края (карниз); у щипца по видам стр. 1–2 — 0,5–0,7 м
overhang_m = 0.7
gable_overhang_m = 0.6
overhang_by = "drawing"
unit = "m"
pt_per_unit = 370.0
material = "wood"         # ОСП-плита, рисунок стружки; по рисунку, не по подписи
colors = { main = "#c2995f", plinth = "#d2a260", accent = "#d3a464" }
plinth = 0.36
plinth_material = "siding"  # светлая горизонтальная доска, по цвету, не уверен
floor_heights = [2.8]
trim = { door = "plain" }
cut = ["все стороны: цоколь двумя полосами светлой доски (по ~0,17 м)",
       "юг: окна ОК_02, ОК_04 со скошенным верхом по скату, ОК_03 в пол высотой 3,56 м до щипца"]
absent = ["все стороны: нет подоконников, наличников, ставен, козырька, водостока, труб",
          "все стороны: нет карнизной полосы — только свес кровли"]

