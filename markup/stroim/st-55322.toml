# «Дружба-9» — ООО СТРОИТЕЛЬНАЯ КОМПАНИЯ "ФЕДЕРАЦИЯ"; проект № 55322 на строим.дом.рф
# https://строим.дом.рф/project/55322 ; разметка gf#328 (учебная, см. LICENSE.md).
# Листы: стр. 1 — Ф. 1–4 (юг, вход под навесом), стр. 4 — Ф. В–А (запад), стр. 3 — Ф. 4–1 (север),
# стр. 2 — Ф. А–В (восток); 1 pt = 1 px. Прямоугольник по стенам 14,68 × 10,0 м (план: 14 680 и 10 000).
# Масштаб у каждого вида свой: pt/м = ширина стены в px / длина стены. Сверка по уровням: на Ф. 1–4
# 2,700 → 0,975 = 127,4 pt при 1,725 м (73,9 pt/м), 0,975 → 0,000 = 72,6 pt (74,5), 0,000 → −0,300 = 22,4 pt (74,7);
# на Ф. В–А 0,000 → 3,000 = 262 pt (87,2 pt/м) при ширине 867 pt / 10,0 м = 86,7.
# Низ кладки стены — на +0,150 над ±0,000 (отметка 0,150 на Ф. 4–1), поэтому «пол» разметки — низ кирпича,
# цоколь от земли (−0,300) до него 0,45 м, карниз +3,000 над ±0,000 = 2,85 м над низом кладки.
# Крыша (gf#336): свес — по умолчанию ([spec.roof_shape], на листе не подписан).
