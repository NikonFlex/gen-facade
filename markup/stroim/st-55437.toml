# Листы: стр. 4 — Ф-07 «Фасад (1)» (юг, вход), стр. 1 — Ф-08 (запад, глухой), стр. 2 — фасад с двумя
# окнами (север), стр. 3 — Ф-06 (восток, окно с дверной створкой); порядок сторон и положение окон сверены с планом.
# Масштаб: на всех видах подпись 1:40; размеров и отметок на листе нет. Стр. 1 и 4 — 2481 pt (A3 150 dpi, 147,6 pt/м),
# стр. 2 и 3 — 4961 pt (A3 300 dpi, 295,3 pt/м). Сверка: стены 10,41 × 7,80 м (юг 1537 pt, запад 1152 pt, север 3072 pt,
# восток 2300 pt), контур замыкается; застройка 81 м² (в API 82); толщина стены на плане ≈ 0,30 м (в API 300 мм).
# Высота стены до карниза по чертежу 2,29 м (в API этаж 2,7 м — расходится, верим чертежу); низ кладки = верх цоколя.
id = "st-55437"
pdf = "55437/sheet.pdf"
roof = "вальмовая, ≈25° (конёк ≈ +2,19 м над линией карниза кровли, полупролёт со свесом 4,68 м → 25,1°), свес 0,8 м со всех сторон; кровля не читается"
roof_kind = "hip"
# рисунок — контур без штриховки: вид кровли не определить
