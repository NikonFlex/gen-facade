# Halfstory House — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия,
# целиком (части разной высоты) — gf#323.
# Листы: план — стр. 2 (A1.1), фасады — стр. 5 (FRONT = запад, RIGHT SIDE = юг) и стр. 6
# (REAR = восток, LEFT SIDE = север), 1/4" = 1'-0" (18 pt/ft); сверено: MAIN ROOF EAVE +4'-8" = 84 pt
# над FLOOR LEVEL, дверь 36x80" = 54x120 pt, ROOF RIDGE +13'-2".
# Устройство: «полуторный» дом-крест — квадрат 18' x 18' и четыре рукава 12' x 18' (42' x 42'),
# одноэтажный, стены до карниза всего +4'-8", крыши 10:12 с коньком вдоль северо-юг (общая) и
# поперечными щипцами на торцах рукавов; окна и двери торцов уходят во фронтоны выше карниза
# (дверь 6'-8", окна 4'-6" над полом). Западный торец — вход, восточный — раздвижные двери на
# патио, северной торец — эркер 2'-6" x 7'-8" (прямоугольный, свой скат выше карниза), южный торец —
# трёхгранный эркер глубиной 2' (600 мм) с гранями 45° — размечен ОДНИМ окном на плоскости торца,
# боковые грани и скат эркера — в cut (правило «эркер глубиной ~0,6 м — элемент на плоскости»).
# Контур первого этажа — 16 сторон по часовой от запада: вход (западный торец) 324 pt (18'), северная
# стена западного рукава 207.8 (внутренний угол), западная стена северного рукава 207.8, торец
# северного рукава: запад 93, эркер (запад 45 / фронт 138 / восток 45), восток 93, восточная стена
# северного рукава 207.8, северная стена восточного рукава 207.8, восточный торец 324, южная стена
# восточного рукава 207.8, восточная стена южного рукава 207.8, южный торец 324, западная стена южного
# рукава 207.8, южная стена западного рукава 207.8. Невязка 0 pt по обеим осям (стены рукавов
# на листе 11.5'; план — 12').
# Крыша (gf#336); свесы — с чертежа (gf#451), строка у `overhang_m`.
id = "ffh-halfstory"
pdf = "Halfstory House - Blueprints - Jay Osborne.pdf"
roof = "двускатная 10:12 (кедровая дранка), конёк север-юг +13'-2, поперечные щипцы 10:12 на торцах рукавов; эркеры — свои скаты"
roof_kind = "gable"
pitch_deg = 39.8
# свес: карнизный — Ф. FRONT (W) стр. 5, кончики карниза на 20,4 pt за стеной (648,0/972,0 pt), 18 pt/фут = 0,35 м; фронтонный — Ф. LEFT SIDE (N) стр. 6, 19,8 pt = 0,33 м (главный объём — рукава)
overhang_m = 0.35
gable_overhang_m = 0.35
overhang_by = "drawing"
part_roofs = [  # свои крыши частей (gf#431), часть — под серединой x на виде side
  { side = 1, x = [972.0, 1180.0], kind = "gable", pitch_deg = 39.8, down = 1 },  # западный рукав: конёк поперёк основного, щипец на торце (FRONT ELEVATION)
  { side = 9, x = [440.0, 648.0], kind = "gable", pitch_deg = 39.8, down = 9 },  # восточный рукав: то же (REAR ELEVATION)
]
unit = "ft"
pt_per_unit = 18.0          # SCALE: 1/4" = 1'-0"
material = "siding"       # CLAPBOARD SIDING
plinth = 1.0           # пояс кирпичного фундамента (BRICK VENEER @ FOUNDATION) под линией пола
plinth_material = "brick"
trim_material = "wood"
floor_heights = [4.6667]   # MAIN ROOF EAVE +4'-8" над FLOOR LEVEL — один этаж стен до карниза
cut = ["west, east: козырьки над дверями (FRONT DOOR AWNING, BACK DOOR AWNING), металлические трубы выше конька",
       "south: боковые грани и скат эркера (грани под 45°)",
       "rear, front: боковые грани южного эркера видны с ребра",
       "north-bay: скат эркера над рамой",
       "east: окно ванной по желанию (пунктир, примечание 5) на восточной стене южного рукава",
       "all: ступени и патио не размечены; щипцы без вентрешёток"]
absent = ["все стороны: нет карнизной полосы — карниз без отдельной доски на листе",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой"]

