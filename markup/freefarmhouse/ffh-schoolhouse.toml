# Tiny Schoolhouse — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Один класс 12'x12' на столбах. Спереди по центру — выступ 6' шириной и 1' глубиной вокруг
# двери, он поднимается над карнизом в купол со своим фронтоном: в разметке его нет (хозяин
# 25.10: пилястр там нет), дверь — на плоскости фасада; выступ и козырёк — в cut.
id = "ffh-schoolhouse"
pdf = "Schoolhouse - Blueprints and Renderings - Jay Osborne 2023-09-08.pdf"
roof = "двускатная 10/12, фальцевая; над входом купол 10/12 (CUPOLA EAVE +11'-5\")"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"; дверь 80" = 120 pt, стена 12' = 216 pt
material = "siding"       # 4-6" FIBER CEMENT CLAPBOARD
plinth_ft = 1.5           # обшивка до 18 pt под FLOOR +0, ниже до земли 6" MIN (вид справа)
plinth_material = "concrete"   # NOTE 3 FOUNDATION: 12x12 CONCRETE PIERS OR REINFORCED BRICK; на виде — гладкая полоса под обшивкой (gf#245)
trim_material = "wood"    # 1x6 FASCIA BOARD под карнизом (NOTE 7, TRIM: SOLID WOOD OR FIBER CEMENT)
floor_heights_ft = [6.8333]   # EAVE +6'-10"
cut = ["front: выступ 6'x1' вокруг двери от земли до карниза",
       "front: выступ-купол над входом выше карниза (фронтон, вентрешётка ATTIC VENT)",
       "front: козырёк с кронштейнами над дверью — выше карниза",
       "front: деревянная ступень и мощение у входа",
       "rear: треугольная вентрешётка во фронтоне",
       "right, left: выступ входа и козырёк в профиле за углом стены",
       "right, left: скат кровли и купол"]
absent = ["front, rear: нет карнизной полосы — щипцовые стены, на отметке карниза горизонтальной линии нет",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой CLAPBOARD SIDING"]

