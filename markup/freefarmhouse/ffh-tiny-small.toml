# Tiny Farmhouse, Smallest Version — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Двухэтажный квадрат на столбчатом фундаменте; вход с юга под портиком на двух колоннах,
# сзади дверь со ступенями. Восточная стена глухая (окно — по желанию, пунктиром — не размечено).
# Стена по углам обшивки — 277.5 pt = 15'-5.5"; на плане 16'-0" (до каркаса? не сверено).
id = "ffh-tiny-small"
pdf = "Tiny Farmhouse - Blueprints - both versions.pdf"
roof = "двускатная 7.5/12, фальцевая; портик с фронтоном над входом"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"; EAVE +17'-3" = 310.5 pt над FF1, дверь 84" = 126 pt
material = "siding"       # CLAPBOARD SIDING
plinth_ft = 2.1667        # линия земли под кирпичным цоколем — 39 pt под FF1 (на листе «18-24"»)
floor_heights_ft = [9.0, 8.25]   # FF2 +9'-0", EAVE +17'-3"
cut = ["west, east: фронтон с вентрешёткой", "south, north: скат кровли",
       "south: колонны портика", "north: ступени у задней двери",
       "west, east: портик и ступени за углом стены",
       "east: окно по желанию (пунктир, примечание 5)"]

