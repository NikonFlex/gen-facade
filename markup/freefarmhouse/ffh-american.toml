# American Farmhouse — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Лист 17x11", масштаб 1/4" = 1'-0": дверь 36x84 = 54x126 pt, отметки 1ST FLOOR / 2ND FLOOR /
# ROOF EAVE через 180 pt (10'-0") — сходится. Стена по наружным угловым доскам: 581.5 pt = 32'-4"
# и 293.7 pt = 16'-4" (план — 32'x16' по каркасу, лишние ~2" на сторону — обшивка).
# Два полных этажа, карниз +20'-0"; кирпичная труба на западной стене; крыльцо во всю южную стену.
id = "ffh-american"
pdf = " Drawing Set - American Farmhouse - Jay Osborne.pdf"
roof = "двускатная 12/12, коньком вдоль; кирпичная труба у западного щипца; навес крыльца 4/12"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"
material = "siding"       # CLAPBOARD SIDING
plinth_ft = 2.5           # APPROX. GRADE -2'-6", кирпичный фундамент
plinth_material = "brick" # BRICK FOUNDATION: от чистого пола 627.6 до земли 672.6 на всех листах
trim_material = "wood"    # FRIEZE BOARD под карнизом (gf#245)
floor_heights_ft = [10.0, 10.0]   # 2ND FLOOR +10'-0", ROOF EAVE +20'-0"
cut = ["west: фронтон с вентрешёткой, труба выше карниза",
       "east: фронтон с вентрешёткой",
       "south, north: кирпичная труба в профиль — за углом стены",
       "west, east: крыльцо и задний навес в профиль — за углом стены",
       "south: ступени крыльца", "north: деревянные ступени у задней двери",
       "south, north: доски-обрамления окон (window surround) — по раме окна"]

