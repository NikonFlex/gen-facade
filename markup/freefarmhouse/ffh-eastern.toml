# Eastern Farmhouse — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180, gf#199 — та же лицензия.
# Лист 22x17", масштаб 1/4" = 1'-0" (18 pt/фут): дверь 36x80 = 54x120 pt (стр. 7, 9), стена
# по наружным угловым доскам 647.3 pt = 35'-11.6" и 431.2 pt = 23'-11.6" — план 36'x24' (стр. 2).
# Два этажа: 2ND FLOOR +9'-11", ROOF EAVE / ATTIC FLOOR +19'-11"; чердак под скатом — не этаж.
# Контур — прямоугольник: эркер столовой на восточной стене (18x72 SIDE BAY WINDOW, выступ
# ~2'-0" ≈ 0,6 м, своя низкая крыша) по правилам gf#199 — элемент на плоскости фасада, не стороны.
# Наружные кирпичные трубы у западной и восточной стен; крыльцо во всю южную стену, портик у
# северной двери.
id = "ffh-eastern"
pdf = "Eastern Farmhouse - Architectural Plans.pdf"
roof = "двускатная 10/12, коньком вдоль длинной стороны, фальцевая; навес крыльца 3/12, портик с фронтоном, крыша эркера 3/12"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"
material = "siding"       # CLAPBOARD SIDING
plinth_ft = 1.85          # FINISH GRADE у стены ~1'-10" под 1ST FLOOR (кирпичный цоколь)
floor_heights_ft = [9.917, 10.0]   # 2ND FLOOR +9'-11", ROOF EAVE +19'-11"
cut = ["west, east: фронтон с вентрешётками (attic vent), трубы выше карниза",
       "south, north: кирпичные трубы в профиль — за углом стены",
       "south: эркер в профиль — за углом стены",
       "west, east: крыльцо и портик в профиль — за углом стены",
       "south: кирпичные ступени крыльца; north: столбы портика (стоят перед стеной)",
       "east: эркер — выступ ~2'-0\", размечен окнами и козырьком на плоскости стены",
       "south: боковые фрамуги над окнами-сайдлайтами — одной фрамугой двери"]

