# Lone Star Farmhouse ("the tiniest 2-story farmhouse") — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Контур 20'x12', пол по плите; спереди (торец) крыльцо 5' во всю ширину под своей крышей на
# столбах, сзади патио и козырёк над дверью. Второй этаж — мансарда с коленом стены 3'-9" (пол
# +7'-11", карниз +11'-8"): по правилу разметки не этаж, как спальный чердак Thoreau; окна
# мансарды в торцах — во фронтонах. Стены — по наружным угловым доскам (1x4).
id = "ffh-lone-star"
pdf = "Lone Star Farmhouse - Blueprints - Jay Osborne-2.pdf"
roof = "двускатная 12/12, фальцевая; крыша крыльца 3/12, козырёк над задней дверью"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"; дверь 80" = 120 pt, торец 12' = 216 pt, бок 20' = 360 pt
material = "siding"       # 6" FIBER CEMENT OR WOOD CLAPBOARDS
plinth_ft = 0.75          # FLOOR +0'-0" на 13,5 pt над линией земли/фундамента у стены
floor_heights_ft = [11.6667]   # GABLE EAVE +11'-8"; FLOOR 2 +7'-11" — мансарда, не этаж
cut = ["front: окно 6/6 во фронтоне (заходит за карниз)", "rear: окно 2/2 во фронтоне (заходит за карниз)",
       "front: столбы с кронштейнами и низкие перила крыльца",
       "right: звезда-стяжка (декор) на стене", "right, left: крыльцо и козырёк задней двери за углами",
       "right, left: скат кровли"]

