# Lone Star Farmhouse ("the tiniest 2-story farmhouse") — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Контур 20'x12', пол по плите; спереди (торец) крыльцо 5' во всю ширину под своей крышей на
# столбах, сзади патио и козырёк над дверью. Второй этаж — мансарда с коленом стены 3'-9" (пол
# +7'-11", карниз +11'-8"): по правилу разметки не этаж, как спальный чердак Thoreau; окна
# мансарды в торцах — во фронтонах, размечены целиком (gf#321): окно спереди заходит за карниз;
# силуэт `outline` — по внутренней кромке наличника ската (без свеса), скат 12/12. Стены — по наружным угловым доскам (1x4).
# Крыша (gf#336): свес — по умолчанию ([spec.roof_shape], на листе не подписан).
id = "ffh-lone-star"
pdf = "Lone Star Farmhouse - Blueprints - Jay Osborne-2.pdf"
roof = "двускатная 12/12, фальцевая; крыша крыльца 3/12, козырёк над задней дверью"
roof_kind = "gable"
pitch_deg = 45.0
overhang_m = 0.4
unit = "ft"
pt_per_unit = 18.0          # SCALE: 1/4" = 1'-0"; дверь 80" = 120 pt, торец 12' = 216 pt, бок 20' = 360 pt
material = "siding"       # 6" FIBER CEMENT OR WOOD CLAPBOARDS
plinth = 0.75          # FLOOR +0'-0" на 13,5 pt над линией земли/фундамента у стены
plinth_material = "concrete"   # плоский фундамент-плита без рисунка, FOUNDATION DETAILS: SEE PAGE 59 (gf#245)
trim_material = "wood"    # карнизная доска под скатом на боковых стенах (gf#245)
floor_heights = [11.6667]   # GABLE EAVE +11'-8"; FLOOR 2 +7'-11" — мансарда, не этаж
cut = ["front: столбы с кронштейнами и низкие перила крыльца",
       "right: звезда-стяжка (декор) на стене", "right, left: крыльцо и козырёк задней двери за углами",
       "right, left: скат кровли"]
absent = ["front, rear: нет карнизной полосы — щипцовые стены, линии на отметке карниза нет, обшивка идёт в щипец",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой CLAPBOARDS"]

