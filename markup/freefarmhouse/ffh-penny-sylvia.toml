# Penny & Sylvia's Farmhouse (50 Starter Farmhouses) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия,
# целиком (части разной высоты) — gf#323.
# Листы: планы — стр. 2 (1/16" = 1'-0"), фасады — стр. 3 (FRONT, LEFT SIDE, RIGHT SIDE, BACK),
# масштаб 1/16" = 4.5 pt/ft; сверено: FF1–FF2 10' = 45 pt, EAVE +18'-9" = 84.4 pt, дверь 36x80" = 13.5x30 pt.
# Модульный дом: передний объём 40' x 18' (левый модуль 8' + ядро 24' + правый модуль 8') под
# двускатной крышей 10/12 с коньком вдоль восток-запад (RIDGE +26'-10", EAVE +18'-9") и задний
# модуль 24' x 16' по центру (контур — Т). Задний модуль: восточная половина (12') — два этажа со
# своим щипцом (конёк с севера на юг, EAVE +18'-9"), западная половина (12') — один этаж под
# односкатной крышей 4/12 (стена +8'-1", кромка кровли у 2-го этажа +12'-8"). Крыльцо входа спереди
# (4') и заднее крыльцо-стойка — вне стен.
# Контур первого этажа по часовой от юга: юг 181.5 pt (40'), запад левого модуля 82.5 (18'), север
# левого модуля 36.7 (8', внутренний угол), запад заднего модуля 72 (16'), север заднего модуля 107.5
# (24', щипец + низкая половина — одна сторона со ступенчатым силуэтом), восток заднего модуля 72
# (внутренний угол), север правого модуля 37.3, восток правого модуля 83.1. Невязка: x 0, y −0.6 pt.
# Стены по наружным угловым доскам. Отметки FF1 снимались с каждого вида: стены ступеней и
# 2-го этажа, отодвинутые вглубь (стена 2-го этажа спальни над низкой половиной сзади, стена ядра
# с двумя окнами над низкой кровлей сзади), в сторону 1-го этажа не входят — см. cut.
id = "ffh-penny-sylvia"
pdf = "Penny-Sylvia Blueprints.pdf"
roof = "двускатная 10/12 по всему фронту, задний модуль: щипец 10/12 над двухэтажной половиной и односкатная 4/12 над одноэтажной"
pt_per_ft = 4.5           # SCALE: 1/16" = 1'-0"
material = "siding"       # лицевая обшивка по листу (горизонтальная)
plinth_ft = 2.2           # FF1 над низом фундамента (кирпичный пояс): 9.9 pt на всех видах
plinth_material = "brick" # розовый кирпичный пояс под обшивкой
trim_material = "wood"    # карнизная доска
floor_heights_ft = [10.0, 8.75]   # 2ND FLOOR +10'-0", ROOF EAVE +18'-9" — основной (высокий) объём
cut = ["south, west, north, east: фронтоны — вентрешётки и верх щипцов",
       "south: фонарь над дверью, ступени и площадка входа, крыльцо 4' под козырьком слева на виде LEFT SIDE",
       "west-back: стена 2-го этажа спальни (отступает на 11.5' вглубь, окно 2-го этажа 25x49\") над низкой кровлей",
       "north-back: стена 2-го этажа ядра на 16' глубже, два окна 25x49\" над скатом 4/12",
       "north-back: ступени и площадка заднего входа, скат над ними",
       "all: трубы и вентиляционная труба выше крыши, ставни окон с ребра"]
absent = ["west, east, north-back: нет карнизной полосы на щипцовых стенах",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой"]

