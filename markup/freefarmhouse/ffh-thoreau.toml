  { cls = "door", box = [183.6, 299.8, 235.4, 419.8], variant = { kind = "glazed" } },
  { cls = "canopy", box = [170.4, 276.4, 248.6, 298.7] },
  { cls = "window", box = [194.5, 211.7, 224.5, 247.7], variant = { cols = 2, rows = 2 } },   # створчатое окно во фронтоне (gf#321)
]
