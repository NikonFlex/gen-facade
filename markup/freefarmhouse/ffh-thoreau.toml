# Thoreau Cabin (tiny house) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Лист Letter, но масштаб 1/4" = 1'-0" настоящий: шаг обшивки 9 pt = 6", дверь 80" = 120 pt.
# Крыша (gf#336); свесы — с чертежа (gf#451), строка у `overhang_m`.
id = "ffh-thoreau"
pdf = "Thoreau Blueprints 2024-11-24 By Jay Osborne.pdf"
roof = "двускатная 10/12, спальный чердак; кирпичные столбы"
roof_kind = "gable"
# труба: Ф. левый стр. 5, центр ~414 pt (стена 425–728 pt), металлическая (METAL CHIMNEY) снаружи у заднего торца, чуть за углом стены; на заднем виде стр. 5 — по оси щипца
chimney = { side = 1, x = 414 }
pitch_deg = 39.8
# свес: карнизный — Ф. фронт стр. 4, кончики карниза на 15,5 pt за стеной (96,6/322,4 pt), 18 pt/фут = 0,26 м; фронтонный — Ф. левый стр. 5, 7,6 pt = 0,13 м
overhang_m = 0.25
gable_overhang_m = 0.15
overhang_by = "drawing"
unit = "ft"
pt_per_unit = 18.0          # SCALE: 1/4" = 1'-0"
material = "wood"         # CEDAR BEVEL SIDING
plinth = 1.32          # земля у входа — FIN. FLOOR +0'-0"
plinth_material = "brick" # BRICK PIER (на листе: «могут быть простым бетоном»), между столбами — открытое подполье (gf#245)
trim_material = "wood"    # 1x8 FASCIA BD под кровлей, на боковых стенах (gf#245)
floor_heights = [8.3333]   # EAVE +8'-4"
cut = ["front: ступень", "rear: труба дымохода выше карниза"]
absent = ["front, rear: нет карнизной полосы — щипцовые стены, горизонтальной линии на отметке карниза нет (1x8 FASCIA BD идёт по скату)",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой CEDAR BEVEL SIDING"]

