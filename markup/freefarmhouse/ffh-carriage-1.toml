# Carriage House 1 (the option with a 2-car garage) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Контур 16'x24' без выступов: внизу гараж на 1 машину, наверху жильё — фасады целиком, 2 этажа.
# Вход в жильё — с левого бока (LEFT ELEVATION (FRONT OF RESIDENCE)), ворота — на торце.
# Подпись SCALE у торцов — 1/8", но торцы начерчены в 1/4": стена 16' = 288 pt, как на плане.
id = "ffh-carriage-1"
pdf = "Carriage House 1 - Blueprints - Jay Osborne.pdf"
roof = "двускатная 7.5/12, фальцевая кровля"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"; дверь 36x80" = 54x120 pt, стена 24' = 432 pt
material = "siding"       # FIBER CEMENT CLAPBOARD
plinth_ft = 0.0           # SLAB +0'-0" у ворот — на уровне земли
floor_heights_ft = [9.0, 8.25]   # 2ND FLOOR +9'-0", ROOF EAVE +17'-3"
cut = ["front: вентиляционная решётка во фронтоне", "rear: вентиляционная решётка во фронтоне",
       "front: фонари над воротами и дверью x3", "left: фонарь над дверью",
       "left: площадка входа LANDING +0'-8\"",
       "left/rear: козырьки соседних сторон в профиле"]

