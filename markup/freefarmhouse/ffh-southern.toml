# Southern Farmhouse — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180, gf#199 — та же лицензия.
# Лист 11x8.5" — уменьшенный вдвое лист 22x17" с подписью SCALE 1/4" = 1'-0": на этом PDF 9 pt/фут.
# Проверка: дверь 36x80 = 27x60 pt (стр. 10), ROOF EAVE +21'-2" над 1ST FLOOR = 190.5 pt — сходится;
# стена по угловым доскам 378.8 pt = 42'-1" и 252.7 pt = 28'-1" — план 42'x28' (стр. 5).
# Два этажа: 2ND FLOOR +10'-11", ROOF EAVE +21'-2"; чердак под скатом — не этаж.
# Контур — прямоугольник: двухэтажный эркер столовой на восточной стене выступает на 18" (0,46 м) —
# по правилам gf#199 элемент на плоскости фасада. Двухэтажная галерея во всю южную стену, сетчатые
# веранды (screen porch) у западной (Sunset) и восточной (Breakfast) стен — на столбах, не стены.
id = "ffh-southern"
pdf = "Drawing Set - Southern Farmhouse - Jay Osborne 2023-02-01.pdf"
roof = "двускатная 10/12, коньком вдоль длинной стороны, фальцевая; галерея под вальмовой 3/12, сетчатые веранды под односкатными 2.5/12"
pt_per_ft = 9.0           # SCALE 1/4" = 1'-0" на листе 22x17", PDF уменьшен до 11x8.5"
material = "siding"       # CLAPBOARD SIDING
plinth_ft = 2.0           # APPROX. 24" [600] от земли до чистого пола, кирпичные столбы
plinth_material = "brick" # BRICK FOUNDATION (+ WATER TABLE BOARD — доска над кирпичом, не зона) (gf#245)
trim_material = "wood"    # FASCIA + FRIEZE BOARD под карнизом (gf#245)
floor_heights_ft = [10.917, 10.25]   # 2ND FLOOR +10'-11", ROOF EAVE +21'-2"
cut = ["west, east: фронтон с вентрешёткой (attic vent), труба выше карниза",
       "south, north: сетчатые веранды и эркер в профиль — за углом стены",
       "west, east: двухэтажная галерея в профиль — за углом стены",
       "south: столбы и перила галереи (стоят перед стеной), кирпичные ступени",
       "west: стена 1-го этажа за сеткой Sunset Porch на листе не нарисована — проёмы за ней не размечены",
       "east: стена 1-го этажа за сеткой Breakfast Porch — только дверь кухни, видная сквозь сетку",
       "east: крыша эркера у карниза, филёнки под окнами эркера",
       "north: наличник двери (door surround) — по коробке двери"]
absent = ["south: карнизная полоса на отметке карниза — это фасция и балка крыши галереи, уже в canopy",
          "west, east: нет карнизной полосы — щипцовые стены, горизонтальной линии нет (только возвраты карниза в углах и крыша эркера)",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой CLAPBOARD SIDING"]

