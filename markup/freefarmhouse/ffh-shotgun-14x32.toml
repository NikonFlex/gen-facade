# 14x32 Shotgun House — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Контур 14'x32' на столбчатом фундаменте; спереди крыльцо во всю ширину под своей крышей
# (вариант A, викторианский), сзади ступени и козырёк над дверью. Двери — с фрамугой.
id = "ffh-shotgun-14x32"
pdf = "Shotgun 14x32 Blueprints 2024-02-01.pdf"
roof = "двускатная 7.5/12, фальцевая; крыша крыльца 2.5/12, козырёк над задней дверью"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"; дверь 36"x80" = 54x120 pt, стена 14' = 252 pt
material = "siding"       # CLAPBOARD SIDING
plinth_ft = 2.0           # низ кирпичных столбов на виде спереди и сзади — 36 pt под FIN. FLOOR
plinth_material = "brick" # кирпичные столбы (кладка нарисована) с гладкой стенкой между ними — материал стенки на листе не назван (gf#245)
trim_material = "wood"    # карнизная доска под скатом на боковых стенах (gf#245)
floor_heights_ft = [9.1667]   # EAVE +9'-2"
cut = ["front: фронтон с вентрешёткой", "rear: фронтон с вентрешёткой",
       "left, right: скат кровли", "front: столбы и кронштейны крыльца",
       "front: ступени крыльца", "rear: ступени у задней двери",
       "left, right: крыльцо и ступени за углом стены"]
absent = ["front, rear: нет карнизной полосы — щипцовые стены, на отметке карниза горизонтальной линии нет (у front — только антаблемент крыши крыльца)",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой CLAPBOARD SIDING"]

