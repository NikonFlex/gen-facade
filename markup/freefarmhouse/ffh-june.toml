# Backyard Farmhouse, June's version (simple & economical) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Лист Letter, масштаб 1/8" = 1'-0": стена 28'-0" = 252 pt, 16'-0" = 144 pt, дверь 36x84 = 27x63 pt,
# окно 32x60 = 24x45 pt — сходится. Корпус 16'x28', крыльцо 5'-8" у входа (запад) под своим навесом.
# Подписи листа A2.1 перепутаны: «WEST ELEVATION» там — восточный фасад (раздвижная дверь G и
# окно 3 по плану A1.1), «SOUTH ELEVATION» — северный (глухая стена, крыльцо справа).
# Полутораэтажный: 2-й этаж (+8'-4") под скатом, стена до карниза +11'-6" — один этаж до карниза.
id = "ffh-june"
pdf = "June - Blueprints - Backyard Farmhouse - Jay Osborne.pdf"
roof = "двускатная 10/12, коньком вдоль; дормеры 4/12 на юге и севере; мансарда; навес крыльца 3/12"
pt_per_ft = 9.0           # SCALE: 1/8" = 1'-0"
material = "siding"       # CLAPBOARD SIDING (fiber cement); фронтоны — диагональная вагонка
plinth_ft = 0.75          # земля у стены 406.3 pt, 1ST FLOOR +0'-0" — 399.6 pt
floor_heights_ft = [11.5]     # EAVE +11'-6"; мансарда (2ND FLOOR +8'-4") — не этаж
cut = ["west: окно мансарды во фронтоне", "east: окно мансарды во фронтоне",
       "south: дормер с окном", "north: дормер с окном",
       "north: два возможных окна (пунктир, note 4) — не размечены",
       "south, north: крыльцо в профиль — за углом стены",
       "south, north: козырёк восточной двери в профиль — за углом стены",
       "водосточные трубы, фонарь у входа"]

[[sides]]
view = "WEST ELEVATION (FRONT)"
page = 7
wall = [140.0, 284.0]
floor = 399.6
elements = [
  { cls = "door", box = [167.0, 336.6, 194.0, 399.6], variant = { kind = "glazed" } },
  { cls = "window", box = [231.5, 336.6, 255.5, 381.6], variant = { cols = 2, rows = 2 } },
