# Backyard Farmhouse, April's version (classic & elongated) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Лист Letter, масштаб 1/8" = 1'-0": стена 32'-0" = 288 pt, 16'-0" = 144 pt, дверь 36x84 = 27x63 pt,
# окно 32x60 = 24x45 pt, RIDGE +19'-0" = 171 pt над FF1 — сходится.
# Полутораэтажный: 2-й этаж (+8'-4") под скатом, стена до карниза +11'-6" — один этаж до карниза,
# окна мансарды — во фронтонах, срезаны. Крыльцо во всю южную стену.
id = "ffh-april"
pdf = "April - Blueprints - Backyard Farmhouse - Jay Osborne.pdf"
roof = "двускатная 10/12, фронтоны 14/12 над югом и севером; мансарда; навес крыльца 3/12"
pt_per_ft = 9.0           # SCALE: 1/8" = 1'-0"
material = "siding"       # CLAPBOARD SIDING (fiber cement)
plinth_ft = 0.75          # земля у угла ~406 pt, FF1 +0'-0" — 399.6 pt
floor_heights_ft = [11.5]     # EAVE +11'-6"; мансарда (2ND FLOOR +8'-4") — не этаж
cut = ["south: окно мансарды во фронтоне со ставнями",
       "north: окно мансарды во фронтоне со ставнями",
       "west: окно мансарды во фронтоне со ставнями (низ чуть ниже карниза)",
       "east: окно мансарды во фронтоне со ставнями (низ чуть ниже карниза)",
       "north: возможная дверь (пунктир, note 5) — не размечена",
       "west, east: крыльцо в профиль — за углом стены",
       "south, north: козырёк восточной двери в профиль — за углом стены",
       "водосточные трубы"]

