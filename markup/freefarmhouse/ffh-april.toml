# Backyard Farmhouse, April's version (classic & elongated) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Лист Letter, масштаб 1/8" = 1'-0": стена 32'-0" = 288 pt, 16'-0" = 144 pt, дверь 36x84 = 27x63 pt,
# окно 32x60 = 24x45 pt, RIDGE +19'-0" = 171 pt над FF1 — сходится.
# Полутораэтажный: 2-й этаж (+8'-4") под скатом, стена до карниза +11'-6" — один этаж до карниза,
# окна мансарды — во фронтонах выше карниза (gf#321), силуэт `outline` — по внутренней кромке
# наличника ската (без свеса). Фронтон юга и севера — 14/12, поперечный над главным скатом.
# Крыльцо во всю южную стену.
# Крыша (gf#336): свес — по умолчанию ([spec.roof_shape], на листе не подписан).
id = "ffh-april"
pdf = "April - Blueprints - Backyard Farmhouse - Jay Osborne.pdf"
roof = "двускатная 10/12, фронтоны 14/12 над югом и севером; мансарда; навес крыльца 3/12"
roof_kind = "gable"
pitch_deg = 39.8
overhang_m = 0.4
unit = "ft"
pt_per_unit = 9.0           # SCALE: 1/8" = 1'-0"
material = "siding"       # CLAPBOARD SIDING (fiber cement)
plinth = 0.75          # земля у угла ~406 pt, FF1 +0'-0" — 399.6 pt
plinth_material = "concrete"  # «A slab» (note 3): плита, кромка 401.8–406.4 под плинтусной доской; подписи материала нет
trim_material = "wood"    # TRIM: WOOD OR FIBER CEMENT — карнизная полоса и наличники
floor_heights = [11.5]     # EAVE +11'-6"; мансарда (2ND FLOOR +8'-4") — не этаж
absent = ["west, east: карниза нет — щипцовые стены, только свесы кровли по скату"]
cut = ["north: возможная дверь (пунктир, note 5) — не размечена",
       "west, east: крыльцо в профиль — за углом стены",
       "south, north: козырёк восточной двери в профиль — за углом стены",
       "водосточные трубы"]

