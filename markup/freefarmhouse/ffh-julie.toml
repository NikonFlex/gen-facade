# Backyard Farmhouse, вариант Julie (гараж и спальня-люкс) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия,
# целиком (части разной высоты, перепад земли) — gf#323.
# Листы: планы — стр. 4 (A1.0) и 5 (A1.1), фасады — стр. 7 (WEST, SOUTH) и стр. 8 (EAST, NORTH),
# 1/8" = 1'-0" (9 pt/ft); сверено: RIDGE +19'-0" = 171 pt над FF1, FF1–FF2 8'-4" = 75 pt, дверь 36x84".
# Устройство: прямоугольник 24' x 26' — главный объём 24' x 16' под двускатной крышей 10/12 (конёк
# восток-запад, EAVE +11'-6", ridge +19'-0") с передним щипцом 14/12 по центру юга и сзади пристройка
# 24' x 10' (спальня-люкс, ванная) под односкатной крышей 4/12 с плитой +8'-0" (одноэтажная) и
# шед-дормером над ней; спереди крыльцо 8' на столбах под своей walk-крышей. Стены пристройки и
# главного объёма в одной плоскости: запад и восток — по одной стороне со ступенчатым силуэтом.
# Верхний этаж — мансардный (3'-2" стены над FF2 +8'-4"), этажей 2.
# Перепад земли: у западной стены земля на −9' (BASEMENT T.O. SLAB, гараж 2 машины + вход); у юга,
# севера и востока земля у FF1 на −2' (кирпичный пояс 2'): plinth = 2.0 для них. На западной
# стороне гаражные ворота 8' x 7' и дверь размечены на своих отметках ниже FF1 (y ниже нуля стены:
# сборщик их срежет), силуэт западной стены идёт от −9'. Ступеньки и пандус участка — в cut.
# Длины: юг 217.6 pt (24'), запад 234.0 (26'), север 217.5, восток 234.0. Невязка 0.
# Крыша (gf#336): свес — по умолчанию ([spec.roof_shape], на листе не подписан).
id = "ffh-julie"
pdf = "Julie - Blueprints - Backyard Farmhouse - Jay Osborne.pdf"
roof = "двускатная 10/12 стоячий фальц, передний щипец 14/12; сзади односкатная 4/12 и шед-дормер 3/12; крыльцо — walk-скат 3/12"
roof_kind = "gable"
pitch_deg = 39.8
overhang_m = 0.4
roof_gaps = ["составная: двускатная ядра, передний щипец 14/12, сзади односкатная 4/12 -> одна двускатная"]
unit = "ft"
pt_per_unit = 9.0           # SCALE: 1/8" = 1'-0"
material = "siding"       # 4-6" fiber cement clapboard
plinth = 2.0           # земля у юга/севера/востока на −2' под FF1; запад — −9' (см. шапку)
plinth_material = "brick" # BRICK VENEER на фундаменте
trim_material = "wood"
floor_heights = [8.3333, 3.1667]   # FF2 +8'-4", EAVE +11'-6" — главный объём
cut = ["south, west: крыльцо 8' с шестью столбами 6x6, перилами, ступенями и walk-скатом 3/12",
       "west: навес над дверью (DOOR CANOPY 6/A5.1) и кирпичные пилястры гаража",
       "west, south: ступени, подпорная стена и гравийные полосы участка",
       "north: шед-дормер 3/12 с окном над кровлей пристройки (стена в 10' глубже плоскости стены) и скат над ней",
       "west, east: скат дормера, окно мансарды в стене дормера не видно с боковых фасадов",
       "south: фонарь над дверью и перила крыльца перед окнами 1-го этажа",
       "all: водосточные трубы, ставни окон мансарды видны с ребра"]
absent = ["west, east: нет карнизной полосы на щипцовых стенах главного объёма",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой"]

