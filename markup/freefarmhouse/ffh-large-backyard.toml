# Backyard Farmhouse, original version (large 16'x32') — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Лист «messy draft» 22x17", масштаб 1/2" = 1'-0": стена 32'-0" = 1152 pt, дверь 36x84 = 108x252 pt,
# окно 32x60 = 96x180 pt, верх окон HEAD +7'-0" = 252 pt над чистым полом — сходится.
# Полутораэтажный: 2-й этаж (+8'-4") под скатом, стена до карниза +11'-6" — один этаж до карниза,
# окна мансарды во фронтонах размечены (gf#321), окно дормера срезано. Крыльцо во всю южную стену.
# Крыша (gf#336); свесы — с чертежа (gf#451), строка у `overhang_m`.
id = "ffh-large-backyard"
pdf = "Large Backyard Farmhouse - Blueprints - messy draft.pdf"
roof = "двускатная 10/12 с фронтоном 14/12 над входом, дормер на севере; мансарда; навес крыльца 3/12"
roof_kind = "gable"
pitch_deg = 39.8
# свес: карнизный — Ф. запад стр. 7, кончики карниза на 30 pt за стеной (385,3/961,3 pt), 36 pt/фут = 0,25 м; фронтонный — Ф. юг стр. 6, 9,7 pt = 0,08 м
overhang_m = 0.25
gable_overhang_m = 0.10
overhang_by = "drawing"
unit = "ft"
pt_per_unit = 36.0          # SCALE: 1/2" = 1'-0"
material = "siding"       # CLAPBOARD SIDING
plinth = 0.8333        # земля у стены ~10" ниже 1ST FLOOR +0'-0" (линия 921.8 pt на северном фасаде)
plinth_material = "concrete"  # CONCRETE SLAB (notes листа 3): кромка плиты 900.8–921.8 под плинтусной доской; подписи на фасаде нет
trim_material = "wood"    # карнизная доска и фриз под свесом (gf#245)
absent = ["west, east: карниза нет — щипцовые торцы, горизонтальной полосы на отметке карниза нет",
          "south: под фронтоном над входом карниза нет — стена фронтона идёт до свеса, полоса только по краям"]
floor_heights = [11.5]     # ROOF EAVE +11'-6"; мансарда (2ND FLOOR +8'-4") — не этаж
cut = ["north: дормер с окном",
       "west: ступень боковой двери (side stoop)",
       "west, east: крыльцо в профиль — за углом стены",
       "north: козырёк боковой двери в профиль — за углом стены",
       "south: водосточные трубы"]

