# Backyard Farmhouse, original version (large 16'x32') — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Лист «messy draft» 22x17", масштаб 1/2" = 1'-0": стена 32'-0" = 1152 pt, дверь 36x84 = 108x252 pt,
# окно 32x60 = 96x180 pt, верх окон HEAD +7'-0" = 252 pt над чистым полом — сходится.
# Полутораэтажный: 2-й этаж (+8'-4") под скатом, стена до карниза +11'-6" — один этаж до карниза,
# окна мансарды — во фронтонах и дормере, срезаны. Крыльцо во всю южную стену.
id = "ffh-large-backyard"
pdf = "Large Backyard Farmhouse - Blueprints - messy draft.pdf"
roof = "двускатная 10/12 с фронтоном 14/12 над входом, дормер на севере; мансарда; навес крыльца 3/12"
pt_per_ft = 36.0          # SCALE: 1/2" = 1'-0"
material = "siding"       # CLAPBOARD SIDING
plinth_ft = 0.8333        # земля у стены ~10" ниже 1ST FLOOR +0'-0" (линия 921.8 pt на северном фасаде)
floor_heights_ft = [11.5]     # ROOF EAVE +11'-6"; мансарда (2ND FLOOR +8'-4") — не этаж
cut = ["south: окно мансарды во фронтоне со ставнями и подоконником",
       "west: окно мансарды во фронтоне со ставнями и подоконником",
       "east: окно мансарды во фронтоне со ставнями и подоконником",
       "north: дормер с окном",
       "west: ступень боковой двери (side stoop)",
       "west, east: крыльцо в профиль — за углом стены",
       "north: козырёк боковой двери в профиль — за углом стены",
       "south: водосточные трубы"]

