# The Barnhouse (carriage house) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Контур 24'x24' с нишей входа 8'x6' под крышей: дверь спроецирована на плоскость фасада.
# Крыша (gf#336): свес — по умолчанию ([spec.roof_shape], на листе не подписан).
# Крыша (gf#336): уклон — по умолчанию ([spec.roof_shape], на листе не подписан).
id = "ffh-barnhouse"
pdf = "Barnhouse - Blueprints - Jay Osborne.pdf"
roof = "гамбрел (ломаная двускатная), купол; второй этаж под крышей"
roof_kind = "gable"
pitch_deg = 35.0
overhang_m = 0.4
roof_gaps = ["гамбрел (ломаная двускатная) -> двускатная: модуль не строит ломаный скат; уклон на листе не подписан"]
roof_down = 1          # скат крыши к стороне 1 (gf#431; была строка roof_gaps)
unit = "ft"
pt_per_unit = 18.0          # SCALE: 1/4" = 1'-0"
material = "siding"       # CLAPBOARD SIDING
plinth = 0.0           # SLAB +0'-0" у ворот — на уровне земли
trim_material = "wood"    # TRIM: WOOD — карнизная доска под свесом боковых стен (gf#245)
floor_heights = [8.9167]   # EAVE +8'-11"
absent = ["all: цоколя нет — обшивка до земли (SLAB на уровне земли), фундамент только пунктиром под землёй",
          "rear, front: карниза нет — торцы гамбрела, горизонтальной полосы на отметке карниза нет"]
cut = ["rear: фонари у двери x2",
       "front: фонарь над воротами", "front: козырёк сена (hay hood)",
       "left: фонарь", "крыша: купол с флюгером"]

