# Oregon Farmhouse — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Модульный набор «50 starter farmhouses» (2025-01-18, first draft, format test): ядро 24'x18',
# двухэтажное, двускатная крыша; у торцов (side 1 и side 3) открытые крыльца 6' под своими
# крышами 4/12 на столбах — вне стены. Стены сняты с листов модулей 1B–4B (1/8"), где ядро
# нарисовано целиком до линии стыка; карниз +18'-9" — с общего листа фасадов (стр. 3, 1/16").
id = "ffh-oregon"
pdf = "Oregon Farmhouse - Blueprints - by Jay Osborne.pdf"
roof = "двускатная 10/12 над ядром; крыши крылец 4/12 у торцов"
pt_per_ft = 9.0           # SCALE: 1/8" = 1'-0"; LEVEL 2 +10' = 90 pt над LEVEL 1, стена 24' = 216 pt
material = "siding"       # SIDING (lap siding на видах)
plinth_ft = 2.0           # столбчатый фундамент: низ столбов ~9 pt под 1ST FLOOR на стр. 3 (1/16")
plinth_material = "concrete"   # столбчатые опоры (на стр. 3 — розовые столбики), FOUNDATION FINISH на листе — XX, материал не назван (gf#245)
trim_material = "wood"    # белая фризовая доска под карнизом (side 4, стр. 8)
floor_heights_ft = [10.0, 8.75]   # 2ND FLOOR +10'-0", ROOF EAVE +18'-9"
cut = ["side 1: фронтон с окном чердака", "side 3: фронтон с окном чердака",
       "side 1: стойки 6x6 и кронштейны крыльца, настил и ступень",
       "side 3: стойки 6x6 крыльца, настил и ступень",
       "side 3: необязательное окно у лестницы (пунктир, OPTIONAL WINDOW @ STAIRS)",
       "side 2, side 4: скат кровли; крыши крылец за углами"]
absent = ["side 1, side 3: нет карнизной полосы — щипцы, на отметке карниза горизонтальной линии нет",
          "side 2: нет карнизной полосы — лист модуля 2B обрезан по линии ROOF: SEE 46, фриза не нарисовано",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой SIDING"]

