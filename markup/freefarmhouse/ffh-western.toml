# Western Farmhouse (Patreon 1st draft, plan set 2024-02-01) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия,
# целиком (части разной высоты) — gf#323.
# Листы: план — стр. 2 (A1.1), фасады — стр. 9 SOUTH, 10 WEST, 11 NORTH, 12 EAST (A2.0–A2.3),
# 1/4" = 1'-0" (18 pt/ft); сверено: FF1–FF2 9'-11" = 178.5 pt (651.0 над 829.5), EAVE +19'-11" = 358.5 pt, дверь 36x80" = 54x120 pt.
# Устройство: двухэтажное ядро 40' x 30' под двускатной крышей 10/12 (конёк восток-запад,
# EAVE +19'-11") с поперечными щипцами 16/12 по центру южной и северной стен; на западе и востоке
# в 1'-6" от северной стены — одноэтажные крылья 8' x 12' (ванная и кладовая) под кровлей 2.5/12 на
# уровне 2ND FLOOR +9'-11" (общая с крыльцом); спереди (юг) крыльцо на столбах 8' во всю ширину и
# на оба крыла, сзади портик над дверью на колоннах.
# Контур 1-го этажа — 12 сторон по часовой от юга: юг ядра 720 pt (40'); запад ядра южнее крыла 297
# (16.5'); юг западного крыла 144 (8', внутренний угол); запад крыла 215.3 (12'); север крыла 144
# (8', внутренний угол); запад ядра севернее крыла 26.2 (1'-6"); север ядра 720; восток севернее
# крыла 27 (внутренний угол); север восточного крыла 144; восток крыла 216; юг восточного крыла 144
# (внутренний угол); восток ядра южнее крыла 297. Невязка по y 1.5 pt, по x 0.
# Окна 2-го этажа и фронтонное окно над крыльями (стена ядра вне контура 1-го этажа) — в cut.
# Материал цоколя на листе не подписан — concrete (не проверено).
# Крыша (gf#336); свесы — с чертежа (gf#451), строка у `overhang_m`.
id = "ffh-western"
pdf = "Western Farmhouse Draft Plan Set 2024-02-01.pdf"
roof = "двускатная 10/12 (фальцевая) с поперечными щипцами 16/12; крылья и крыльцо — навесные скаты 2.5/12"
roof_kind = "gable"
# труба: Ф. юг стр. 9, центр ~431 pt (стена 450–1170 pt), кирпичная у западного торца; вторая — у восточного, x ~1192 pt
chimney = { side = 0, x = 431 }
pitch_deg = 39.8
# свес: карнизный — Ф. восток стр. 12, кончик карниза на 15 pt за стеной (617,1 pt), 18 pt/фут = 0,25 м; фронтонный — Ф. юг стр. 9, 18 pt = 0,30 м
overhang_m = 0.25
gable_overhang_m = 0.30
overhang_by = "drawing"
# Навесные скаты крыльев 2.5/12 (gf#455): низ наружу — к западной стороне 3 и восточной 9; скат прилегает верхом к стене ядра.
part_roofs = [
  { side = 3, x = [520.0, 640.0], kind = "shed", pitch_deg = 11.77, down = 3 },    # западное крыло (ванная)
  { side = 9, x = [960.0, 1080.0], kind = "shed", pitch_deg = 11.77, down = 9 },   # восточное крыло (кладовая)
]
roof_gaps = ["щипцы 16/12 над карнизными стенами строятся (gf#431); крыльцо спереди и портик сзади — отдельных частей без стен нет, не строятся"]
unit = "ft"
pt_per_unit = 18.0          # SCALE: 1/4" = 1'-0"
material = "siding"       # CLAPBOARD SIDING
plinth = 1.0           # FF1 над линией 847.5 pt (низ видимой части фундамента)
plinth_material = "concrete"
trim_material = "wood"    # карнизная доска с торцами стропил (RAFTER TAILS)
floor_heights = [9.9167, 10.0]   # FF2 +9'-11", ROOF EAVE / ATTIC FLOOR +19'-11" — ядро
cut = ["south, north: кирпичные трубы по бокам стены (торчат на 2.5' за плоскость)",
       "south: крыльцо 8' на столбах 8x8 с кирпичными ступенями и кровля крыльца, перила",
       "north: колонны и ступени портика, фронтон портика",
       "west, east: окна 2-го этажа (по одному, 52x91 pt) и фронтонное полукруглое окно над крылом — стена ядра вне контура 1-го этажа",
       "west, east: кровля и столбы крыльца на южном конце, кирпичные ступени",
       "north, south: фонарь и вентрешётки в щипцах не размечены"]
absent = ["west, east: нет карнизной полосы на щипцовых стенах ядра",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой"]

