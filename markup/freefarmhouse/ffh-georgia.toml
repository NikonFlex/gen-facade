# Georgia's Farmhouse (four starter farmhouses) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Контур 24'x26' (по наружным угловым доскам), два этажа; спереди двухъярусная веранда во всю
# ширину (столбы, перила, балкон) — вне стены, окна за перилами размечены целиком по раме.
# Подпись SCALE у видов — 1/8", но начерчены в 1/4": стена 24' = 432 pt, как на плане.
id = "ffh-georgia"
pdf = "Georgia - Blueprints.pdf"
roof = "двускатная 7.5/12 с поперечным фронтоном сзади, фальцевая кровля; навесной скат у угла"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"; дверь 36x80" = 54x120 pt, FF1–FF2 9' = 162 pt
material = "siding"       # FIBER CEMENT CLAPBOARD SIDING
plinth_ft = 2.08          # FF1 +0'-0" над низом кирпичного цоколя (земля у стены), по листу
plinth_material = "brick" # кирпичный фундамент (BRICK): кладка 817.1–836.5, выше до пола — обшивка заходит ниже чистого пола
trim_material = "wood"    # CORNICE / CROWN MOLDING / BED MOLDING — деревянный карниз (gf#245)
floor_heights_ft = [9.0, 8.25]   # FF2 +9'-0", EAVE +17'-3"
absent = ["west, north, east: карниз только на части стены (под скатом), на щипцовой части полосы нет"]
cut = ["south: двухъярусная веранда во всю ширину — столбы, перила, балкон 2-го этажа, ступени",
       "south: фонарь у двери", "west: вентиляционная решётка во фронтоне",
       "east: вентиляционная решётка во фронтоне", "north: вентиляционная решётка во фронтоне",
       "north/west: навесной скат (pent roof) у угла на уровне 2-го этажа",
       "west: верх металлической трубы выше карниза", "north: ступени заднего входа",
       "west/east/north: веранда и козырьки соседних сторон в профиле"]

