# Tiny Farmhouse, Extended Design (with rear extension) — Jay Osborne, FreeFarmhouse; CC BY-SA 4.0
# archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия,
# целиком (части разной высоты) — gf#323.
# Листы: план — стр. 8 (A1.1), фасады — стр. 10 (WEST, SOUTH) и стр. 11 (EAST, NORTH), 1/4" = 1'-0";
# масштаб сверен: дверь A 84" = 126 pt, FF1–FF2 9' = 162 pt, EAVE +17'-3" = 310.5 pt над FF1.
# Устройство: двухэтажный объём 16' x 16' под двускатной крышей 7.5/12 (конёк вдоль восток-запад,
# EAVE +17'-3") и сзади на востоке — кухня 10' x 10' в два этажа под односкатной крышей 2/12, её
# карниз на +16'-0" (верх кровли у кромки 511.1 pt) — часть ниже основного объёма. На северо-западе
# между кухней и основным объёмом — открытое заднее крыльцо (BACK PORCH 5'-8" x 10', столбы и
# скат 3/12, не стена). Вход A с юга под портиком; дверь B — в западной стене кухни, утоплена
# от плоскости западного фасада основного объёма на 5'-8".
# Контур первого этажа (по часовой от юга): юг 277.5 pt; запад основного объёма 277.5; север
# основного объёма за крыльцом 102.8 (внутренний угол); запад кухни 180.0; север кухни 174.7;
# восток 457.5 = основной объём 277.5 + кухня 180.0 в одной плоскости — одна сторона со
# ступенчатым силуэтом. Невязка 0: север 174.7 + 102.8 = юг 277.5; на листе сторона 16' = 277.5 pt.
# Eaves: только где кровля стекает на стену (щипцовые стены без участков). Карниз и силуэт: отметка кухни — кромка кровли 2/12 на севере (511.1 pt = +16'-0"); сам верх
# стены кухни и силуэт по линии нижней кромки кровли (на 7–9 pt ниже отметки) — рисунок грубый
# по высоте на ±0.5'.
# Крыша (gf#336); свесы — с чертежа (gf#451), строка у `overhang_m`.
id = "ffh-tiny-ext"
pdf = "Tiny Farmhouse - Blueprints - both versions.pdf"
roof = "двускатная 7.5/12 (фальцевая), конёк вдоль восток-запад; кухня сзади — односкатная 2/12 (падает на север) ниже основной; портик с фронтоном над входом; скат 3/12 заднего крыльца"
roof_kind = "gable"
pitch_deg = 32.0
# свес: карнизный — Ф. восток стр. 11, кончик карниза на 17,4 pt за стеной (259,1 pt), 18 pt/фут = 0,29 м (то же, что у tiny-small); фронтонный — Ф. юг стр. 10, 8,4 pt = 0,14 м
overhang_m = 0.30
gable_overhang_m = 0.15
overhang_by = "drawing"
part_roofs = [  # свои крыши частей (gf#431), часть — под серединой x на виде side
  { side = 3, x = [278.0, 458.0], kind = "shed", pitch_deg = 9.46, down = 4 },  # кухня — односкатная 2/12, падает на север
]
unit = "ft"
pt_per_unit = 18.0          # SCALE: 1/4" = 1'-0"; EAVE +17'-3" = 310.5 pt над FF1, дверь 84" = 126 pt
material = "siding"       # CLAPBOARD SIDING
plinth = 2.1667        # линия земли под кирпичным цоколем — 39 pt под FF1 (на листе «18-24"»)
plinth_material = "brick" # кирпичные угловые столбы + решётчатые вентпанели (VENT SILL)
trim_material = "wood"    # фасция и фризовая доска под карнизом на южной и северных стенах
floor_heights = [9.0, 8.25]   # FF2 +9'-0", EAVE +17'-3" — основной объём
cut = ["west, east: фронтон с вентрешёткой", "south, north: скат кровли",
       "south: колонны портика", "south, north-main: столбы, балка, скат 3/12 и ступени заднего крыльца",
       "west-kitchen: скат 3/12 крыльца, столбы 6x6 и ступени у двери B",
       "north-kitchen, east, west-kitchen: ставни окон кухни видны с ребра",
       "east: окно по желанию (пунктир, примечание 5)"]
absent = ["west, east: нет карнизной полосы — щипцовые стены, горизонтальной линии на отметке карниза нет",
          "west-kitchen, east: у кухни нет карнизной полосы на боковых стенах — скат 2/12 падает вдоль стены",
          "все стороны: нет зон второй отделки — вся стена одной обшивкой CLAPBOARD SIDING"]

