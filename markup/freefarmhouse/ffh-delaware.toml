# Delaware Farmhouse (50 starter farmhouses), фаза 1 — ядро-модуль — Jay Osborne, FreeFarmhouse;
# CC BY-SA 4.0; archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Контур 18'x24' (по наружным угловым доскам на листе — 18'-4" x 24'-4"), без выступов; площадка
# входа (сторона 1) и задний ступ (сторона 3) — вне стены. Лист — черновик «format test», 1/16".
# Второй этаж — мансарда под скатом: 2ND FLOOR +10'-0", карниз +13'-8" (подкосная стенка 3'-8"),
# поэтому этаж до карниза один; окна мансарды — во фронтонах, срезаны.
id = "ffh-delaware"
pdf = "Delaware Farmhouse Plans - by Jay Osborne.pdf"
roof = "двускатная, мансарда под скатом"
pt_per_ft = 4.5           # SCALE: 1/16" = 1'-0"; дверь 36x80" = 13.5x30 pt
material = "siding"       # обшивка по виду листа (отделка на листе не подписана)
plinth_ft = 2.2           # чистый пол над низом опор (земля у стены), по листу
floor_heights_ft = [13.6667]   # ROOF EAVE +13'-8" (мансарда — не этаж)
cut = ["side 1: окно мансарды со ставнями во фронтоне", "side 3: окно мансарды со ставнями во фронтоне",
       "side 1: ступени и площадка входа", "side 3: ступени заднего ступа",
       "side 1: фонари у двери x2", "side 2/4: козырёк и фонарь соседних сторон в профиле"]

