# Delaware Farmhouse (50 starter farmhouses), фаза 1 — ядро-модуль — Jay Osborne, FreeFarmhouse;
# CC BY-SA 4.0; archive.org/details/freefarmhouse_and_other_patreon_plans; разметка gf#180 — та же лицензия.
# Контур 18'x24' (по наружным угловым доскам на листе — 18'-4" x 24'-4"), без выступов; площадка
# входа (сторона 1) и задний ступ (сторона 3) — вне стены. Лист — черновик «format test», 1/16".
# Второй этаж — мансарда под скатом: 2ND FLOOR +10'-0", карниз +13'-8" (подкосная стенка 3'-8"),
# поэтому этаж до карниза один; окна мансарды — во фронтонах выше карниза (gf#321), силуэт
# `outline` — по внутренней кромке наличника ската (без свеса); скат на листе 10/12 (39.8°).
# Крыша (gf#336); свесы — с чертежа (gf#451), строка у `overhang_m`.
# Крыша (gf#336): уклон — по умолчанию ([spec.roof_shape], на листе не подписан).
id = "ffh-delaware"
pdf = "Delaware Farmhouse Plans - by Jay Osborne.pdf"
roof = "двускатная, мансарда под скатом"
roof_kind = "gable"
pitch_deg = 35.0
# свес: карнизный — Ф. сторона 1 стр. 3, кончики карниза на 4,9 pt за стеной (217,6/300,1 pt), 4,5 pt/фут = 0,33 м; фронтонный — Ф. сторона 4 стр. 3, 3,3 pt = 0,22 м (масштаб 1/16", точность ±0,05 м)
overhang_m = 0.35
gable_overhang_m = 0.20
overhang_by = "drawing"
unit = "ft"
pt_per_unit = 4.5           # SCALE: 1/16" = 1'-0"; дверь 36x80" = 13.5x30 pt
material = "siding"       # обшивка по виду листа (отделка на листе не подписана)
plinth = 2.2           # чистый пол над низом опор (земля у стены), по листу
plinth_material = "wood"  # белая обшивная доска (skirt) под полом на столбчатом фундаменте, подпись на листе нет
trim_material = "wood"    # карнизная доска и угловые доски, белые (gf#245)
floor_heights = [13.6667]   # ROOF EAVE +13'-8" (мансарда — не этаж)
absent = ["side 1, side 3: карниза нет — щипцовые торцы, горизонтальной полосы на отметке карниза нет",
          "all: подписей материалов на листе нет — цоколь и карниз по виду (белая доска), опоры под полом не размечены"]
cut = ["side 1: ступени и площадка входа", "side 3: ступени заднего ступа",
       "side 1: фонари у двери x2", "side 2/4: козырёк и фонарь соседних сторон в профиле"]

