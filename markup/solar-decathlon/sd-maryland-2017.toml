# reACT — University of Maryland, College Park, Solar Decathlon 2017 (Denver, Colorado).
# U.S. DOE Solar Decathlon; без штампа PD: учебное использование по разрешению научруков, со слов
# хозяина 26.10.2026 (штамп PUBLIC DOMAIN на листах не найден); разметка gf#323.
# Листы: план A-101 (стр. 86, FLOOR PLAN), виды A-200 (стр. 90: NORTH сверху, SOUTH снизу) и A-201
# (стр. 91: EAST сверху, WEST снизу); масштаб 1/4" = 1'-0" = 18 pt/ft на всех (стена 29'-6" = 530,8
# pt, крыло 11'-7 1/4" = 208,7 pt). Отметки: FINISHED FLOOR 0'-0" — линия на каждом виде своя
# (N 594,1; S 1251,8; E 585,6; W 1251,4 pt), FOUNDATION −2'-6" = 45 pt ниже пола.
# Устройство: дом на опорах 37'-3" x 29'-6" из двух крыльев по 11'-7 1/4" (запад и восток) и ядра
# 14'-0" между ними. Крылья — односкатные («бабочка»): верх стены у внешнего торца 11'-0", скат
# ~1,5:12 вниз к ядру (у ядра ~9'-8"); у ядра двускатная крыша 4:12 щипцами на север и юг,
# карниз ядра (T.O. WALL) 9'-3 1/4" над полом, выше него 2'-10" клерестория и скат до конька
# T.O. CORE 14'-6". С севера к ядру пристроен тамбур 7'-8" x 6'-3" (плоская крыша на 9'-3 1/4"), с
# юга — теплица (GREENHOUSE, T.O. 12'-6", стеклянная, щипец 12'-6") шириной с ядро, выступает
# на 4'-1 1/2" от южной стены крыльев. Контур первого этажа — 12 сторон по часовой от стороны
# входа: E, SE (южная стена восточного крыла), GE (восточная грань теплицы), GS (южная грань
# теплицы), GW, SW, W, NW (северная стена ядра и западного крыла, ступень у тамбура), VW, VN, VE
# (грани тамбура), NE. Внутренние углы — после SE, GW, NW, VE.
# Вход: дверь 1 на восточной стене (по плану A-101 дверь №1 — первая, на настил, к которому ведёт
# пандус 1:12 с юга); стороной входа взята восточная — выбор разметчика, проверить хозяину.
# Длины сторон с листов: E 530,8; SE 208,6; GE 74,1; GS 252,0; GW 74,1; SW 208,7; W 530,7;
# NW 321,1; VW 112,3; VN 139,4; VE 112,3; NE 208,7 pt; невязка контура 0,1 pt.
id = "sd-maryland-2017"
pdf = "2017/maryland-drawings.pdf"
roof = "составная: два односкатных крыла 1,5:12 «бабочкой» (низ у ядра) с солнечными панелями; двускатное ядро 4:12 щипцами на север и юг; стеклянная теплица со своим щипцом на юге; плоская кровля тамбура"
roof_kind = "gable"
pitch_deg = 18.4349         # 4:12 у ядра (главный объём, T.O. CORE); крылья 1,5:12 = 7,1°
overhang_m = 0.1            # свес ядра у щипцов на листе ~2–4 pt; у крыльев до 0,6 м, но это каркас панелей
roof_gaps = ["составная: односкатные крылья «бабочкой» 1,5:12, двускатное ядро 4:12, стеклянная теплица и плоский тамбур -> одна двускатная (вид главного объёма, ядра)",
             "конёк поперёк правила: щипцы ядра на сторонах NW/VN (север) и GS (юг), а дом длиннее по x (37'-3\" x 29'-6\"); модуль ставит щипцы на короткие стороны"]
unit = "ft"
pt_per_unit = 18.0          # SCALE 1/4" = 1'-0"; стена 29'-6" = 530,8 pt, крыло 11'-2 1/4" = 201,2 pt
material = "wood"           # LAMBOO RAINSCREEN SIDING (бамбуковый брус, горизонтальная), нижние ~7'-0" стен
plinth = 2.5                # FINISHED FLOOR 0'-0", FOUNDATION −2'-6": дом на опорах
floor_heights = [9.2708]    # T.O. WALL ядра 9'-3 1/4" (линия 427,5 на N, 166,6 pt над полом)
cut = ["all: солнечные панели и стойки на кровле (PV PANELS, RACKING SYSTEM), трубчатые фонари SUNTUBE и окно-скайлайт на скатах, труба/вытяжка на коньке",
       "north, east, west: настил (deck) вокруг дома на уровне пола с перилами и ограждением (HANDRAIL & GUARD), закрывает низ дверей и проёмов; зелёная стена-трельяж GREENWALL TRELLIS",
       "south: пандус 1:12 с перилами к теплице, плантер перед теплицей, водосточные трубы, зарядка электромобиля на западной стене (CAR CHARGER)",
       "north: вентрешётка (louver, тег 8) в щипце ядра над тамбуром; маленькие щитки/розетки на стенах",
       "south: тег 14 (верхний ряд стёкол теплицы) не выделен; вертикальные стойки теплицы",
       "east, west: клерестория ядра выше стены крыла — вертикальная гофра с коньковыми стойками панелей"]
absent = ["все: цоколь — дом на опорах (FOUNDATION POSTS), подполье открыто, юбки нет",
          "все: карниз — полосы с материалом на листе нет; у ядра фасция 12 pt по верху стены тамбура (VW, VN, VE) не отделана иначе",
          "NE, NW, SW, SE: верх стены под косым скатом крыла — полоса вертикальной гофры вынесена зоной band (прямоугольник по низкому краю)"]

