# HOUSE by Northwestern — Northwestern University, U.S. DOE Solar Decathlon 2017; штамп «PUBLIC
# DOMAIN» («COPYRIGHT: NONE: PROJECT IS PUBLIC DOMAIN»); разметка gf#323.
# Комплект northwestern-drawings.pdf: план A-103 (стр. 28, Dimensioned), фасады A-201 (стр. 32: NORTH,
# SOUTH) и A-202 (стр. 33: EAST, WEST), крыша A-106 (стр. 31), разрезы A-301 (стр. 34);
# масштаб 1/4" = 1'-0" — 18 pt на фут; проверка: GRADE 0" — T.O. Subfloor 2'-0" = 36 pt, высота
# гаражных ворот 9'-0" = 162 pt, стены 1143,8 pt = 63'-6" (на плане гараж + дом 63'-6", 21'-11 3/4"
# по глубине = 395 pt).
# Устройство: одноэтажный дом-прямоугольник 63'-6" x 21'-11" — гараж слева (запад), основной объём,
# вход (ENTRY WAY 001 — остеклённый тамбур внутри контура, южная стена в одной плоскости с
# гаражом и домом); с юга настил (ENTRY DECK / SOUTH DECK) и остеклённая веранда SOUTH DECK 007
# (BRONZE COLORED ALUMINUM + GLASS PATIO ENCLOSURE на настиле перед гостиной), с севера NORTH DECK
# 011 и UTILITY CLOSET 012 под навесом из белого деревянного каркаса.
# Крыша: плоская (ПВХ/шингл Charcoal Black по листу) на отметке 13'-4 3/8" над землёй по югу,
# востоку и западу; северная полоса 7'-9" вдоль северной стены — наклонная плоскость с PV-панелями
# (скат на юг, 23°), её высокая кромка — верх северной стены 16'-8 1/2" над землёй. Профиль
# на E и W: ровный верх 13'-4 3/8" на 14'-2" от южной стены, дальше подъём к северной.
# Контур: юг (вход) → запад → север → восток; стороны с листов: юг 1143,8 pt, запад 395,2,
# север 1144,0, восток 395,1; невязка контура 0,2 pt.
# Дальше: Utility Closet (лёгкий каркасный бокс 8'-5" x 12'-10", открыт сверху наполовину) и North
# Deck — не стены дома, в cut.
id = "sd-northwestern-2017"
pdf = "2017/northwestern-drawings.pdf"
roof = "плоская (13'-4 3/8\") с наклонной полосой PV-панелей вдоль северной стены (верх северной стены 16'-8 1/2\"), без свесов"
roof_kind = "flat"
pitch_deg = 0.0
overhang_m = 0.0
roof_gaps = ["составная: плоская кровля на 13'-4 3/8\" и наклонная полоса с PV-панелями к северной стене (до 16'-8 1/2\") -> плоская"]
unit = "ft"
pt_per_unit = 18.0          # SCALE 1/4" = 1'-0"
material = "wood"         # LP SmartSide Siding (композитная обшивка под дерево), акцент — Wood Siding
plinth = 2.0           # T.O. Subfloor 2'-0" над GRADE LEVEL 0" (Level 1 = 0')
floor_heights = [14.7667]  # северная стена 16'-8 1/2" − 2'-0": самая высокая; юг, восток, запад — 13'-4 3/8"
cut = ["all: солнечные панели PV на крыше и над стеной, ограждения",
       "south: настил ENTRY DECK и SOUTH DECK с пандусом и ступенями (1/12 slope, Double ADA Ramp), деревянные клумбы WOODEN PLANTERS перед стеной",
       "south: остеклённая веранда SOUTH DECK 007 (bronze aluminum + glass patio enclosure) перед стеклянной стеной гостиной — скрывает стену; стена за ней размечена по плану A-103",
       "east, west: веранда и пандус за углами стены, клумбы",
       "north: North Deck 011, Utility Closet 012 с дверью D8, бак и кондиционер под навесом из белого деревянного каркаса (White Painted Wood Frame) — не стены дома",
       "west: каркас навеса и пристройка бокса за северным углом стены",
       "south, north: деревянные бочки-клумбы у углов"]
absent = ["все: цоколь — дом на опорах, стена обшита до земли гладкой LP SmartSide, отдельной отделки цоколя нет",
          "все: карниз — плоская кромка кровли ~1' без отделки и подписи, горизонтальной полосы с материалом нет",
          "все: вторая отделка — на север/запад/восток Wood Siding на скошенной части стены, не отдельный пояс"]

