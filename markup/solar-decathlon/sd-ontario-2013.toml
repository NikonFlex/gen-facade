# ECHO — Team Ontario (Queen's, Carleton, Algonquin), 2013. U.S. DOE Solar Decathlon; штамп
# «COPYRIGHT: NONE: PROJECT IS PUBLIC DOMAIN»; разметка gf#180.
# Листы A-211 (стр. 59: EAST, WEST) и A-212 (стр. 60: NORTH, SOUTH), SCALE 1/4" = 1'-0" — 18 pt
# на фут; проверка: T/O SUBFLOOR 2'-5 1/2" над GRADE 0" = 44,3 pt на листе (44,25 по масштабу),
# торцы 412,6 pt = 22'-11" при оси 21'-10 1/4" плюс стены и обшивка. План A-111 (стр. 53) —
# прямоугольник по осям 1–11 × A–C; вокруг настилы: пергола с настилом на севере, BACK DECK на
# юге, пандусы с запада и востока — на фасадах настилы не нарисованы, площадки сняты с плана.
# Кровля низкоуклонная за фасциями: T/O ROOF PEAK 13'-0 3/4" = верх фасции; карниз — низ фасции.
id = "sd-ontario-2013"
pdf = "2013/ont_cd.pdf"
roof = 'плоская низкоуклонная за фасцией (T/O ROOF PEAK 13 ft 0 3/4 in), пергола на севере'
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"
material = "wood"         # DRIFTWOOD / CLEAR COAT STAIN WHITE PINE CLADDING
plinth_ft = 2.4583        # T/O SUBFLOOR +2'-5 1/2" над GRADE LEVEL 0"; дом на временных опорах
floor_heights_ft = [9.756]    # от чистого пола до низа фасции: 175,6 pt
cut = ["north: пергола над настилом у входа", "west, east: пандусы",
       "south: электросчётчик на углу стены", "west: водосток и светильник у углового окна",
       "north: светильник у двери", "all: временные опоры под домом",
       "north, south: площадки сняты с плана A-111 — на фасадах настилов нет"]

