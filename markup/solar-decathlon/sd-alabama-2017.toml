# surviv(AL) house — Team Alabama (University of Alabama at Birmingham и University of Alabama in
# Huntsville), 2017. U.S. DOE Solar Decathlon; без штампа PD — по разрешению научрукам в учебных
# целях (хозяин, 26.10); разметка gf#180, gf#199.
# Листы A3.01 (стр. 24: EAST, NORTH) и A3.02 (стр. 25: WEST, SOUTH), 1/4" = 1'-0" (18 pt на фут);
# план A2.02 (стр. 21). Виды на листах — растр (~100 dpi), координаты сняты по сетке pt поверх
# картинки, точность ~2–3 pt; отметки — векторные: FLOOR FRAMING 2'-0" → BEARING HEIGHT 10'-0"
# = 144 pt, ROOF 16'-3 3/4" — сходится с 18 pt на фут.
# Прямоугольная коробка ~41' x 24'-4" (на плане 40'-7" по каркасу). Карниз один — BEARING HEIGHT
# 10'-0" на северной и южной стенах; над ним — отступивший на ~4' от северной стены фонарь-
# клерестория с окнами D и односкатная кровля с PV вниз к югу. На севере и юге — террасы с
# навесами на стойках 4x4 (север — CORRUGATED ACRYLIC CANOPY ROOF), низ стен закрыт перилами,
# ящиками-клумбами и посадками.
# Вход — дверь 001 на севере, рядом три стеклянные секции B.
id = "sd-alabama-2017"
pdf = "2017/alabama-drawings.pdf"
roof = "односкатная к югу с PV (ROOF 16'-3 3/4\"), фонарь-клерестория над северной полосой кровли"
pt_per_ft = 18.0          # 1/4" = 1'-0", проверено отметками
material = "siding"       # PAINTED FIBER CEMENT PANELS
plinth_ft = 2.0           # FLOOR FRAMING 2'-0" над GROUND 0'-0"
trim_material = "wood"    # 2X8 WOOD BEAMS и 1X8 WOOD TRIM под навесом на отметке карниза; рядом PREFINISHED METAL GUTTER (gf#245)
floor_heights_ft = [8.0]  # BEARING HEIGHT 10'-0"
cut = ["все: клерестория с окнами D над северной полосой кровли, односкатная кровля, PV, водостоки",
       "north, south: навесы террас на стойках 4x4, перила, посадки — вне стены; низ окон и дверей закрыт",
       "east, west: щипцовый профиль стены выше BEARING HEIGHT; низкий навес и кровельная полоса у северного угла",
       "east, west: кирпичные/бетонные ящики-клумбы и укрытие бака за углами, ограждения-«планкеры» перед стеной",
       "south: двери 010 и 006B закрыты перилами и стойкой — границы по видимой части и плану, неточны"]
absent = ["все: цоколь — полоса каркаса пола 2'-0\" (653–676 pt на востоке) белая, материал не подписан",
          "east, west: карниз — стена идёт выше BEARING HEIGHT до скатной кровли, горизонтальной полосы нет",
          "east, west: нижняя нахлёсточная обшивка (PAINTED FIBER CEMENT SIDING) — основная material, гладкие панели выше — accent; на севере/юге нахлёсточная обшивка видна под панелями сквозь перила"]

