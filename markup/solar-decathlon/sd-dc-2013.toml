# Листы A-201 (стр. 49: NORTH, SOUTH) и A-202 (стр. 50: EAST, WEST), 1/4" = 1'-0"; план A-101
# (стр. 44). Два модуля со сдвигом — Z-контур из 8 сторон: южный ряд (гостиная-кухня + санузел)
# 38'-7" по SIP, северный (техкомната + спальня) 27'-7" сдвинут на восток; гостиная выступает на
# запад на 16'. Длины с листов сходятся: север 289,2 + 501,3 = юг 718,5 + 72,0 pt; запад
# 235,4 + 262,8 = восток 204,3 + 293,9 pt. FIRST FLR 2'-4", T.O. PARAPET 13'-0": 192 pt между
# верхом парапета и полом на всех четырёх листах — карниз один, крыша плоская.
# Вход — дверь 103 гостиной с севера.
id = "sd-dc-2013"
pdf = "2013/dc_cd.pdf"
roof = "плоская за парапетом, панели на стойках под наклоном"
pt_per_ft = 18.0          # SCALE 1/4" = 1'-0"; дверь 102a 3'-3" = 58,5 pt, высота 7'-0" = 126 pt
material = "wood"         # RECLAIMED RAIN SCREEN WITH SHIP LAPPED (стр. 81–88)
plinth_ft = 2.3333        # FIRST FLR 2'-4" над GRADE LEVEL 0" (дом на регулируемых опорах)
floor_heights_ft = [10.6667]  # T.O. PARAPET 13'-0" − 2'-4"
cut = ["all: солнечные панели на стойках над парапетом",
       "east: веранда у двери спальни 102a — кровля и боковые стенки-экраны на ~5' перед стеной; стена спальни (дверь, окно 02c) в глубине, размечена по краям рамы веранды",
       "north, south: боковая стенка-экран веранды спальни с проёмом OPENING — продолжение стены за восточным углом северного модуля",
       "south: раздвижные жалюзийные ставни перед стеклянными дверями кухни (панели 104 ×3) и четвёртая — перед глухой стеной санузла (105)",
       "south: южная стена санузла на ~1' южнее стены гостиной (план A-101) — меньше 0,6 м, одна плоскость",
       "west: вентрешётка над двустворчатой дверью техкомнаты 101",
       "east, west: вставка-перемычка между модулями (2'-4 1/2\", вертикальная обшивка) — в плоскости стены санузла и техкомнаты",
       "all: опоры дома и юбка под полом"]

