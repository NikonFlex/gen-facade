# 4D Home — Team Massachusetts (UMass Lowell и др.), 2011. U.S. DOE Solar Decathlon; штамп
# «COPYRIGHT: NONE: PROJECT IS PUBLIC DOMAIN»; разметка gf#180.
# Листы A-211 (стр. 52: EAST, WEST) и A-212 (стр. 53: NORTH, SOUTH), SCALE 1/4" = 1'-0": двери
# 36" = 55 pt, отметки FFL LEVEL 01 0" → T.O. WALLS 7'-7" через 136,5 pt, GRADE -1'-6" — 27 pt.
# Контур — прямоугольник (план A-102, стр. 47). Стена по наружным краям обшивки и угловых
# стоек: 757 pt = 42'-1" и 417,5 pt = 23'-2" (на плане по осям 40'-3 7/8" — без обшивки?).
# Вход — с юга: дверь на кухню с террасы под перголой с панелями; вторая дверь — с запада.
id = "sd-mass-2011"
pdf = "2011/mass_cd.pdf"
roof = "двускатная, фальцевая, конёк вдоль; щипцы на востоке и западе; южная пергола-рама с панелями"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"; дверь 36" = 55 pt
material = "siding"       # горизонтальная обшивка доской
plinth_ft = 1.5           # GRADE LEVEL -1'-6" от FFL
trim_material = "wood"    # WOOD: узкая полоса обвязки/фасции на отметке T.O. WALLS (gf#245)
floor_heights_ft = [7.5833]   # T.O. WALLS 7'-7"
cut = ["east, west: щипцы выше T.O. WALLS (с вентрешёткой на востоке)",
       "south: пергола-рама с солнечными панелями перед стеной; на east, west — её портал в профиль",
       "east, west: портальные рамы-стойки по углам стены (серые) — по краю стены",
       "north: щитки, счётчики, вентиляция на стене", "north, south: пандусы вдоль стен",
       "east: скамья-ящик и настил за углом", "south, north: солнечные панели на скате"]
absent = ["все: цоколь — стены на сваях/опорах, обшивка доходит до настила, фундаментной полосы нет (GRADE -1'-6\")",
          "east, west: карниз — щипец, стена идёт до стропил, горизонтальной полосы на отметке T.O. WALLS нет",
          "все: вторая отделка — одна горизонтальная обшивка доской по всем стенам"]

