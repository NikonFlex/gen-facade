# Chameleon House — Missouri University of Science and Technology (Missouri S&T), U.S. DOE Solar
# Decathlon 2013; штамп «PUBLIC DOMAIN» («COPYRIGHT: NONE: PROJECT IS PUBLIC DOMAIN»); разметка gf#323.
# Комплект mst_cd.pdf: план A-111 (стр. 195, FIRST FLOOR), фасады A-211 (стр. 201: SOUTH, NORTH)
# и A-212 (стр. 202: EAST, WEST); масштаб 1/4" = 1'-0" — 18 pt на фут; проверка: LEVEL 1 3'-0"
# над GRADE 0" = 54 pt, ROOF TOP 13'-6 3/4" = 244 pt на всех видах. Стены по плану: главный корпус
# 851,6 x 401,3 pt (47'-4" x 22'-4"), солярий SOLARIUM 106 — 327,9 x 110,6 pt (18'-3" x 6'-2").
# Устройство: одноэтажный дом-прямоугольник на настиле (DECK SKIRT до земли), к юго-западной части
# южной стены примыкает остеклённый солярий (ниже основного корпуса, на 8'-0" над чистым полом,
# своя крыша SOLARIUM BIFACIAL ROOF с панелями); вход — дверь FRONT DOOR на южной стене главного
# корпуса справа от солярия. Кровля главного корпуса — SIP ROOF, почти плоская (уклон ~0,7°, верх
# стены 9'-8" у юга и 10'-0" у севера над чистым полом), над ней три пилообразных фонаря
# (CLERESTORY WINDOWS, до 18'-0" SOLAR ENVELOPE); свес кровли ~0,5' по периметру, над южными окнами
# козырёк FRONT OVERHANG. Контур: юг главного корпуса (вход) → торец солярия (восток) → юг
# солярия → запад → север → восток; внутренний угол после первой стороны. Стороны с листов:
# юг-1 525,2 pt, торец солярия 110,2, юг солярия 328,0, запад 512,0, север 851,6, восток 401,0;
# невязка контура 1,6 pt по x и 0,8 по y.
# Не размечены стеной: WATER STORAGE SHELTER 108 (северо-восточный угол, открытая каркасная
# пристройка за северной стеной с двумя баками и воротами, крыша ниже основного корпуса) и
# настилы — в cut; северная стена в пределах шельтера закрыта им на виде NORTH.
id = "sd-mst-2013"
pdf = "2013/mst_cd.pdf"
roof = "SIP-кровля главного корпуса, почти плоская (уклон ~0,7°), три пилообразных фонаря над ней, коллекторы; над солярием своя низкая крыша с панелями"
roof_kind = "flat"
pitch_deg = 0.0
overhang_m = 0.15
roof_gaps = ["составная: почти плоская SIP-кровля с пилообразными фонарями и низкая крыша солярия -> плоская"]
unit = "ft"
pt_per_unit = 18.0          # SCALE 1/4" = 1'-0"
material = "siding"       # EXTERIOR FINISH / COLORED PANELS (цветные панели по SIP-стене)
plinth = 3.0           # LEVEL 1 3'-0" над GRADE LEVEL 0"
plinth_material = "wood"  # DECK SKIRT — обшивка настила от чистого пола до земли на всех листах
floor_heights = [10.0]    # северная стена: верх 13'-0" над землёй − 3'-0" (юг — 9'-8", солярий — 8'-0")
cut = ["all: коллекторы, фотоэлектрические панели, пилообразные фонари и UV-отражатели над кровлей",
       "south: деревянный настил, ступени и пандус перед солярием и входом, перила",
       "south: панели SOLARIUM BIFACIAL ROOF над солярием (три блока) и стойки козырька FRONT OVERHANG",
       "north: WATER STORAGE SHELTER 108 с двумя ярусами баков, въездные двустворчатые ворота шельтера и его крыша — пристройка у северо-восточного угла, закрывает нижнюю часть северной стены на 214 pt",
       "north, east, west: стена-модуль LIVING WALL MODULE (озеленённые панели), плантеры, цветные панели без проёмов",
       "north: инвертор и шкаф OUTDOOR STORAGE CABINET у стены, наружные светильники EXTERIOR SCONCES",
       "east, west: опоры настила и вентиляционные решётки в подполье"]
absent = ["все: карниз — кромка SIP-кровли ~1,4' без отделки и подписи, отдельной полосы материала на листе нет",
          "все: вторая отделка — одна EXTERIOR FINISH по всем стенам, акцентов нет"]

