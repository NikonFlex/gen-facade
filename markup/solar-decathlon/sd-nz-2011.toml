# First Light — Victoria University of Wellington (Новая Зеландия), U.S. DOE Solar Decathlon 2011;
# без штампа PD: учебное использование по разрешению научруков, со слов хозяина 26.10.2026;
# разметка gf#323.
# Листы: A-111 (стр. 67: план), A-211 (стр. 70: NORTH, SOUTH), A-212 (стр. 71: EAST, WEST);
# масштаб 1:48 метрический (лист 34" x 22": pt_per_unit = 72 / 25,4 * 1000 / 48 = 59,055 pt/м;
# сверка: T.O. PARAPET 2985 над GROUND FLOOR 0 = 176,3 pt на всех видах, GRADE LEVEL -550 ниже
# пола на 32,5 pt). Здание — одноэтажный прямоугольник 14,2 x 5,5 м на опорах (SOLAR DECATHLON
# модуль), стены — горизонтальная обшивка (weatherboard/cedar cladding), плоская кровля с
# парапетом T.O. PARAPET 2985 над полом; над ней на стойках — П-образные (бабочка) навесы с
# солнечными панелями. Посередине длинных стен — остеклённая тройная дверь (DO02-3 на юге, DO01-3
# на севере) в плоскости стены. Окна: юг WI02-2, WI04-4 (1,94 м), WI06-6 (узкое, 0,5 м); север
# WI03-4, WI05-5; запад WI01-1; восток — две двери сервисных отсеков DO04-6 (двустворчатая) и
# DO03-6. Вход — с юга (пандус и центральная дверь). Стены по наружной грани по видам: юг 839 pt =
# 14,21 м, север 839 pt, запад 326 pt = 5,52 м, восток 326 pt (на плане 14 000 и 5 534 между осями).
id = "sd-nz-2011"
pdf = "2011/nz_cd.pdf"
roof = "плоская за парапетом T.O. PARAPET 2985; над ней навесы-бабочка с PV (ската на листе нет)"
roof_kind = "flat"
pitch_deg = 0.0
# свес: плоская за парапетом; Ф. S стр. 70 — кровля-«бабочка» выходит за стену на >1,2 м (канопи), вынос всей кровли не строим
overhang_m = 0.0
overhang_by = "drawing"
roof_gaps = ["навесы-бабочка с солнечными панелями на стойках над парапетом -> плоская"]
unit = "m"
pt_per_unit = 59.055        # 1:48 метрический: 72 / 25,4 * 1000 / 48
material = "wood"           # горизонтальная обшивка кедром (CLADDING / TIMBER, ключи 06-26-13)
plinth = 0.55               # GROUND FLOOR 0 над GRADE LEVEL -550
floor_heights = [2.985]     # T.O. PARAPET 2985 над GROUND FLOOR 0
cut = ["все: навесы-бабочка с PV-панелями на стойках над парапетом, водосточные и обрешётные детали над стеной",
       "все: стойки навеса, жалюзийные ширмы (LANDSCAPE SCREEN) и деревянные решётки у углов и на концах стен",
       "south: пандус с перилами слева (запад) и скамьи/плантеры перед стеной; настил у двери",
       "north: скамьи/плантеры и решётчатые ширмы у стены — низ окон открыт, нижние 0,5 м стены закрыты скамьями",
       "west: навес/ящик за западным краем (слева на виде), нижний настил",
       "east: пандус и перила перед стеной, настил",
       "все: дом на опорах, подполье открыто"]
absent = ["все: цоколь — дом на опорах (GRADE LEVEL -550), гладкая обвязка настила без отделки",
          "все: карниз — стена идёт до T.O. PARAPET под навесом, горизонтальной полосы с материалом на листе нет",
          "все: вторая отделка — одна горизонтальная обшивка; остеклённые центральные двери на юге и севере — проёмы"]

