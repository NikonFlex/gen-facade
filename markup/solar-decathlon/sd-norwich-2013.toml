# Delta T-90 — Norwich University, 2013. U.S. DOE Solar Decathlon; без штампа PD — по разрешению
# научрукам в учебных целях (хозяин, 26.10); разметка gf#180, gf#199.
# Листы A-211 (стр. 43: SOUTH, WEST CARDINAL) и A-212 (стр. 44: NORTH, EAST CARDINAL), «AS BUILT»,
# 1/2" = 1'-0" (36 pt на фут); план A-111 (стр. 37).
# Прямоугольная коробка из двух модулей, почти плоская кровля, обшивка горизонтальной доской.
# Отметки: T.O. SUBFLOOR 0'-0", T.O. WALL 8'-10", GRADE -1'-6 3/8". Проверка масштаба: GRADE →
# SUBFLOOR 55 pt = 1'-6 3/8"; коробка двери 33" x 84.7" по путям листа. Стены по обшивке:
# 990.6 pt = 27'-6" (юг) и 1290.6 pt = 35'-10" (запад); север 987.7 pt, восток 1289.9 pt.
# Вход — западная дверь с площадкой у плана (A-111); вторая дверь — на юге.
id = "sd-norwich-2013"
pdf = "2013/nu_cd.pdf"
roof = "плоская с малым уклоном; PV и окно-фонарь (ROOF WINDOW) на кровле"
pt_per_ft = 36.0          # 1/2" = 1'-0"
material = "siding"       # горизонтальная обшивка
plinth_ft = 1.5313        # GRADE -1'-6 3/8"
floor_heights_ft = [8.8333]   # T.O. WALL 8'-10"
cut = ["все: PV-панели, фонарь (ROOF WINDOW), вентиляционная труба над кровлей; край кровли чуть выше T.O. WALL",
       "north: инженерные коробки на стене (щиток, инвертор, тепловой насос, розетки)",
       "east: щиток и вынос теплового насоса у правого угла",
       "все: настил и фундамент (WOOD DECKING AND FOUNDATION) не показаны на листе",
       "south, west: наличники дверей — по коробке с наличником"]

