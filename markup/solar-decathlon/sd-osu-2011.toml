# enCORE — The Ohio State University, 2011. U.S. DOE Solar Decathlon; штамп «COPYRIGHT: NONE:
# PROJECT IS PUBLIC DOMAIN»; разметка gf#180.
# Листы A-211 (стр. 25: NORTH, SOUTH w/o SCREEN) и A-212 (стр. 26: EAST, WEST w/o SCREEN), SCALE
# 1/4" = 1'-0" — 18 pt на фут; проверка: FINISH FLOOR 0'-0" — GRADE -2'-4" = 42 pt, T.O. SCREEN
# 15'-3" = 274,3 pt; стены 540 pt = 30'-0" и 600 pt = 33'-4" — как на плане A-102 (стр. 19:
# 30'-0 1/2" x 33'-4 1/8"). С востока открытое крыльцо 12'-3" под общей крышей на столбах, с юга
# полоса 2'-2" за стеной (в профиль на E/W, не стена).
# Кровля — низкоуклонная «бабочка» с фонарями из поликарбоната: верх стен по сторонам разный —
# S 8'-4", N 9'-1", W 9'-5" (низ фасции над стеной); карниз — нижний (S), остальное — в cut.
id = "sd-osu-2011"
pdf = "2011/osu_cd.pdf"
roof = "низкоуклонная бабочка с фонарями из поликарбоната, коллекторы на кровле"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"
material = "wood"         # WOOD SIDING TYPE 1/2; на юге — металл (гофра)
plinth_ft = 2.3333        # FINISH FLOOR 0'-0", GRADE -2'-4"; дом на настиле с юбкой
plinth_material = "wood"  # COMPOSITE DECK SKIRT (06 73 00): юбка настила от чистого пола до земли на всех листах (gf#245)
floor_heights_ft = [8.361]    # южная стена: 150,5 pt до низа фасции — самая низкая
cut = ["north, west: верх стены выше карниза (до 9'-1\" на севере, 9'-5\" на западе)",
       "all: фонари из поликарбоната, коллекторы и панели над кровлей",
       "east: столбы крыльца (4)", "north, south: открытое крыльцо за углом стены (OPEN)",
       "north: пандус вдоль стены", "south: воздушный солнечный коллектор на стене (HOT AIR COLLECTOR)",
       "west: наружный блок кондиционера", "east, west: полоса 2'-2\" за южной стеной в профиль",
       "all: деревянные экраны (виды w/ SCREEN) не размечены"]
absent = ["все: карниз — на юге фасция лежит выше отметки (отметка — её низ), на east, west, north стена идёт выше карниза к фасции кровли; полосы ниже отметки нет",
          "east, west, north: вторая отделка — одна WOOD SIDING TYPE 1; на юге вся стена другая (accent)"]

