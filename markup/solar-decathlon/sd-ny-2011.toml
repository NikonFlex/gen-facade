# Solar Roof Pod — Team New York (The City College of New York), 2011. U.S. DOE Solar Decathlon;
# без штампа PD — по разрешению научрукам в учебных целях (хозяин, 26.10); разметка gf#180, gf#199.
# Листы A-201.01 SOUTH (стр. 66), A-202.01 EAST (стр. 67), A-203.01 NORTH (стр. 68), A-204.01 WEST
# (стр. 69), 1/2" = 1'-0" (36 pt на фут). Проверка масштаба: GRADE 0" → DECK LEVEL 1'-9" = 63 pt,
# оси блоков через 2'-0" = 72 pt, TOP OF ROOF 12'-7" = 453 pt над GRADE.
# Прямоугольный короб из модульных «блоков» 2' высотой на раме-ростверке, плоская кровля;
# над кровлей — трельяж с PV до 16'-9". Стены по краю кровельного карниза: 1201 pt = 33'-4"
# (юг, север) и 816.6 pt = 22'-8" (восток, запад).
# Пол — низ окна-фрамуги (south «3»), ~3'-2" над землёй; дверь-стекло стоит на 3'-3".
id = "sd-ny-2011"
pdf = "2011/ny_cd.pdf"
roof = "плоская (TOP OF ROOF 12'-7\"); трельяж с PV над кровлей до 16'-9\""
pt_per_ft = 36.0          # 1/2" = 1'-0"
material = "metal"        # модульные панели-блоки (08 51 13 / 06 40 13), без обшивки доской
plinth_ft = 3.1417        # пол короба над GRADE по низу окна south «3»
trim_material = "metal"   # кровельный карниз-кап: двойная горизонтальная полоса над верхним рядом блоков (gf#245)
floor_heights_ft = [9.4417]   # до TOP OF ROOF 12'-7"
cut = ["все: трельяж (FINISHED TRELLIS 16'-9\") с PV и его стойки над кровлей",
       "все: настил (DECK LEVEL 1'-9\"), пандусы, перила, скамьи и кадки у стен; ростверк под коробом",
       "все: глухие панели-блоки 1–16 — плоскость стены, не проёмы",
       "south, east, west: панели со штриховкой (08 88 49) — размечены окнами, вид стекла не ясен"]
absent = ["все: цоколь — под коробом открытая рама-ростверк на опорах, обшивки между полом и землёй нет",
          "все: вторая отделка — модульные блоки одного вида по всем стенам, светопрозрачные панели — окна"]

