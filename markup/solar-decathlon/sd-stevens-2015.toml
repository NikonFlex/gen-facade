# SU+RE HOUSE — Stevens Institute of Technology, 2015. U.S. DOE Solar Decathlon; штамп «PUBLIC
# DOMAIN»; разметка gf#180, контур — gf#199.
# Листы A-201 (стр. 55: NORTH, SOUTH) и A-202 (стр. 56: EAST, WEST), 1/4" = 1'-0"; виды — растр,
# координаты сняты с картинки по сетке 10 pt и сверены с векторным планом A-113 (стр. 53):
# стены W x 743.3, N y 523.9, восток спален x 1285.4, север гостиной y 705.5, E x 1434.4,
# S y 1036.5 pt. Г-контур: на северо-восточном углу — крыльцо входа ENTRY PORCH 111
# (8'-3" x 10'-1") под общей крышей на стальных колоннах. Длины с листов сходятся: север
# 150,7 + 541,6 = юг 691,6 pt; запад 514,1 = восток 331,0 + 182,7 pt.
# Отметки: FINISH FLOOR 1'-10 1/2", T.O. PARAPET 13'-5 3/4" — один парапет на весь дом; линия уровня
# на 12,6 pt ниже верха подписи, расстояние 208,9 pt на всех листах.
id = "sd-stevens-2015"
pdf = "2015/stevens-drawings.pdf"
roof = "плоская за парапетом, общая для дома, крыльца входа, восточной веранды и южной террасы; панели на подставках"
pt_per_ft = 18.0          # SCALE 1/4" = 1'-0"; парапет − пол 11'-7 1/4" = 208,9 pt
material = "wood"         # CEDAR SHAKE SIDING
plinth_ft = 1.875         # FINISH FLOOR 1'-10 1/2" над GRADE LEVEL 0"
floor_heights_ft = [11.6042]  # T.O. PARAPET 13'-5 3/4" − 1'-10 1/2"
cut = ["all: солнечные панели, конденсатор, вентвыходы над парапетом",
       "north, east: кровля крыльца входа и восточной веранды PORCH 109 на стальных колоннах перед стенами — продолжение основной крыши",
       "south: терраса SOUTH TERRACE под той же крышей с колоннами и крестовыми связями; жалюзийный экран SHADING SCREEN закрывает западную половину южной стены — стеклянная стена размечена по плану A-113, высота — по видимой части",
       "south, west: жалюзийный экран террасы за углом",
       "north: пандус входа с перилами, плантер, ниша техкомнаты со щитами и счётчиками у западного края (~5' x 8') — не размечена",
       "east: площадка с плантером над баками и перила за северо-восточным углом",
       "all: дом на опорах — подполье открыто, цоколь условный"]

