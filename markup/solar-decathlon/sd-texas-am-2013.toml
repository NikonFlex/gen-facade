# AUAPT — Team Texas (Texas A&M University), Solar Decathlon 2013 (Orange County, California).
# U.S. DOE Solar Decathlon; штамп «COPYRIGHT: NONE: PROJECT IS PUBLIC DOMAIN»; разметка gf#323.
# Листы: план A-111 (стр. 18, 1/4"), A-211 (стр. 20: EAST 1/4" и NORTH 3/16"), A-212 (стр. 21:
# SOUTH и WEST, 1/4"). Север начерчен в другом масштабе (13,5 pt/ft), чем остальные виды (18 pt/ft):
# у трёх северных сторон и стороны mech-north свой pt_per_ft = 13,5.
# Устройство: Т-контур из 8 сторон, прямоугольник 48' x 16' (план: стены 578–1442 x 734–1022 pt)
# и к северной стене пристроена техкомната MECH. ROOM 103 8' x 8' (x 794–940, выступ до y 588).
# Север слева направо (смотрим с севера, слева — восток): N-east 28' (x 986–1364), техкомната 8'
# (1364,4–1471,7), N-west 12' (1472–1634); длины сошлись с планом в 1 pt. Карниз не один: основной
# объём (гофрированная обшивка) — парапет 13'-0" над чистым полом, ядро-модуль 8' (Corten) и
# техкомната — 10'-10" с уклоном ~0,3' к югу; эти части идут в `eaves` с отметкой с листа (дом
# ждёт — waiting). Перфорированная кровля веранды (ceiling 11'-6" над землёй) — плита вокруг дома
# перед стенами, дана в `roof`. Стены основного объёма снаружи закрыты жалюзийными экранами
# (перекрывают края стены на 5–10 pt); проёмы читаются сквозь них.
# Вход: из-за пандуса на север, к раздвижным стеклянным дверям гостиной (N-east); дверь техкомнаты
# выходит на восток (на виде EAST снята по линиям двери сквозь экран, по плану A-111).
id = "sd-texas-am-2013"
pdf = "2013/tex_cd.pdf"
roof = "плоская за парапетом на основном объёме; на ядре и техкомнате ниже на 2'-2\" с уклоном к югу; перфорированная кровля веранды"
pt_per_ft = 18.0          # SCALE 1/4" = 1'-0": парапет − пол 13'-0" = 233,9 pt, дверь 3'-0" = 54 pt
material = "metal"        # CORRUGATED METAL PANEL WALLS
plinth_ft = 3.0           # FIRST FLOOR 3'-0" над GRADE LEVEL 0"
plinth_material = "metal" # CORTEN METAL PANEL — юбка от земли до пола
floor_heights_ft = [13.0] # верх основного объёма (T.O. WALL) 13'-0" над чистым полом
cut = ["all: перфорированная кровля веранды вокруг дома (плита 8\", отметка 11'-6\" над землёй) и жалюзийные экраны приватности перед стенами",
       "all: ограждение террас из труб с тросами, ступени и подпорные блоки у земли",
       "north: пандус входа с перилами и бетонными подпорными блоками перед стеной N-east",
       "south: ядро-модуль выступает ~1,4' на юг (A-111, y 1022–1047) — на виде Corten-панель в плоскости стены, не размечена",
       "east: чёрный прямоугольник ~1,3' на восточной стене на плане A-111 (оборудование?) — на виде EAST не читается",
       "all: солнечные панели на крыше выше парапета на видах стен не показаны"]
absent = ["все: карниза нет — кровля примыкает к стене плитой веранды, горизонтальной полосы-фриза на стене нет",
          "все: вторая отделка в разметку не вынесена — Corten-панель ядра и техкомнаты того же вида «metal»"]

