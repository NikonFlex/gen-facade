# Ecohabit — Stevens Institute of Technology, Solar Decathlon 2013. U.S. DOE Solar Decathlon; штамп
# «COPYRIGHT: NONE: PROJECT IS PUBLIC DOMAIN»; разметка gf#323.
# Листы: план A-112 (стр. 28, размерный), A-211 (стр. 31: EAST, WEST), A-212 (стр. 32: NORTH, SOUTH),
# 1/4" = 1'-0". Г-контур из 8 сторон (план: наружные грани в pt листа): северное крыло 727–1312 x
# 305–537 (флекс-комната, гостиная-столовая), южное крыло 1141–1373 x 393–1183 (кухня, техкомната,
# ванная, спальня); у северо-восточного угла южного крыла вестибюль — ниша 3'-5" x 4'-11" со своей
# дверью D101. Стороны от входа (D101 в E1) по часовой: E1 88, N2 61, E2 790, S 232, W2 645,
# S2 414, W1 232, N1 585 pt; невязка контура 1 pt. Длины сверены с видами: E (E1+E2) 886 pt,
# N1 585, W1 232, W2 645.
# Крыша: односкатная, уклон к югу (T.O. ROOF 17'-2", над северной частью), на юге и востоке
# парапет PARAPET 12'-5" — части разной высоты (дом ждёт — waiting). Верх стены под односкатной
# кровлей на N/W снят по виду: на севере 12'-8" над полом, дальше к югу и востоку ниже до парапета
# 10'-5"; отметки карниза на пологих участках — нижняя кромка крыши (грубо).
id = "sd-sit-2013"
pdf = "2013/sit_cd.pdf"
roof = "односкатная (T.O. ROOF 17'-2\") над северной частью, на остальном парапет PARAPET 12'-5\"; солнечная кровельная плитка"
pt_per_ft = 18.0          # SCALE 1/4" = 1'-0": T.O. ROOF − T.O. FIN. FL. 15'-2" = 273 pt, PARAPET 10'-5" = 187,5 pt
material = "wood"        # 4"x1" RED CEDAR WOOD RAIN SCREEN, цементные панели и кирпичная кладка по сторонам
plinth_ft = 1.969         # T.O. FIN. FL. 2'-0" над GRADE LEVEL 3/8"
floor_heights_ft = [12.7] # самая высокая стена — северная: верх 12'-8" над полом
cut = ["all: деревянные террасы вокруг дома, перила из нержавеющей стали, ступени, пандус",
       "all: деревянные планки дождезащитного экрана (RAIN SCREEN) перед стенами на N/E, жёсткие экраны не закрывают проёмы",
       "south, west: деревянные кашпо (WOOD PLANTER) и скамья у стены",
       "all: солнечная кровельная плитка и кровля выше верха стены",
       "north, east: восточная терраса с глухой стеной-экраном из цементных плит и ступенями — отдельная от дома стенка",
       "north: четыре стальных упора-опоры у южного края северной стороны (ножки)"]
absent = ["все: цоколь — дом на опорах, подполье закрыто обшивкой DECK SKIRT (4\"x5/4\" red cedar), отдельной отделки цоколя нет",
          "все: карниза нет — кровля примыкает к стене кромкой, фриза нет",
          "все: вторая отделка в разметку не вынесена — стены сочетают дерево, кирпич и цементные панели, палитра берёт одну"]

