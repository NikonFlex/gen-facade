# Y House — Yale University, U.S. DOE Solar Decathlon 2015; без штампа PD: учебное использование
# по разрешению научруков, со слов хозяина 26.10.2026; разметка gf#323.
# Листы: A-101 (стр. 25: план первого этажа), A-203 (стр. 31: SOUTH, NORTH), A-204 (стр. 32: EAST,
# WEST), A-205 (стр. 33: узел подключения механического модуля, западная сторона); масштаб
# 1/4" = 1'-0" (pt_per_unit 18; FIRST FLOOR 2'-6" ↔ T.O. STRUCTURE 13'-8 1/2" = 201,7 pt на всех
# видах, GRADE 0" ниже пола на 45 pt).
# Устройство: одноэтажный дом на опорах, плоская кровля с PV-панелями на стойках (T.O. PV PANELS
# 15'-5 17/32", SOLAR ENVELOPE 18'-0" — габарит, не стена); стены — фиброцементный сайдинг
# вертикальный гладкий 2' (CEMENT FIBRE BOARD SIDING, VERTICAL, SMOOTH). Контур стен — прямоугольник
# 20,1 x 37,9 фута по видам (юг и север 361,8 pt, восток и запад 682,6 pt). Вход — с востока (дверь
# 221U, 104 и складная дверь 221T на настил OUTDOOR DECK / PATIO). Окна: восток W4 x 2, юг W4 x 3,
# север W26 x 3, запад W5 x 1.
# Отметка карниза — T.O. STRUCTURE 13'-8 1/2" над GRADE 0"; пол FIRST FLOOR 2'-6" — этаж 11'-2 1/2".
# Мех-модуль MECH 105 (3,1 x 9,8 фута) выступает за западную стену, у юго-запада за стеной — баки
# MECH SPACE: на плане это Г-контур с 0,9-метровым выступом, на видах запад показан одной
# плоскостью — размечена основная стена (прямоугольник), модуль и баки — в cut.
id = "sd-yale-2015"
pdf = "2015/yale-drawings.pdf"
roof = "плоская, с PV-панелями на стойках над T.O. STRUCTURE (15'-5 17/32\" верх панелей); скатов нет"
roof_kind = "flat"
pitch_deg = 0.0
# свес: плоская — Ф. E стр. 32, кровля вровень со стеной, выноса нет
overhang_m = 0.0
overhang_by = "drawing"
unit = "ft"
pt_per_unit = 18.0          # 1/4" = 1'-0"; T.O. STRUCTURE − FIRST FLOOR = 11'-2 1/2" = 201,7 pt
material = "siding"         # CEMENT FIBRE BOARD SIDING, VERTICAL, SMOOTH
plinth = 2.5                # FIRST FLOOR 2'-6" над GRADE 0"
floor_heights = [11.2083]   # T.O. STRUCTURE 13'-8 1/2" − FIRST FLOOR 2'-6"
cut = ["все: PV-панели и стойки кровли над T.O. STRUCTURE, водосток-воронка, кровельная рама по периметру",
       "east: терраса/настил OUTDOOR DECK и PATIO перед стеной, колонны навеса за краями стены",
       "north, south: пандус с перилами и экраном вдоль стены, колонны и навес над террасой правее стены",
       "west: механический модуль MECH 105 (панель 10'-10\" x ~9', выступ ~3 фута за стену), баки MECH SPACE (3 бака на опорах) и наружный блок — не стена",
       "north, south: торцевая часть модуля с баками за западным краем стены",
       "все: дом на опорах, подполье открыто, фундаментные опоры"]
absent = ["все: цоколь — дом на опорах (FIRST FLOOR 2'-6\" над GRADE), гладкая обвязка пола под стеной без отделки",
          "все: карниз — стена сайдинга идёт до T.O. STRUCTURE под рамой кровли, отдельной полосы с материалом на листе нет",
          "все: вторая отделка — одна фиброцементная обшивка"]

