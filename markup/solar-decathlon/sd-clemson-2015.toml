# Листы A-211 (стр. 43: NORTH, EAST) и A-212 (стр. 44: WEST, SOUTH), 1/4" = 1'-0": стена юг/север
# 655 pt = 36'-5", восток/запад 492 pt = 27'-4" (план A-111, стр. 39: 36'-0" x 27'-0" + обшивка);
# дверь 36" = 54 pt; TOP OF SUBFLOOR 1'-7 3/4" над GRADE — 29,6 pt; SOLAR ENVELOPE 18'-0" — 324 pt.
# Односкатная крыша, низ на юге: карниз — капельник южной стены (11'-3" от пола), на севере
# 13'-1" — лишние 1'-10" в `cut`. Вход — с запада, две двери из-под крыши веранды.
id = "sd-clemson-2015"
pdf = "2015/clemson-drawings.pdf"
roof = "односкатная, низ на юге, панели на стойках; веранда на западе под своей односкатной крышей"
pt_per_ft = 18.0          # SCALE: 1/4" = 1'-0"; дверь 36" = 54 pt
material = "metal"        # 1/8" CNC CUT POLYMETAL PANEL SIDING
plinth_ft = 1.6458        # TOP OF SUBFLOOR 1'-7 3/4" над GRADE LEVEL
floor_heights_ft = [11.228]   # капельник южной стены — 202 pt над полом
cut = ["north, east, west: стена выше южного карниза (односкатная крыша, на севере +1'-10\")",
       "west: перфорированные металлические экраны веранды перед стеной — закрывают дверь 103 и низ стены",
       "west: крыша веранды на балках и стойках, перила",
       "west: дверь 103 (спальня) за экраном — положение снято с плана A-111, не с фасада",
       "north: короб водяного бака (PLUMBING TANK ENCLOSURE) у восточного края стены",
       "north: теплообменник, электрощитки, зарядка электромобиля",
       "east: короб бака у северного края; south, north, east: веранда и короб бака за углами",
       "all: солнечные панели на крыше, металлические козырьки-обрамления окон (по раме)"]

