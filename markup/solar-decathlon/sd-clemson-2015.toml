  { cls = "door", box = [1028.3, 415.6, 1085.3, 537.1], variant = { kind = "glazed" } }, # 101
  { cls = "porch", box = [677.3, 537.1, 1169.5, 566.6] },    # настил веранды: пол — земля
]

