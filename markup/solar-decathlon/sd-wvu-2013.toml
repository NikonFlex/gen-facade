# PEAK — Team West Virginia (West Virginia University), Solar Decathlon 2013 (Orange County,
# California). U.S. DOE Solar Decathlon; штамп PUBLIC DOMAIN («COPYRIGHT: NONE: PROJECT IS PUBLIC
# DOMAIN» в штампе листов A-101, A-201, A-202); разметка gf#323.
# Листы: план A-101 (стр. 27, 1/4"), план кровли A-102 (стр. 28), A-201 (стр. 34: SOUTH сверху, NORTH
# снизу), A-202 (стр. 35: EAST сверху, WEST снизу); масштаб всех видов 1/4" = 1'-0" (18 pt/ft;
# GROUND CONTACT 0'-0", REFLECTED CEILING PLAN 2'-0" — чистый пол, CEILING 9'-8", SOLAR ENVELOPE 18'-0"
# над землёй: 36 / 174 / 324 pt на всех видах).
# Устройство: одноэтажный дом на опорах, ортогональный контур из 8 сторон, вокруг — деревянные деки
# с ограждением, пандус, карпорт с PV на юго-востоке. Два объёма: высокий жилой блок (кухня,
# столовая, гостиная, на юге теплица GREEN HOUSE) под односкатной крышей с PV 2,5/12, высокой на
# севере (T.O. стены 13'-7" над чистым полом у кухни, около 8'-1" у южной стены теплицы), и
# северо-восточный блок спален и ванной под односкатной кровлей из фальца 1,25/12 (стена 11'-7" на
# юге блока, 9'-1" на севере); между ними над коридором — фонарь (клерестория, «fulcrum» 0,25/12).
# Контур по часовой от стороны входа (восток, дверь гостиной): DE восток (теплица и гостиная,
# 13,2'), EF юг теплицы (26,3'), FG запад гостиной и кухни (26,5'), GH север кухни (17,5',
# после неё внутренний угол), HA запад ванной (10,2'), AB север блока спален (22,1'), BC восток
# спален (23,5'), CD юг гостевой спальни (13,3', после неё внутренний угол). Длины — по плану A-101
# (наружные грани: x 643,6 / 958,5 / 1117,5 / 1356,2, y 267,6 / 450,5 / 690,1 / 928,3), невязка
# контура 0; сдвиг листа вида к плану: юг и запад на южном и западном видах x−15,0 и y+173,8;
# север x = 2035,0 − x плана; восток x = 1679,5 − y плана.
# Стена не ровная: верх стен жилого блока идёт по скату (на видах E и W — `outline` с уклоном), участки
# карниза — по нижнему краю ската, у северной стены кухни (верх ската) — по верху стены. Карниза по
# высоте не один (13'-7" у кухни, 8'-1" у теплицы, 9'-1"–11'-7" у спален) — дом ждёт (waiting).
# Сквозная разметка: нижняя часть стен на видах закрыта планками ограждения деков и плантерами;
# проёмы доведены до чистого пола по высоте двери 6'-8".
id = "sd-wvu-2013"
pdf = "2013/wvu_cd.pdf"
roof = "две односкатные крыши: высокий жилой блок — PV 2,5/12 (стоячий фальц, высота к северу), блок спален — фальцевая кровля 1,25/12 (низ на севере); фонарь над коридором 0,25/12; карпорт с PV на юго-востоке"
roof_kind = "shed"
pitch_deg = 11.8
overhang_m = 0.5
roof_gaps = ["составная: две односкатные крыши разной высоты и уклона (2,5/12 над жилым блоком, 1,25/12 над спальнями) и фонарь над коридором -> одна односкатная", "низ односкатной не у той стены: у жилого блока скат вниз к югу (сторона 1), у блока спален вниз к северу (сторона 5); модуль ставит низ по своему правилу"]
unit = "ft"
pt_per_unit = 18.0          # SCALE 1/4" = 1'-0": пол 2'-0" над землёй = 36 pt, CEILING 9'-8" = 174 pt, дверь 6'-8" = 120 pt
material = "plaster"       # 07 42 43 COMPOSITE WALL PANELS — гладкие панели без швов на видах
plinth = 2.0           # REFLECTED CEILING PLAN 2'-0" над GROUND CONTACT 0'-0"
floor_heights = [13.55] # северный верх жилого блока (стена кухни GH) над чистым полом: 13'-7"
cut = ["all: деревянные деки вокруг дома с ограждением (рейки, плантеры 32 94 33), пандус с перилами и ступени у входа",
       "east: навес-пергола на опорах над пандусом и входом гостиной (PV-кровля 1,75/12) слева на виде, столбы, бак у ступеней",
       "east, south, west: фонарь над коридором — стенка с отделкой 04 42 13 и плита кровли выше основной крыши (по крыше стены отдельной стороны нет)",
       "all: PV-панели на крышах и над крыльцом, фальцевая кровля 07 61 13",
       "south: PV-навес карпорта и перголы справа от дома, плантеры и скамья на деке справа",
       "north: PV-навес карпорта (жалюзи) за блоком спален и скамья-деревянный экран слева на виде",
       "west: навес и столбы на юге (справа на виде), бак и оборудование на деке",
       "all: светильники на стенах, блок кондиционера и ящик у северной стены кухни, вентрешётка у ванной (HA, выше окна)"]
absent = ["все: цоколь — дом на опорах (ADJUSTABLE PIERS), нижняя часть стен закрыта ограждением деков, отделки цоколя нет",
          "все: карниза нет — кровля примыкает к стене плитой с кромкой, профилированного карниза и фриза нет",
          "все: вторая отделка — одни и те же композитные панели"]

