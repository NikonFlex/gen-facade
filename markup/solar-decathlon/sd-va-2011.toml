# Unit 6 — Team Tidewater Virginia (Old Dominion University + Hampton University), Solar Decathlon
# 2011. U.S. DOE Solar Decathlon; штамп «PUBLIC DOMAIN» («NONE: PROJECT IS PUBLIC DOMAIN»);
# разметка gf#323.
# Листы: A-111..A-113 (стр. 20–22) — планы модулей A, B, C, A-211 (стр. 25: EAST, WEST),
# A-212 (стр. 26: NORTH, SOUTH); масштаб 1/4" = 1'-0" (pt_per_unit 18; FIRST FLOOR 1'-6" ↔ GRADE 0" =
# 27 pt, PARAPET 11'-6" над землёй = 207 pt, на всех видах).
# Устройство: Г-образный в плане одноэтажный дом (три модуля) с плоской кровлей за парапетом
# (карниз = верх парапета, 10'-0" над чистым полом); в юго-западном углу — более высокий модуль A
# (сквозной блок 15' x ~24') под односкатной кровлей 3/12 (СЕВЕР высокий, юг низкий: нижняя
# кромка у южной стены на отметке парапета), на его высокой северной стене — окна второго этажа
# (SECOND FLOOR 10'-0" над землёй). Контур: запад (вход) → север → восток → юг юго-восточной
# части → внутренняя стенка J (3'-11", лицом на восток) → юг модуля A. Стороны с листа:
# запад 546 pt, север 616, восток 479, юг-1 341, J 71, юг-2 279 pt; невязка контура 4 pt по x и
# по y (0,07 м). Вход — дверь на западной стороне.
# Стена выше парапета: северная стена высокого модуля A отступает от северной стены дома на 7'-5";
# на севере она — часть `outline` (ступень) и окна выше карниза; на западе — скос стены под кровлей
# (`outline`), на востоке над парапетом виден скат кровли модуля A (`roof`).
id = "sd-va-2011"
pdf = "2011/va_cd.pdf"
roof = "плоская за парапетом (3 модуля), над юго-западным модулем A — односкатная 3/12 с солнечными панелями (север высокий)"
roof_kind = "flat"
# водосток: ключевая пометка 07 71 00.A1 GUTTER на Ф. стр. 26 (парапет плоской кровли)
gutters = true
pitch_deg = 0.0
# свес: плоская за парапетом — Ф. W стр. 25, парапет вровень со стеной, выноса нет
overhang_m = 0.0
overhang_by = "drawing"
roof_gaps = ["составная: плоская за парапетом и односкатная 3/12 над модулем A -> плоская"]
unit = "ft"
pt_per_unit = 18.0          # SCALE 1/4" = 1'-0"
material = "wood"         # 10" NEO-PLY WOOD SIDING, painted wood batten 1'-0" o.c.
plinth = 1.5           # FIRST FLOOR 1'-6" над GRADE LEVEL 0"
floor_heights = [10.0] # PARAPET 11'-6" − FIRST FLOOR 1'-6"
cut = ["all: солнечные панели и кровельный парапет с водосточными деталями, вентиляционные трубы выше парапета",
       "west, north: деревянный экран/перголы и растительные навесы (WOOD PERGOLA WITH OVERHEAD PLANTERS), пандус и ступени у западной стороны",
       "south: деревянные экраны и пергола слева от модуля A, плантеры; нижняя решётка/вентиляция цоколя",
       "east: стена на вид справа (за северо-восточным углом) — лестница, перила, бак; вентиляционная труба над парапетом",
       "north: бак и вентиляционная шахта у северной стены, левая сторона вида — пандус",
       "west, south: жалюзи и ставни/ширмы модуля A (по сторонам двери); навес над западной дверью"]
absent = ["все: цоколь — дом на опорах (подполье, обшитое решёткой), гладкая обвязка пола без отделки",
          "все: карниз — плоский парапет без выделенной полосы с материалом на листе"]

