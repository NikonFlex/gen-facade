# Team Alfred NY (Alfred State / Alfred University), Solar Decathlon 2015. U.S. DOE Solar Decathlon;
# штамп «COPYRIGHT: NONE: PROJECT IS PUBLIC DOMAIN»; разметка gf#323.
# Листы: план A-111 (стр. 33), A-212 (стр. 36: EAST, NORTH), A-213 (стр. 37: SOUTH, WEST), 1/4" = 1'-0".
# Устройство: закрытая коробка 30' x 30' (план: стены x 886–1431, y 456–996 pt), вокруг — деревянные
# террасы с ограждением и пандус, на юге — карпорт на стойках 6x6 с панелями. Крыша односкатная
# надстройка с PV над SIP: уклон к югу, над северными ~20' (длина по горизонтали 19'-10"), южные ~10'
# ниже — плоская кровля LOW ROOF 11'-1". Верх стены (T.O. WALL) на севере 17'-8 1/2" над землёй
# (16,4' над чистым полом), на юге 11'-1" — части разной высоты: на листах E/W сторона со ступенью и
# уклоном (в `outline`), участки карниза — отдельно (дом ждёт — waiting). Масштаб всех видов 1/4".
# Сквозная разметка: чёрные стены в белых полях — обшивка винилом, окна и двери читаются; стена
# за ограждением террасы закрыта только по низу.
id = "sd-nyalfred-2015"
pdf = "2015/team-ny-alfred-drawings.pdf"
roof = "односкатная надстройка с PV над SIP (уклон к югу) над северной частью, плоская низкая кровля над южной; карпорт с панелями"
pt_per_ft = 18.0          # SCALE 1/4" = 1'-0": 17'-8 1/2" = 318,75 pt, плита дека — высота пола 1'-2 1/2"
material = "siding"       # 4" VINYL SIDING OVER #30 FELT OVER SIP PANELS
plinth_ft = 1.2083        # FINISH FIRST FLOOR 1'-2 1/2" над GROUND LEVEL 0"
floor_heights_ft = [16.4] # северная стена до верха надстройки (T.O. WALL 17'-8 1/2" над землёй)
cut = ["all: деревянные террасы вокруг дома с ограждением из реек 3'-4\", пандус и посадочная площадка",
       "all: солнечные панели на надстройке и на крыше карпорта, рамы",
       "south: карпорт на стойках 6x6 перед южной стеной и круглый бак перед стеной",
       "south: остеклённая стенка шириной ~8' рядом со стеной на востоке (на S и N видах правее/левее стены) — не размечена",
       "east: ограждение северной террасы; north: стеклянная стенка на восточной террасе за углом",
       "west: сам объём электрощита и бак у юго-западного угла за карпортом",
       "all: наличники, зелёные экраны (GREEN SCREEN PANELS) на восточной террасе"]
absent = ["все: цоколь — дом на опорах (SHIM ADJUSTABLE FOOTINGS), подполье закрыто ограждением террасы, юбки нет",
          "все: карниза нет — кровля примыкает к стене кромкой SIP, профилированного карниза и фриза нет",
          "все: вторая отделка — одна обшивка 4\" VINYL SIDING"]

