# Empowerhouse — The New School Parsons / Stevens Institute of Technology, 2011. U.S. DOE Solar
# Decathlon; штамп «COPYRIGHT: NONE: PROJECT IS PUBLIC DOMAIN»; разметка gf#180, gf#199.
# Листы A-201 (стр. 31: EAST, NORTH) и A-202 (стр. 32: WEST, SOUTH), 1/4" = 1'-0" (18 pt на фут);
# план A-101 (стр. 28). Проверка масштаба: T.O. SUB FLOOR 2'-4" → T.O. ROOF 12'-5 1/8" = 181.6 pt;
# дверь на севере 36" x 84" по пути листа.
# Прямоугольная коробка (passive house), плоская кровля с парапетом 13'-9 3/4"; над кровлей —
# надстройка-бокс (T.O. BULKHEAD ROOF 17'-11"). Вход — с севера (ENTRYWAY 101). Кровля и западная
# стена продолжаются экраном над северной (~7'-10", проём «OPEN TO BEYOND») и южной (~7'-7")
# площадками — это не стены дома, срезано. Стены: восток 653.4 pt = 36'-4", запад 654.0 pt
# (на плане A-101 ~35'-7" внутри); север 413.2 pt = 22'-11", юг 413.9 pt.
id = "sd-parsons-2011"
pdf = "2011/pars_cd.pdf"
roof = "плоская с парапетом 13'-9 3/4\"; надстройка-бокс над кровлей до 17'-11\""
pt_per_ft = 18.0          # 1/4" = 1'-0"
material = "siding"       # 07 46 23 / 07 46 46 — горизонтальная и панельная обшивка
plinth_ft = 2.3333        # T.O. SUB FLOOR 2'-4" над GROUND LEVEL
plinth_material = "plaster"  # CEMENT BOARD SIDING (07 46 46): панельная юбка между полом и землёй на N, E, S (gf#245)
trim_material = "plaster"    # CEMENT BOARD SIDING: панельная полоса парапета под PARAPET CAP FLASHING
floor_heights_ft = [11.4792]  # T.O. PARAPET 13'-9 3/4"
cut = ["все: надстройка-бокс с жалюзи над кровлей (T.O. BULKHEAD ROOF 17'-11\")",
       "north, east, west: вынос кровли и продолжение западной стены над входной площадкой с проёмом OPEN TO BEYOND — вне стены дома",
       "east: короб-ступень перед стеной; южная площадка под выносом кровли со скамьёй и перилами — вне стены",
       "south: решётчатый экран-ограждение террасы закрывает низ стены и двери; ступени и пандус",
       "north: террасный экран-планкер слева, ящик справа",
       "west: экран-продолжение стены над южной площадкой и наклонная стенка-пандус у южного угла"]
absent = ["west: цоколь — вертикальная кедровая обшивка идёт до земли, панельной юбки нет",
          "west: карниз — вертикальная обшивка доходит до T.O. PARAPET, панельной полосы парапета нет",
          "все: вторая отделка — кедровая обшивка по стене и панельные полосы цоколя и парапета (они — plinth и trim)"]

