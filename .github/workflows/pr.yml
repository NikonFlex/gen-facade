name: pr

# Быстрые проверки PR — `fast`, обязательная для слияния вместе с `pr-link` (pr-link.yml); полный
# набор тестов — после мержа на main (post-merge.yml, gf#283). Правка описания PR гоняет только
# pr-link, а не эти проверки.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Прогоны одного PR (и одной ветки при push) — в одну очередь, устаревший отменяется: правка
# описания и новый коммит подряд не дают двух прогонов.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # вся история: номер задачи проверяется во всех коммитах ветки от базы
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r tools/requirements.txt

      - name: gitleaks
        # Архив релиза, сверенный по контрольным суммам; версия — tools/secret_scan.py.
        run: |
          python3 tools/secret_scan.py install --binary
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Проверки
        # Быстрые тесты и самопроверки: локально хук гоняет `check.sh --quick` — только
        # затронутые тесты. `fast` и `pr-link` обязательны для слияния в main: PR с
        # `gh pr merge --auto --squash` GitHub сольёт сам, когда они зелёные. Долгие тесты (slow)
        # и тесты с torch — в полном наборе после мержа. Ключей в CI нет: тест, которому нужен
        # настоящий API, упадёт — так и задумано.
        run: sh tools/check.sh --fast

      - name: Номер задачи в каждом коммите
        # Хук commit-msg обходится `--no-verify` — поэтому то же правило здесь.
        run: python3 tools/commit_check.py range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Ключи в коммитах
        # Хук pre-commit обходится `--no-verify` — поэтому то же по всем коммитам PR.
        run: python3 tools/secret_scan.py range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
