name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r tools/requirements.txt

      - name: Проверки
        # Список проверок — в tools/check.sh: его же запускает хук перед git commit.
        # Ключей в CI нет: тест, которому нужен настоящий API, упадёт — так и задумано.
        run: sh tools/check.sh
