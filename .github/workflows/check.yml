name: check

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

# Прогоны одного PR (и одной ветки при push) — в одну очередь, устаревший отменяется: правка
# описания и новый коммит подряд не дают двух прогонов.
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # вся история: номер задачи проверяется во всех коммитах ветки от базы
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r tools/requirements.txt

      - name: gitleaks
        # Архив релиза, сверенный по контрольным суммам; версия — tools/secret_scan.py.
        run: |
          python3 tools/secret_scan.py install --binary
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Проверки
        # Полный прогон: локально хук гоняет `check.sh --quick` — только затронутые тесты.
        # Проверка `check` обязательна для слияния в main (защита ветки, gf#96): PR с
        # `gh pr merge --auto` GitHub сольёт сам, когда она зелёная.
        # Ключей в CI нет: тест, которому нужен настоящий API, упадёт — так и задумано.
        run: sh tools/check.sh

      - name: Номер задачи в каждом коммите
        # Хук commit-msg обходится `--no-verify` — поэтому то же правило здесь.
        if: github.event_name == 'pull_request'
        run: python3 tools/commit_check.py range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Ключи в коммитах
        # Хук pre-commit обходится `--no-verify` — поэтому то же по всем коммитам PR.
        if: github.event_name == 'pull_request'
        run: python3 tools/secret_scan.py range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Слова, закрывающие задачу
        # Задачу закрывает только хозяин (AGENTS.md, «Задачи»): close/fix/resolve рядом со
        # ссылкой в заголовке, описании или коммитах PR закрыли бы её при слиянии.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" \
            --json title,body,commits > pr.json
          python3 tools/closing_words.py --pr pr.json
