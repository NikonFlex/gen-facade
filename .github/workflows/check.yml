name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер
        run: ruff check .

      - name: Тесты
        # Ключей в CI нет: тест, которому нужен настоящий API, упадёт — так и задумано.
        # Код 5 у pytest — «тестов не найдено»: пока их нет, это не ошибка.
        run: |
          pytest -q || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 5 ]; then exit "$code"; fi

      - name: Копипаста
        # jscpd ловит скопированные блоки и в одном файле, и между файлами (pylint —
        # только между файлами). Пороги — в .jscpd.json. Node на раннере уже есть.
        run: npx -y jscpd@5.3.3 -c .jscpd.json genfacade tests tools

      - name: Самопроверка скрипта задач
        run: python3 tools/backlog.py --selftest

      - name: Спеки и входящие
        run: python3 tools/spec_check.py
