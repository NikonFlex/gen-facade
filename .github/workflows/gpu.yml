name: gpu

# Запуски на домашнем GPU хозяина: RTX 3060 12 ГБ, Ubuntu 24.04 в WSL2, раннер с меткой `gpu`
# (gf#106, устройство машины — в низу docs/tasks/gf-0106.md). Только вручную: workflow_dispatch
# запускает лишь тот, у кого есть запись в репо, а PR из форка ждут апрува хозяина
# (approval_policy: all_external_contributors). Обучение — только после «обучай» хозяина;
# оценка (eval) — тоже на его машине, запуск согласуется с ним.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "probe — проверить GPU; train — обучить модель шага 4; eval — оценить её на val"
        type: choice
        options: [probe, train, eval]
        default: probe
      houses:
        description: "train: сколько синтетических домов в корпусе (собранные раньше не пересобираются)"
        type: number
        default: 10000
      model_run:
        description: "eval: номер запуска train, чью модель оценивать (артефакт train-<номер>)"
        type: string
        default: "38560937357"

permissions:
  contents: read
  actions: read   # eval скачивает модель — артефакт другого запуска

# Видюха одна: следующий запуск ждёт предыдущего, а не отменяет его.
concurrency:
  group: gpu
  cancel-in-progress: false

env:
  # Драйвер на машине — 581.42, держит CUDA до 13.0.
  TORCH: torch==2.14.1
  TORCH_INDEX: https://download.pytorch.org/whl/cu130
  VENV: /home/runner/venvs/genfacade
  # Дома и корпус переживают запуски: checkout чистит рабочую папку, а сборка 10 000 домов — минуты.
  DATA_CONFIG: /home/runner/genfacade-config
  SAMPLES: /home/runner/data/samples
  OUT: outputs/train/gpu-${{ github.run_id }}

jobs:
  gpu:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Видюха
        # В WSL nvidia-smi лежит рядом с драйвером Windows, а PATH службы раннера его не знает.
        run: /usr/lib/wsl/lib/nvidia-smi

      - name: Окружение
        # venv переживает запуски: torch с CUDA — несколько гигабайт, качать каждый раз незачем.
        run: |
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --upgrade pip
          "$VENV/bin/pip" install -q "$TORCH" --index-url "$TORCH_INDEX"
          "$VENV/bin/pip" install -q -e ".[train]"
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: PyTorch видит GPU
        if: inputs.job == 'probe'
        run: |
          python - <<'PY'
          import time

          import torch

          assert torch.cuda.is_available(), "PyTorch не видит CUDA"
          props = torch.cuda.get_device_properties(0)
          print(f"torch {torch.__version__}, CUDA {torch.version.cuda}, {props.name}, "
                f"{props.total_memory / 2**30:.1f} ГиБ")
          n, repeats = 8192, 10
          x = torch.randn(n, n, device="cuda")
          torch.cuda.synchronize()
          start = time.perf_counter()
          for _ in range(repeats):
              x @ x
          torch.cuda.synchronize()
          step = (time.perf_counter() - start) / repeats
          print(f"matmul {n}x{n} fp32: {step * 1e3:.1f} мс, {2 * n**3 / step / 1e12:.1f} TFLOPS")
          PY

      - name: Дома и корпус
        if: inputs.job != 'probe'
        run: |
          mkdir -p "$DATA_CONFIG"
          printf '[paths]\nsamples_dir = "%s"\n' "$SAMPLES" > "$DATA_CONFIG/data.toml"
          genfacade -c "$DATA_CONFIG" synth -n "${{ inputs.houses }}"
          genfacade -c "$DATA_CONFIG" tokens
          head -30 "$SAMPLES/synthetic/_tokens.json"

      - name: Обучение
        if: inputs.job == 'train'
        # Загрузка GPU и видеопамять — раз в 10 с рядом с моделью: PyTorch сам их не меряет.
        run: |
          mkdir -p "$OUT"
          /usr/lib/wsl/lib/nvidia-smi --query-gpu=timestamp,utilization.gpu,memory.used,memory.total \
            --format=csv -l 10 > "$OUT/gpu.csv" &
          monitor=$!
          genfacade -c "$DATA_CONFIG" train -o "$OUT"
          kill "$monitor"

      - name: Результат обучения
        if: always() && inputs.job == 'train'
        uses: actions/upload-artifact@v7
        with:
          name: train-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: ignore

      - name: Модель для оценки
        if: inputs.job == 'eval'
        uses: actions/download-artifact@v8
        with:
          name: train-${{ inputs.model_run }}
          path: model
          run-id: ${{ inputs.model_run }}
          github-token: ${{ github.token }}

      - name: Оценка
        if: inputs.job == 'eval'
        # Свой конфиг на запуск: корпус — общий, модель — скачанная в рабочую папку.
        run: |
          cfg="$RUNNER_TEMP/eval-config"
          mkdir -p "$cfg" "$OUT"
          cp "$DATA_CONFIG/data.toml" "$cfg/"
          printf '[layout]\ncheckpoint = "%s"\n' "$GITHUB_WORKSPACE/model/model.pt" > "$cfg/models.toml"
          genfacade -c "$cfg" eval -o "$OUT"

      - name: Результат оценки
        if: always() && inputs.job == 'eval'
        uses: actions/upload-artifact@v7
        with:
          name: eval-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: ignore
