name: gpu

# Запуски на домашнем GPU хозяина: RTX 3060 12 ГБ, Ubuntu 24.04 в WSL2, раннер с меткой `gpu`
# (gf#106, устройство машины — в низу docs/tasks/gf-0106.md). Только вручную: workflow_dispatch
# запускает лишь тот, у кого есть запись в репо, а PR из форка ждут апрува хозяина
# (approval_policy: all_external_contributors). Обучение — только после «обучай» хозяина;
# оценка (eval) и метрики с FID и KID (visual) — тоже на его машине, запуск согласуется с ним.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "probe — проверить GPU; train — обучить модель шага 4; finetune — дообучить её на коттеджах BuildingNet; eval — оценить на val; visual — таблица метрик с FID и KID; realtest — таблица против реального теста с FID и KID; retrain — всё сразу: корпус, обучение, дообучение по флагу, реальный тест новой и прежней модели одной таблицей"
        type: choice
        options: [probe, train, finetune, eval, visual, realtest, retrain]
        default: probe
      houses:
        description: "train, retrain: сколько синтетических домов в корпусе (собранные раньше не пересобираются)"
        type: number
        default: 10000
      epochs:
        description: "train, retrain: эпох обучения (умолчание config/train.toml — 10; gf#155 учили 24); датчик [probe] пишется в историю"
        type: number
        default: 10
      rebuild:
        description: "train, retrain: пересобрать дома заново — нужно, если код генератора поменялся с прошлой сборки"
        type: boolean
        default: false
      finetune:
        description: "retrain: дообучить новую модель на коттеджах BuildingNet (извлечение скачанных — около 11 мин, первое скачивание — около 50 мин)"
        type: boolean
        default: false
      ft_epochs:
        description: "finetune, retrain: эпох дообучения (gf#198: на процессоре val-loss минимален на 3-й)"
        type: number
        default: 3
      init_run:
        description: "finetune: номер запуска train, чью модель дообучать; retrain: с чьей моделью сравнивать (артефакт train-<номер>); 39586817099 — gf#155"
        type: string
        default: "39586817099"
      mix:
        description: "finetune, retrain: сколько последовательностей train синтетики подмешать к BuildingNet"
        type: number
        default: 1500
      lr:
        description: "finetune, retrain: шаг обучения дообучения после разгона"
        type: string
        default: "1e-4"
      model_run:
        description: "eval, realtest: номер запуска train, чью модель оценивать (артефакт train-<номер>); 39586817099 — gf#155"
        type: string
        default: "39586817099"
      eval_run:
        description: "visual: номер запуска eval, чьи листы считать (артефакт eval-<номер>)"
        type: string
        default: "38811282415"

permissions:
  contents: read
  actions: read   # eval скачивает модель, visual — листы оценки: артефакты других запусков

# Видюха одна: следующий запуск ждёт предыдущего, а не отменяет его.
concurrency:
  group: gpu
  cancel-in-progress: false

env:
  # Драйвер на машине — 581.42, держит CUDA до 13.0.
  TORCH: torch==2.14.1
  # torchvision — для torch-fidelity (FID, KID); с того же индекса, иначе pip заменит torch на сборку с PyPI.
  TORCHVISION: torchvision==0.29.1
  TORCH_INDEX: https://download.pytorch.org/whl/cu130
  VENV: /home/runner/venvs/genfacade
  # Дома и корпус переживают запуски: checkout чистит рабочую папку, а сборка 10 000 домов — минуты.
  DATA_CONFIG: /home/runner/genfacade-config
  SAMPLES: /home/runner/data/samples
  # BuildingNet — только на этой машине: качается с Drive по секрету, в артефакты не попадает (gf#198)
  BUILDINGNET: /home/runner/data/buildingnet
  OUT: outputs/train/gpu-${{ github.run_id }}
  # Модель из артефакта train-<номер> — в папке этапа: дообучение пишет finetune/, обучение — train/.
  MODEL_DIR: ${{ (inputs.job == 'finetune' || (inputs.job == 'retrain' && inputs.finetune)) && 'finetune' || 'train' }}
  # Код, на котором отвечает модель для сравнения (init_run) в retrain: последний main до новой
  # записи токенов gf#212 — её словарь новый код не читает. Сменилась модель — сменить и код.
  BASE_REF: 52b943ec370febfb4ec7fde60b4c43b3a35577c6

jobs:
  gpu:
    runs-on: [self-hosted, gpu]
    # 24 эпохи на 10 000 домах в 1–3 этажа — около часа (gf#186); оценка и метрики — до часа;
    # finetune в первый раз качает и извлекает BuildingNet — часа два до обучения; retrain на
    # 24 эпохи — около 1,5 ч, с дообучением — ещё около 20 мин (оценка 30.10 по запускам
    # 39586817099 и 40507586318; реальный тест на GPU ещё не шёл)
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v7

      - name: Видюха
        # В WSL nvidia-smi лежит рядом с драйвером Windows, а PATH службы раннера его не знает.
        run: /usr/lib/wsl/lib/nvidia-smi

      - name: Окружение
        # venv переживает запуски: torch с CUDA — несколько гигабайт, качать каждый раз незачем.
        run: |
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --upgrade pip
          "$VENV/bin/pip" install -q "$TORCH" "$TORCHVISION" --index-url "$TORCH_INDEX"
          "$VENV/bin/pip" install -q -e ".[train,visual]"
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: PyTorch видит GPU
        if: inputs.job == 'probe'
        run: |
          python - <<'PY'
          import time

          import torch

          assert torch.cuda.is_available(), "PyTorch не видит CUDA"
          props = torch.cuda.get_device_properties(0)
          print(f"torch {torch.__version__}, CUDA {torch.version.cuda}, {props.name}, "
                f"{props.total_memory / 2**30:.1f} ГиБ")
          n, repeats = 8192, 10
          x = torch.randn(n, n, device="cuda")
          torch.cuda.synchronize()
          start = time.perf_counter()
          for _ in range(repeats):
              x @ x
          torch.cuda.synchronize()
          step = (time.perf_counter() - start) / repeats
          print(f"matmul {n}x{n} fp32: {step * 1e3:.1f} мс, {2 * n**3 / step / 1e12:.1f} TFLOPS")
          PY

      - name: Модель-основа
        # finetune — дообучать её; retrain — сравнивать с ней на реальном тесте.
        if: inputs.job == 'finetune' || inputs.job == 'retrain'
        uses: actions/download-artifact@v8
        with:
          name: train-${{ inputs.init_run }}
          path: init
          run-id: ${{ inputs.init_run }}
          github-token: ${{ github.token }}

      - name: Код модели-основы
        if: inputs.job == 'retrain'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_REF }}
          path: base-code

      - name: Модель для реального теста
        if: inputs.job == 'realtest'
        uses: actions/download-artifact@v8
        with:
          name: train-${{ inputs.model_run }}
          path: model
          run-id: ${{ inputs.model_run }}
          github-token: ${{ github.token }}

      - name: Коттеджи BuildingNet на этой машине
        if: inputs.job == 'finetune' || (inputs.job == 'retrain' && inputs.finetune)
        env:
          BUILDINGNET_DRIVE: ${{ secrets.BUILDINGNET_DRIVE }}
        run: python tools/fetch_buildingnet.py "$BUILDINGNET"

      - name: Монитор GPU
        # Загрузка GPU и видеопамять — раз в 10 с: PyTorch сам их не меряет. Процесс живёт до
        # конца задания — раннер убирает его сам.
        if: inputs.job == 'train' || inputs.job == 'finetune' || inputs.job == 'retrain'
        run: |
          mkdir -p "$OUT"
          nohup /usr/lib/wsl/lib/nvidia-smi --query-gpu=timestamp,utilization.gpu,memory.used,memory.total \
            --format=csv -l 10 > "$OUT/gpu.csv" 2>&1 &

      - name: Этапы
        # Команды этапов — tools/retrain.sh, те же, что в локальном прогоне в миниатюре.
        # Дома и корпусы — в $SAMPLES: переживают запуски.
        if: inputs.job == 'train' || inputs.job == 'finetune' || inputs.job == 'realtest' || inputs.job == 'retrain'
        env:
          WORK: ${{ env.OUT }}
          HOUSES: ${{ inputs.houses }}
          EPOCHS: ${{ inputs.epochs }}
          REBUILD: ${{ inputs.rebuild }}
          FT_EPOCHS: ${{ inputs.ft_epochs }}
          LR: ${{ inputs.lr }}
          MIX: ${{ inputs.mix }}
          BASE_MODEL: ${{ github.workspace }}/init/model.pt
          BASE_CODE: ${{ github.workspace }}/base-code
        run: |
          case "${{ inputs.job }}" in
            train) stages="corpus train" ;;
            finetune) stages="buildingnet finetune"; export INIT="$BASE_MODEL" ;;
            realtest) stages="realtest"; export MODELS="run${{ inputs.model_run }}=$PWD/model/model.pt" ;;
            retrain) stages="base corpus train ${{ inputs.finetune && 'buildingnet finetune' || '' }} realtest" ;;
          esac
          sh tools/retrain.sh $stages

      - name: Загрузка GPU рядом с моделью
        if: always() && (inputs.job == 'train' || inputs.job == 'finetune' || inputs.job == 'retrain')
        run: |
          [ ! -d "$OUT/$MODEL_DIR" ] || cp "$OUT/gpu.csv" "$OUT/$MODEL_DIR/"

      - name: Модель
        if: always() && (inputs.job == 'train' || inputs.job == 'finetune' || inputs.job == 'retrain')
        uses: actions/upload-artifact@v7
        with:
          name: train-${{ github.run_id }}
          path: ${{ env.OUT }}/${{ env.MODEL_DIR }}
          if-no-files-found: ignore

      - name: Модель до дообучения
        if: always() && inputs.job == 'retrain' && inputs.finetune
        uses: actions/upload-artifact@v7
        with:
          name: pretrain-${{ github.run_id }}
          path: ${{ env.OUT }}/train
          if-no-files-found: ignore

      - name: Результат реального теста
        # summary.md — сводка: строки обеих моделей (model-train, model-finetune, model-base) и
        # базовых подходов, оба режима; листы и metrics.json — рядом.
        if: always() && (inputs.job == 'realtest' || inputs.job == 'retrain')
        uses: actions/upload-artifact@v7
        with:
          name: realtest-${{ github.run_id }}
          path: ${{ env.OUT }}/realtest
          if-no-files-found: ignore

      - name: Папка данных
        # Оценка и метрики берут корпус, собранный этапом corpus в $SAMPLES.
        if: inputs.job == 'eval' || inputs.job == 'visual'
        run: |
          mkdir -p "$DATA_CONFIG"
          printf '[paths]\nsamples_dir = "%s"\n' "$SAMPLES" > "$DATA_CONFIG/data.toml"

      - name: Модель для оценки
        if: inputs.job == 'eval'
        uses: actions/download-artifact@v8
        with:
          name: train-${{ inputs.model_run }}
          path: model
          run-id: ${{ inputs.model_run }}
          github-token: ${{ github.token }}

      - name: Оценка
        if: inputs.job == 'eval'
        # Свой конфиг на запуск: корпус — общий, модель — скачанная в рабочую папку.
        run: |
          cfg="$RUNNER_TEMP/eval-config"
          mkdir -p "$cfg" "$OUT"
          cp "$DATA_CONFIG/data.toml" "$cfg/"
          printf '[layout]\ncheckpoint = "%s"\n' "$GITHUB_WORKSPACE/model/model.pt" > "$cfg/models.toml"
          genfacade -c "$cfg" eval -o "$OUT"

      - name: Результат оценки
        if: always() && inputs.job == 'eval'
        uses: actions/upload-artifact@v7
        with:
          name: eval-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: ignore

      - name: Листы оценки
        if: inputs.job == 'visual'
        uses: actions/download-artifact@v8
        with:
          name: eval-${{ inputs.eval_run }}
          path: eval
          run-id: ${{ inputs.eval_run }}
          github-token: ${{ github.token }}

      - name: Метрики с FID и KID
        if: inputs.job == 'visual'
        # Калибровка — эталон train и подмены на val (gf#16); строки — ответы оценки и правило
        # GenPlan на тех же домах (gf#141) и строки ablation (gf#163: без привязки, независимые
        # стороны) против того же эталона train. Inception — на GPU.
        run: |
          mkdir -p "$OUT"
          genfacade -c "$DATA_CONFIG" calibrate -o "$OUT/calibrate"
          for mode in blind with_openings; do
            genfacade baseline genplan "eval/sheets/reference/$mode" -o "$OUT/genplan/$mode"
            genfacade metrics eval/sheets/{reference,model,constrained,constrained_raw,independent,untrained}/$mode \
              "$OUT/genplan/$mode" -r "$OUT/calibrate/$mode/reference" -o "$OUT/rows/$mode"
          done

      - name: Результат метрик
        if: always() && inputs.job == 'visual'
        uses: actions/upload-artifact@v7
        with:
          name: visual-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/calibrate/*/metrics.json
            ${{ env.OUT }}/rows/*/metrics.json
          if-no-files-found: ignore
